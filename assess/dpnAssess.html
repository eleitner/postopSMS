<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>DPN Assessment</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fff; }
  * { -webkit-tap-highlight-color: transparent; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const STORAGE_KEY = "dpn-assessments";
const SHEET_URL_KEY = "dpn-sheet-url";

// Use localStorage for standalone version
const storage = {
  get(key) { const v = localStorage.getItem(key); return v ? { value: v } : null; },
  set(key, value) { localStorage.setItem(key, value); return { key, value }; },
  delete(key) { localStorage.removeItem(key); return { key, deleted: true }; }
};

const defaultState = {
  patientId: "",
  date: new Date().toISOString().split("T")[0],
  visitType: "T0",
  diabetesDuration: "",
  diabetesType: "Type 2",
  age: "",
  sex: "",
  nrsPainPre: "",
  nrsPainPost: "",
  rmssdPre: "",
  rmssdPost: "",
  leftFootPre: Array(12).fill(false),
  leftFootPost: Array(12).fill(false),
  rightFootPre: Array(12).fill(false),
  rightFootPost: Array(12).fill(false),
  coinQuarterPre: "",
  coinQuarterPost: "",
  coinDimePre: "",
  coinDimePost: "",
  coinPennyPre: "",
  coinPennyPost: "",
  slsRightSecPre: "",
  slsRightSecPost: "",
  slsRightFallPre: "No",
  slsRightFallPost: "No",
  slsLeftSecPre: "",
  slsLeftSecPost: "",
  slsLeftFallPre: "No",
  slsLeftFallPost: "No",
  walkTimePre: "",
  walkTimePost: "",
  notes: "",
};

const siteLabels = [
  "Great toe", "2nd toe", "3rd toe", "4th toe", "5th toe",
  "Met head 1", "Met head 3", "Met head 5",
  "Midfoot med", "Midfoot lat", "Arch", "Heel",
];

function sumChecked(arr) { return arr.filter(Boolean).length; }

function App() {
  const [form, setForm] = useState(defaultState);
  const [records, setRecords] = useState([]);
  const [view, setView] = useState("form");
  const [msg, setMsg] = useState({ text: "", type: "" });
  const [submitting, setSubmitting] = useState(false);
  const [sheetUrl, setSheetUrl] = useState("");
  const [showConfig, setShowConfig] = useState(false);

  useEffect(() => {
    try {
      const r = storage.get(STORAGE_KEY);
      if (r?.value) setRecords(JSON.parse(r.value));
    } catch (e) {}
    try {
      const u = storage.get(SHEET_URL_KEY);
      if (u?.value) setSheetUrl(u.value);
    } catch (e) {}
  }, []);

  function flash(text, type = "ok") {
    setMsg({ text, type });
    setTimeout(() => setMsg({ text: "", type: "" }), 3000);
  }

  function set(key, val) { setForm(f => ({ ...f, [key]: val })); }

  function toggleSite(key, idx) {
    setForm(f => {
      const arr = [...f[key]];
      arr[idx] = !arr[idx];
      return { ...f, [key]: arr };
    });
  }

  function buildRow() {
    const lPre = sumChecked(form.leftFootPre);
    const rPre = sumChecked(form.rightFootPre);
    const lPost = sumChecked(form.leftFootPost);
    const rPost = sumChecked(form.rightFootPost);
    return {
      patientId: form.patientId, date: form.date, visitType: form.visitType,
      age: form.age, sex: form.sex, diabetesType: form.diabetesType, diabetesDuration: form.diabetesDuration,
      nrsPainPre: form.nrsPainPre, nrsPainPost: form.nrsPainPost,
      rmssdPre: form.rmssdPre, rmssdPost: form.rmssdPost,
      leftFootPre: lPre, leftFootPost: lPost, rightFootPre: rPre, rightFootPost: rPost,
      combinedPre: lPre + rPre, combinedPost: lPost + rPost,
      monofilamentChange: (lPost + rPost) - (lPre + rPre),
      coinQuarterPre: form.coinQuarterPre, coinQuarterPost: form.coinQuarterPost,
      coinDimePre: form.coinDimePre, coinDimePost: form.coinDimePost,
      coinPennyPre: form.coinPennyPre, coinPennyPost: form.coinPennyPost,
      coinScorePre: [form.coinQuarterPre, form.coinDimePre, form.coinPennyPre].filter(v => v === "Yes").length,
      coinScorePost: [form.coinQuarterPost, form.coinDimePost, form.coinPennyPost].filter(v => v === "Yes").length,
      slsRightSecPre: form.slsRightSecPre, slsRightSecPost: form.slsRightSecPost,
      slsRightFallPre: form.slsRightFallPre, slsRightFallPost: form.slsRightFallPost,
      slsLeftSecPre: form.slsLeftSecPre, slsLeftSecPost: form.slsLeftSecPost,
      slsLeftFallPre: form.slsLeftFallPre, slsLeftFallPost: form.slsLeftFallPost,
      walkTimePre: form.walkTimePre, walkTimePost: form.walkTimePost,
      notes: form.notes,
    };
  }

  function generateNote() {
    const lPre = sumChecked(form.leftFootPre), rPre = sumChecked(form.rightFootPre);
    const lPost = sumChecked(form.leftFootPost), rPost = sumChecked(form.rightFootPost);
    const coinStr = (q, d, p) => {
      const items = [q === "Yes" ? "quarter \u2713" : "quarter \u2717", d === "Yes" ? "dime \u2713" : "dime \u2717", p === "Yes" ? "penny \u2713" : "penny \u2717"];
      return items.join(", ") + ` (${[q,d,p].filter(v => v === "Yes").length}/3)`;
    };
    const delta = (a, b) => a && b ? (parseFloat(b) - parseFloat(a)).toFixed(1) : "---";
    const coinPre = [form.coinQuarterPre, form.coinDimePre, form.coinPennyPre].filter(v => v === "Yes").length;
    const coinPost = [form.coinQuarterPost, form.coinDimePost, form.coinPennyPost].filter(v => v === "Yes").length;

    return `AURICULAR VNS SENSORY ASSESSMENT - ${form.visitType}
Date: ${form.date} | Patient: ${form.patientId || "[ID]"} | Age: ${form.age} | Sex: ${form.sex}
Diabetes: ${form.diabetesType}, ${form.diabetesDuration} yrs

PRE-ACTIVATION:
  HRV (RMSSD): ${form.rmssdPre} ms | NRS Pain: ${form.nrsPainPre}/10
  Monofilament: L ${lPre}/12, R ${rPre}/12, Combined ${lPre + rPre}/24
  Stereognosis: ${coinStr(form.coinQuarterPre, form.coinDimePre, form.coinPennyPre)}
  SLS eyes closed: R ${form.slsRightSecPre}s (fall: ${form.slsRightFallPre}), L ${form.slsLeftSecPre}s (fall: ${form.slsLeftFallPre}) | 10m walk: ${form.walkTimePre}s

POST-ACTIVATION (10 min):
  HRV (RMSSD): ${form.rmssdPost} ms | NRS Pain: ${form.nrsPainPost}/10
  Monofilament: L ${lPost}/12, R ${rPost}/12, Combined ${lPost + rPost}/24
  Stereognosis: ${coinStr(form.coinQuarterPost, form.coinDimePost, form.coinPennyPost)}
  SLS eyes closed: R ${form.slsRightSecPost}s (fall: ${form.slsRightFallPost}), L ${form.slsLeftSecPost}s (fall: ${form.slsLeftFallPost}) | 10m walk: ${form.walkTimePost}s

CHANGE: Mono ${(lPost+rPost)-(lPre+rPre) > 0 ? "+" : ""}${(lPost+rPost)-(lPre+rPre)} pts | Coins ${coinPre}/3 to ${coinPost}/3 | RMSSD ${delta(form.rmssdPre, form.rmssdPost)} ms | Pain ${delta(form.nrsPainPre, form.nrsPainPost)} pts
${form.notes ? "\nNotes: " + form.notes : ""}`;
  }

  async function handleSubmit() {
    if (!form.patientId) { flash("Enter a Patient ID", "err"); return; }
    setSubmitting(true);
    const row = buildRow();
    const note = generateNote();
    try { await navigator.clipboard.writeText(note); } catch (e) {}
    const updated = [...records, { ...row, id: Date.now() }];
    try { storage.set(STORAGE_KEY, JSON.stringify(updated)); setRecords(updated); } catch (e) {}
    let sheetOk = false;
    if (sheetUrl) {
      try { await fetch(sheetUrl, { method: "POST", mode: "no-cors", body: JSON.stringify(row) }); sheetOk = true; } catch (e) {}
    }
    setSubmitting(false);
    flash(`Note copied${sheetOk ? " + Sheet updated" : sheetUrl ? " (Sheet may have updated)" : ""}. Paste into chart.`, "ok");
  }

  function saveSheetUrl() {
    storage.set(SHEET_URL_KEY, sheetUrl);
    flash("Sheet URL saved");
    setShowConfig(false);
  }

  function exportCSV() {
    if (!records.length) return;
    const headers = Object.keys(records[0]).filter(k => k !== "id");
    const csv = [headers.join(","), ...records.map(r => headers.map(h => `"${String(r[h] ?? "").replace(/"/g, '""')}"`).join(","))].join("\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
    a.download = `dpn_data_${new Date().toISOString().split("T")[0]}.csv`; a.click();
  }

  function clearAll() {
    if (confirm("Delete all saved records?")) { storage.delete(STORAGE_KEY); setRecords([]); }
  }

  function resetForm() { setForm({ ...defaultState, date: new Date().toISOString().split("T")[0] }); }

  const ic = "w-full border border-gray-300 rounded px-2 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-blue-400";
  const lc = "block text-xs font-medium text-gray-600 mb-0.5";

  return (
    <div className="max-w-lg mx-auto bg-white min-h-screen">
      <div className="flex border-b border-gray-200 sticky top-0 bg-white z-10">
        {[["form","Assess"],["note","Note"],["records","Data ("+records.length+")"]].map(([v,l]) => (
          <button key={v} onClick={() => setView(v)} className={"flex-1 py-2.5 text-sm font-medium " + (view === v ? "text-blue-600 border-b-2 border-blue-600" : "text-gray-500")}>{l}</button>
        ))}
        <button onClick={() => setShowConfig(!showConfig)} className="px-3 py-2.5 text-gray-400 text-sm">{showConfig ? "\u2715" : "\u2699"}</button>
      </div>

      {showConfig && (
        <div className="p-3 bg-yellow-50 border-b border-yellow-200">
          <label className={lc}>Google Apps Script URL</label>
          <input className={ic} value={sheetUrl} onChange={e => setSheetUrl(e.target.value)} placeholder="https://script.google.com/macros/s/.../exec" />
          <button onClick={saveSheetUrl} className="mt-2 px-3 py-1 bg-yellow-500 text-white text-xs rounded">Save URL</button>
        </div>
      )}

      {msg.text && (
        <div className={"px-4 py-2 text-sm font-medium " + (msg.type === "err" ? "bg-red-50 text-red-600" : msg.type === "warn" ? "bg-yellow-50 text-yellow-700" : "bg-green-50 text-green-600")}>{msg.text}</div>
      )}

      {view === "form" && (
        <div className="p-4 space-y-3">
          <div className="grid grid-cols-4 gap-2">
            <div className="col-span-2"><label className={lc}>Patient ID</label><input className={ic} value={form.patientId} onChange={e => set("patientId", e.target.value)} placeholder="DPN-001" /></div>
            <div><label className={lc}>Visit</label><select className={ic} value={form.visitType} onChange={e => set("visitType", e.target.value)}><option>T0</option><option>T1</option><option>T2</option><option>T3</option></select></div>
            <div><label className={lc}>Date</label><input type="date" className={ic} value={form.date} onChange={e => set("date", e.target.value)} /></div>
          </div>
          <div className="grid grid-cols-4 gap-2">
            <div><label className={lc}>Age</label><input className={ic} type="number" value={form.age} onChange={e => set("age", e.target.value)} /></div>
            <div><label className={lc}>Sex</label><select className={ic} value={form.sex} onChange={e => set("sex", e.target.value)}><option value="">--</option><option>M</option><option>F</option></select></div>
            <div><label className={lc}>DM Type</label><select className={ic} value={form.diabetesType} onChange={e => set("diabetesType", e.target.value)}><option>Type 1</option><option>Type 2</option></select></div>
            <div><label className={lc}>DM Yrs</label><input className={ic} type="number" value={form.diabetesDuration} onChange={e => set("diabetesDuration", e.target.value)} /></div>
          </div>

          <div className="bg-gray-50 rounded p-3">
            <div className="text-xs font-semibold text-gray-500 mb-2">HRV and PAIN</div>
            <div className="grid grid-cols-2 gap-4">
              {["Pre","Post"].map(ph => (
                <div key={ph}>
                  <div className="text-xs text-gray-400 mb-1">{ph.toUpperCase()}</div>
                  <div className="grid grid-cols-2 gap-2">
                    <div><label className={lc}>RMSSD</label><input className={ic} type="number" step="0.1" value={form["rmssd"+ph]} onChange={e => set("rmssd"+ph, e.target.value)} placeholder="ms" /></div>
                    <div><label className={lc}>NRS Pain</label><input className={ic} type="number" min="0" max="10" value={form["nrsPain"+ph]} onChange={e => set("nrsPain"+ph, e.target.value)} placeholder="/10" /></div>
                  </div>
                </div>
              ))}
            </div>
          </div>

          {["Pre","Post"].map(phase => (
            <div key={phase} className="bg-gray-50 rounded p-3">
              <div className="flex justify-between items-center mb-2">
                <span className="text-xs font-semibold text-gray-500">MONOFILAMENT {phase.toUpperCase()}</span>
                <span className="text-sm font-bold text-blue-600">L: {sumChecked(form["leftFoot"+phase])}/12 | R: {sumChecked(form["rightFoot"+phase])}/12</span>
              </div>
              <div className="grid grid-cols-2 gap-3">
                {["left","right"].map(side => (
                  <div key={side}>
                    <div className="text-xs text-gray-400 mb-1 capitalize">{side}</div>
                    <div className="grid grid-cols-3 gap-1">
                      {siteLabels.map((label, i) => {
                        const key = side+"Foot"+phase;
                        return (
                          <button key={i} onClick={() => toggleSite(key, i)}
                            className={"text-xs py-1 px-0.5 rounded border " + (form[key][i] ? "bg-blue-500 text-white border-blue-500" : "bg-white text-gray-500 border-gray-300")}>
                            {label}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          ))}

          <div className="bg-gray-50 rounded p-3">
            <div className="text-xs font-semibold text-gray-500 mb-2">STEREOGNOSIS (0-3 per hand)</div>
            <div className="grid grid-cols-2 gap-4">
              {["Pre","Post"].map(ph => (
                <div key={ph}>
                  <div className="text-xs text-gray-400 mb-1">{ph.toUpperCase()}</div>
                  <div className="grid grid-cols-3 gap-2">
                    <div><label className={lc}>Quarter</label><select className={ic} value={form["coinQuarter"+ph]} onChange={e => set("coinQuarter"+ph, e.target.value)}><option value="">--</option><option>Yes</option><option>No</option></select></div>
                    <div><label className={lc}>Dime</label><select className={ic} value={form["coinDime"+ph]} onChange={e => set("coinDime"+ph, e.target.value)}><option value="">--</option><option>Yes</option><option>No</option></select></div>
                    <div><label className={lc}>Penny</label><select className={ic} value={form["coinPenny"+ph]} onChange={e => set("coinPenny"+ph, e.target.value)}><option value="">--</option><option>Yes</option><option>No</option></select></div>
                  </div>
                </div>
              ))}
            </div>
          </div>

          <div className="bg-gray-50 rounded p-3">
            <div className="text-xs font-semibold text-gray-500 mb-2">SINGLE LEG STANCE (eyes closed, max 30s) and 10M WALK</div>
            <div className="grid grid-cols-2 gap-4">
              {["Pre","Post"].map(ph => (
                <div key={ph}>
                  <div className="text-xs text-gray-400 mb-1">{ph.toUpperCase()}</div>
                  <div className="space-y-2">
                    <div className="grid grid-cols-2 gap-2">
                      <div><label className={lc}>R leg (s)</label><input className={ic} type="number" step="0.1" value={form["slsRightSec"+ph]} onChange={e => set("slsRightSec"+ph, e.target.value)} /></div>
                      <div><label className={lc}>R fall?</label><select className={ic} value={form["slsRightFall"+ph]} onChange={e => set("slsRightFall"+ph, e.target.value)}><option>No</option><option>Yes</option></select></div>
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div><label className={lc}>L leg (s)</label><input className={ic} type="number" step="0.1" value={form["slsLeftSec"+ph]} onChange={e => set("slsLeftSec"+ph, e.target.value)} /></div>
                      <div><label className={lc}>L fall?</label><select className={ic} value={form["slsLeftFall"+ph]} onChange={e => set("slsLeftFall"+ph, e.target.value)}><option>No</option><option>Yes</option></select></div>
                    </div>
                    <div><label className={lc}>10m walk (s)</label><input className={ic} type="number" step="0.1" value={form["walkTime"+ph]} onChange={e => set("walkTime"+ph, e.target.value)} /></div>
                  </div>
                </div>
              ))}
            </div>
          </div>

          <div><label className={lc}>Notes</label><textarea className={ic + " h-14"} value={form.notes} onChange={e => set("notes", e.target.value)} placeholder="Meds, observations..."></textarea></div>

          <button onClick={handleSubmit} disabled={submitting}
            className={"w-full py-3 rounded-lg text-white font-semibold text-base " + (submitting ? "bg-gray-400" : "bg-blue-600 active:bg-blue-700")}>
            {submitting ? "Submitting..." : "Submit: Copy Note + Save Data"}
          </button>
          <button onClick={resetForm} className="w-full py-2 text-sm text-gray-400">Clear form for next patient</button>
        </div>
      )}

      {view === "note" && (
        <div className="p-4">
          <pre className="text-xs font-mono bg-gray-50 p-4 rounded whitespace-pre-wrap border">{generateNote()}</pre>
          <button onClick={() => { navigator.clipboard.writeText(generateNote()); flash("Copied"); }}
            className="mt-3 w-full py-2 bg-blue-600 text-white rounded text-sm font-medium">Copy Again</button>
        </div>
      )}

      {view === "records" && (
        <div className="p-4">
          <div className="flex justify-between items-center mb-3">
            <span className="text-sm text-gray-600">{records.length} records</span>
            <div className="flex gap-2">
              <button onClick={exportCSV} disabled={!records.length} className="px-3 py-1 bg-green-600 text-white text-xs rounded">CSV</button>
              <button onClick={clearAll} disabled={!records.length} className="px-3 py-1 bg-red-100 text-red-600 text-xs rounded">Clear</button>
            </div>
          </div>
          {!records.length ? <div className="text-center text-gray-400 py-8 text-sm">No records yet</div> : (
            <div className="space-y-2 max-h-96 overflow-y-auto">
              {records.map((r, i) => (
                <div key={r.id || i} className="bg-gray-50 rounded p-3 text-xs">
                  <div className="flex justify-between"><span className="font-medium">{r.patientId}</span><span className="text-gray-400">{r.date} | {r.visitType}</span></div>
                  <div className="text-gray-600 mt-1">
                    Mono: {r.combinedPre}/24 &rarr; {r.combinedPost}/24 ({r.monofilamentChange > 0 ? "+" : ""}{r.monofilamentChange}) |
                    Coins: {r.coinScorePre != null ? r.coinScorePre : "?"}/3 &rarr; {r.coinScorePost != null ? r.coinScorePost : "?"}/3 |
                    RMSSD: {r.rmssdPre} &rarr; {r.rmssdPost} | Pain: {r.nrsPainPre} &rarr; {r.nrsPainPost}
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body>
</html>
