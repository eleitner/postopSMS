            function detectContraKeywords(notesStr) {
              var lower = notesStr.toLowerCase();
              var hits = [];
              if (lower.indexOf("pacemaker") >= 0) hits.push("pacemaker");
              if (lower.indexOf("defibrillator") >= 0) hits.push("defibrillator");
              if (/\baicd\b/i.test(notesStr)) hits.push("AICD");
              // ICD device only if not in a diagnostic-coding context AND has device context nearby
              var hasCodingMention = /icd[-\s]*(10|9|cm|pcs|code|coding)/i.test(notesStr);
              if (!hasCodingMention && /\bicd\b/i.test(notesStr) && /(implant|device|placement|s\/p|h\/o|history of)/i.test(notesStr)) {
                hits.push("ICD device");
              }
              if (lower.indexOf("loop recorder") >= 0) hits.push("loop recorder");
              if (lower.indexOf("spinal cord stim") >= 0) hits.push("spinal cord stimulator");
              if (lower.indexOf("deep brain stim") >= 0) hits.push("deep brain stimulator");
              if (lower.indexOf("bladder stim") >= 0) hits.push("bladder stimulator");
              if (lower.indexOf("pregnan") >= 0) hits.push("pregnancy");
              if (lower.indexOf("hemophilia") >= 0) hits.push("hemophilia");
              if (lower.indexOf("dementia") >= 0) hits.push("dementia");
              return hits;
            }

            // Classify each referral
            var classified = referrals.map(function(ref) {
              var notesStr = String(ref.notes || "");
              // Contraindication: trust the CONTRA: marker from Haiku, fall back to keyword scan
              var contraMatch = /CONTRA:\s*([^|]+)/i.exec(notesStr);
              var contraText = "";
              if (contraMatch) {
                contraText = contraMatch[1].trim();
              } else {
                var hits = detectContraKeywords(notesStr);
                if (hits.length) contraText = hits.join(", ");
              }
              // Payer classification from Ins:/Sec: prefixes in notes
              var insMatch = /\bIns:\s*([^|#]+)/i.exec(notesStr);
              var secMatch = /\bSec:\s*([^|#]+)/i.exec(notesStr);
              var primaryIns = insMatch ? insMatch[1].trim() : "";
              var secondaryIns = secMatch ? secMatch[1].trim() : "";
              var payerTier = classifyPayer(primaryIns, secondaryIns);
              return { ref: ref, contraText: contraText, hasContra: !!contraText, payerTier: payerTier };
            });
            // Partition: red (contra or red-payer) at bottom; everything else keeps server order
            var nonRed = classified.filter(function(c){ return !c.hasContra && c.payerTier.tier !== "red"; });
            var red = classified.filter(function(c){ return c.hasContra || c.payerTier.tier === "red"; });
            var ordered = nonRed.concat(red);

            return ordered.map(function(c, idx) {
              var ref = c.ref;
              var days = ref.referralDate ? Math.floor((Date.now() - new Date(ref.referralDate).getTime()) / 86400000) : 0;
              var isStale = days >= 2 && !ref.called && !c.hasContra && c.payerTier.tier !== "red";
              var statusColor = ref.status === "Complete" ? "text-green-600" :
                ref.status === "Intake Complete" ? "text-blue-600" :
                (c.hasContra) ? "text-purple-700" :
                (c.payerTier.tier === "red") ? "text-red-700" :
                isStale ? "text-orange-600" : "text-gray-500";
              // Color precedence (top to bottom, first match wins):
              //   contraindication → PURPLE (clinical, physician judgment)
              //   red payer        → red (billing/coverage)
              //   yellow payer     → yellow
              //   green payer      → green
              //   default          → neutral
              // Purple is distinct from red because the concern is medical
              // (anticoagulation, pacemaker, etc.), not billing-related.
              // Treating both as red was conflating "needs MD review" with
              // "preauth will be denied" — different problems, different owners.
              var cardClass = c.hasContra ? "border-purple-500 bg-purple-50"
                : c.payerTier.tier === "red" ? "border-red-400 bg-red-50"
                : c.payerTier.tier === "yellow" ? "border-amber-400 bg-amber-50"
                : c.payerTier.tier === "green" ? "border-green-300 bg-green-50"
                : "border-gray-200 bg-white";
              // Payer category badge from accumulated Payer Reference table
              // (separate from the heuristic green/yellow/red tier above).
              // Shows verified institutional knowledge: "Auto-approve" /
              // "Preauth needed" / "Not covered" / "Unknown — verify".
              var payerCat = (ref.payerLookup && ref.payerLookup.category) || "unknown-needs-verification";
              var payerBadge = null;
              if (payerCat === "auto-approved") {
                payerBadge = { text: "⚡ Auto-approve", cls: "bg-green-100 text-green-800" };
              } else if (payerCat === "preauth-required") {
                payerBadge = { text: "🔍 Preauth needed", cls: "bg-amber-100 text-amber-800" };
              } else if (payerCat === "not-covered") {
                payerBadge = { text: "❌ Not covered", cls: "bg-red-100 text-red-800" };
              } else {
                payerBadge = { text: "❓ Verify payer", cls: "bg-gray-100 text-gray-700" };
              }
              var verifiedDate = (ref.payerLookup && ref.payerLookup.lastVerified) || "";
              return (
                <div key={idx} className={"rounded border p-3 space-y-1 " + cardClass}>
                  {c.hasContra && (
                    <div className="bg-purple-200 text-purple-900 rounded px-2 py-1 text-xs font-bold mb-1">
                      🟣 CONTRAINDICATION — physician review: {c.contraText}
                    </div>
                  )}
                  {!c.hasContra && c.payerTier.tier === "red" && (
                    <div className="bg-red-200 text-red-900 rounded px-2 py-1 text-xs font-bold mb-1">
                      ‼ NOT YET APPROVED: {c.payerTier.reason}
                    </div>
                  )}
                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-2 flex-1 min-w-0">
                      <div className="font-medium text-sm text-gray-900 truncate">{ref.name || "Unknown"}</div>
                      {!c.hasContra && c.payerTier.tier === "yellow" && (function(){
                        // For MA plans, the indicator depends on where the patient
                        // is in the preauth lifecycle. Status "Authorized" or later
                        // means Floyd already confirmed preauth — show the calm
                        // "MA · authorized" badge. Anything earlier means preauth
                        // is still pending — show "Preauth pending" as a quiet
                        // reminder that intake should wait. Floyd's email parser
                        // flips status to Authorized automatically when his
                        // approval email comes in, so the badge updates without
                        // anyone having to manually change anything.
                        var s = String(ref.status || "").trim();
                        var preauthDone = s === "Authorized" ||
                          s === "D0 Scheduled" || s === "D0 Complete" ||
                          s.indexOf("Trial Billing") === 0 ||
                          s === "D20 Complete" || s === "D90 Complete" ||
                          s === "Reimbursed" || s === "Complete";
                        if (preauthDone) {
                          return <span className="text-xs bg-amber-200 text-amber-900 px-1.5 py-0.5 rounded font-semibold whitespace-nowrap">MA · authorized</span>;
                        }
                        return <span className="text-xs bg-amber-200 text-amber-900 px-1.5 py-0.5 rounded font-semibold whitespace-nowrap">⏳ Preauth pending</span>;
                      })()}
                      {!c.hasContra && c.payerTier.tier === "green" && (
                        <span className="text-xs bg-green-200 text-green-900 px-1.5 py-0.5 rounded font-semibold whitespace-nowrap">✓ Medicare</span>
                      )}
                    </div>
                    {/* Status display with non-canonical indicator. The "?"
                        chip means status doesn't match any known taxonomy
                        value — usually a legacy/relic status that needs human
                        cleanup. Tap-and-hold (or hover on desktop) shows
                        what's expected. We don't auto-rewrite; we surface. */}
                    <div className="flex items-center gap-1 ml-2">
                      {!isCanonicalStatus(ref.status) && (
                        <span title="Non-canonical status — needs human review or update"
                              className="text-[10px] px-1.5 py-0.5 rounded bg-yellow-200 text-yellow-900 font-bold">?</span>
                      )}
                      <div className={"text-xs font-medium " + statusColor}>{ref.status || "New"}</div>
                    </div>
                  </div>
                  {/* Payer category badge — shows what we KNOW about this
                      payer from accumulated Floyd verifications. Distinct
                      from the heuristic green/yellow/red tier (which is a
                      first-glance guess). When both appear, the badge is
                      the more reliable signal. */}
                  {ref.insurancePrimary && (
                    <div className="flex items-center gap-2 flex-wrap text-xs">
                      <span className={"px-1.5 py-0.5 rounded font-semibold " + payerBadge.cls}>{payerBadge.text}</span>
                      <span className="text-gray-500 truncate">{ref.insurancePrimary}</span>
                      {verifiedDate && (
                        <span className="text-gray-400 text-[10px]">verified {verifiedDate}</span>
                      )}
                    </div>
                  )}
                  <div className="flex items-center justify-between">
                    <div className="text-xs text-gray-500 flex items-center gap-1 flex-wrap">
                      {ref.provider ? "Ref: " + ref.provider : ""}
                      {ref.phone && (
                        <React.Fragment>
                          <span>{ref.provider ? " | " : ""}{ref.phone}</span>
                          {(function(){
                            // Phone validation badge derived from call log.
                            // Walk log backwards: first ✓ marker = verified state,
                            // first wrong-number entry without a later ✓ = unverified.
                            // Same logic as the backend webhook so visual matches behavior.
                            var logStr = String(ref.callLog || "");
                            if (!logStr) return null;
                            var lines = logStr.split("\n");
                            var state = null;
                            for (var li = lines.length - 1; li >= 0; li--) {
                              var line = lines[li];
                              if (line.indexOf("✓ phone verified") === 0) { state = "verified"; break; }
                              if (line.indexOf("Wrong number") !== -1 && line.indexOf("✓") !== 0) { state = "wrong"; break; }
                            }
                            if (state === "verified") {
                              return (
                                <button title="Phone verified — tap to revert"
                                  onClick={function(){
                                    if (!confirm("Revert verification? This re-flags the number as wrong.")) return;
                                    // Revert by logging a fresh wrong-number entry.
                                    // Reuses logCallAttempt path so audit trail is consistent.
                                    logCallAttempt(ref.rowIndex, "Wrong number", "verification reverted");
                                  }}
                                  className="text-green-600 font-bold ml-0.5">✓</button>
                              );
                            }
                            if (state === "wrong") {
                              return (
                                <button title="Number flagged wrong — tap to verify"
                                  onClick={function(){ verifyPhone(ref); }}
                                  className="text-red-600 font-bold ml-0.5">✗</button>
                              );
                            }
                            return null;
                          })()}
                        </React.Fragment>
                      )}
                    </div>
                    <div className={"text-xs " + (isStale ? "text-orange-600 font-bold" : "text-gray-400")}>{days > 0 ? days + "d ago" : "Today"}</div>
                  </div>
                  {(function(){
                    // Extract Ins: and Sec: lines from notes string for display
                    var notesStr = String(ref.notes || "");
                    var insMatch = /\bIns:\s*([^|]+)/i.exec(notesStr);
                    var secMatch = /\bSec:\s*([^|]+)/i.exec(notesStr);
                    var primary = insMatch ? insMatch[1].trim() : "";
                    var secondary = secMatch ? secMatch[1].trim() : "";
                    if (!primary && !secondary) return null;
                    return (
                      <div className="text-xs text-gray-500 mt-0.5">
                        {primary && <div className="truncate">{primary}</div>}
                        {secondary && <div className="truncate">2°: {secondary}</div>}
                      </div>
                    );
                  })()}
                  {ref.dncId && <div className="text-xs text-blue-500">ID: {ref.dncId}</div>}
                {/* Comm preference badge. Visible on every card post-intake so
                    any clinician can see at a glance how to reach this patient.
                    Blank = not yet captured. Icons are redundant with text but
                    help scan a long list. */}
                {ref.commPref && (
                  <div className="text-xs text-gray-500 mt-0.5">
                    {ref.commPref === "SMS" ? "📱 SMS" :
                     ref.commPref === "Call" ? "📞 Call" :
                     ref.commPref === "Email" ? "✉️ Email" :
                     ref.commPref === "No preference" ? "↔️ No pref" :
                     ref.commPref}
                  </div>
                )}
                {/* Call tally: only shown when attempts > 0. Gives MA a quick
                    read on whether this referral has been pursued already
                    without opening the card. Format: "📞 3 attempts · last 4/20 2:45pm"
                    lastCallAt is ISO from backend; shortened client-side for display. */}
                {(parseInt(ref.callAttempts, 10) || 0) > 0 && (function(){
                  var n = parseInt(ref.callAttempts, 10);
                  var lastShort = "";
                  if (ref.lastCallAt) {
                    try {
                      var d = new Date(ref.lastCallAt);
                      lastShort = (d.getMonth()+1)+"/"+d.getDate()+" "+((d.getHours()%12)||12)+":"+(d.getMinutes()<10?"0":"")+d.getMinutes()+(d.getHours()>=12?"pm":"am");
                    } catch(e){}
                  }
                  return (
                    <div className="text-xs text-gray-500 mt-0.5">
                      📞 {n} {n === 1 ? "attempt" : "attempts"}{lastShort ? " · last " + lastShort : ""}
                    </div>
                  );
                })()}

                {/* Latest notification event from the log. Shows any automated
                    or manual contact attempt (AI call, SMS, email, manual call)
                    across any type (preauth-schedule, d0-reminder, d3-checkin,
                    etc.). Gives the MA a live view of "what's been tried" at
                    a glance without opening anything. Channel icons + status
                    color make it scannable. Empty when no events logged yet.
                    Escalated status uses red to draw attention — that's where
                    a human needs to act. */}
                {ref.latestEvent && (function(){
                  var ev = ref.latestEvent;
                  var channelIcon =
                    ev.channel === "ai-call" ? "🤖" :
                    ev.channel === "sms" ? "📱" :
                    ev.channel === "email" ? "✉️" :
                    ev.channel === "manual-call" ? "📞" :
                    ev.channel === "manual-sms" ? "💬" : "•";
                  var statusLabel =
                    ev.status === "completed" ? "✓" :
                    ev.status === "in-progress" ? "↻" :
                    ev.status === "pending" ? "…" :
                    ev.status === "escalated" ? "⚠️" :
                    ev.status === "no-response" ? "∅" :
                    ev.status === "failed" ? "✗" : ev.status;
                  var bg =
                    ev.status === "escalated" || ev.status === "failed" ? "bg-red-50 border-red-200 text-red-700" :
                    ev.status === "in-progress" || ev.status === "pending" ? "bg-yellow-50 border-yellow-200 text-yellow-700" :
                    "bg-gray-50 border-gray-200 text-gray-600";
                  var tsShort = "";
                  var tsRaw = ev.completedAt || ev.initiatedAt;
                  if (tsRaw) {
                    try {
                      var d = new Date(tsRaw);
                      var now = new Date();
                      var minsAgo = Math.floor((now - d) / 60000);
                      if (minsAgo < 1) tsShort = "just now";
                      else if (minsAgo < 60) tsShort = minsAgo + "m ago";
                      else if (minsAgo < 1440) tsShort = Math.floor(minsAgo / 60) + "h ago";
                      else tsShort = (d.getMonth()+1)+"/"+d.getDate();
                    } catch(e){}
                  }
                  var typeLabel = String(ev.type || "").replace(/-/g, " ");
                  return (
                    <div className={"text-xs mt-1 px-2 py-1 rounded border " + bg}>
                      <div className="flex items-center justify-between gap-2">
                        <span className="font-medium truncate">
                          {channelIcon} {typeLabel} {statusLabel}
                        </span>
                        {tsShort && <span className="text-[10px] opacity-70 whitespace-nowrap">{tsShort}</span>}
                      </div>
                      {ev.outcome && <div className="truncate opacity-80 mt-0.5">{ev.outcome}</div>}
                    </div>
                  );
                })()}
                <div className="flex gap-2 pt-1">
                  {/* Call logging button — always available regardless of pipeline
                      stage. Bradley flagged that once intake started, there was
                      no way to log additional call attempts (e.g., patient hung
                      up mid-intake, or MA needed to capture "call back at 7pm"
                      on a partially-completed draft). The full modal (outcome +
                      follow-up note) is the right tool for ALL non-completed
                      contact attempts, not just first contact.

                      Two variants:
                       - No DNC ID yet (fresh referral): "Call Patient"
                         (the modal also offers "Yes — start intake now" path)
                       - DNC ID exists (intake started or called): "Log Call"
                         (modal still has all outcomes; "start intake" reopens
                         the existing draft via Open Draft button) */}
                  {!ref.dncId && (
                    <button onClick={function(){openCallModal(ref)}}
                      className="flex-1 py-1.5 bg-blue-600 text-white rounded text-xs font-medium">Call Patient</button>
                  )}
                  {ref.dncId && (
                    <button onClick={function(){openCallModal(ref)}}
                      className="flex-1 py-1.5 bg-yellow-500 text-white rounded text-xs font-medium">📞 Log Call</button>
                  )}
                  {ref.dncId && (
                    <button onClick={function(){
                      // Reset form to clean state with this patient's ID so that if
                      // the draft doesn't exist in cloud or local, we're not showing
                      // stale data from a previously-loaded patient. loadDraft will
                      // overwrite form with full draft data if found; if not found,
                      // user sees a clean form labeled with the correct patient ID.
                      setForm(Object.assign({}, defaultState, { date: todayLocal(), patientId: ref.dncId }));
                      setPatientName(ref.name || "");
                      setFormSection("intake");
                      setView("form");
                      loadDraft(ref.dncId);
                    }}
                      className="flex-1 py-1.5 bg-gray-200 text-gray-700 rounded text-xs font-medium">Open Draft</button>
                  )}
                  <button onClick={function(){
                    var reason = prompt("Remove " + (ref.name || "this referral") + " from list?\n\nEnter reason (e.g. Withdrawn, Wrong patient, Duplicate, Patient seen elsewhere):");
                    if (reason && reason.trim()) {
                      updateReferralStatus(ref.rowIndex, "status", "Removed: " + reason.trim());
                      flash("Removed from list");
                    }
                  }} className="px-2 py-1.5 bg-red-50 text-red-500 rounded text-xs font-medium">×</button>
                </div>
              </div>
            );
          });
          })()}
        </div>
      )}

      {/* ========== CONSENT TAB ========== */}
      {/* ========== COSIGN TAB ========== */}
      {/* Shows documents awaiting this user's signature. Typical users:
          Lindsey (MD) as cosigner for CRNA/NP authors, or whichever physician
          is mapped to each site. The backend filters by the signed-in user's
          email, so this list only shows what THIS user needs to sign. */}
      {view === "cosign" && (
        <div className="p-4 space-y-3">
          <div className="flex items-center justify-between">
            <div>
              <div className="text-lg font-semibold text-gray-800">Cosign Queue</div>
              <div className="text-xs text-gray-500">Documents awaiting your signature</div>
            </div>
            <button onClick={loadCosignQueue}
              className="px-3 py-1.5 bg-blue-50 text-blue-600 rounded text-xs font-medium">
              Refresh
            </button>
          </div>

          {cosignLoading && (
            <div className="text-center text-gray-400 text-sm py-6">Loading...</div>
          )}

          {!cosignLoading && cosignQueue.length === 0 && (
            <div className="text-center py-8">
              <div className="text-4xl mb-2">✓</div>
              <div className="text-gray-500 text-sm">No documents awaiting your signature.</div>
            </div>
          )}

          {!cosignLoading && cosignQueue.length > 0 && cosignQueue.map(function(c) {
            var createdShort = "";
            if (c.createdAt) {
              try {
                var d = new Date(c.createdAt);
                var now = new Date();
                var mins = Math.floor((now - d) / 60000);
                if (mins < 1) createdShort = "just now";
                else if (mins < 60) createdShort = mins + "m ago";
                else if (mins < 1440) createdShort = Math.floor(mins/60) + "h ago";
                else createdShort = Math.floor(mins/1440) + "d ago";
              } catch(e) { createdShort = ""; }
            }
            var isSigning = cosignSigning === c.cosignId;
            return (
              <div key={c.cosignId} className="bg-white border border-gray-200 rounded-lg p-3 shadow-sm">
                <div className="flex items-start justify-between gap-2 mb-2">
                  <div className="flex-1 min-w-0">
                    <div className="font-semibold text-gray-800 text-sm">{c.docType}</div>
                    <div className="text-xs text-gray-500 mt-0.5">
                      {c.patientId}{c.siteId ? " · " + c.siteId : ""}
                    </div>
                    <div className="text-xs text-gray-400 mt-0.5">
                      by {c.authorEmail}{c.authorRole ? " (" + c.authorRole + ")" : ""} · {createdShort}
                    </div>
                    {c.notes && (
                      <div className="text-xs text-amber-700 mt-1 italic">{c.notes}</div>
                    )}
                  </div>
                </div>
                <div className="flex gap-2 mt-2">
                  {c.docUrl && (
                    <a href={c.docUrl} target="_blank" rel="noopener noreferrer"
                       className="flex-1 py-2 bg-gray-100 text-gray-700 rounded text-xs font-medium text-center">
                      View Doc
                    </a>
                  )}
                  <button onClick={function(){ signCosignEntry(c.cosignId, c.docType, c.patientId); }}
                    disabled={isSigning}
                    className={"flex-1 py-2 rounded text-xs font-medium " +
                      (isSigning ? "bg-gray-300 text-gray-500" : "bg-green-600 text-white")}>
                    {isSigning ? "Signing..." : "Sign"}
                  </button>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* ========== CONSENT TAB ========== */}
      {view === "consent" && (
        <div className="p-4 space-y-3">
          <div>
            <label className={lc}>Patient (load from Assess tab or enter ID)</label>
            <input className={ic} value={form.patientId} onChange={function(e){set("patientId",e.target.value)}} placeholder="DNC-XXXX" />
            {patientName && <div className="text-xs text-gray-500 mt-1">{patientName}</div>}
          </div>

          {!form.patientId && (
            <div className="text-center text-gray-400 text-sm py-6">Enter Study ID to begin consent</div>
          )}

          {/* Consent list view */}
          {form.patientId && !currentConsent && (
            <div className="space-y-3">
              <div className="text-xs text-gray-500">Tap a consent to review and sign. Patient reads the full text, then patient and witness both sign at the bottom.</div>
              {CONSENTS.map(function(c) {
                var existing = photos.find(function(p){return p.patientId === form.patientId && p.type === c.photoType});
                var signed = !!existing;
                return (
                  <button key={c.key} onClick={function(){
                    setCurrentConsent(c.key);
                    setScrolledToBottom(false);
                    // Pre-fill witness identity from logged-in user's profile.
                    // Per Evan's call: auto-fill BOTH name and signature so
                    // the witness can confirm with a single tap rather than
                    // re-typing and re-drawing on every consent. Convention
                    // matches how digital EHR signatures (Cerner, Epic) work
                    // — authenticate once, clicks become signature.
                    var prefillName = "";
                    var prefillSig = null;
                    if (userProfile) {
                      prefillName = userProfile.displayName || "";
                      if (userProfile.credentials) prefillName += ", " + userProfile.credentials;
                      prefillSig = userProfile.signatureDataUrl || null;
                    }
                    setConsentSigs({patient:null, witness: prefillSig, witnessName: prefillName});
                  }}
                    className={"w-full text-left p-4 rounded-lg border-2 " + (signed ? "bg-green-50 border-green-300" : "bg-white border-gray-200")}>
                    <div className="flex items-center justify-between">
                      <div className="font-medium text-gray-800">{c.title}</div>
                      <div className={"text-xs font-semibold " + (signed ? "text-green-600" : "text-gray-400")}>{signed ? "SIGNED ✓" : "Tap to sign"}</div>
                    </div>
                    {signed && <div className="text-xs text-gray-500 mt-1">{new Date(existing.timestamp).toLocaleString()}</div>}
                  </button>
                );
              })}
            </div>
          )}

          {/* Consent detail view */}
          {form.patientId && currentConsent && (function() {
            var consent = CONSENTS.find(function(c){return c.key===currentConsent});
            if (!consent) return null;
            var canSave = scrolledToBottom && consentSigs.patient && consentSigs.witness && consentSigs.witnessName.trim();
            return (
              <div className="space-y-3">
                <button onClick={function(){setCurrentConsent(null)}} className="text-xs text-blue-600">← Back to consents</button>
                <div className="font-bold text-gray-800 text-base">{consent.title}</div>
                <div className="text-xs text-gray-500">Patient: {patientName || form.patientId}</div>

                {/* Scrollable consent body */}
                <div
                  id="consent-body"
                  className="border-2 border-gray-200 rounded bg-gray-50 p-3 text-sm text-gray-700 leading-relaxed whitespace-pre-wrap"
                  style={{maxHeight: "300px", overflowY: "auto"}}
                  onScroll={function(e){
                    var el = e.target;
                    if (el.scrollTop + el.clientHeight >= el.scrollHeight - 20) {
                      setScrolledToBottom(true);
                    }
                  }}>
                  {consent.body}
                </div>
                {!scrolledToBottom && (
                  <div className="text-xs text-orange-600 font-medium">Scroll to bottom to enable signing</div>
                )}
                {scrolledToBottom && (
                  <div className="text-xs text-green-600 font-medium">✓ Consent text reviewed</div>
                )}

                {/* Patient signature */}
                <div className={"rounded border-2 p-3 " + (consentSigs.patient ? "border-green-300 bg-green-50" : "border-gray-200 bg-white")}>
                  <div className="flex items-center justify-between mb-2">
                    <div className="text-sm font-semibold text-gray-700">Patient Signature</div>
                    {consentSigs.patient && <div className="text-xs text-green-600 font-medium">SIGNED ✓</div>}
                  </div>
                  {consentSigs.patient && (
                    <img src={consentSigs.patient} className="w-full h-24 object-contain bg-white border border-gray-200 rounded mb-2" alt="Patient signature" />
                  )}
                  <button
                    onClick={function(){
                      if (!scrolledToBottom) { flash("Scroll through consent text first", "err"); return; }
                      setSigModalType("consent_patient");
                      setTimeout(function() {
                        var canvas = document.getElementById("sig-canvas");
                        if (canvas) {
                          var ctx = canvas.getContext("2d");
                          ctx.fillStyle = "#ffffff";
                          ctx.fillRect(0, 0, canvas.width, canvas.height);
                          ctx.strokeStyle = "#000000";
                          ctx.lineWidth = 2.5;
                          ctx.lineCap = "round";
                          ctx.lineJoin = "round";
                        }
                      }, 50);
                    }}
                    disabled={!scrolledToBottom}
                    className={"w-full py-2 rounded text-sm font-medium " + (scrolledToBottom ? "bg-blue-600 text-white" : "bg-gray-200 text-gray-400")}>
                    {consentSigs.patient ? "Re-sign" : "Tap to sign"}
                  </button>
                </div>

                {/* Witness */}
                <div className={"rounded border-2 p-3 " + (consentSigs.witness ? "border-green-300 bg-green-50" : "border-gray-200 bg-white")}>
                  <div className="flex items-center justify-between mb-2">
                    <div className="text-sm font-semibold text-gray-700">Witness</div>
                    {consentSigs.witness && <div className="text-xs text-green-600 font-medium">SIGNED ✓</div>}
                  </div>
                  <input
                    className={ic + " mb-2"}
                    value={consentSigs.witnessName}
                    onChange={function(e){setConsentSigs(function(s){return Object.assign({}, s, {witnessName: e.target.value})})}}
                    placeholder="Witness name (clinic staff)"
                  />
                  {consentSigs.witness && (
                    <img src={consentSigs.witness} className="w-full h-24 object-contain bg-white border border-gray-200 rounded mb-2" alt="Witness signature" />
                  )}
                  {/* When witness sig was auto-filled from profile, the user
                      can re-sign manually if they want — this is the override
                      path. Most days it'll just be confirm-and-go. */}
                  <button
                    onClick={function(){
                      if (!consentSigs.witnessName.trim()) { flash("Enter witness name first", "err"); return; }
                      setSigModalType("consent_witness");
                      setTimeout(function() {
                        var canvas = document.getElementById("sig-canvas");
                        if (canvas) {
                          var ctx = canvas.getContext("2d");
                          ctx.fillStyle = "#ffffff";
                          ctx.fillRect(0, 0, canvas.width, canvas.height);
                          ctx.strokeStyle = "#000000";
                          ctx.lineWidth = 2.5;
                          ctx.lineCap = "round";
                          ctx.lineJoin = "round";
                        }
                      }, 50);
                    }}
                    className="w-full py-2 rounded text-sm font-medium bg-blue-600 text-white">
                    {consentSigs.witness ? "Re-sign manually" : "Tap to sign"}
                  </button>
                </div>

                <button
                  onClick={saveConsent}
                  disabled={!canSave}
                  className={"w-full py-3 rounded-lg text-base font-semibold " + (canSave ? "bg-green-600 text-white" : "bg-gray-200 text-gray-400")}>
                  {canSave ? "Save Consent" : "Complete all fields to save"}
                </button>
              </div>
            );
          })()}
        </div>
      )}

      {/* ========== ASSESS TAB ========== */}
      {view === "form" && (
        <div className="p-4 space-y-3">
          {/* Patient Name + ID */}
          <div className="space-y-2">
            <div>
              <label className={lc}>Patient Name (local only, never exported)</label>
              <input className={ic} value={patientName} onChange={function(e){setPatientName(e.target.value)}} placeholder="Last, First" />
            </div>
            <div className="grid grid-cols-4 gap-2">
              <div className="col-span-2">
                <label className={lc}>Study ID</label>
                <div className="flex gap-1">
                  <input className={ic} value={form.patientId} onChange={function(e){set("patientId",e.target.value)}} placeholder="DNC-XXXX" />
                  <button onClick={function(){set("patientId", generatePatientId())}} className="px-2 py-1 bg-gray-200 text-gray-600 text-xs rounded whitespace-nowrap">New</button>
                  <button onClick={function(){loadDraft()}} className="px-2 py-1 bg-blue-100 text-blue-600 text-xs rounded whitespace-nowrap">Load</button>
                </div>
              </div>
              <div><label className={lc}>Visit</label><select className={ic} value={form.visitType} onChange={function(e){set("visitType",e.target.value)}}><option>Phone Intake</option><option>D0</option><option>D20</option><option>D90</option></select></div>
              <div><label className={lc}>Date</label><input type="date" className={ic} value={form.date} onChange={function(e){set("date",e.target.value)}} /></div>
            </div>

            {/* Inline name search: type 2+ chars, get dropdown of matches from
                user's sites. Pick one → auto-fills Study ID, loads draft. Useful
                when staff know the patient by name but don't remember the DNC ID.
                Debounced 300ms via useEffect watching nameSearchQuery. */}
            <div className="relative">
              <label className={lc}>Find by name</label>
              <input className={ic} value={nameSearchQuery} placeholder="Type 2+ letters of patient name..."
                onChange={function(e){setNameSearchQuery(e.target.value); setNameSearchOpen(true)}}
                onFocus={function(){setNameSearchOpen(true)}}
                onBlur={function(){setTimeout(function(){setNameSearchOpen(false)}, 200)}} />
              {nameSearchOpen && nameSearchQuery && nameSearchQuery.length >= 2 && (
                <div className="absolute left-0 right-0 top-full mt-1 bg-white border border-gray-300 rounded shadow-lg z-10 max-h-64 overflow-y-auto">
                  {nameSearchResults.length === 0 ? (
                    <div className="px-3 py-2 text-xs text-gray-400">No matches</div>
                  ) : (
                    nameSearchResults.map(function(r, i) {
                      return (
                        <button key={i} onMouseDown={function(e){e.preventDefault()}} onClick={function(){
                          if (r.dncId) {
                            set("patientId", r.dncId);
                            setPatientName(r.name || "");
                            loadDraft(r.dncId);
                          } else {
                            // Referral exists but no DNC ID yet — user should go
                            // through call-patient flow on Referrals tab instead
                            flash(r.name + " has no DNC ID yet — use Referrals tab");
                          }
                          setNameSearchQuery("");
                          setNameSearchResults([]);
                          setNameSearchOpen(false);
                        }} className="w-full text-left px-3 py-2 hover:bg-blue-50 border-b border-gray-100">
                          <div className="text-sm text-gray-800">{r.name}</div>
                          <div className="text-xs text-gray-500">
                            {r.dncId ? r.dncId : <span className="text-orange-500">no DNC ID</span>}
                            {r.status ? " · " + r.status : ""}
                            {r.siteId ? " · " + r.siteId : ""}
                          </div>
                        </button>
                      );
                    })
                  )}
                </div>
              )}
            </div>
          </div>

          {/* Saved drafts indicator */}
          {draftList.length > 0 && (
            <div className="text-xs text-gray-400">Drafts: {draftList.map(function(d){
              return <button key={d} onClick={function(){set("patientId",d);}} className="text-blue-500 underline mr-2">{d}</button>;
            })}</div>
          )}

          {/* Demographics */}
          <div className="grid grid-cols-4 gap-2">
            <div><label className={lc}>Age</label><input className={ic} type="number" value={form.age} onChange={function(e){set("age",e.target.value)}} /></div>
            <div><label className={lc}>Sex</label><select className={ic} value={form.sex} onChange={function(e){set("sex",e.target.value)}}><option value="">--</option><option>M</option><option>F</option></select></div>
            <div><label className={lc}>DM Type</label><select className={ic} value={form.diabetesType} onChange={function(e){set("diabetesType",e.target.value)}}><option>Type 1</option><option>Type 2</option></select></div>
            <div><label className={lc}>DM Yrs</label><input className={ic} type="number" value={form.diabetesDuration} onChange={function(e){set("diabetesDuration",e.target.value)}} /></div>
          </div>

          {/* Section toggle */}
          <div className="flex rounded-lg overflow-hidden border border-gray-300">
            <button onClick={function(){setFormSection("intake")}} className={"flex-1 py-2 text-sm font-medium " + (formSection==="intake" ? "bg-blue-600 text-white" : "bg-gray-50 text-gray-500")}>{form.visitType === "D0" ? "Intake / H&P" : form.visitType === "Phone Intake" ? "Phone Intake" : "Progress Note"}</button>
            <button onClick={function(){setFormSection("sensory")}} className={"flex-1 py-2 text-sm font-medium " + (formSection==="sensory" ? "bg-blue-600 text-white" : "bg-gray-50 text-gray-500")}>Sensory Assessment</button>
          </div>

          {/* ---- INTAKE SECTION ---- */}
          {formSection === "intake" && (
            <div className="space-y-3">

              {/* Paste transcript */}
              <div className="bg-blue-50 rounded p-3 border border-blue-200">
                <div className="text-xs font-semibold text-blue-600 mb-1">PASTE TRANSCRIPT (OpenEvidence or other)</div>
                <textarea className={ic + " h-20 bg-white"} value={transcript} onChange={function(e){setTranscript(e.target.value)}} placeholder="Paste call transcript or OpenEvidence note here..."></textarea>
                <button onClick={parseTranscript} disabled={parsing}
                  className={"mt-1 w-full py-2 rounded text-sm font-medium " + (parsing ? "bg-gray-300 text-gray-500" : "bg-blue-600 text-white")}>
                  {parsing ? "Parsing..." : "Parse Transcript to Form"}
                </button>
              </div>

              {/* Phone Intake + D0: Full intake history */}
              {(form.visitType === "D0" || form.visitType === "Phone Intake") && (
                <div className="space-y-3">
                  {form.visitType === "D0" && (
                  <div className="bg-purple-50 border border-purple-200 rounded p-3">
                    <div className="text-xs font-semibold text-purple-700 mb-1">DAY-OF-PROCEDURE NOTE (clinician adds at D0)</div>
                    <div className="text-xs text-purple-600 mb-2">Brief subjective added by clinician on day of procedure. Will prepend to op note.</div>
                    <textarea className={ic} rows="2" value={form.procedureDaySubjective} onChange={function(e){set("procedureDaySubjective",e.target.value)}} placeholder="e.g. Patient presents today for scheduled NS100 implantation. Pain remains 7/10. No interval changes. Ready to proceed." />
                  </div>
                  )}

                  {form.visitType === "D0" && (
                    <div className="text-xs text-gray-400 italic border-t border-gray-200 pt-2">— Phone intake data below (completed during intake call, editable if correction needed) —</div>
                  )}
                  <div className={form.visitType === "D0" ? "space-y-3 opacity-60" : "space-y-3"}>

                  <div><label className={lc}>Referring Provider</label><input className={ic} value={form.referringProvider} onChange={function(e){set("referringProvider",e.target.value)}} placeholder="Dr. Smith" /></div>

                  <div className="bg-gray-50 rounded p-3">
                    <div className="text-xs font-semibold text-gray-500 mb-2">PATIENT CONTACT (for requisition form)</div>
                    <div className="grid grid-cols-2 gap-2 mb-2">
                      <div><label className={lc}>DOB</label><input className={ic} value={form.dob} onChange={function(e){set("dob",e.target.value)}} placeholder="MM/DD/YYYY" /></div>
                      <div><label className={lc}>Phone</label><input className={ic} type="tel" value={form.phone} onChange={function(e){set("phone",e.target.value)}} placeholder="555-555-5555" /></div>
                    </div>
                    <input className={ic + " mb-2"} value={form.address} onChange={function(e){set("address",e.target.value)}} placeholder="Street address" />
                    <div className="grid grid-cols-3 gap-2 mb-2">
                      <input className={ic} value={form.city} onChange={function(e){set("city",e.target.value)}} placeholder="City" />
                      <input className={ic} value={form.state} onChange={function(e){set("state",e.target.value)}} placeholder="State" />
                      <input className={ic} value={form.zip} onChange={function(e){set("zip",e.target.value)}} placeholder="Zip" />
                    </div>
                    <input className={ic} type="email" value={form.email} onChange={function(e){set("email",e.target.value)}} placeholder="Email (optional)" />
                  </div>

                  {/* Comm preference: MA asks the patient once during intake, stored
                      on the throughput row. Drives routing of preauth-approved
                      notifications, D0 reminders, and future scheduling nudges.
                      SMS selection shows TCPA-compliant consent language inline —
                      required before sending any automated/templated SMS under
                      federal TCPA rules. Default blank forces the question to
                      actually be asked rather than silently defaulting. */}
                  <div className="bg-gray-50 rounded p-3">
                    <div className="text-xs font-semibold text-gray-500 mb-2">CONTACT PREFERENCE</div>
                    <label className={lc}>How should we reach you to schedule appointments and send reminders?</label>
                    <select className={ic} value={form.commPref} onChange={function(e){set("commPref",e.target.value)}}>
                      <option value="">-- ask patient --</option>
                      <option value="SMS">Text message (SMS)</option>
                      <option value="Call">Phone call</option>
                      <option value="Email">Email</option>
                      <option value="No preference">No preference</option>
                    </select>
                    {form.commPref === "SMS" && (
                      <div className="text-xs text-gray-600 bg-blue-50 border border-blue-200 rounded p-2 mt-2">
                        <div className="font-semibold text-blue-700 mb-1">SMS consent (read to patient):</div>
                        "By choosing text messaging, you're giving Diabetic Nerve Clinic permission to
                        send automated text messages to {form.phone || "[your phone number]"} for appointment
                        scheduling, reminders, and care coordination. Standard message and data rates may
                        apply. You can opt out at any time by replying STOP."
                      </div>
                    )}
                  </div>

                  <div className="bg-gray-50 rounded p-3">
                    <div className="flex items-center justify-between mb-2">
                      <div className="text-xs font-semibold text-gray-500">INSURANCE</div>
                      {(function(){
                        var pid = form.patientId;
                        var hasPrimary = pid && photos.some(function(p){return p.patientId===pid && p.type==="medicare"});
                        var hasSecondary = pid && photos.some(function(p){return p.patientId===pid && p.type==="medicare_secondary"});
                        return (
                          <div className="flex gap-1">
                            <button onClick={function(){capturePhoto("medicare")}} className={"px-2 py-1 text-xs rounded font-medium whitespace-nowrap " + (hasPrimary ? "bg-green-100 text-green-700" : "bg-blue-100 text-blue-600")}>
