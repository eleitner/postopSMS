                    </div>
                    <div className="grid grid-cols-2 gap-2 mb-2">
                      <div><label className={lc}>Neuropathy type</label><select className={ic} value={form.neuropathyType} onChange={function(e){set("neuropathyType",e.target.value)}}><option>Polyneuropathy</option><option>Mononeuropathy</option></select></div>
                      <div><label className={lc}>Distribution</label><select className={ic} value={form.neuropathyDistribution} onChange={function(e){set("neuropathyDistribution",e.target.value)}}><option>Bilateral LE</option><option>Right LE</option><option>Left LE</option><option>Bilateral UE</option><option>Bilateral UE/LE</option></select></div>
                    </div>
                    <label className={lc}>Diagnosis codes</label>
                    <div className="flex flex-wrap mb-2">{DX_OPTIONS.map(function(d){return <Chip key={d.code} label={d.code + " " + d.label} selected={form.dxCodes.includes(d.code)} onClick={function(){toggleMulti("dxCodes",d.code)}} />;})}</div>
                    <div><label className={lc}>Prognosis</label><select className={ic} value={form.prognosis} onChange={function(e){set("prognosis",e.target.value)}}><option>Fair</option><option>Good</option><option>Excellent</option></select></div>
                  </div>

                  <div className="bg-gray-50 rounded p-3">
                    <div className="text-xs font-semibold text-gray-500 mb-2">CONTRAINDICATIONS</div>
                    <div className="flex flex-wrap">{CONTRAINDICATIONS.map(function(d){return <Chip key={d} label={d} selected={form.contraindications.includes(d)} onClick={function(){toggleMulti("contraindications",d)}} />;})}</div>
                    {form.contraindications.length > 0 && (
                      <div className="text-xs text-red-500 mt-1 font-medium">Contraindication(s) selected - verify eligibility</div>
                    )}
                  </div>

                  </div>
                  {/* end grey wrapper for phone intake data at D0 */}

                  {form.visitType === "D0" && (
                  <div className="bg-gray-50 rounded p-3">
                    <div className="flex items-center justify-between mb-2">
                      <div className="text-xs font-semibold text-gray-500">DEVICE + NEEDLES</div>
                      <div className="flex items-center gap-2">
                        <label className="text-xs text-gray-500">Side:</label>
                        <select className={ic + " w-20"} value={form.implantSide} onChange={function(e){set("implantSide",e.target.value)}}>
                          <option>Right</option>
                          <option>Left</option>
                        </select>
                      </div>
                    </div>
                    <div className="flex gap-2 mb-2">
                      {(function(){
                        var pid = form.patientId;
                        var hasDevice = pid && photos.some(function(p){return p.patientId===pid && p.type==="serial"});
                        return (
                          <button onClick={function(){capturePhoto("serial")}} className={"flex-1 px-2 py-1.5 text-xs rounded font-medium " + (hasDevice ? "bg-green-100 text-green-700" : "bg-blue-100 text-blue-600")}>
                            {hasDevice ? "✓ Device Sticker (top)" : "📷 Device Sticker (top)"}
                          </button>
                        );
                      })()}
                      {(function(){
                        var pid = form.patientId;
                        var hasNeedles = pid && photos.some(function(p){return p.patientId===pid && p.type==="needles"});
                        return (
                          <button onClick={function(){capturePhoto("needles")}} className={"flex-1 px-2 py-1.5 text-xs rounded font-medium " + (hasNeedles ? "bg-green-100 text-green-700" : "bg-blue-100 text-blue-600")}>
                            {hasNeedles ? "✓ Needles Sticker (bot)" : "📷 Needles Sticker (bot)"}
                          </button>
                        );
                      })()}
                    </div>
                    <div className="text-xs font-medium text-gray-500 mt-1 mb-1">Device (generator)</div>
                    <div className="grid grid-cols-3 gap-2 mb-2">
                      <div><label className={lc}>Model</label><input className={ic} value={form.deviceModel} onChange={function(e){set("deviceModel",e.target.value)}} placeholder="NS0232" /></div>
                      <div><label className={lc}>Serial</label><input className={ic} value={form.deviceSerial} onChange={function(e){set("deviceSerial",e.target.value)}} placeholder="NS26A03181" /></div>
                      <div><label className={lc}>Exp</label><input className={ic} value={form.deviceExpiration} onChange={function(e){set("deviceExpiration",e.target.value)}} placeholder="2026-12" /></div>
                    </div>
                    <div className="text-xs font-medium text-gray-500 mt-1 mb-1">Needles (consumable)</div>
                    <div className="grid grid-cols-2 gap-2 mb-2">
                      <div><label className={lc}>Lot</label><input className={ic} value={form.needlesLot} onChange={function(e){set("needlesLot",e.target.value)}} placeholder="NS26A1000" /></div>
                      <div><label className={lc}>Exp</label><input className={ic} value={form.needlesExpiration} onChange={function(e){set("needlesExpiration",e.target.value)}} placeholder="2026-12" /></div>
                    </div>
                    <input className={ic + " mt-2"} value={form.deviceNotes} onChange={function(e){set("deviceNotes",e.target.value)}} placeholder="Placement notes..." />
                  </div>
                  )}
                </div>
              )}

              {/* D20/D90: Progress note with greyed-out original HPI */}
              {(form.visitType === "D20" || form.visitType === "D90") && (
                <div className="space-y-3">
                  <div className="bg-gray-100 rounded p-3 opacity-60">
                    <div className="text-xs font-semibold text-gray-500 mb-1">ORIGINAL HPI (from D0)</div>
                    <div className="text-xs text-gray-600 space-y-1">
                      <div>{form.age}yo {form.sex === "M" ? "male" : form.sex === "F" ? "female" : ""} | {form.diabetesType} DM x {form.diabetesDuration} yrs | A1C: {form.a1c || "---"}</div>
                      <div>Pain at D0: Rest {form.painRest}/10, Best {form.painBest}/10, Worst {form.painWorst}/10</div>
                      <div>Descriptors: {form.painDescriptors.length ? form.painDescriptors.join(", ") : "none"}</div>
                      <div>PMHx: {form.pmhx.length ? form.pmhx.join(", ") : "none"}</div>
                      <div>Meds: {form.medications || "none"}</div>
                      <div>Prior Tx: {form.priorTx.length ? form.priorTx.join(", ") : "none"}</div>
                    </div>
                  </div>

                  {/* D90: single subjective */}
                  {form.visitType === "D90" && (
                    <div className="bg-gray-50 rounded p-3">
                      <div className="text-xs font-semibold text-gray-500 mb-2">SUBJECTIVE</div>
                      <textarea className={ic + " h-24"} value={form.subjective} onChange={function(e){set("subjective",e.target.value)}} placeholder="Patient reports... symptoms since device removal, changes in pain, function, sleep..."></textarea>
                    </div>
                  )}

                  {/* D20: pre-explant subjective */}
                  {form.visitType === "D20" && (
                    <div className="bg-gray-50 rounded p-3">
                      <div className="text-xs font-semibold text-gray-500 mb-2">SUBJECTIVE (PRE-EXPLANT)</div>
                      <textarea className={ic + " h-20"} value={form.subjectivePre} onChange={function(e){set("subjectivePre",e.target.value)}} placeholder="Patient reports over 20-day treatment period... pain changes, sensation improvements, function, sleep..."></textarea>
                    </div>
                  )}

                  <div className="bg-gray-50 rounded p-3">
                    <div className="text-xs font-semibold text-gray-500 mb-2">CURRENT PAIN</div>
                    <div className="grid grid-cols-3 gap-2">
                      <div><label className={lc}>Rest /10</label><input className={ic} type="number" min="0" max="10" value={form.nrsPainPre} onChange={function(e){set("nrsPainPre",e.target.value)}} /></div>
                      <div><label className={lc}>Best /10</label><input className={ic} type="number" min="0" max="10" value={form.painBest} onChange={function(e){set("painBest",e.target.value)}} /></div>
                      <div><label className={lc}>Worst /10</label><input className={ic} type="number" min="0" max="10" value={form.painWorst} onChange={function(e){set("painWorst",e.target.value)}} /></div>
                    </div>
                  </div>

                  {/* D20: explant procedure note */}
                  {form.visitType === "D20" && (
                    <div className="bg-gray-50 rounded p-3">
                      <div className="text-xs font-semibold text-gray-500 mb-2">EXPLANT PROCEDURE</div>
                      <div className="space-y-2">
                        <div>
                          <label className={lc}>Complication</label>
                          <select className={ic} value={form.explantComplication || "No"} onChange={function(e){set("explantComplication",e.target.value)}}><option>No</option><option>Yes</option></select>
                        </div>
                        {form.explantComplication === "Yes" && (
                          <textarea className={ic + " h-20 border-red-300"} value={form.explantComplicationDetail || ""} onChange={function(e){set("explantComplicationDetail",e.target.value)}} placeholder="Describe: site findings (induration, erythema, infection, bleeding), patient symptoms, actions taken..."></textarea>
                        )}
                        <input className={ic} value={form.explantNotes} onChange={function(e){set("explantNotes",e.target.value)}} placeholder="Additional procedure notes..." />
                      </div>
                    </div>
                  )}

                  {/* D20: post-explant subjective */}
                  {form.visitType === "D20" && (
                    <div className="bg-gray-50 rounded p-3">
                      <div className="text-xs font-semibold text-gray-500 mb-2">SUBJECTIVE (POST-EXPLANT)</div>
                      <textarea className={ic + " h-16"} value={form.subjectivePost} onChange={function(e){set("subjectivePost",e.target.value)}} placeholder="How patient feels after device removal..."></textarea>
                    </div>
                  )}

                  {form.visitType === "D20" && (
                    <div className="bg-gray-50 rounded p-3">
                      <div className="text-xs font-semibold text-gray-500 mb-2">UPDATED LABS</div>
                      <div className="grid grid-cols-2 gap-2">
                        <div><label className={lc}>A1C (if available)</label><input className={ic} value={form.a1c} onChange={function(e){set("a1c",e.target.value)}} placeholder="%" /></div>
                        <div><label className={lc}>BG Control</label><select className={ic} value={form.glucoseControl} onChange={function(e){set("glucoseControl",e.target.value)}}><option value="">--</option><option>Well controlled</option><option>Poorly controlled</option></select></div>
                      </div>
                    </div>
                  )}

                  <div className="bg-gray-50 rounded p-3">
                    <div className="text-xs font-semibold text-gray-500 mb-2">PLAN</div>
                    <textarea className={ic + " h-16"} value={form.plan} onChange={function(e){set("plan",e.target.value)}} placeholder="Plan, follow-up instructions, medication changes..."></textarea>
                  </div>
                </div>
              )}

              <div className="flex gap-2">
                <button onClick={saveDraft} className="flex-1 py-2.5 bg-yellow-500 text-white rounded-lg text-sm font-medium">{form.visitType === "Phone Intake" ? "Save Draft" : form.visitType === "D0" ? "Save Draft" : "Save Progress"}</button>
                {form.visitType !== "Phone Intake" && (
                  <button onClick={function(){setFormSection("sensory")}} className="flex-1 py-2.5 bg-blue-600 text-white rounded-lg text-sm font-medium">Continue to Sensory</button>
                )}
              </div>
              {lastAutoSave && (
                <div className="text-xs text-gray-400 text-center -mt-1">Auto-saved {lastAutoSave.toLocaleTimeString()}</div>
              )}
              {(form.visitType === "D0" || form.visitType === "Phone Intake") && (
                <button onClick={generatePreauth} disabled={preauthGenerating} className={"w-full py-2.5 rounded-lg text-sm font-medium mt-2 " + (preauthGenerating ? "bg-gray-300 text-gray-500" : "bg-purple-600 text-white")}>
                  {preauthGenerating ? "Generating..." : "Generate Preauth Packet (H&P + LOMN → Biller)"}
                </button>
              )}
            </div>
          )}

          {/* ---- SENSORY ASSESSMENT SECTION ---- */}
          {formSection === "sensory" && (function() {
            var phases = form.visitType === "D90" ? ["Pre"] : ["Pre","Post"];
            var phaseLabel = function(ph) { return form.visitType === "D90" ? "EXAM" : ph.toUpperCase(); };
            return (
            <div className="space-y-3">
              {form.visitType === "D90" && <div className="text-xs text-center text-gray-400 bg-gray-50 py-2 rounded">Single exam (no device in place)</div>}

              <div className="bg-gray-50 rounded p-3">
                <div className="text-xs font-semibold text-gray-500 mb-2">HRV and PAIN</div>
                <div className={"grid gap-4 " + (phases.length === 1 ? "grid-cols-1" : "grid-cols-2")}>
                  {phases.map(function(ph) { return (
                    <div key={ph}>
                      <div className="text-xs text-gray-400 mb-1">{phaseLabel(ph)}</div>
                      <div className="grid grid-cols-2 gap-2">
                        <div><label className={lc}>RMSSD</label><input className={ic} type="number" step="0.1" value={form["rmssd"+ph]} onChange={function(e){set("rmssd"+ph,e.target.value)}} placeholder="ms" /></div>
                        <div><label className={lc}>NRS Pain</label><input className={ic} type="number" min="0" max="10" value={form["nrsPain"+ph]} onChange={function(e){set("nrsPain"+ph,e.target.value)}} placeholder="/10" /></div>
                      </div>
                    </div>
                  );})}
                </div>
              </div>

              {phases.map(function(phase) { return (
                <div key={phase} className="bg-gray-50 rounded p-3">
                  <div className="flex justify-between items-center mb-2">
                    <span className="text-xs font-semibold text-gray-500">MONOFILAMENT {phaseLabel(phase)}</span>
                    <span className="text-sm font-bold text-blue-600">L: {sumChecked(form["leftFoot"+phase])}/12 | R: {sumChecked(form["rightFoot"+phase])}/12</span>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    {["left","right"].map(function(side) { return (
                      <div key={side}>
                        <div className="text-xs text-gray-400 mb-1 capitalize">{side}</div>
                        <div className="grid grid-cols-3 gap-1">
                          {siteLabels.map(function(label, i) {
                            var key = side+"Foot"+phase;
                            return <button key={i} onClick={function(){toggleSite(key,i)}}
                              className={"text-xs py-1 px-0.5 rounded border " + (form[key][i] ? "bg-blue-500 text-white border-blue-500" : "bg-white text-gray-500 border-gray-300")}>{label}</button>;
                          })}
                        </div>
                      </div>
                    );})}
                  </div>
                </div>
              );})}

              <div className="bg-gray-50 rounded p-3">
                <div className="text-xs font-semibold text-gray-500 mb-2">STEREOGNOSIS (0-3 per hand)</div>
                <div className={"grid gap-4 " + (phases.length === 1 ? "grid-cols-1" : "grid-cols-2")}>
                  {phases.map(function(ph) { return (
                    <div key={ph}>
                      <div className="text-xs text-gray-400 mb-1">{phaseLabel(ph)}</div>
                      <div className="grid grid-cols-3 gap-2">
                        <div><label className={lc}>Quarter</label><select className={ic} value={form["coinQuarter"+ph]} onChange={function(e){set("coinQuarter"+ph,e.target.value)}}><option value="">--</option><option>Yes</option><option>No</option></select></div>
                        <div><label className={lc}>Dime</label><select className={ic} value={form["coinDime"+ph]} onChange={function(e){set("coinDime"+ph,e.target.value)}}><option value="">--</option><option>Yes</option><option>No</option></select></div>
                        <div><label className={lc}>Penny</label><select className={ic} value={form["coinPenny"+ph]} onChange={function(e){set("coinPenny"+ph,e.target.value)}}><option value="">--</option><option>Yes</option><option>No</option></select></div>
                      </div>
                    </div>
                  );})}
                </div>
              </div>

              <div className="bg-blue-50 rounded p-3 border border-blue-200">
                <div className="flex items-center justify-between mb-2">
                  <div className="text-xs font-semibold text-blue-700">STOPWATCH</div>
                  <div className="text-xs text-blue-500">{swFormat(swElapsed)}s</div>
                </div>
                <div className="flex gap-2">
                  {!swRunning && swElapsed === 0 && (
                    <button onClick={swStart} className="flex-1 py-2 bg-green-600 text-white rounded text-sm font-medium">Start</button>
                  )}
                  {!swRunning && swElapsed > 0 && (
                    <React.Fragment>
                      <button onClick={swStart} className="flex-1 py-2 bg-green-600 text-white rounded text-sm font-medium">Resume</button>
                      <button onClick={swReset} className="flex-1 py-2 bg-gray-200 text-gray-700 rounded text-sm font-medium">Reset</button>
                    </React.Fragment>
                  )}
                  {swRunning && (
                    <React.Fragment>
                      <button onClick={swStop} className="flex-1 py-2 bg-red-600 text-white rounded text-sm font-medium">Stop</button>
                      <button onClick={swReset} className="flex-1 py-2 bg-gray-200 text-gray-700 rounded text-sm font-medium">Reset</button>
                    </React.Fragment>
                  )}
                </div>
                <div className="text-xs text-blue-400 mt-1">Use for Single Leg Stance (max 45s) and 10m walk. Tap Stop, read the seconds, type into the field.</div>
              </div>

              <div className="bg-gray-50 rounded p-3">
                <div className="text-xs font-semibold text-gray-500 mb-2">SINGLE LEG STANCE (eyes closed, max 45s) and 10M WALK</div>
                <div className={"grid gap-4 " + (phases.length === 1 ? "grid-cols-1" : "grid-cols-2")}>
                  {phases.map(function(ph) { return (
                    <div key={ph}>
                      <div className="text-xs text-gray-400 mb-1">{phaseLabel(ph)}</div>
                      <div className="space-y-2">
                        <div className="grid grid-cols-2 gap-2">
                          <div><label className={lc}>R leg (s)</label><input className={ic} type="number" step="0.1" value={form["slsRightSec"+ph]} onChange={function(e){set("slsRightSec"+ph,e.target.value)}} /></div>
                          <div><label className={lc}>R fall?</label><select className={ic} value={form["slsRightFall"+ph]} onChange={function(e){set("slsRightFall"+ph,e.target.value)}}><option>No</option><option>Yes</option></select></div>
                        </div>
                        <div className="grid grid-cols-2 gap-2">
                          <div><label className={lc}>L leg (s)</label><input className={ic} type="number" step="0.1" value={form["slsLeftSec"+ph]} onChange={function(e){set("slsLeftSec"+ph,e.target.value)}} /></div>
                          <div><label className={lc}>L fall?</label><select className={ic} value={form["slsLeftFall"+ph]} onChange={function(e){set("slsLeftFall"+ph,e.target.value)}}><option>No</option><option>Yes</option></select></div>
                        </div>
                        <div><label className={lc}>10m walk (s)</label><input className={ic} type="number" step="0.1" value={form["walkTime"+ph]} onChange={function(e){set("walkTime"+ph,e.target.value)}} /></div>
                      </div>
                    </div>
                  );})}
                </div>
              </div>

              <div><label className={lc}>Notes</label><textarea className={ic + " h-14"} value={form.notes} onChange={function(e){set("notes",e.target.value)}} placeholder="Meds, observations..."></textarea></div>

              <button onClick={trySubmit} disabled={submitting}
                className={"w-full py-3 rounded-lg text-white font-semibold text-base " + (submitting ? "bg-gray-400" : "bg-blue-600 active:bg-blue-700")}>
                {submitting ? "Submitting..." : "Submit: Copy Note + Save Data"}
              </button>

              {showOverride && validationErrors.length > 0 && (
                <div className="bg-red-50 border border-red-200 rounded-lg p-3 mt-2">
                  <div className="text-xs font-semibold text-red-600 mb-1">Cannot submit - missing items:</div>
                  {validationErrors.map(function(err, i) { return <div key={i} className="text-xs text-red-500 py-0.5">{err}</div>; })}
                  <button onClick={function(){ setShowOverride(false); setValidationErrors([]); handleSubmit(); }}
                    className="mt-2 w-full py-1.5 bg-red-100 text-red-600 text-xs rounded font-medium">Override and Submit Anyway</button>
                </div>
              )}
              <div className="flex gap-2">
                <button onClick={function(){setFormSection("intake")}} className="flex-1 py-2 text-sm text-gray-400">{form.visitType === "D0" ? "Back to Intake" : "Back to Progress"}</button>
                <button onClick={resetForm} className="flex-1 py-2 text-sm text-gray-400">Clear All</button>
              </div>
            </div>
            );
          })()}
        </div>
      )}

      {/* ========== PHOTOS TAB ========== */}
      {view === "photos" && (
        <div className="p-4 space-y-3">
          <div>
            <label className={lc}>Patient ID for Photos</label>
            <input className={ic} value={photoPatientId || form.patientId} onChange={function(e){setPhotoPatientId(e.target.value)}} placeholder="DNC-XXXX" />
          </div>
          <div className="grid grid-cols-3 gap-2">
            {PHOTO_TYPES.filter(function(t){return t.key.indexOf("consent_") !== 0}).map(function(t) { return (
              <button key={t.key} onClick={function(){capturePhoto(t.key)}}
                className="flex flex-col items-center justify-center py-3 bg-gray-50 rounded-lg border border-gray-200 active:bg-blue-50">
                <span className="text-lg font-bold text-blue-500 mb-1">{t.icon}</span>
                <span className="text-xs font-medium text-gray-600 text-center leading-tight">{t.label}</span>
              </button>
            );})}
          </div>
          {(function() {
            var pid = photoPatientId || form.patientId;
            var patientPhotos = pid ? getPhotosForPatient(pid) : [];
            if (!pid) return <div className="text-center text-gray-400 text-sm py-4">Enter Patient ID above</div>;
            if (!patientPhotos.length) return <div className="text-center text-gray-400 text-sm py-4">No photos for {pid}</div>;
            return (
              <div className="space-y-2">
                <div className="text-xs font-medium text-gray-500">{patientPhotos.length} photos for {pid}</div>
                {patientPhotos.map(function(p) { return (
                  <div key={p.id} className="bg-gray-50 rounded-lg overflow-hidden border">
                    <div className="flex justify-between items-center px-3 py-1.5">
                      <span className="text-xs font-medium text-gray-600">
                        {(PHOTO_TYPES.find(function(t){return t.key===p.type})||{}).icon} {(PHOTO_TYPES.find(function(t){return t.key===p.type})||{}).label}
                      </span>
                      <div className="flex items-center gap-2">
                        <span className="text-xs text-gray-400">{new Date(p.timestamp).toLocaleString()}</span>
                        <button onClick={function(){deletePhoto(p.id)}} className="text-red-400 text-xs">X</button>
                      </div>
                    </div>
                    <img src={p.data} className="w-full" alt={p.type} />
                  </div>
                );})}
              </div>
            );
          })()}
        </div>
      )}

      {/* ========== NOTE TAB ========== */}
      {view === "note" && (
        <div className="p-4">
          <pre className="text-xs font-mono bg-gray-50 p-4 rounded whitespace-pre-wrap border">{generateNote()}</pre>
          {form.visitType === "D0" && (function() {
            var pid = form.patientId;
            var patientPhotos = pid ? getPhotosForPatient(pid) : [];
            if (!patientPhotos.length) return null;
            return (
              <div className="mt-2 space-y-2">
                <div className="text-xs font-semibold text-gray-500">PHOTOS ({patientPhotos.length})</div>
                {patientPhotos.map(function(p) { return (
                  <div key={p.id} className="bg-gray-50 rounded overflow-hidden border">
                    <div className="px-2 py-1 text-xs text-gray-500">{(PHOTO_TYPES.find(function(t){return t.key===p.type})||{}).label}</div>
                    <img src={p.data} className="w-full" alt={p.type} />
                  </div>
                );})}
              </div>
            );
          })()}
          <button onClick={tryCopy}

function SettingsModal(props) {
  var p = props.profile || {};
  const [displayName, setDisplayName] = useState(p.displayName || "");
  const [credentials, setCredentials] = useState(p.credentials || "");
  const [role, setRole] = useState(p.role || "");
  const [locations, setLocations] = useState(p.locations || []);
  const [licensedStates, setLicensedStates] = useState((p.licensedStates || []).join(", "));
  const [sigImage, setSigImage] = useState(p.signatureUrl ? "EXISTING" : "");
  const [drawing, setDrawing] = useState(false);
  const [saving, setSaving] = useState(false);
  const canvasRef = React.useRef(null);

  function toggleLoc(siteId) {
    setLocations(function(prev) {
      return prev.indexOf(siteId) === -1 ? prev.concat([siteId]) : prev.filter(function(s){return s !== siteId});
    });
  }

  function startDraw(e) {
    setDrawing(true);
    var c = canvasRef.current; if (!c) return;
    var rect = c.getBoundingClientRect();
    var x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    var y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    var ctx = c.getContext("2d");
    ctx.beginPath(); ctx.moveTo(x, y);
  }
  function moveDraw(e) {
    if (!drawing) return;
    e.preventDefault();
    var c = canvasRef.current; if (!c) return;
    var rect = c.getBoundingClientRect();
    var x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    var y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    var ctx = c.getContext("2d");
    ctx.lineWidth = 2; ctx.lineCap = "round"; ctx.strokeStyle = "#000";
    ctx.lineTo(x, y); ctx.stroke();
  }
  function endDraw() {
    setDrawing(false);
    if (canvasRef.current) setSigImage(canvasRef.current.toDataURL("image/png"));
  }
  function clearSig() {
    var c = canvasRef.current;
    if (c) { var ctx = c.getContext("2d"); ctx.clearRect(0, 0, c.width, c.height); }
    setSigImage("");
  }

  function save() {
    if (!role) { props.flash("Role is required", "err"); return; }
    if (!displayName) { props.flash("Display name is required", "err"); return; }
    if (!sigImage) { props.flash("Signature is required", "err"); return; }
    if (locations.length === 0) { props.flash("Select at least one location", "err"); return; }
    setSaving(true);
    var body = {
      _action: "saveUserProfile",
      email: props.email,
      displayName: displayName,
      credentials: credentials,
      role: role,
      locations: locations,
      licensedStates: licensedStates.split(",").map(function(s){return s.trim().toUpperCase()}).filter(Boolean),
      signatureUrl: p.signatureUrl || ""
    };
    if (sigImage && sigImage !== "EXISTING") body.signatureImage = sigImage;
    fetch(props.sheetUrl, { method: "POST", body: JSON.stringify(body) })
      .then(function(r){return r.json()})
      .then(function(j) {
        setSaving(false);
        if (j && j.status === "ok") props.onSaved(j.profile);
        else props.flash("Save failed: " + (j && j.message || "unknown"), "err");
      })
      .catch(function(e) { setSaving(false); props.flash("Save failed: " + e, "err"); });
  }

  var ic = "w-full p-2 border border-gray-300 rounded text-sm";
  var lc = "block text-xs font-semibold text-gray-700 mb-1";
  var isPhysician = String(role).toLowerCase() === "physician";

  return (
    <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
      <div className="bg-white rounded-lg max-w-md w-full max-h-full overflow-y-auto p-4">
        <div className="flex justify-between items-center mb-3">
          <h2 className="text-lg font-semibold">User Profile</h2>
          {p.role && <button onClick={props.onClose} className="text-gray-400 text-xl">&times;</button>}
        </div>
        {!p.role && (
          <div className="bg-yellow-50 border border-yellow-200 text-yellow-800 text-xs p-2 rounded mb-3">
            Complete your profile to start using the app. This determines whether your documents need cosignature.
          </div>
        )}
        <div className="space-y-3">
          <div>
            <label className={lc}>Display Name</label>
            <input className={ic} value={displayName} onChange={function(e){setDisplayName(e.target.value)}} placeholder="Jane Doe" />
          </div>
          <div>
            <label className={lc}>Credentials</label>
            <input className={ic} value={credentials} onChange={function(e){setCredentials(e.target.value)}} placeholder="RN, BSN" />
          </div>
          <div>
            <label className={lc}>Role</label>
            <select className={ic} value={role} onChange={function(e){setRole(e.target.value)}}>
              <option value="">— Select —</option>
              <option value="ma">Medical Assistant</option>
              <option value="apc">Nurse / NP / PA</option>
              <option value="physician">Physician</option>
            </select>
            {role && role !== "physician" && (
              <div className="text-xs text-gray-500 mt-1">Your documents will require physician cosignature.</div>
            )}
          </div>
          <div>
            <label className={lc}>Practice Locations</label>
            {props.sitesList.length === 0 && (
              <div className="text-xs text-red-600">No sites configured. Admin: add rows to the Sites tab in the sheet.</div>
            )}
            <div className="space-y-1">
              {props.sitesList.map(function(s) {
                return (
                  <label key={s.siteId} className="flex items-center text-sm">
                    <input type="checkbox" className="mr-2"
                      checked={locations.indexOf(s.siteId) !== -1}
                      onChange={function(){toggleLoc(s.siteId)}} />
                    {s.name} ({s.state})
                  </label>
                );
              })}
            </div>
          </div>
          {isPhysician && (
            <div>
              <label className={lc}>Licensed States (comma separated)</label>
              <input className={ic} value={licensedStates} onChange={function(e){setLicensedStates(e.target.value)}} placeholder="DE, MD, VA" />
              <div className="text-xs text-gray-500 mt-1">Used to route cosign requests when no physician is mapped to a specific site.</div>
            </div>
          )}
          <div>
            <label className={lc}>Signature {p.signatureUrl && sigImage === "EXISTING" && <span className="text-green-600">(saved — draw to replace)</span>}</label>
            <canvas ref={canvasRef} width={350} height={120}
              className="w-full border border-gray-300 rounded bg-white"
              style={{touchAction: "none"}}
              onMouseDown={startDraw} onMouseMove={moveDraw} onMouseUp={endDraw} onMouseLeave={endDraw}
              onTouchStart={startDraw} onTouchMove={moveDraw} onTouchEnd={endDraw} />
            <button onClick={clearSig} className="mt-1 text-xs text-gray-500 underline">Clear</button>
          </div>
          <div className="flex gap-2 pt-2">
            {p.role && <button onClick={props.onClose} className="flex-1 py-2 border border-gray-300 rounded text-sm">Cancel</button>}
            <button onClick={save} disabled={saving} className="flex-1 py-2 bg-blue-600 text-white rounded text-sm font-medium disabled:opacity-50">
              {saving ? "Saving..." : "Save Profile"}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function AuthGate() {
  const [user, setUser] = useState(null);
  const [loading, setLoading] = useState(true);
  const [authError, setAuthError] = useState("");
  const [emailInput, setEmailInput] = useState("");
  const [passwordInput, setPasswordInput] = useState("");
  const [signingIn, setSigningIn] = useState(false);
  const [requestMode, setRequestMode] = useState(false);
  const [requestName, setRequestName] = useState("");
  const [requestRole, setRequestRole] = useState("");
  const [requestReason, setRequestReason] = useState("");
  const [requestSubmitting, setRequestSubmitting] = useState(false);
  const [requestSent, setRequestSent] = useState(false);

  useEffect(function() {
    if (!__firebaseEnabled) {
      setLoading(false);
      return;
    }
    var unsub = firebase.auth().onAuthStateChanged(function(u) {
      if (u) {
        var email = (u.email || "").toLowerCase();
        var allowed = ALLOWED_EMAILS.map(function(e){return e.toLowerCase()});
        if (allowed.indexOf(email) === -1) {
          setAuthError("Access denied for " + email + ". Contact admin.");
          firebase.auth().signOut();
          setUser(null);
        } else {
          setUser(u);
          setAuthError("");
          window.__currentUser = u;
        }
      } else {
        setUser(null);
        window.__currentUser = null;
      }
      setLoading(false);
    });
    return function(){ unsub && unsub(); };
  }, []);

  function signIn() {
    if (!emailInput || !passwordInput) {
      setAuthError("Enter email and password");
      return;
    }
    setAuthError("");
    setSigningIn(true);
    firebase.auth().signInWithEmailAndPassword(emailInput, passwordInput)
      .catch(function(e) {
        var msg = e.message || "Sign-in failed";
        if (e.code === "auth/wrong-password" || e.code === "auth/invalid-credential") msg = "Wrong password";
        else if (e.code === "auth/user-not-found") msg = "No account for this email. Contact admin.";
        else if (e.code === "auth/invalid-email") msg = "Invalid email format";
        setAuthError(msg);
      })
      .finally(function() { setSigningIn(false); });
  }

  function signOut() {
    firebase.auth().signOut();
  }
  window.__signOut = signOut;

  function sendPasswordReset() {
    if (!emailInput) {
      setAuthError("Enter your email above first");
      return;
    }
    setAuthError("");
    firebase.auth().sendPasswordResetEmail(emailInput)
      .then(function() {
        setAuthError("Reset email sent to " + emailInput + ". Check inbox.");
      })
      .catch(function(e) {
        var msg = e.message || "Reset failed";
        if (e.code === "auth/user-not-found") msg = "No account for this email";
        else if (e.code === "auth/invalid-email") msg = "Invalid email format";
        setAuthError(msg);
      });
  }

  async function submitAccessRequest() {
    if (!emailInput || !requestName || !requestRole) {
      setAuthError("Email, name, and role required");
      return;
    }
    setAuthError("");
    setRequestSubmitting(true);
    try {
      var storedUrl = localStorage.getItem(SHEET_URL_KEY);
      var url = storedUrl || DEFAULT_SHEET_URL;
      await fetch(url, {
        method: "POST",
        mode: "no-cors",
        body: JSON.stringify({
          _action: "requestAccess",
          email: emailInput,
          name: requestName,
          role: requestRole,
          reason: requestReason
        })
      });
      setRequestSent(true);
    } catch(e) {
      setAuthError("Request failed: " + e.toString());
    }
    setRequestSubmitting(false);
  }

  if (!__firebaseEnabled) {
    return (
      <div>
        <div className="bg-yellow-100 text-yellow-900 text-xs px-3 py-1 text-center border-b border-yellow-300">
          ⚠ Auth disabled (no Firebase config) — dev mode
        </div>
        <App />
      </div>
    );
  }

  if (loading) {
    return <div className="min-h-screen flex items-center justify-center text-gray-500">Loading...</div>;
  }

  if (!user) {
    return (
      <div className="min-h-screen flex items-center justify-center bg-gray-50 px-4">
        <div className="bg-white rounded-lg shadow-md p-6 max-w-sm w-full">
          <div className="text-center mb-4">
            <div className="text-lg font-semibold text-gray-800">Diabetic Nerve Clinic</div>
            <div className="text-xs text-gray-500 mt-1">{requestMode ? "Request access" : "Sign in to access the platform"}</div>
          </div>
          {!requestMode && (
            <div className="space-y-2">
              <input
                type="email"
                className="w-full border border-gray-300 rounded px-3 py-2 text-sm"
                placeholder="Email"
                value={emailInput}
                onChange={function(e){setEmailInput(e.target.value)}}
                onKeyDown={function(e){if(e.key==="Enter")signIn()}}
                autoFocus
              />
              <input
                type="password"
                className="w-full border border-gray-300 rounded px-3 py-2 text-sm"
                placeholder="Password"
                value={passwordInput}
                onChange={function(e){setPasswordInput(e.target.value)}}
                onKeyDown={function(e){if(e.key==="Enter")signIn()}}
              />
              <button
                onClick={signIn}
                disabled={signingIn}
                className={"w-full py-2.5 rounded-lg text-sm font-medium " + (signingIn ? "bg-gray-300 text-gray-500" : "bg-blue-600 text-white")}
              >
                {signingIn ? "Signing in..." : "Sign in"}
              </button>
              <div className="flex justify-between items-center mt-2">
                <button
                  onClick={sendPasswordReset}
                  className="text-xs text-blue-600 underline"
                >
                  Forgot password
                </button>
                <button
                  onClick={function(){setRequestMode(true); setAuthError(""); setRequestSent(false)}}
                  className="text-xs text-blue-600 underline"
                >
                  Request access
                </button>
              </div>
            </div>
          )}
          {requestMode && !requestSent && (
            <div className="space-y-2">
              <input
                type="email"
                className="w-full border border-gray-300 rounded px-3 py-2 text-sm"
                placeholder="Your work email"
                value={emailInput}
                onChange={function(e){setEmailInput(e.target.value)}}
              />
              <input
                type="text"
                className="w-full border border-gray-300 rounded px-3 py-2 text-sm"
                placeholder="Full name"
                value={requestName}
                onChange={function(e){setRequestName(e.target.value)}}
              />
              <select
                className="w-full border border-gray-300 rounded px-3 py-2 text-sm"
                value={requestRole}
                onChange={function(e){setRequestRole(e.target.value)}}
              >
                <option value="">Role...</option>
                <option>Clinician</option>
                <option>MA / Front desk</option>
                <option>Biller</option>
                <option>Admin</option>
                <option>Other</option>
              </select>
              <textarea
                className="w-full border border-gray-300 rounded px-3 py-2 text-sm h-16"
                placeholder="Reason for access (optional)"
                value={requestReason}
                onChange={function(e){setRequestReason(e.target.value)}}
              />
              <button
                onClick={submitAccessRequest}
                disabled={requestSubmitting}
                className={"w-full py-2.5 rounded-lg text-sm font-medium " + (requestSubmitting ? "bg-gray-300 text-gray-500" : "bg-blue-600 text-white")}
              >
                {requestSubmitting ? "Sending..." : "Send request"}
              </button>
              <button
                onClick={function(){setRequestMode(false); setAuthError("")}}
                className="w-full text-xs text-gray-500 underline mt-1"
              >
                Back to sign in
              </button>
            </div>
          )}
          {requestMode && requestSent && (
            <div className="space-y-3 text-center">
              <div className="text-sm text-green-700 font-medium">Request sent</div>
              <div className="text-xs text-gray-600">An admin will review and contact you at {emailInput}.</div>
              <button
                onClick={function(){setRequestMode(false); setRequestSent(false); setEmailInput(""); setRequestName(""); setRequestRole(""); setRequestReason("")}}
                className="w-full text-xs text-blue-600 underline"
              >
                Back to sign in
              </button>
            </div>
          )}
          {authError && <div className="mt-3 text-xs text-red-600 text-center">{authError}</div>}
        </div>
      </div>
    );
  }

  return (
    <div>
      <div className="bg-gray-100 text-gray-600 text-xs px-3 py-1 flex justify-between items-center border-b border-gray-200">
        <span>{user.email}</span>
        <button onClick={signOut} className="text-blue-600 underline">Sign out</button>
      </div>
      <App />
    </div>
  );
}

ReactDOM.render(<AuthGate />, document.getElementById("root"));
</script>
</body>
</html>
