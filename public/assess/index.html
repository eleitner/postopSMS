<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>DNC Assessment</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff}*{-webkit-tap-highlight-color:transparent}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const STORAGE_KEY = "dpn-assessments";
const DRAFTS_KEY = "dpn-drafts";
const PHOTOS_KEY = "dpn-photos";
const SHEET_URL_KEY = "dpn-sheet-url";
const DIRECTORY_KEY = "dpn-directory";

const storage = {
  get(k) { const v = localStorage.getItem(k); return v ? { value: v } : null; },
  set(k, v) { localStorage.setItem(k, v); return { key: k, value: v }; },
  delete(k) { localStorage.removeItem(k); return { key: k, deleted: true }; }
};

const PMHX_OPTIONS = ["HTN","Hyperlipidemia","Obesity","CAD","CHF","PVD","COPD","Asthma","CKD","Retinopathy","Depression","CAN"];
const PAIN_DESC = ["Burning","Tingling","Numbness","Dysesthesia","Allodynia","Paresthesias","Hyperalgesia","Throbbing","Sharp","Aching","Prickly","Pressure","Shooting"];
const PRIOR_TX = ["Physical therapy","Compression stockings","OTC medications","Gabapentin","Pregabalin","Duloxetine","Amitriptyline","Capsaicin","TENS unit","Opiates (current)","Opiates (past)","Other Rx"];
const PRIOR_DME = ["TENS unit","Walking boot","Custom orthotics","Wheelchair","Compression stockings"];
const FUNCTIONAL = ["Decreased activity","Decreased mobility","Sleep disturbance","Decreased quality of life","Balance issues / fall risk"];
const ALLERGY_COMMON = ["NKDA","Penicillin","Betadine","Chlorhexidine"];

const siteLabels = ["Great toe","2nd toe","3rd toe","4th toe","5th toe","Met head 1","Met head 3","Met head 5","Midfoot med","Midfoot lat","Arch","Heel"];

const PHOTO_TYPES = [
  { key: "consent_procedure", label: "Procedure Consent", icon: "P" },
  { key: "consent_social", label: "Social Media Consent", icon: "S" },
  { key: "consent_data", label: "Data Use Consent", icon: "D" },
  { key: "serial", label: "Device Serial / Lot", icon: "#" },
  { key: "earmap", label: "Ear Map", icon: "M" },
  { key: "earphoto", label: "Ear Photo", icon: "E" },
];

function sumChecked(arr) { return arr.filter(Boolean).length; }
function toggleInArray(arr, val) { return arr.includes(val) ? arr.filter(function(v){return v!==val}) : arr.concat([val]); }

const defaultState = {
  patientId: "", date: new Date().toISOString().split("T")[0], visitType: "D0",
  diabetesDuration: "", diabetesType: "Type 2", age: "", sex: "",
  // Intake
  referringProvider: "", cc: "diabetic nerve pain",
  painRest: "", painBest: "", painWorst: "",
  painDescriptors: [], painNotes: "",
  functionalLimitations: [], functionalNotes: "",
  balanceIssues: "No",
  pmhx: [], pshx: "", pmhxNotes: "",
  allergies: [], allergiesOther: "",
  medications: "",
  priorTx: [], priorDME: [], txNotes: "",
  socialTob: "No", socialEtOH: "No", socialSubstance: "No", socialNotes: "",
  a1c: "", bgFasting: "", glucoseControl: "", labNotes: "",
  // Device
  trigeminalOhms: "", trigeminalHz: "",
  c2Ohms: "", c2Hz: "",
  vagusOhms: "", vagusHz: "",
  deviceNotes: "",
  // Sensory assessment
  nrsPainPre: "", nrsPainPost: "",
  rmssdPre: "", rmssdPost: "",
  leftFootPre: Array(12).fill(false), leftFootPost: Array(12).fill(false),
  rightFootPre: Array(12).fill(false), rightFootPost: Array(12).fill(false),
  coinQuarterPre: "", coinQuarterPost: "",
  coinDimePre: "", coinDimePost: "",
  coinPennyPre: "", coinPennyPost: "",
  slsRightSecPre: "", slsRightSecPost: "",
  slsRightFallPre: "No", slsRightFallPost: "No",
  slsLeftSecPre: "", slsLeftSecPost: "",
  slsLeftFallPre: "No", slsLeftFallPost: "No",
  walkTimePre: "", walkTimePost: "",
  notes: "",
  // Progress note fields (D20/D90)
  subjective: "", plan: "",
  // D20 explant specific
  subjectivePre: "", subjectivePost: "",
  explantSiteClean: "Yes", explantInduration: "No", explantErythema: "No", explantTolerated: "Yes", explantComplication: "No", explantComplicationDetail: "", explantNotes: "",
};

function App() {
  const [form, setForm] = useState(defaultState);
  const [records, setRecords] = useState([]);
  const [photos, setPhotos] = useState([]);
  const [drafts, setDrafts] = useState({});
  const [view, setView] = useState("form");
  const [formSection, setFormSection] = useState("intake"); // intake | sensory
  const [msg, setMsg] = useState({ text: "", type: "" });
  const [submitting, setSubmitting] = useState(false);
  const [sheetUrl, setSheetUrl] = useState("");
  const [showConfig, setShowConfig] = useState(false);
  const [photoPatientId, setPhotoPatientId] = useState("");
  const [directory, setDirectory] = useState([]);
  const [dirName, setDirName] = useState("");
  const [dirId, setDirId] = useState("");
  const [dirSearch, setDirSearch] = useState("");
  const [patientName, setPatientName] = useState("");

  function generatePatientId() {
    var chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    var id = "DNC-";
    for (var i = 0; i < 4; i++) id += chars.charAt(Math.floor(Math.random() * chars.length));
    return id;
  }

  useEffect(function() {
    try { var r = storage.get(STORAGE_KEY); if (r && r.value) setRecords(JSON.parse(r.value)); } catch(e) {}
    try { var u = storage.get(SHEET_URL_KEY); if (u && u.value) setSheetUrl(u.value); } catch(e) {}
    try { var p = storage.get(PHOTOS_KEY); if (p && p.value) setPhotos(JSON.parse(p.value)); } catch(e) {}
    try { var d = storage.get(DRAFTS_KEY); if (d && d.value) setDrafts(JSON.parse(d.value)); } catch(e) {}
    try { var dir = storage.get(DIRECTORY_KEY); if (dir && dir.value) setDirectory(JSON.parse(dir.value)); } catch(e) {}
  }, []);

  function flash(text, type) { setMsg({text:text, type:type||"ok"}); setTimeout(function(){setMsg({text:"",type:""})}, 3000); }
  function set(key, val) { setForm(function(f) { var n = Object.assign({}, f); n[key] = val; return n; }); }
  function toggleSite(key, idx) { setForm(function(f) { var n = Object.assign({}, f); var a = n[key].slice(); a[idx] = !a[idx]; n[key] = a; return n; }); }
  function toggleMulti(key, val) { setForm(function(f) { var n = Object.assign({}, f); n[key] = toggleInArray(f[key], val); return n; }); }

  // Draft save/load
  function saveDraft() {
    if (!form.patientId) { flash("Enter Patient ID", "err"); return; }
    var updated = Object.assign({}, drafts);
    updated[form.patientId] = Object.assign({}, form, { savedAt: new Date().toISOString() });
    setDrafts(updated);
    storage.set(DRAFTS_KEY, JSON.stringify(updated));
    flash("Draft saved for " + form.patientId);
  }

  function loadDraft() {
    if (!form.patientId) { flash("Enter Study ID to load", "err"); return; }
    var d = drafts[form.patientId];
    if (!d) { flash("No draft found for " + form.patientId, "warn"); return; }
    // Load intake + device data, clear sensory fields for fresh assessment
    var loaded = Object.assign({}, d, {
      date: new Date().toISOString().split("T")[0],
      nrsPainPre: "", nrsPainPost: "",
      rmssdPre: "", rmssdPost: "",
      leftFootPre: Array(12).fill(false), leftFootPost: Array(12).fill(false),
      rightFootPre: Array(12).fill(false), rightFootPost: Array(12).fill(false),
      coinQuarterPre: "", coinQuarterPost: "",
      coinDimePre: "", coinDimePost: "",
      coinPennyPre: "", coinPennyPost: "",
      slsRightSecPre: "", slsRightSecPost: "",
      slsRightFallPre: "No", slsRightFallPost: "No",
      slsLeftSecPre: "", slsLeftSecPost: "",
      slsLeftFallPre: "No", slsLeftFallPost: "No",
      walkTimePre: "", walkTimePost: "",
      subjective: "", plan: "",
      subjectivePre: "", subjectivePost: "",
      explantSiteClean: "Yes", explantInduration: "No", explantErythema: "No", explantTolerated: "Yes", explantComplication: "No", explantComplicationDetail: "", explantNotes: "",
      notes: "",
    });
    setForm(loaded);
    // Auto-fill name from directory
    var dirEntry = directory.find(function(e) { return e.id === form.patientId; });
    if (dirEntry) setPatientName(dirEntry.name);
    flash("Loaded " + form.patientId + " - sensory fields cleared for new assessment");
  }

  function getDraftList() { return Object.keys(drafts); }

  // Photo functions
  function capturePhoto(photoType) {
    var pid = photoPatientId || form.patientId;
    if (!pid) { flash("Enter a Patient ID first", "err"); return; }
    var input = document.createElement("input");
    input.type = "file"; input.accept = "image/*"; input.capture = "environment";
    input.onchange = function(e) {
      var file = e.target.files[0]; if (!file) return;
      var reader = new FileReader();
      reader.onload = function(ev) {
        var img = new Image();
        img.onload = function() {
          var canvas = document.createElement("canvas");
          var maxDim = 1200; var w = img.width; var h = img.height;
          if (w > maxDim || h > maxDim) { if (w > h) { h = h*maxDim/w; w = maxDim; } else { w = w*maxDim/h; h = maxDim; } }
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          var compressed = canvas.toDataURL("image/jpeg", 0.7);
          var newPhoto = { id: Date.now(), patientId: pid, type: photoType, timestamp: new Date().toISOString(), data: compressed };
          var updated = photos.concat([newPhoto]);
          setPhotos(updated);
          try { storage.set(PHOTOS_KEY, JSON.stringify(updated)); } catch(e) { flash("Storage full", "warn"); }
          var matched = PHOTO_TYPES.find(function(t){return t.key===photoType});
          flash((matched ? matched.label : photoType) + " captured");
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    };
    input.click();
  }

  function deletePhoto(id) {
    if (!confirm("Delete this photo?")) return;
    var updated = photos.filter(function(p){return p.id !== id});
    setPhotos(updated); storage.set(PHOTOS_KEY, JSON.stringify(updated));
  }

  function getPhotosForPatient(pid) { return photos.filter(function(p){return p.patientId === pid}); }

  // Build data row
  function buildRow() {
    var lPre=sumChecked(form.leftFootPre), rPre=sumChecked(form.rightFootPre);
    var lPost=sumChecked(form.leftFootPost), rPost=sumChecked(form.rightFootPost);
    return {
      patientId:form.patientId, date:form.date, visitType:form.visitType,
      age:form.age, sex:form.sex, diabetesType:form.diabetesType, diabetesDuration:form.diabetesDuration,
      referringProvider:form.referringProvider, a1c:form.a1c,
      pmhx:form.pmhx.join("; "), medications:form.medications, priorTx:form.priorTx.join("; "),
      painDescriptors:form.painDescriptors.join("; "),
      painNotes:form.painNotes, functionalNotes:form.functionalNotes,
      pmhxNotes:form.pmhxNotes, txNotes:form.txNotes,
      socialNotes:form.socialNotes, labNotes:form.labNotes,
      painRest:form.painRest, painBest:form.painBest, painWorst:form.painWorst,
      glucoseControl:form.glucoseControl,
      trigeminalOhms:form.trigeminalOhms, trigeminalHz:form.trigeminalHz,
      c2Ohms:form.c2Ohms, c2Hz:form.c2Hz,
      vagusOhms:form.vagusOhms, vagusHz:form.vagusHz,
      deviceNotes:form.deviceNotes,
      nrsPainPre:form.nrsPainPre, nrsPainPost:form.nrsPainPost,
      rmssdPre:form.rmssdPre, rmssdPost:form.rmssdPost,
      leftFootPre:lPre, leftFootPost:lPost, rightFootPre:rPre, rightFootPost:rPost,
      combinedPre:lPre+rPre, combinedPost:lPost+rPost, monofilamentChange:(lPost+rPost)-(lPre+rPre),
      coinQuarterPre:form.coinQuarterPre, coinQuarterPost:form.coinQuarterPost,
      coinDimePre:form.coinDimePre, coinDimePost:form.coinDimePost,
      coinPennyPre:form.coinPennyPre, coinPennyPost:form.coinPennyPost,
      coinScorePre:[form.coinQuarterPre,form.coinDimePre,form.coinPennyPre].filter(function(v){return v==="Yes"}).length,
      coinScorePost:[form.coinQuarterPost,form.coinDimePost,form.coinPennyPost].filter(function(v){return v==="Yes"}).length,
      slsRightSecPre:form.slsRightSecPre, slsRightSecPost:form.slsRightSecPost,
      slsRightFallPre:form.slsRightFallPre, slsRightFallPost:form.slsRightFallPost,
      slsLeftSecPre:form.slsLeftSecPre, slsLeftSecPost:form.slsLeftSecPost,
      slsLeftFallPre:form.slsLeftFallPre, slsLeftFallPost:form.slsLeftFallPost,
      walkTimePre:form.walkTimePre, walkTimePost:form.walkTimePost,
      subjective:form.subjective, subjectivePre:form.subjectivePre, subjectivePost:form.subjectivePost,
      explantSiteClean:form.explantSiteClean, explantInduration:form.explantInduration,
      explantErythema:form.explantErythema, explantTolerated:form.explantTolerated,
      explantComplication:form.explantComplication, explantComplicationDetail:form.explantComplicationDetail,
      explantNotes:form.explantNotes,
      plan:form.plan,
      notes:form.notes,
    };
  }

  // Generate clinical note
  function generateNote() {
    var lPre=sumChecked(form.leftFootPre), rPre=sumChecked(form.rightFootPre);
    var lPost=sumChecked(form.leftFootPost), rPost=sumChecked(form.rightFootPost);
    var coinStr = function(q,d,p) {
      var items = [q==="Yes"?"quarter +":"quarter -", d==="Yes"?"dime +":"dime -", p==="Yes"?"penny +":"penny -"];
      return items.join(", ") + " (" + [q,d,p].filter(function(v){return v==="Yes"}).length + "/3)";
    };
    var delta = function(a,b) { return a&&b ? (parseFloat(b)-parseFloat(a)).toFixed(1) : "---"; };
    var coinPre=[form.coinQuarterPre,form.coinDimePre,form.coinPennyPre].filter(function(v){return v==="Yes"}).length;
    var coinPost=[form.coinQuarterPost,form.coinDimePost,form.coinPennyPost].filter(function(v){return v==="Yes"}).length;

    var header = "AURICULAR VNS " + (form.visitType === "D0" ? "EVALUATION AND SENSORY ASSESSMENT" : "PROGRESS NOTE") + " - " + form.visitType + "\n" +
"Patient: " + (patientName || "[Name]") + " (Study ID: " + (form.patientId||"[ID]") + ")\n" +
"Date: " + form.date + " | Age: " + form.age + " | Sex: " + form.sex + "\n" +
"Referring: " + (form.referringProvider||"N/A") + "\n\n";

    var examBlock = function(label, pre) {
      var ph = pre ? "Pre" : "Post";
      var l = sumChecked(form["leftFoot"+ph]);
      var r = sumChecked(form["rightFoot"+ph]);
      return label + ":\n" +
"  HRV (RMSSD): " + form["rmssd"+ph] + " ms | NRS Pain: " + form["nrsPain"+ph] + "/10\n" +
"  Monofilament: L " + l + "/12, R " + r + "/12, Combined " + (l+r) + "/24\n" +
"  Stereognosis: " + coinStr(form["coinQuarter"+ph], form["coinDime"+ph], form["coinPenny"+ph]) + "\n" +
"  SLS eyes closed: R " + form["slsRightSec"+ph] + "s (fall: " + form["slsRightFall"+ph] + "), L " + form["slsLeftSec"+ph] + "s (fall: " + form["slsLeftFall"+ph] + ") | 10m walk: " + form["walkTime"+ph] + "s\n";
    };

    // D0: Full intake + pre/post exam
    if (form.visitType === "D0") {
      return header +
"CC: " + form.cc + "\n" +
"Diabetes: " + form.diabetesType + ", " + form.diabetesDuration + " yrs | A1C: " + (form.a1c||"pending") + " | Glucose control: " + (form.glucoseControl||"N/A") + "\n\n" +
"HPI: Pt is a " + form.age + " year old " + (form.sex==="M"?"male":"female") + " with " + form.diabetesType + " DM x " + form.diabetesDuration + " years presenting with chronic diabetic neuropathic pain.\n" +
"Pain NRS: Rest " + form.painRest + "/10, Best " + form.painBest + "/10, Worst " + form.painWorst + "/10\n" +
"Descriptors: " + (form.painDescriptors.length ? form.painDescriptors.join(", ") : "none selected") + (form.painNotes ? " | " + form.painNotes : "") + "\n" +
"Functional: " + (form.functionalLimitations.length ? form.functionalLimitations.join(", ") : "none") + (form.functionalNotes ? " | " + form.functionalNotes : "") + "\n\n" +
"PMHx: " + (form.pmhx.length ? form.pmhx.join(", ") : "none") + (form.pmhxNotes ? " | " + form.pmhxNotes : "") + "\n" +
"PSHx: " + (form.pshx || "none") + "\n" +
"Allergies: " + (form.allergies.length ? form.allergies.join(", ") : "NKDA") + (form.allergiesOther ? ", " + form.allergiesOther : "") + "\n" +
"Medications: " + (form.medications || "none listed") + "\n" +
"Prior Tx: " + (form.priorTx.length ? form.priorTx.join(", ") : "none") + (form.txNotes ? " | " + form.txNotes : "") + "\n" +
"Social: Tobacco " + form.socialTob + " | EtOH " + form.socialEtOH + " | Substances " + form.socialSubstance + (form.socialNotes ? " | " + form.socialNotes : "") + "\n" +
(form.labNotes ? "Lab notes: " + form.labNotes + "\n" : "") +
(form.trigeminalOhms || form.c2Ohms || form.vagusOhms ?
"Device Impedance: Trigeminal " + form.trigeminalOhms + " ohms / " + form.trigeminalHz + " Hz | C2 " + form.c2Ohms + " ohms / " + form.c2Hz + " Hz | Vagus " + form.vagusOhms + " ohms / " + form.vagusHz + " Hz\n" : "") +
(form.deviceNotes ? "Device notes: " + form.deviceNotes + "\n" : "") + "\n" +
examBlock("PRE-ACTIVATION", true) + "\n" +
examBlock("POST-ACTIVATION (10 min)", false) + "\n" +
"CHANGE: Mono " + ((lPost+rPost)-(lPre+rPre)>0?"+":"") + ((lPost+rPost)-(lPre+rPre)) + " pts | Coins " + coinPre + "/3 to " + coinPost + "/3 | RMSSD " + delta(form.rmssdPre,form.rmssdPost) + " ms | Pain " + delta(form.nrsPainPre,form.nrsPainPost) + " pts" +
(form.notes ? "\n\nNotes: " + form.notes : "");
    }

    // D20: SOAP progress note with pre/post exam and explant
    if (form.visitType === "D20") {
      var explantNote = "Hands washed. Area cleaned and prepped. Device and electrodes explanted. " +
        (form.explantComplication === "Yes" ?
          "COMPLICATION: " + (form.explantComplicationDetail || "[Details not recorded]") :
          "Site inspection: non-indurated, non-erythematous. Site clean. Procedure tolerated well without complication.") +
        (form.explantNotes ? " " + form.explantNotes : "");

      return header +
"SUBJECTIVE (PRE-EXPLANT):\n" +
(form.subjectivePre || "[Not entered]") + "\n" +
"Current Pain: Rest " + (form.nrsPainPre||"---") + "/10, Best " + (form.painBest||"---") + "/10, Worst " + (form.painWorst||"---") + "/10\n\n" +
"RELEVANT HISTORY:\n" +
"  " + form.diabetesType + " DM x " + form.diabetesDuration + " yrs | A1C: " + (form.a1c||"---") + "\n" +
"  PMHx: " + (form.pmhx.length ? form.pmhx.join(", ") : "none") + "\n" +
"  Meds: " + (form.medications || "none") + "\n" +
(form.trigeminalOhms ? "  Device (D0): Tri " + form.trigeminalOhms + "/" + form.trigeminalHz + "Hz | C2 " + form.c2Ohms + "/" + form.c2Hz + "Hz | Vagus " + form.vagusOhms + "/" + form.vagusHz + "Hz\n" : "") + "\n" +
"OBJECTIVE:\n" +
examBlock("PRE-EXPLANT", true) + "\n" +
"EXPLANT PROCEDURE:\n" + explantNote + "\n\n" +
examBlock("POST-EXPLANT", false) + "\n" +
"SUBJECTIVE (POST-EXPLANT):\n" +
(form.subjectivePost || "[Not entered]") + "\n\n" +
"CHANGE: Mono " + ((lPost+rPost)-(lPre+rPre)>0?"+":"") + ((lPost+rPost)-(lPre+rPre)) + " pts | Coins " + coinPre + "/3 to " + coinPost + "/3 | RMSSD " + delta(form.rmssdPre,form.rmssdPost) + " ms | Pain " + delta(form.nrsPainPre,form.nrsPainPost) + " pts\n\n" +
"PLAN:\n" + (form.plan || "[No plan entered]") +
(form.notes ? "\n\nNotes: " + form.notes : "");
    }

    // D90: SOAP progress note with single exam
    return header +
"SUBJECTIVE:\n" +
(form.subjective || "[No subjective entered]") + "\n" +
"Current Pain: Rest " + (form.nrsPainPre||"---") + "/10, Best " + (form.painBest||"---") + "/10, Worst " + (form.painWorst||"---") + "/10\n\n" +
"RELEVANT HISTORY:\n" +
"  " + form.diabetesType + " DM x " + form.diabetesDuration + " yrs | A1C: " + (form.a1c||"---") + "\n" +
"  PMHx: " + (form.pmhx.length ? form.pmhx.join(", ") : "none") + "\n" +
"  Meds: " + (form.medications || "none") + "\n\n" +
"OBJECTIVE:\n" +
examBlock("EXAM", true) + "\n" +
"PLAN:\n" + (form.plan || "[No plan entered]") +
(form.notes ? "\n\nNotes: " + form.notes : "");
  }

  // Validation - check for missing required items
  function getValidationErrors() {
    var errors = [];
    var pid = form.patientId;
    if (!pid) return ["Study ID required"];
    if (!patientName) return ["Patient name required (local only, for directory mapping)"];

    var patientPhotos = pid ? getPhotosForPatient(pid) : [];
    var photoTypes = patientPhotos.map(function(p) { return p.type; });

    // Always required
    if (photoTypes.indexOf("consent_procedure") === -1) errors.push("Missing: Procedure Consent photo");
    if (photoTypes.indexOf("consent_data") === -1) errors.push("Missing: Data Use Consent photo");

    // Required on D0 (placement visit)
    if (form.visitType === "D0") {
      if (photoTypes.indexOf("consent_social") === -1) errors.push("Missing: Social Media Consent photo");
      if (photoTypes.indexOf("serial") === -1) errors.push("Missing: Device Serial / Lot photo");
      if (photoTypes.indexOf("earmap") === -1) errors.push("Missing: Ear Map photo");
      if (photoTypes.indexOf("earphoto") === -1) errors.push("Missing: Ear Photo");
      if (!form.trigeminalOhms || !form.trigeminalHz) errors.push("Missing: Trigeminal impedance values");
      if (!form.c2Ohms || !form.c2Hz) errors.push("Missing: C2 impedance values");
      if (!form.vagusOhms || !form.vagusHz) errors.push("Missing: Vagus impedance values");
    }

    // D20 = explant day, want ear photo
    if (form.visitType === "D20") {
      if (photoTypes.indexOf("earphoto") === -1) errors.push("Missing: Ear Photo (explant)");
    }

    return errors;
  }

  const [showOverride, setShowOverride] = useState(false);
  const [validationErrors, setValidationErrors] = useState([]);

  function tryCopy() {
    var errors = getValidationErrors();
    if (errors.length > 0) {
      setValidationErrors(errors);
      setShowOverride(true);
      return;
    }
    setShowOverride(false);
    setValidationErrors([]);
    copyNoteWithPhotos();
  }

  function trySubmit() {
    var errors = getValidationErrors();
    if (errors.length > 0) {
      setValidationErrors(errors);
      setShowOverride(true);
      return;
    }
    setShowOverride(false);
    setValidationErrors([]);
    handleSubmit();
  }

  async function handleSubmit() {
    if (!form.patientId) { flash("Enter a Study ID", "err"); return; }
    if (!patientName) { flash("Enter patient name", "err"); return; }
    setSubmitting(true);
    var row = buildRow();

    // Auto-add to directory if not already there
    var alreadyInDir = directory.some(function(d) { return d.id === form.patientId; });
    if (patientName && !alreadyInDir) {
      var entry = { name: patientName, id: form.patientId, addedAt: new Date().toISOString() };
      var updatedDir = directory.concat([entry]);
      setDirectory(updatedDir);
      storage.set(DIRECTORY_KEY, JSON.stringify(updatedDir));
    }

    try { await copyNoteWithPhotos(); } catch(e) {}
    var updated = records.concat([Object.assign({}, row, { id: Date.now() })]);
    try { storage.set(STORAGE_KEY, JSON.stringify(updated)); setRecords(updated); } catch(e) {}
    // Update draft with latest intake/device data for future visits
    var d = Object.assign({}, drafts);
    d[form.patientId] = Object.assign({}, form, { savedAt: new Date().toISOString() });
    setDrafts(d);
    try { storage.set(DRAFTS_KEY, JSON.stringify(d)); } catch(e) {}
    var sheetOk = false;
    if (sheetUrl) { try { await fetch(sheetUrl, {method:"POST", mode:"no-cors", body:JSON.stringify(row)}); sheetOk = true; } catch(e) {} }
    setSubmitting(false);
    flash("Saved" + (sheetOk ? " + Sheet updated" : sheetUrl ? " (Sheet may have updated)" : "") + ". Paste into chart.", "ok");
    setPatientName(""); // clear name after submit, it's in the directory now
  }

  // Directory functions (local only, never exported)
  function addToDirectory() {
    if (!dirName || !dirId) { flash("Enter both name and ID", "err"); return; }
    var entry = { name: dirName, id: dirId, addedAt: new Date().toISOString() };
    var updated = directory.concat([entry]);
    setDirectory(updated);
    storage.set(DIRECTORY_KEY, JSON.stringify(updated));
    setDirName(""); setDirId("");
    flash("Added " + dirName + " as " + dirId);
  }

  function removeFromDirectory(idx) {
    var updated = directory.filter(function(_, i) { return i !== idx; });
    setDirectory(updated);
    storage.set(DIRECTORY_KEY, JSON.stringify(updated));
  }

  function selectFromDirectory(id, name) {
    set("patientId", id);
    setPhotoPatientId(id);
    setPatientName(name || "");
    setShowConfig(false);
    flash("Selected " + id);
  }

  function getFilteredDirectory() {
    if (!dirSearch) return directory;
    var s = dirSearch.toLowerCase();
    return directory.filter(function(d) {
      return d.name.toLowerCase().includes(s) || d.id.toLowerCase().includes(s);
    });
  }

  function generateNoteHtml() {
    var text = generateNote();
    var pid = form.patientId;
    var patientPhotos = pid ? getPhotosForPatient(pid) : [];
    var html = "<div style=\"font-family:Courier New,monospace;font-size:11px;white-space:pre-wrap;\">" + text.replace(/\n/g, "<br>") + "</div>";
    if (patientPhotos.length) {
      html += "<br><div style=\"font-family:Arial,sans-serif;font-size:11px;font-weight:bold;\">PHOTOS:</div>";
      patientPhotos.forEach(function(p) {
        var matched = PHOTO_TYPES.find(function(t){return t.key===p.type}) || {};
        html += "<div style=\"font-family:Arial,sans-serif;font-size:10px;color:#666;margin-top:8px;\">" + (matched.label || p.type) + " - " + new Date(p.timestamp).toLocaleString() + "</div>";
        html += "<img src=\"" + p.data + "\" style=\"max-width:400px;margin:4px 0 12px 0;\" />";
      });
    }
    return html;
  }

  async function copyNoteWithPhotos() {
    var pid = form.patientId;
    var patientPhotos = pid ? getPhotosForPatient(pid) : [];
    // Only include photos for D0
    if (form.visitType === "D0" && patientPhotos.length > 0) {
      try {
        var html = generateNoteHtml();
        var blob = new Blob([html], { type: "text/html" });
        var textBlob = new Blob([generateNote()], { type: "text/plain" });
        await navigator.clipboard.write([
          new ClipboardItem({
            "text/html": blob,
            "text/plain": textBlob
          })
        ]);
        flash("Copied note + " + patientPhotos.length + " photos");
        return;
      } catch(e) {}
    }
    try { await navigator.clipboard.writeText(generateNote()); flash("Copied note"); } catch(e) { flash("Copy failed", "err"); }
  }

  function saveSheetUrl() { storage.set(SHEET_URL_KEY, sheetUrl); flash("Sheet URL saved"); setShowConfig(false); }

  function exportCSV() {
    if (!records.length) return;
    var headers = Object.keys(records[0]).filter(function(k){return k!=="id"});
    var csv = [headers.join(",")].concat(records.map(function(r){return headers.map(function(h){return '"'+String(r[h]||"").replace(/"/g,'""')+'"'}).join(",")})).join("\n");
    var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
    a.download = "dpn_data_" + new Date().toISOString().split("T")[0] + ".csv"; a.click();
  }

                    <div className="bg-gray-50 rounded p-3">
                      <div className="text-xs font-semibold text-gray-500 mb-2">SUBJECTIVE (POST-EXPLANT)</div>
                      <textarea className={ic + " h-16"} value={form.subjectivePost} onChange={function(e){set("subjectivePost",e.target.value)}} placeholder="How patient feels after device removal..."></textarea>
                    </div>
                  )}

                  {form.visitType === "D20" && (
                    <div className="bg-gray-50 rounded p-3">
                      <div className="text-xs font-semibold text-gray-500 mb-2">UPDATED LABS</div>
                      <div className="grid grid-cols-2 gap-2">
                        <div><label className={lc}>A1C (if available)</label><input className={ic} value={form.a1c} onChange={function(e){set("a1c",e.target.value)}} placeholder="%" /></div>
                        <div><label className={lc}>BG Control</label><select className={ic} value={form.glucoseControl} onChange={function(e){set("glucoseControl",e.target.value)}}><option value="">--</option><option>Well controlled</option><option>Poorly controlled</option></select></div>
                      </div>
                    </div>
                  )}

                  <div className="bg-gray-50 rounded p-3">
                    <div className="text-xs font-semibold text-gray-500 mb-2">PLAN</div>
                    <textarea className={ic + " h-16"} value={form.plan} onChange={function(e){set("plan",e.target.value)}} placeholder="Plan, follow-up instructions, medication changes..."></textarea>
                  </div>
                </div>
              )}

              <div className="flex gap-2">
                <button onClick={saveDraft} className="flex-1 py-2.5 bg-yellow-500 text-white rounded-lg text-sm font-medium">{form.visitType === "D0" ? "Save Draft (phone intake)" : "Save Progress"}</button>
                <button onClick={function(){setFormSection("sensory")}} className="flex-1 py-2.5 bg-blue-600 text-white rounded-lg text-sm font-medium">Continue to Sensory</button>
              </div>
            </div>
          )}

          {/* ---- SENSORY ASSESSMENT SECTION ---- */}
          {formSection === "sensory" && (function() {
            var phases = form.visitType === "D90" ? ["Pre"] : ["Pre","Post"];
            var phaseLabel = function(ph) { return form.visitType === "D90" ? "EXAM" : ph.toUpperCase(); };
            return (
            <div className="space-y-3">
              {form.visitType === "D90" && <div className="text-xs text-center text-gray-400 bg-gray-50 py-2 rounded">Single exam (no device in place)</div>}

              <div className="bg-gray-50 rounded p-3">
                <div className="text-xs font-semibold text-gray-500 mb-2">HRV and PAIN</div>
                <div className={"grid gap-4 " + (phases.length === 1 ? "grid-cols-1" : "grid-cols-2")}>
                  {phases.map(function(ph) { return (
                    <div key={ph}>
                      <div className="text-xs text-gray-400 mb-1">{phaseLabel(ph)}</div>
                      <div className="grid grid-cols-2 gap-2">
                        <div><label className={lc}>RMSSD</label><input className={ic} type="number" step="0.1" value={form["rmssd"+ph]} onChange={function(e){set("rmssd"+ph,e.target.value)}} placeholder="ms" /></div>
                        <div><label className={lc}>NRS Pain</label><input className={ic} type="number" min="0" max="10" value={form["nrsPain"+ph]} onChange={function(e){set("nrsPain"+ph,e.target.value)}} placeholder="/10" /></div>
                      </div>
                    </div>
                  );})}
                </div>
              </div>

              {phases.map(function(phase) { return (
                <div key={phase} className="bg-gray-50 rounded p-3">
                  <div className="flex justify-between items-center mb-2">
                    <span className="text-xs font-semibold text-gray-500">MONOFILAMENT {phaseLabel(phase)}</span>
                    <span className="text-sm font-bold text-blue-600">L: {sumChecked(form["leftFoot"+phase])}/12 | R: {sumChecked(form["rightFoot"+phase])}/12</span>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    {["left","right"].map(function(side) { return (
                      <div key={side}>
                        <div className="text-xs text-gray-400 mb-1 capitalize">{side}</div>
                        <div className="grid grid-cols-3 gap-1">
                          {siteLabels.map(function(label, i) {
                            var key = side+"Foot"+phase;
                            return <button key={i} onClick={function(){toggleSite(key,i)}}
                              className={"text-xs py-1 px-0.5 rounded border " + (form[key][i] ? "bg-blue-500 text-white border-blue-500" : "bg-white text-gray-500 border-gray-300")}>{label}</button>;
                          })}
                        </div>
                      </div>
                    );})}
                  </div>
                </div>
              );})}

              <div className="bg-gray-50 rounded p-3">
                <div className="text-xs font-semibold text-gray-500 mb-2">STEREOGNOSIS (0-3 per hand)</div>
                <div className={"grid gap-4 " + (phases.length === 1 ? "grid-cols-1" : "grid-cols-2")}>
                  {phases.map(function(ph) { return (
                    <div key={ph}>
                      <div className="text-xs text-gray-400 mb-1">{phaseLabel(ph)}</div>
                      <div className="grid grid-cols-3 gap-2">
                        <div><label className={lc}>Quarter</label><select className={ic} value={form["coinQuarter"+ph]} onChange={function(e){set("coinQuarter"+ph,e.target.value)}}><option value="">--</option><option>Yes</option><option>No</option></select></div>
                        <div><label className={lc}>Dime</label><select className={ic} value={form["coinDime"+ph]} onChange={function(e){set("coinDime"+ph,e.target.value)}}><option value="">--</option><option>Yes</option><option>No</option></select></div>
                        <div><label className={lc}>Penny</label><select className={ic} value={form["coinPenny"+ph]} onChange={function(e){set("coinPenny"+ph,e.target.value)}}><option value="">--</option><option>Yes</option><option>No</option></select></div>
                      </div>
                    </div>
                  );})}
                </div>
              </div>

              <div className="bg-gray-50 rounded p-3">
                <div className="text-xs font-semibold text-gray-500 mb-2">SINGLE LEG STANCE (eyes closed, max 30s) and 10M WALK</div>
                <div className={"grid gap-4 " + (phases.length === 1 ? "grid-cols-1" : "grid-cols-2")}>
                  {phases.map(function(ph) { return (
                    <div key={ph}>
                      <div className="text-xs text-gray-400 mb-1">{phaseLabel(ph)}</div>
                      <div className="space-y-2">
                        <div className="grid grid-cols-2 gap-2">
                          <div><label className={lc}>R leg (s)</label><input className={ic} type="number" step="0.1" value={form["slsRightSec"+ph]} onChange={function(e){set("slsRightSec"+ph,e.target.value)}} /></div>
                          <div><label className={lc}>R fall?</label><select className={ic} value={form["slsRightFall"+ph]} onChange={function(e){set("slsRightFall"+ph,e.target.value)}}><option>No</option><option>Yes</option></select></div>
                        </div>
                        <div className="grid grid-cols-2 gap-2">
                          <div><label className={lc}>L leg (s)</label><input className={ic} type="number" step="0.1" value={form["slsLeftSec"+ph]} onChange={function(e){set("slsLeftSec"+ph,e.target.value)}} /></div>
                          <div><label className={lc}>L fall?</label><select className={ic} value={form["slsLeftFall"+ph]} onChange={function(e){set("slsLeftFall"+ph,e.target.value)}}><option>No</option><option>Yes</option></select></div>
                        </div>
                        <div><label className={lc}>10m walk (s)</label><input className={ic} type="number" step="0.1" value={form["walkTime"+ph]} onChange={function(e){set("walkTime"+ph,e.target.value)}} /></div>
                      </div>
                    </div>
                  );})}
                </div>
              </div>

              <div><label className={lc}>Notes</label><textarea className={ic + " h-14"} value={form.notes} onChange={function(e){set("notes",e.target.value)}} placeholder="Meds, observations..."></textarea></div>

              <button onClick={trySubmit} disabled={submitting}
                className={"w-full py-3 rounded-lg text-white font-semibold text-base " + (submitting ? "bg-gray-400" : "bg-blue-600 active:bg-blue-700")}>
                {submitting ? "Submitting..." : "Submit: Copy Note + Save Data"}
              </button>

              {showOverride && validationErrors.length > 0 && (
                <div className="bg-red-50 border border-red-200 rounded-lg p-3 mt-2">
                  <div className="text-xs font-semibold text-red-600 mb-1">Cannot submit - missing items:</div>
                  {validationErrors.map(function(err, i) { return <div key={i} className="text-xs text-red-500 py-0.5">{err}</div>; })}
                  <button onClick={function(){ setShowOverride(false); setValidationErrors([]); handleSubmit(); }}
                    className="mt-2 w-full py-1.5 bg-red-100 text-red-600 text-xs rounded font-medium">Override and Submit Anyway</button>
                </div>
              )}
              <div className="flex gap-2">
                <button onClick={function(){setFormSection("intake")}} className="flex-1 py-2 text-sm text-gray-400">{form.visitType === "D0" ? "Back to Intake" : "Back to Progress"}</button>
                <button onClick={resetForm} className="flex-1 py-2 text-sm text-gray-400">Clear All</button>
              </div>
            </div>
            );
          })()}
        </div>
      )}

      {/* ========== PHOTOS TAB ========== */}
      {view === "photos" && (
        <div className="p-4 space-y-3">
          <div>
            <label className={lc}>Patient ID for Photos</label>
            <input className={ic} value={photoPatientId || form.patientId} onChange={function(e){setPhotoPatientId(e.target.value)}} placeholder="DNC-XXXX" />
          </div>
          <div className="grid grid-cols-3 gap-2">
            {PHOTO_TYPES.map(function(t) { return (
              <button key={t.key} onClick={function(){capturePhoto(t.key)}}
                className="flex flex-col items-center justify-center py-3 bg-gray-50 rounded-lg border border-gray-200 active:bg-blue-50">
                <span className="text-lg font-bold text-blue-500 mb-1">{t.icon}</span>
                <span className="text-xs font-medium text-gray-600 text-center leading-tight">{t.label}</span>
              </button>
            );})}
          </div>
          {(function() {
            var pid = photoPatientId || form.patientId;
            var patientPhotos = pid ? getPhotosForPatient(pid) : [];
            if (!pid) return <div className="text-center text-gray-400 text-sm py-4">Enter Patient ID above</div>;
            if (!patientPhotos.length) return <div className="text-center text-gray-400 text-sm py-4">No photos for {pid}</div>;
            return (
              <div className="space-y-2">
                <div className="text-xs font-medium text-gray-500">{patientPhotos.length} photos for {pid}</div>
                {patientPhotos.map(function(p) { return (
                  <div key={p.id} className="bg-gray-50 rounded-lg overflow-hidden border">
                    <div className="flex justify-between items-center px-3 py-1.5">
                      <span className="text-xs font-medium text-gray-600">
                        {(PHOTO_TYPES.find(function(t){return t.key===p.type})||{}).icon} {(PHOTO_TYPES.find(function(t){return t.key===p.type})||{}).label}
                      </span>
                      <div className="flex items-center gap-2">
                        <span className="text-xs text-gray-400">{new Date(p.timestamp).toLocaleString()}</span>
                        <button onClick={function(){deletePhoto(p.id)}} className="text-red-400 text-xs">X</button>
                      </div>
                    </div>
                    <img src={p.data} className="w-full" alt={p.type} />
                  </div>
                );})}
              </div>
            );
          })()}
        </div>
      )}

      {/* ========== NOTE TAB ========== */}
      {view === "note" && (
        <div className="p-4">
          <pre className="text-xs font-mono bg-gray-50 p-4 rounded whitespace-pre-wrap border">{generateNote()}</pre>
          {form.visitType === "D0" && (function() {
            var pid = form.patientId;
            var patientPhotos = pid ? getPhotosForPatient(pid) : [];
            if (!patientPhotos.length) return null;
            return (
              <div className="mt-2 space-y-2">
                <div className="text-xs font-semibold text-gray-500">PHOTOS ({patientPhotos.length})</div>
                {patientPhotos.map(function(p) { return (
                  <div key={p.id} className="bg-gray-50 rounded overflow-hidden border">
                    <div className="px-2 py-1 text-xs text-gray-500">{(PHOTO_TYPES.find(function(t){return t.key===p.type})||{}).label}</div>
                    <img src={p.data} className="w-full" alt={p.type} />
                  </div>
                );})}
              </div>
            );
          })()}
          <button onClick={tryCopy}
            className="mt-3 w-full py-2 bg-blue-600 text-white rounded text-sm font-medium">{form.visitType === "D0" ? "Copy Note + Photos" : "Copy Note"}</button>

          {showOverride && validationErrors.length > 0 && (
            <div className="bg-red-50 border border-red-200 rounded-lg p-3 mt-2">
              <div className="text-xs font-semibold text-red-600 mb-1">Missing items:</div>
              {validationErrors.map(function(err, i) { return <div key={i} className="text-xs text-red-500 py-0.5">{err}</div>; })}
              <button onClick={function(){ setShowOverride(false); setValidationErrors([]); copyNoteWithPhotos(); }}
                className="mt-2 w-full py-1.5 bg-red-100 text-red-600 text-xs rounded font-medium">Copy Anyway</button>
            </div>
          )}
        </div>
      )}

      {/* ========== RECORDS TAB ========== */}
      {view === "records" && (
        <div className="p-4">
          <div className="flex justify-between items-center mb-3">
            <span className="text-sm text-gray-600">{records.length} records</span>
            <div className="flex gap-2">
              <button onClick={exportCSV} disabled={!records.length} className="px-3 py-1 bg-green-600 text-white text-xs rounded">CSV</button>
              <button onClick={clearAll} disabled={!records.length} className="px-3 py-1 bg-red-100 text-red-600 text-xs rounded">Clear</button>
            </div>
          </div>
          {!records.length ? <div className="text-center text-gray-400 py-8 text-sm">No records yet</div> : (
            <div className="space-y-2 max-h-96 overflow-y-auto">
              {records.map(function(r, i) { return (
                <div key={r.id || i} className="bg-gray-50 rounded p-3 text-xs">
                  <div className="flex justify-between"><span className="font-medium">{r.patientId}</span><span className="text-gray-400">{r.date} | {r.visitType}</span></div>
                  <div className="text-gray-600 mt-1">
                    Mono: {r.combinedPre}/24 &rarr; {r.combinedPost}/24 ({r.monofilamentChange > 0 ? "+" : ""}{r.monofilamentChange}) |
                    Coins: {r.coinScorePre != null ? r.coinScorePre : "?"}/3 &rarr; {r.coinScorePost != null ? r.coinScorePost : "?"}/3 |
                    RMSSD: {r.rmssdPre} &rarr; {r.rmssdPost} | Pain: {r.nrsPainPre} &rarr; {r.nrsPainPost}
                  </div>
                </div>
              );})}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body>
</html>
