<script>
// ============================================================
// CACHE-BUST + VERSION CHECK
// GitHub Pages doesn't let us set HTTP cache headers, so home-screen PWA
// shortcuts (like Lindsey's iOS bookmark) aggressively cache the HTML and
// can keep serving stale code for days after a deploy. This block runs
// BEFORE the main app loads and does two things:
//
// 1. On first load after a deploy, compare APP_VERSION in the freshly-loaded
//    HTML against the version stored in localStorage. If different:
//       - purge any service worker cache entries
//       - bump stored version
//       - hard-reload bypassing cache to ensure all sub-resources are fresh
//
// 2. Every time the app is foregrounded (iOS PWA resume or tab switch back),
//    re-fetch the HTML with a cache-bust query string and compare the
//    embedded APP_VERSION. If the server has a newer version, prompt or
//    auto-reload.
//
// Bumping APP_VERSION on every deploy is the trigger. One manual step.
// ============================================================
window.__APP_VERSION = "2026-05-07-parse-feedback";

// ============================================================
// MAINTENANCE REDIRECT
// While MAINTENANCE_MODE is true, every visitor is redirected to
// diabeticnerveclinic.com BEFORE the app boots. The redirect runs in this
// plain <script> block — earlier than the babel-compiled app — so non-admin
// visitors never download or render any of the React code below.
//
// Admin bypass: visit URL with ?admin=1 (e.g. surghome.com/assess?admin=1).
// Bypass persists in sessionStorage for the tab — page refresh keeps you in,
// closing the tab/Safari clears it. Bookmark the ?admin=1 version on your
// home screen and you'll always land in.
//
// To re-enable the app for all users:
//   1. Set window.__MAINTENANCE_MODE = false below
//   2. Bump APP_VERSION above so the foreground re-check forces a refresh
//   3. Redeploy
// ============================================================
window.__MAINTENANCE_MODE = false;
window.__MAINTENANCE_REDIRECT_URL = "https://diabeticnerveclinic.com";

(function checkMaintenance() {
  if (!window.__MAINTENANCE_MODE) return;
  try {
    if (window.location.search.indexOf("admin=1") !== -1) {
      sessionStorage.setItem("dnc-admin-bypass", "1");
      return; // bypass active, let app load
    }
    if (sessionStorage.getItem("dnc-admin-bypass") === "1") return;
    window.location.replace(window.__MAINTENANCE_REDIRECT_URL);
  } catch(e) {
    // sessionStorage blocked? Redirect anyway — safer to be off than on.
    window.location.replace(window.__MAINTENANCE_REDIRECT_URL);
  }
})();

(function initCacheBust() {
  try {
    var VERSION_KEY = "dnc-app-version";
    var stored = localStorage.getItem(VERSION_KEY);

    // First load: stamp version and proceed
    if (!stored) {
      localStorage.setItem(VERSION_KEY, window.__APP_VERSION);
      return;
    }

    // Version mismatch: stored version is older than what we just downloaded.
    // Purge caches, update stamp, force hard reload. location.reload(true) is
    // deprecated in some browsers but still works on iOS Safari; the cache
    // purge below belts-and-suspenders covers cases where it's a no-op.
    if (stored !== window.__APP_VERSION) {
      console.log("Version mismatch (" + stored + " → " + window.__APP_VERSION + "). Purging caches.");
      localStorage.setItem(VERSION_KEY, window.__APP_VERSION);
      // Purge all Cache Storage entries (service worker cache)
      if ('caches' in window) {
        caches.keys().then(function(names) {
          return Promise.all(names.map(function(n) { return caches.delete(n); }));
        }).finally(function() {
          // Break any in-flight cache on reload
          window.location.replace(window.location.pathname + "?v=" + Date.now());
        });
      } else {
        window.location.replace(window.location.pathname + "?v=" + Date.now());
      }
      return;
    }

    // Same version — no-op. Foreground re-check runs below.
  } catch(e) {
    console.error("Cache-bust init failed:", e);
  }
})();

// Foreground re-check: when app is brought back to focus (iOS PWA resume,
// tab switch-back), quietly fetch the live HTML with a cache-bust and see
// if the server has a newer APP_VERSION. If so, auto-reload. This catches
// the case where a user leaves the app open for days and we've deployed
// multiple times.
window.addEventListener("visibilitychange", function() {
  if (document.visibilityState !== "visible") return;
  try {
    fetch(window.location.pathname + "?v=" + Date.now(), {
      cache: "no-store",
      headers: { "Cache-Control": "no-cache" }
    }).then(function(r) { return r.text(); }).then(function(html) {
      var match = html.match(/window\.__APP_VERSION\s*=\s*"([^"]+)"/);
      if (match && match[1] && match[1] !== window.__APP_VERSION) {
        console.log("Newer version available on server: " + match[1]);
        // Don't interrupt a user mid-flow unless they're idle. Check if
        // they're actively editing (any input has focus); if so, defer.
        var activeEl = document.activeElement;
        var isEditing = activeEl && (
          activeEl.tagName === "INPUT" ||
          activeEl.tagName === "TEXTAREA" ||
          activeEl.tagName === "SELECT" ||
          activeEl.isContentEditable
        );
        if (!isEditing) {
          localStorage.setItem("dnc-app-version", match[1]);
          window.location.reload();
        } else {
          // Flag it in a global so the app can show a subtle "update available"
          // banner if it wants. For now, just log.
          window.__updateAvailable = match[1];
        }
      }
    }).catch(function(e) { /* silent — network failure shouldn't block app */ });
  } catch(e) {}
});
</script>

function sumChecked(arr) { return arr.filter(Boolean).length; }

function toggleInArray(arr, val) { return arr.includes(val) ? arr.filter(function(v){return v!==val}) : arr.concat([val]); }

// Phone format validation: should normalize to exactly 10 digits.
// Returns true if the string contains a valid US phone number.
function isValidPhone(s) {
  if (!s) return false;
  var digits = String(s).replace(/\D/g, "");
  return digits.length === 10 || digits.length === 11; // 11 = with country code
}

// Medicare Beneficiary Identifier (MBI) format check. Per CMS, since 2018 every
// traditional Medicare member has an 11-character MBI (replacing SSN-based HICN).
// Format positions: C A N N A N A A N N N, where:
//   C = digit 1-9 (never 0 in position 1)
//   A = letter, excluding S/L/O/I/B/Z (CMS excluded these — too easily confused
//       with digits 5/1/0/1/8/2)
//   N = digit 0-9
// Strips dashes/whitespace and uppercases before checking, since MBIs are
// sometimes displayed dashed (e.g. "1AB2-CD3-EF45") even though canonical form
// is undelimited.
function isValidMBI(s) {
  if (!s) return false;
  var clean = String(s).replace(/[\s-]/g, "").toUpperCase();
  if (clean.length !== 11) return false;
  return /^[1-9][AC-HJ-KMNP-RT-Y][0-9AC-HJ-KMNP-RT-Y][0-9][AC-HJ-KMNP-RT-Y][0-9AC-HJ-KMNP-RT-Y][0-9][AC-HJ-KMNP-RT-Y]{2}[0-9]{2}$/.test(clean);
}

// Returns true if the insurance name indicates TRADITIONAL Medicare (Part A/B/D),
// NOT Medicare Advantage. Same disambiguation logic classifyPayer uses for
// tiering — kept consistent so a payer that triggers MBI validation here is
// the same set of payers tagged "green" in the existing tier display.
function isMedicareTraditional(insuranceName) {
  if (!insuranceName) return false;
  var p = String(insuranceName).toLowerCase();
  return /\bmedicare\b/.test(p) && !/advantage|ma\s*plan|hmo|ppo/.test(p);
}

// Normalize phone for comparison: digits only, last 10
function normalizePhone(s) {
  if (!s) return "";
  var d = String(s).replace(/\D/g, "");
  return d.slice(-10);
}

// Compare two values from main parse vs verification pass.
// Returns null if they match (or one is missing), otherwise returns {field, primary, verified}.
function compareNumeric(field, primary, verified) {
  if (!primary || !verified) return null; // can't compare
  if (field === "phone") {
    return normalizePhone(primary) === normalizePhone(verified) ? null : { field: field, primary: primary, verified: verified };
  }
  // Member IDs: case-insensitive, strip whitespace and dashes for comparison
  var p = String(primary).replace(/[\s-]/g, "").toUpperCase();
  var v = String(verified).replace(/[\s-]/g, "").toUpperCase();
  return p === v ? null : { field: field, primary: primary, verified: verified };
}

// Classify a referral's payer mix into a tier:
//   "green"   = Medicare Part B (traditional, fast preauth, approved)
//   "yellow"  = Medicare + secondary OR BCBS Medicare Advantage (slower preauth but approved)
//   "red"     = anything else (commercial, other MA plans, Medicaid, unknown payer with insurance listed)
//   "neutral" = no insurance info parsed at all (unknown — don't penalize)
// Input: { primary: "Medicare Part B", secondary: "BCBS Medigap" } or empty object
// Canonical throughput statuses. Anything outside this set is treated as
// "non-canonical" — usually a relic from the pre-system era, hand-typed by
// MA/biller, or AI-generated drift. Cards with non-canonical statuses get
// a "?" indicator so they're visible for human cleanup without being
// silently rewritten.
//
// SOURCE OF TRUTH: this object is seeded with sensible defaults but is
// dynamically replaced on first load by /action=getStatusTaxonomy from the
// backend (where STATUS_TAXONOMY lives in Code.gs). When a new status is
// added to the backend, it propagates here automatically — frontend doesn't
// need to be redeployed for taxonomy changes alone. The seed defaults below
// are kept in sync with the backend so app works correctly during the brief
// window between page load and the taxonomy fetch completing.
//
// "Removed: <reason>" / "Preauth Rejected: <reason>" prefix families are
// matched via canonicalPrefixes, not the canonical map.
var STATUS_TAXONOMY_CLIENT = {
  canonical: {
    "Referral Received": true, "Intake In Progress": true,
    "Awaiting Cosign": true, "Cosigned": true,
    "Preauth In Review": true, "Preauth Submitted": true,
    "Preauth Rejected": true, "Authorized": true,
    "D0 Scheduled": true, "D0 Complete": true,
    "Trial Billing Submitted": true, "Trial Billing Approved": true,
    "Trial Billing Rejected": true, "D20 Complete": true,
    "D90 Complete": true, "Reimbursed": true, "Complete": true
  },
  canonicalPrefixes: ["Removed:", "Removed ", "Preauth Rejected", "Trial Billing Rejected"]
};

function isCanonicalStatus(status) {
  if (!status) return true; // empty defaults to "Referral Received"
  var s = String(status).trim();
  if (!s) return true;
  if (STATUS_TAXONOMY_CLIENT.canonical[s]) return true;
  for (var i = 0; i < STATUS_TAXONOMY_CLIENT.canonicalPrefixes.length; i++) {
    if (s.indexOf(STATUS_TAXONOMY_CLIENT.canonicalPrefixes[i]) === 0) return true;
  }
  return false;
}

// Fetch latest taxonomy from backend on app load. Failure is silent — seeded
// defaults above remain in effect. This lets backend taxonomy changes
// propagate to frontend without a redeploy.
async function refreshStatusTaxonomy(sheetUrl) {
  if (!sheetUrl) return;
  try {
    var resp = await fetch(sheetUrl + "?action=getStatusTaxonomy");
    var result = await resp.json();
    if (result.status === "ok" && Array.isArray(result.canonical)) {
      var newCanonical = {};
      result.canonical.forEach(function(s) { newCanonical[s] = true; });
      STATUS_TAXONOMY_CLIENT.canonical = newCanonical;
      if (Array.isArray(result.canonicalPrefixes)) {
        STATUS_TAXONOMY_CLIENT.canonicalPrefixes = result.canonicalPrefixes;
      }
    }
  } catch(e) {
    // Quiet failure — defaults remain
  }
}

function classifyPayer(primary, secondary) {
  var p = String(primary || "").toLowerCase();
  var s = String(secondary || "").toLowerCase();
  if (!p && !s) return { tier: "neutral", reason: "" };

  var hasMedicare = /\bmedicare\b/.test(p) && !/advantage|ma\s*plan|hmo|ppo/.test(p);
  var isMA = /medicare\s*advantage|ma\s*plan/.test(p) || /medicare\s*advantage|ma\s*plan/.test(s);
  var isBCBS = /bcbs|blue\s*cross|blue\s*shield/.test(p) || /bcbs|blue\s*cross|blue\s*shield/.test(s);
  var hasSecondary = !!s;

  // Green: traditional Medicare as primary, with or without a secondary. Supplements
  // (Medigap, employer secondary) don't meaningfully slow DNC's preauth path —
  // traditional Medicare is traditional Medicare either way.
  if (hasMedicare && !isMA) return { tier: "green", reason: hasSecondary ? "Medicare + secondary" : "Medicare" };
  // Yellow: any Medicare Advantage plan. BCBS MA is the established approval path;
  // other MA plans (Humana, Aetna, UHC, etc.) are yellow too because the preauth
  // is approvable but slower than traditional Medicare.
  if (isMA && isBCBS) return { tier: "yellow", reason: "BCBS Medicare Advantage" };
  if (isMA) return { tier: "yellow", reason: "Medicare Advantage" };
  // Red: everything else (commercial, Medicaid, unknown, Medicare supplement but no primary)
  return { tier: "red", reason: primary || secondary || "Non-Medicare payer" };
}

// Local date YYYY-MM-DD. Using toISOString() gives UTC, which shifts the date
// forward for late-evening Eastern submissions (9pm ET = 1am UTC next day).
function todayLocal() {
  var d = new Date();
  var y = d.getFullYear();
  var m = String(d.getMonth() + 1).padStart(2, "0");
  var day = String(d.getDate()).padStart(2, "0");
  return y + "-" + m + "-" + day;
}

  // Source row in the throughput sheet, set by startIntakeFromReferral. When

  // Drives routing of future preauth-approved and D0-reminder notifications.
  commPref: "",

  insuranceName: "", memberId: "", groupNum: "", effectiveDate: "",
// Per-field confidence from dual-pass parse. "confirmed" / "suspect" /

// Self-contained stopwatch component. Each instance owns its own state — multiple
// stopwatches can run independently on the same page. Used inline next to timed
// measurements (SLS per leg, 10m walk) so MAs don't have to scroll or mentally
// track which test the shared clock is for. No props needed; component renders
// its own elapsed time and Start/Stop/Reset buttons.
function Stopwatch() {
  const [running, setRunning] = useState(false);
  const [elapsed, setElapsed] = useState(0); // ms
  const [startTime, setStartTime] = useState(null);

  useEffect(function() {
    if (!running) return;
    var interval = setInterval(function() {
      setElapsed(Date.now() - startTime);
    }, 50);
    return function() { clearInterval(interval); };
  }, [running, startTime]);

  function start() {
    setStartTime(Date.now() - elapsed);
    setRunning(true);
  }
  function stop() { setRunning(false); }
  function reset() { setRunning(false); setElapsed(0); setStartTime(null); }
  var seconds = (elapsed / 1000).toFixed(1);

  return (
    <div className="bg-blue-50 rounded px-2 py-1.5 border border-blue-200">
      <div className="flex items-center gap-2">
        <div className="text-sm font-mono font-bold text-blue-700 w-14 tabular-nums">{seconds}s</div>
        {!running && elapsed === 0 && (
          <button onClick={start} className="flex-1 py-1 bg-green-600 text-white rounded text-xs font-medium">Start</button>
        )}
        {!running && elapsed > 0 && (
          <React.Fragment>
            <button onClick={start} className="flex-1 py-1 bg-green-600 text-white rounded text-xs font-medium">Resume</button>
            <button onClick={reset} className="flex-1 py-1 bg-gray-200 text-gray-700 rounded text-xs font-medium">Reset</button>
          </React.Fragment>
        )}
        {running && (
          <React.Fragment>
            <button onClick={stop} className="flex-1 py-1 bg-red-600 text-white rounded text-xs font-medium">Stop</button>
            <button onClick={reset} className="flex-1 py-1 bg-gray-200 text-gray-700 rounded text-xs font-medium">Reset</button>
          </React.Fragment>
        )}
      </div>
    </div>
  );
}

  async function saveUserProfile() {
    if (!sheetUrl || !userProfile) return;
    if (!userProfile.email) { flash("Missing email", "err"); return; }

    // Capture signature image only if user actually drew something new. If
    // they didn't touch the canvas, leave the existing signatureUrl alone.

    var statesArr = String(userProfile.licensedStates || "").split(",").map(function(s){return s.trim()}).filter(Boolean);

        })
      });

  // Profile signature pad handlers — separate from consent sigPad (sigStart/
  // sigMove/sigEnd) so the two canvases don't collide. The profile canvas is
  // referenced by id "profile-sig-canvas" in the settings panel below.
  function profileSigGetCtx() {
    var c = document.getElementById("profile-sig-canvas");
    return c ? c.getContext("2d") : null;
  }
  function profileSigPos(e) {
    var c = document.getElementById("profile-sig-canvas");
    if (!c) return { x: 0, y: 0 };
    var r = c.getBoundingClientRect();
    var t = e.touches && e.touches[0] ? e.touches[0] : e;
    return {
      x: (t.clientX - r.left) * (c.width / r.width),
      y: (t.clientY - r.top) * (c.height / r.height)
    };
  }
  function profileSigStart(e) {
    e.preventDefault();
    var ctx = profileSigGetCtx();
    if (!ctx) return;
    setProfileSigDrawing(true);
    setProfileSigDirty(true);
    var p = profileSigPos(e);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    ctx.strokeStyle = "#000";
  }
  function profileSigMove(e) {
    if (!profileSigDrawing) return;
    e.preventDefault();
    var ctx = profileSigGetCtx();
    if (!ctx) return;
    var p = profileSigPos(e);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  }
  function profileSigEnd(e) {
    if (e) e.preventDefault();
    setProfileSigDrawing(false);
  }
  function profileSigClear() {
    var c = document.getElementById("profile-sig-canvas");
    if (!c) return;
    var ctx = c.getContext("2d");
    ctx.clearRect(0, 0, c.width, c.height);
    setProfileSigDirty(true); // clearing counts as a change — empty signature replaces old one
  }

  async function addReferral(forceAdd, source) {
    // source: undefined = form path (uses newRef), or {queueId} = queue path
    var data;
    if (source && source.queueId != null) {
      var item = parseQueue.find(function(q){ return q.id === source.queueId; });
      if (!item || item.status !== "parsed" || !item.parsed) { flash("Queue item not ready", "err"); return; }
      var p = item.parsed;
      // Rebuild notes in same format parseReferralPhoto uses (CONTRA/Ins/Sec markers)
      var parts = [];
      if (Array.isArray(p.contraindications) && p.contraindications.length) {
        parts.push("CONTRA: " + p.contraindications.join(", "));
      }
      if (p.insurancePrimary || p.memberIdPrimary) {
        parts.push("Ins: " + (p.insurancePrimary || "Primary") + (p.memberIdPrimary ? " #" + p.memberIdPrimary : ""));
      }
      if (p.insuranceSecondary || p.memberIdSecondary) {
        parts.push("Sec: " + (p.insuranceSecondary || "Secondary") + (p.memberIdSecondary ? " #" + p.memberIdSecondary : ""));
      }
      if (p.notes) parts.push(p.notes);
      data = { name: p.name || "", dob: p.dob || "", phone: p.phone || "", provider: p.provider || "", notes: parts.join(" | "), orderDate: p.orderDate || "" };
    } else {
      data = { name: newRef.name, dob: newRef.dob, phone: newRef.phone, provider: newRef.provider, notes: newRef.notes, orderDate: "" };
    }
    if (!data.name.trim() || !data.phone.trim()) { flash("Name and phone required", "err"); return; }
    if (!sheetUrl) { flash("Set database URL first", "err"); return; }
    try {
      var payload = {
        _action: "addReferral",
        patientName: data.name, dob: data.dob, phone: data.phone,
        referringProvider: data.provider, notes: data.notes,
        orderDate: data.orderDate
      };
      if (forceAdd) payload.forceAdd = true;
      var resp = await fetch(sheetUrl, {
        method: "POST",
        body: JSON.stringify(payload)
      });
      var result = await resp.json();
      if (result.status === "ok") {
        flash("Referral added");
        if (source && source.queueId != null) {
          setParseQueue(function(q){ return q.filter(function(x){ return x.id !== source.queueId; }); });
        } else {
          setNewRef({ name: "", dob: "", phone: "", provider: "", notes: "" });
        }
        setDupModal(null);
        loadReferrals();
      } else if (result.status === "duplicate") {
        setDupModal({ existing: result.existing, source: source });
      } else { flash("Error: " + (result.message || ""), "err"); }
    } catch(e) { flash("Error: " + e.toString(), "err"); }
  }

// Mark a referral's phone as verified. Appends a ✓ marker to the call log
  // via the backend's markPhoneVerified action. Suppresses future "wrong number"
  // emails until a NEW wrong-number entry comes in after this verification.
  // Optimistic update of the local referrals list so the X→✓ flip is immediate.
  async function verifyPhone(ref) {
    if (!sheetUrl || !ref || !ref.rowIndex) return;
    if (!confirm("Mark " + (ref.phone || "this number") + " as verified for " + (ref.name || "this patient") + "?")) return;

  // Submits a non-reached call attempt. Increments the server-side tally and
  // optimistically updates the local referrals list so the tally display
  // refreshes without waiting for a refetch.
  async function submitCallAttempt() {
    var ref = callModalRef;
    if (!ref || !sheetUrl) return;
    var outcomeLabels = {
      "no_answer": "No answer",
      "voicemail_full": "Voicemail full",
      "left_vm": "Left voicemail",
      "wrong_number": "Wrong number",
      "patient_hung_up": "Patient hung up",
      "other": "Other"
    };
    var outcomeText = outcomeLabels[callOutcome] || callOutcome || "No answer";
    var reasonText = callOutcome === "other" ? callOutcomeReason : "";
    // Forward-looking follow-up note. Optional, gets appended to log entry so
    // next MA who looks at the card sees "call back Thu 7pm" or whatever.
    var followupText = (callFollowupNote || "").trim();
    setCallSubmitting(true);
    var userEmail = (typeof firebase !== "undefined" && firebase.auth && firebase.auth().currentUser) ? firebase.auth().currentUser.email : "";
    try {
      await fetch(sheetUrl, {
        method: "POST",
        body: JSON.stringify({
          _action: "logCallAttempt",
          rowIndex: ref.rowIndex,
          outcome: outcomeText,
          reason: reasonText,
          followupNote: followupText,
          userEmail: userEmail
        })
      });
      // Optimistic: bump tally locally so card updates without a refresh.
      // Mirror the backend's entry format so prior-attempts block shows the
      // same text whether read from cache or re-fetched from sheet.
      setReferrals(function(prev) {
        return prev.map(function(r) {
          if (r.rowIndex !== ref.rowIndex) return r;
          var newCount = (parseInt(r.callAttempts, 10) || 0) + 1;
          var now = new Date();
          var tsShort = (now.getMonth()+1)+"/"+now.getDate()+" "+((now.getHours()%12)||12)+":"+(now.getMinutes()<10?"0":"")+now.getMinutes()+(now.getHours()>=12?"pm":"am");
          var entry = tsShort + " — " + outcomeText +
                      (reasonText ? " (" + reasonText + ")" : "") +
                      (followupText ? " | \"" + followupText + "\"" : "");
          return Object.assign({}, r, {
            callAttempts: newCount,
            lastCallAt: now.toISOString(),
            callLog: r.callLog ? (r.callLog + "\n" + entry) : entry
          });
        });
      });
      flash("Logged: " + outcomeText);
    } catch(e) {
      flash("Failed to log (will retry)", "warn");
    }
    setCallSubmitting(false);
    setCallModalRef(null);
    setCallOutcome("");
    setCallOutcomeReason("");
    setCallFollowupNote("");
  }

  function startIntakeFromReferral(ref) {
    set("referringProvider", ref.provider || "");
    setPatientName(ref.name || "");
    // Hydrate contact fields directly from the throughput columns
    if (ref.phone) set("phone", ref.phone);
    if (ref.dob) set("dob", ref.dob);
    // Parse insurance back out of the notes string we built during parseReferralPhoto.
    // Format: "CONTRA: ... | Ins: Medicare Part B #1EG4... | Sec: BCBS #ABC... | reason"
    // This is a temporary ugliness until Supabase gives us real insurance columns.
    function extractInsurance(prefix, notes) {
      var re = new RegExp("\\b" + prefix + ":\\s*([^|]+)", "i");
      var m = re.exec(notes);
      if (!m) return null;
      var chunk = m[1].trim();
      var hashIdx = chunk.indexOf("#");
      if (hashIdx >= 0) {
        return { name: chunk.substring(0, hashIdx).trim(), memberId: chunk.substring(hashIdx + 1).trim() };
      }
      return { name: chunk, memberId: "" };
    }
    var notesStr = ref.notes || "";
    var primary = extractInsurance("Ins", notesStr);
    var secondary = extractInsurance("Sec", notesStr);
    if (primary) {
      if (primary.name) set("insuranceName", primary.name);
      if (primary.memberId) set("memberId", primary.memberId);
    }
    if (secondary) {
      if (secondary.name) set("insuranceName2", secondary.name);
      if (secondary.memberId) set("memberId2", secondary.memberId);
    }
    var id = generatePatientId();
    setForm(function(f) { return Object.assign({}, f, { patientId: id, visitType: "Phone Intake", referralRowIndex: ref.rowIndex || "" }); });
    // Seed the referral-corrections snapshot to the values we just hydrated.
    // The diff fires only when one of these changes, so an MA that doesn't
    // touch demographics generates zero sync traffic. Note: patientName lives
    // in its own state, not form, so we capture it explicitly here.
    lastReferralSync.current = {
      patientName: ref.name || "",
      dob: ref.dob || "",
      phone: ref.phone || "",
      referringProvider: ref.provider || "",
      insuranceName: primary ? (primary.name || "") : "",
      memberId: primary ? (primary.memberId || "") : "",
      insuranceName2: secondary ? (secondary.name || "") : "",
      memberId2: secondary ? (secondary.memberId || "") : ""
    };
    // Save to directory
    if (ref.name) {
      var d = directory.slice();
      d.push({ name: ref.name, id: id });
      setDirectory(d);
      try { localStorage.setItem("dncDir", JSON.stringify(d)); } catch(e) {}
    }
    // Update throughput with DNC ID
    if (ref.rowIndex) {
      updateReferralStatus(ref.rowIndex, "dncId", id);
    }
    setView("form");
    setFormSection("intake");
    var hydrated = [];
    if (primary) hydrated.push("primary ins");
    if (secondary) hydrated.push("secondary ins");
    if (ref.phone) hydrated.push("phone");
    if (ref.dob) hydrated.push("DOB");
    var hydratedMsg = hydrated.length ? " (hydrated: " + hydrated.join(", ") + ")" : "";
    flash("Loaded referral for " + ref.name + " as " + id + hydratedMsg);
  }

async function parseMedicareCard(base64Data, isSecondary) {
    if (!sheetUrl) return;
    flash((isSecondary ? "Parsing secondary card..." : "Parsing primary card (dual pass)..."));
    try {
      var resp = await fetch(sheetUrl, {
        method: "POST",
        body: JSON.stringify({ _action: "parseMedicareCardDual", imageData: base64Data })
      });
      var result = await resp.json();
      if (result.status !== "ok" || !result.parsed) {
        flash("Parse failed - enter manually or re-snap clearer image", "warn");
        return;
      }
      var p = result.parsed;
      var conf = result.confidence || {};
      var alts = result.alternates || {};
      var parts = [];
      if (isSecondary) {
        if (p.insuranceName) { set("insuranceName2", p.insuranceName); parts.push(p.insuranceName); }
        if (p.memberId) { set("memberId2", p.memberId); parts.push(p.memberId); }
        if (p.groupNum) { set("groupNum2", p.groupNum); parts.push("Grp " + p.groupNum); }
        if (p.effectiveDate) set("effectiveDate2", p.effectiveDate);
      } else {
        var mismatches = [];
        if (form.insuranceName && p.insuranceName && form.insuranceName.toLowerCase() !== p.insuranceName.toLowerCase()) mismatches.push("Insurance name");
        if (form.memberId && p.memberId && form.memberId.replace(/\s/g,"") !== p.memberId.replace(/\s/g,"")) mismatches.push("Member ID");
        if (form.groupNum && p.groupNum && form.groupNum !== p.groupNum) mismatches.push("Group #");
        if (p.insuranceName) { set("insuranceName", p.insuranceName); parts.push(p.insuranceName); }
        if (p.memberId) { set("memberId", p.memberId); parts.push(p.memberId); }
        if (p.groupNum) { set("groupNum", p.groupNum); parts.push("Grp " + p.groupNum); }
        if (p.effectiveDate) set("effectiveDate", p.effectiveDate);
        if (p.patientName && !patientName) setPatientName(p.patientName);
        // Store dual-pass confidence so the gate (and the soft-warn UI) can read it.
        set("memberIdConfidence", conf.memberId || "");
        set("insuranceNameConfidence", conf.insuranceName || "");
        set("memberIdAlternate", alts.memberId || "");
        if (mismatches.length > 0) {
          flash("CARD vs REFERRAL MISMATCH: " + mismatches.join(", ") + " - card values used, verify", "warn");
          return;
        }
      }
      // Per-field confidence in the toast
      var confMsg = "";
      var toastType = "ok";
      if (!isSecondary) {
        if (conf.memberId === "confirmed") confMsg = " ✓ MBI confirmed";
        else if (conf.memberId === "suspect") { confMsg = " ⚠ MBI passes disagreed — verify"; toastType = "warn"; }
        else if (conf.memberId === "format_error") { confMsg = " ⚠ MBI unreadable characters"; toastType = "warn"; }
      }
      flash("Parsed: " + parts.join(" · ") + confMsg, toastType);
    } catch(e) { flash("Parse error - enter manually or re-snap", "warn"); }
  }

  function handleReferralPhotoCapture(e) {
    var files = Array.from(e.target.files || []);
    if (!files.length) return;
    setReferralParsing(true);

    // Single-file path: use existing flow that pre-fills the NEW REFERRAL form
    if (files.length === 1) {
      var reader = new FileReader();
      reader.onload = function(ev) {
        Promise.resolve(parseReferralPhoto(ev.target.result))
          .finally(function(){ setReferralParsing(false); });
      };
      reader.onerror = function() {
        flash("Failed to read photo file, try again", "err");
        setReferralParsing(false);
      };
      reader.readAsDataURL(files[0]);
      e.target.value = "";
      return;
    }

    // Multi-file path: parse all into a queue, user reviews and adds each
    var now = Date.now();
    var newItems = files.map(function(file, i) {
      return { id: now + i, status: "parsing", parsed: null, error: "", fileName: file.name || ("Photo " + (i+1)) };
    });
    setParseQueue(function(q){ return q.concat(newItems); });
    flash("Parsing " + files.length + " referrals...");

    var pendingCount = files.length;
    function decrementPending() {
      pendingCount--;
      if (pendingCount === 0) setReferralParsing(false);
    }

    files.forEach(function(file, i) {
      var qid = newItems[i].id;
      var reader = new FileReader();
      reader.onload = function(ev) {
        Promise.resolve(parseReferralToQueue(qid, ev.target.result))
          .finally(decrementPending);
      };
      reader.onerror = function() {
        setParseQueue(function(q){
          return q.map(function(item){
            return item.id === qid ? Object.assign({}, item, { status: "error", error: "Read failed" }) : item;
          });
        });
        decrementPending();
      };
      reader.readAsDataURL(file);
    });

    e.target.value = "";
  }

    var now = Date.now();

  async function parseReferralToQueue(queueId, base64Data) {
    if (!sheetUrl) {
      setParseQueue(function(q){
        return q.map(function(item){
          return item.id === queueId ? Object.assign({}, item, { status: "error", error: "No script URL" }) : item;
        });
      });
      return;
    }
    try {
      var resp = await fetch(sheetUrl, {
        method: "POST",
        body: JSON.stringify({ _action: "parseReferralPhoto", imageData: base64Data })
      });
      var result = await resp.json();
      if (result.status === "ok" && result.parsed) {
        var p = result.parsed;
        // Format validation: phone must be 10-11 digits
        var formatWarnings = [];
        if (p.phone && !isValidPhone(p.phone)) formatWarnings.push("Phone number doesn't look right: " + p.phone);
        // Member ID sanity: flag if it contains '?' (model couldn't read a character)
        if (p.memberIdPrimary && p.memberIdPrimary.indexOf("?") >= 0) formatWarnings.push("Primary member ID has unreadable characters: " + p.memberIdPrimary);
        if (p.memberIdSecondary && p.memberIdSecondary.indexOf("?") >= 0) formatWarnings.push("Secondary member ID has unreadable characters: " + p.memberIdSecondary);
        // Medicare MBI format check: if insurance is traditional Medicare but the
        // member ID doesn't match CMS's MBI pattern, the parse is probably wrong
        // OR the insurance name was misidentified. Either way, MA should verify
        // before adding. Doesn't fire for Medicare Advantage plans (they use
        // their own ID format, not MBI).
        if (isMedicareTraditional(p.insurancePrimary) && p.memberIdPrimary && !isValidMBI(p.memberIdPrimary)) {
          formatWarnings.push("Member ID doesn't look like a Medicare MBI — verify with patient or referrer");
        }
        if (isMedicareTraditional(p.insuranceSecondary) && p.memberIdSecondary && !isValidMBI(p.memberIdSecondary)) {
          formatWarnings.push("Secondary member ID doesn't look like a Medicare MBI — verify");
        }
        // Payer classification
        var payerTier = classifyPayer(p.insurancePrimary, p.insuranceSecondary);
        setParseQueue(function(q){
          return q.map(function(item){
            return item.id === queueId
              ? Object.assign({}, item, { status: "parsed", parsed: p, formatWarnings: formatWarnings, payerTier: payerTier })
              : item;
          });
        });
      } else {
        setParseQueue(function(q){
          return q.map(function(item){
            return item.id === queueId ? Object.assign({}, item, { status: "error", error: result.message || "parse failed" }) : item;
          });
        });
      }
    } catch(e) {
      setParseQueue(function(q){
        return q.map(function(item){
          return item.id === queueId ? Object.assign({}, item, { status: "error", error: e.toString() }) : item;
        });
      });
    }
  }

  function skipFromQueue(queueId) {
    setParseQueue(function(q){ return q.filter(function(item){ return item.id !== queueId; }); });
  }

  async function parseTranscript() {
    if (!transcript.trim()) { flash("Paste a transcript first", "err"); return; }
    if (!sheetUrl) { flash("Set Google Apps Script URL in settings first", "err"); return; }
    setParsing(true);
    flash("Parsing transcript...");
    try {
      var resp = await fetch(sheetUrl, {
        method: "POST",
        body: JSON.stringify({ _action: "parseTranscript", transcript: transcript })
      });
      var result = await resp.json();
      if (result.status === "ok" && result.parsed) {
        var p = result.parsed;
        // Auto-fill form fields from parsed data
        if (p.age) set("age", p.age);
        if (p.sex) set("sex", p.sex);
        // Demographics
        if (p.patientName && !patientName) setPatientName(p.patientName);
        if (p.dob) set("dob", p.dob);
        if (p.phone) set("phone", p.phone);
        if (p.email) set("email", p.email);
        if (p.address) set("address", p.address);
        if (p.city) set("city", p.city);
        if (p.state) set("state", p.state);
        if (p.zip) set("zip", p.zip);
        // Insurance from referral (will be cross-checked when card is scanned)
        if (p.insuranceName) set("insuranceName", p.insuranceName);
        if (p.memberId) set("memberId", p.memberId);
        if (p.groupNum) set("groupNum", p.groupNum);
        if (p.diabetesType) set("diabetesType", p.diabetesType);
        if (p.diabetesDuration) set("diabetesDuration", p.diabetesDuration);
        if (p.referringProvider) set("referringProvider", p.referringProvider);
        if (p.painRest) set("painRest", p.painRest);
        if (p.painBest) set("painBest", p.painBest);
        if (p.painWorst) set("painWorst", p.painWorst);
        if (p.painDuration) set("painDuration", p.painDuration);
        if (p.painDurationUnit) set("painDurationUnit", p.painDurationUnit);
        if (p.a1c) set("a1c", p.a1c);
        if (p.glucoseControl) set("glucoseControl", p.glucoseControl);
        if (p.medications) set("medications", p.medications);
        if (p.pshx) set("pshx", p.pshx);
        if (p.allergiesOther) set("allergiesOther", p.allergiesOther);
        if (p.neuropathyType) set("neuropathyType", p.neuropathyType);
        if (p.neuropathyDistribution) set("neuropathyDistribution", p.neuropathyDistribution);
        if (p.socialTob) set("socialTob", p.socialTob);
        if (p.socialEtOH) set("socialEtOH", p.socialEtOH);
        if (p.socialSubstance) set("socialSubstance", p.socialSubstance);
        if (p.srWounds) set("srWounds", p.srWounds);
        if (p.srWoundsLocation) set("srWoundsLocation", p.srWoundsLocation);
        if (p.srBalance) set("srBalance", p.srBalance);
        if (p.srBalanceDetail) set("srBalanceDetail", p.srBalanceDetail);
        if (p.srSwelling) set("srSwelling", p.srSwelling);
        if (p.srSwellingLocation) set("srSwellingLocation", p.srSwellingLocation);
        if (p.srBreathing) set("srBreathing", p.srBreathing);
        if (p.srBreathingDetail) set("srBreathingDetail", p.srBreathingDetail);
        if (p.srHeartAwareness) set("srHeartAwareness", p.srHeartAwareness);
        if (p.srHeartAwarenessDetail) set("srHeartAwarenessDetail", p.srHeartAwarenessDetail);
        if (p.srRhythm) set("srRhythm", p.srRhythm);
        if (p.srRhythmDetail) set("srRhythmDetail", p.srRhythmDetail);
        // Arrays: pain descriptors, pmhx, prior tx, allergies, contraindications, functional limitations
        // Strict Array.isArray check: Haiku occasionally returns comma-separated strings instead
        // of arrays for these fields. Accept only actual arrays; silently ignore string fallbacks.
        if (Array.isArray(p.painDescriptors) && p.painDescriptors.length) setForm(function(f) { return Object.assign({}, f, { painDescriptors: p.painDescriptors }); });
        if (Array.isArray(p.pmhx) && p.pmhx.length) setForm(function(f) { return Object.assign({}, f, { pmhx: p.pmhx }); });
        if (Array.isArray(p.priorTx) && p.priorTx.length) setForm(function(f) { return Object.assign({}, f, { priorTx: p.priorTx }); });
        if (Array.isArray(p.allergies) && p.allergies.length) setForm(function(f) { return Object.assign({}, f, { allergies: p.allergies }); });
        if (Array.isArray(p.contraindications) && p.contraindications.length) setForm(function(f) { return Object.assign({}, f, { contraindications: p.contraindications }); });
        if (Array.isArray(p.functionalLimitations) && p.functionalLimitations.length) setForm(function(f) { return Object.assign({}, f, { functionalLimitations: p.functionalLimitations }); });
        // Free text fields
        if (p.painNotes) set("painNotes", p.painNotes);
        if (p.txNotes) set("txNotes", p.txNotes);
        if (p.pmhxNotes) set("pmhxNotes", p.pmhxNotes);
        if (p.socialNotes) set("socialNotes", p.socialNotes);
        flash("Parsed! Review and correct the fields below.");
      } else {
        flash("Parse failed: " + (result.message || "unknown error"), "err");
      }
    } catch(e) {
      flash("Parse failed: " + e.toString(), "err");
    }
    setParsing(false);
  }

  function saveDraft() {
    if (!form.patientId) { flash("Enter Patient ID", "err"); return; }
    // Embed patientName INTO draftData (not just on network payload). This is the
    // fix for the "next-visit loses patient name" bug: the local copy in drafts
    // (localStorage) had no name, so cross-session reloads on the same device
    // showed "[Name]" in generated notes until the user retyped it. Now any path
    // that reads a draft gets the name back.
    var draftData = Object.assign({}, form, { savedAt: new Date().toISOString(), patientName: patientName });
    // Save locally
    var updated = Object.assign({}, drafts);
    updated[form.patientId] = draftData;
    setDrafts(updated);
    storage.set(DRAFTS_KEY, JSON.stringify(updated));
    // Save to cloud
    if (sheetUrl) {
      var cloudData = Object.assign({}, draftData, { _action: "saveDraft" });
      fetch(sheetUrl, { method: "POST", mode: "no-cors", body: JSON.stringify(cloudData) })
        .then(function() { flash("Draft saved locally + cloud"); })
        .catch(function() { flash("Draft saved locally (cloud failed)", "warn"); });
    } else {
      flash("Draft saved locally");
    }
  }

  // Silent auto-save: fires on form changes, debounced, no flash messages
  // ----- Referral correction sync -----
  // When an intake came from a referral (form.referralRowIndex set), demographic
  // edits in the intake form are pushed back to that throughput row via the
  // backend's updateReferralCorrections action. Without this, an MA correcting
  // a misparsed phone number in the intake updates the local draft and the
  // submitted Sheet1 row but NOT the throughput row that the referral card
  // reads from — so the card keeps showing the wrong number, and Floyd's
  // eligibility lookups use the wrong member ID.
  //
  // Strategy: track the last-synced snapshot in a ref (no re-renders), diff
  // against the current form on each autosave, only POST changed fields.
  // Backend rebuilds the notes string surgically (preserves CONTRA: and
  // trailing reason). Initial snapshot is seeded at startIntakeFromReferral
  // and at loadDraft so we don't fire a no-op sync on first autosave.
  const lastReferralSync = useRef({});

  // Tracks the timestamp of the most recent loadDraft completion. Autosave
  // checks this and suppresses for ~3 seconds after a load — without this,
  // loading a draft that's missing some fields (e.g. a partial cloud draft
  // returned without phone-intake fields) causes the form to be populated
  // with defaultState defaults for the missing fields, then the form-changed
  // useEffect schedules an autosave 1.5s later that writes those empty
  // defaults BACK to cloud, destroying any real data that was in those
  // fields. This bug overwrote a clinician's draft mid-clinic and forced
  // them to redo the work — fix is to give the load a quiet window before
  // autosave starts churning again.
  const justLoadedAt = useRef(0);

  // Build the eight correction-eligible fields out of current form + name state.
  function buildReferralCorrectionSnapshot() {
    return {
      patientName: patientName || "",
      dob: form.dob || "",
      phone: form.phone || "",
      referringProvider: form.referringProvider || "",
      insuranceName: form.insuranceName || "",
      memberId: form.memberId || "",
      insuranceName2: form.insuranceName2 || "",
      memberId2: form.memberId2 || ""
    };
  }

  function syncReferralCorrections() {
    if (!form.referralRowIndex || !sheetUrl) return;
    var current = buildReferralCorrectionSnapshot();
    var diff = {};
    for (var k in current) {
      if (current[k] !== (lastReferralSync.current[k] || "")) {
        diff[k] = current[k];
      }
    }
    if (Object.keys(diff).length === 0) return;
    diff._action = "updateReferralCorrections";
    diff.rowIndex = form.referralRowIndex;
    try {
      fetch(sheetUrl, { method: "POST", mode: "no-cors", body: JSON.stringify(diff) });
      // Update snapshot optimistically. If the POST fails silently (no-cors),
      // we won't retry until the next field actually changes again — acceptable
      // tradeoff for not pestering the backend with re-tries.
      Object.assign(lastReferralSync.current, current);
    } catch(e) {
      // Network failure: leave snapshot alone so next autosave retries.
    }
  }

  function autoSaveDraft(scheduledPatientId) {
    if (!form.patientId) return;
    // Belt-and-suspenders against cross-patient leak: if the patient ID changed
    // between when this autosave was scheduled and when it actually fires,
    // bail rather than risk writing under the wrong patient. The useEffect's
    // cleanup function should have already cleared the timer in this case,
    // but if React batched things weirdly or the fire happened mid-flush,
    // this guard catches it.
    if (scheduledPatientId && scheduledPatientId !== form.patientId) return;
    // Suppress autosave in the quiet window after a load. Without this, a
    // partial cloud draft (one missing some intake fields) loads, the form
    // populates missing fields with defaultState empties, and 1.5s later
    // the autosave writes those empties back to cloud — destroying the real
    // data that was in those fields. The 3-second window is long enough
    // for a load to settle but short enough that legitimate user edits
    // (typing into a field shortly after load) aren't suppressed for long.
    if (Date.now() - justLoadedAt.current < 3000) return;
    // Guard: don't overwrite cloud draft with empty form. If the form has no name,
    // no age, no demographics, no clinical content, refuse to save. This prevents
    // data loss when the form is reset (e.g. after submit, after switching patients,
    // after page refresh while a stale patientId lingers).
    var hasContent = patientName || form.age || form.sex || form.dob || form.phone ||
      form.painRest || form.painBest || form.painWorst ||
      form.medications || form.referringProvider ||
      (form.pmhx && form.pmhx.length > 0) ||
      (form.painDescriptors && form.painDescriptors.length > 0) ||
      (form.priorTx && form.priorTx.length > 0);
    if (!hasContent) return;
    // Same fix as saveDraft: embed name into the persisted object, not just network.
    var draftData = Object.assign({}, form, { savedAt: new Date().toISOString(), patientName: patientName });
    var updated = Object.assign({}, drafts);
    updated[form.patientId] = draftData;
    setDrafts(updated);
    try { storage.set(DRAFTS_KEY, JSON.stringify(updated)); } catch(e) {}
    if (sheetUrl) {
      var cloudData = Object.assign({}, draftData, { _action: "saveDraft" });
      try {
        fetch(sheetUrl, { method: "POST", mode: "no-cors", body: JSON.stringify(cloudData) });
        setLastAutoSave(new Date());
      } catch(e) {}
    }
    // After the draft is saved, push any demographic/insurance corrections
    // back to the source throughput row. No-op when this intake didn't come
    // from a referral (form.referralRowIndex empty).
    syncReferralCorrections();
  }

  // Debounced auto-save effect. Intentionally depends only on form, not patientName:
  // patientName is included inside the save payload but shouldn't trigger saves by itself.
  // This prevents post-submit setPatientName("") from firing a stale autosave.
  //
  // Captures form.patientId at schedule time and passes it to autoSaveDraft.
  // If the patient changes between schedule and fire (because the user rapidly
  // loaded a different patient), the cleanup below clears the timer AND the
  // captured-patientId guard inside autoSaveDraft ensures we don't write to
  // the new patient's row with the previous patient's data.
  useEffect(function() {
    if (!form.patientId) return;
    var capturedPid = form.patientId;
    var t = setTimeout(function() { autoSaveDraft(capturedPid); }, 1500);
    return function() { clearTimeout(t); };
  }, [form]);

  async function loadDraft(optionalId) {
    var pid = (typeof optionalId === "string" && optionalId) ? optionalId : form.patientId;
    if (!pid) { flash("Enter Study ID to load", "err"); return; }
    var draftData = null;

    // Try cloud first
    if (sheetUrl) {
      try {
        flash("Loading from cloud...");
        var url = sheetUrl + "?action=loadDraft&id=" + encodeURIComponent(pid);
        var resp = await fetch(url, { redirect: "follow" });
        var result = await resp.json();
        if (result.status === "ok" && result.draft) {
          draftData = result.draft;
          if (result.source === "sheet1_fallback") {
            flash("Loaded from Sheet1 (no draft found, using last submitted visit)", "warn");
          }
        } else if (result.status === "not_found") {
          flash("No cloud draft for " + pid, "warn");
        } else {
          flash("Cloud err: " + (result.message || result.status), "err");
        }
      } catch(e) { flash("Fetch failed: " + e.toString(), "err"); }
    }

    // Fall back to local
    if (!draftData) {
      draftData = drafts[pid];
    }

    if (!draftData) {
      // No draft found anywhere. Don't leave the previous patient's data
      // visible in the form — that's the cross-patient-leak symptom MAs
      // reported in clinic. Reset to a clean form labeled with the requested
      // patientId so the user knows which patient they're entering data for,
      // but no fields are pre-populated with stale data.
      flash("No draft found for " + pid + " — starting fresh", "warn");
      setForm(Object.assign({}, defaultState, { date: todayLocal(), patientId: pid }));
      setPatientName("");
      // Reset the referral-corrections snapshot too so the next sync diffs
      // against blank, not against the previous patient's values.
      lastReferralSync.current = {
        patientName: "", dob: "", phone: "", referringProvider: "",
        insuranceName: "", memberId: "", insuranceName2: "", memberId2: ""
      };
      // Stamp the load attempt so autosave suppresses for 3 seconds —
      // otherwise the form-reset above would trigger an immediate autosave
      // that writes empties to cloud.
      justLoadedAt.current = Date.now();
      return;
    }

    // Build the loaded form state.
    //
    // CRITICAL: start from defaultState, then layer draftData on top. Without
    // this, fields that aren't present in draftData end up undefined on the
    // form object — and React treats inputs with `value={undefined}` as
    // UNCONTROLLED, meaning the DOM keeps whatever text it had displayed
    // before. That was the cross-patient-leak bug surfaced in clinic: when
    // patient B's draft didn't contain a field that patient A's form had
    // displayed, B's load left A's text visible in that field. The user
    // sees A's data in B's record, may trust it, may submit it. Clinical
    // safety bug.
    //
    // Starting from defaultState forces every field to a defined value
    // (empty string, empty array, or the documented default). React then
    // treats every input as controlled, and the swap is clean.
    //
    // The explicit array overrides below are belt-and-suspenders — defaultState
    // already provides Array(12).fill(false) for the foot grids etc., but
    // legacy drafts saved before some fields existed may still show up here
    // and the explicit defaults guarantee correct types.
    var loaded = Object.assign({}, defaultState, draftData, {
      date: todayLocal(),
      // Defensive: arrays that may be missing from Sheet1 fallback or old drafts
      allergies: (draftData && draftData.allergies) || [],
      functionalLimitations: (draftData && draftData.functionalLimitations) || [],
      pmhx: (draftData && draftData.pmhx) || [],
      priorTx: (draftData && draftData.priorTx) || [],
      painDescriptors: (draftData && draftData.painDescriptors) || [],
      dxCodes: (draftData && draftData.dxCodes) || [],
      contraindications: (draftData && draftData.contraindications) || [],
      // Sensory arrays: defensive defaults if missing from old drafts, but preserve any saved values
      leftFootPre: (draftData && draftData.leftFootPre) || Array(12).fill(false),
      leftFootPost: (draftData && draftData.leftFootPost) || Array(12).fill(false),
      rightFootPre: (draftData && draftData.rightFootPre) || Array(12).fill(false),
      rightFootPost: (draftData && draftData.rightFootPost) || Array(12).fill(false),
    });
    setForm(loaded);
    // Seed the referral-corrections snapshot from the loaded draft. If this
    // intake originally came from a referral, draft has referralRowIndex AND
    // the demographic fields as they were last saved — we treat those as the
    // baseline so subsequent edits diff against them, not against blank.
    // If draft came from a manual D0 (no referralRowIndex), syncReferralCorrections
    // will be a no-op anyway, so seeding is harmless.
    lastReferralSync.current = {
      patientName: (draftData && draftData.patientName) || "",
      dob: loaded.dob || "",
      phone: loaded.phone || "",
      referringProvider: loaded.referringProvider || "",
      insuranceName: loaded.insuranceName || "",
      memberId: loaded.memberId || "",
      insuranceName2: loaded.insuranceName2 || "",
      memberId2: loaded.memberId2 || ""
    };
    // Also save to local drafts keyed by the patientId we just loaded (pid),
    // not form.patientId — form.patientId is stale because setForm is async
    // and hasn't applied the new patientId yet at this point.
    var updated = Object.assign({}, drafts);
    updated[pid] = draftData;
    setDrafts(updated);
    storage.set(DRAFTS_KEY, JSON.stringify(updated));
    // Auto-fill name from directory. BUG FIX: previously used form.patientId
    // which was stale (still the previous patient) because setForm above is
    // async. Use pid (the argument/resolved ID) instead. Without this, clicking
    // Open Draft on a different patient loaded that patient's intake data but
    // displayed the PREVIOUSLY-viewed patient's name in the header, which is
    // dangerous in a clinical workflow — MA could be writing notes on Mr. X
    // while thinking they're on Mrs. Y.
    //
    // Fallback chain: directory → draft's own patientName field → blank
    // (rather than carry over prior patient's name). The draft's patientName
    // field is authoritative because it was set at draft creation time; the
    // directory is a cache that may be stale.
    var dirEntry = directory.find(function(e) { return e.id === pid; });
    if (dirEntry) {
      setPatientName(dirEntry.name);
    } else if (draftData && draftData.patientName) {
      setPatientName(draftData.patientName);
    } else {
      // No name source available. Clear rather than keep the previous patient's
      // name visible — a blank field is a clear signal that something's missing,
      // whereas a stale name is an actively misleading display.
      setPatientName("");
    }
    // Stamp the load time. autoSaveDraft suppresses for 3 seconds after this,
    // preventing the post-load autosave from writing defaults over real data
    // for any field that the loaded draft was missing.
    justLoadedAt.current = Date.now();
    flash("Loaded " + pid);
  }

  function getDraftList() { return Object.keys(drafts); }

  // Photo functions
  function capturePhoto(photoType) {
    var pid = photoPatientId || form.patientId;
    if (!pid) { flash("Enter a Patient ID first", "err"); return; }
    // Signature types open the signature modal instead of camera
    if (photoType === "signature_patient" || photoType === "signature_witness") {
      setSigModalType(photoType);
      setTimeout(function() {
        var canvas = document.getElementById("sig-canvas");
        if (canvas) {
          var ctx = canvas.getContext("2d");
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.strokeStyle = "#000000";
          ctx.lineWidth = 2.5;
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
        }
      }, 50);
      return;
    }
    var input = document.createElement("input");
    input.type = "file"; input.accept = "image/*";
    input.onchange = function(e) {
      var file = e.target.files[0]; if (!file) return;
      var reader = new FileReader();
      reader.onload = function(ev) {
        var img = new Image();
        img.onload = function() {
          var canvas = document.createElement("canvas");
          var maxDim = 1200; var w = img.width; var h = img.height;
          if (w > maxDim || h > maxDim) { if (w > h) { h = h*maxDim/w; w = maxDim; } else { w = w*maxDim/h; h = maxDim; } }
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          var compressed = canvas.toDataURL("image/jpeg", 0.7);
          var newPhoto = { id: Date.now(), patientId: pid, type: photoType, timestamp: new Date().toISOString(), data: compressed };
          // Remove any existing photo of this type for this patient (re-capture overwrites)
          var filtered = photos.filter(function(p){ return !(p.patientId === pid && p.type === photoType); });
          var updated = filtered.concat([newPhoto]);
          setPhotos(updated);
          try { storage.set(PHOTOS_KEY, JSON.stringify(updated)); } catch(e) { flash("Storage full", "warn"); }
          var matched = PHOTO_TYPES.find(function(t){return t.key===photoType});
          flash((matched ? matched.label : photoType) + " captured");
          // Auto-parse Medicare card and device sticker
          if (photoType === "medicare") {
            parseMedicareCard(compressed, false);
          } else if (photoType === "medicare_secondary") {
            parseMedicareCard(compressed, true);
          } else if (photoType === "serial") {
            parseDeviceSticker(compressed, "device");
          } else if (photoType === "needles") {
            parseDeviceSticker(compressed, "needles");
          }
        };
        img.onerror = function() { flash("Photo decode failed, try capturing again", "err"); };
        img.src = ev.target.result;
      };
      reader.onerror = function() { flash("Failed to read photo file, try again", "err"); };
      reader.readAsDataURL(file);
    };
    input.click();
  }

  function getSigCoords(e, canvas) {
    var rect = canvas.getBoundingClientRect();
    var scaleX = canvas.width / rect.width;
    var scaleY = canvas.height / rect.height;
    var clientX, clientY;
    if (e.touches && e.touches.length > 0) {
      clientX = e.touches[0].clientX;
      clientY = e.touches[0].clientY;
    } else {
      clientX = e.clientX;
      clientY = e.clientY;
    }
    return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
  }

  function sigStart(e) {
    e.preventDefault();
    setSigDrawing(true);
    var canvas = document.getElementById("sig-canvas");
    if (!canvas) return;
    var ctx = canvas.getContext("2d");
    var pos = getSigCoords(e, canvas);
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
  }

  function sigMove(e) {
    if (!sigDrawing) return;
    e.preventDefault();
    var canvas = document.getElementById("sig-canvas");
    if (!canvas) return;
    var ctx = canvas.getContext("2d");
    var pos = getSigCoords(e, canvas);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
  }

  function sigEnd(e) {

  function sigSave() {
    var canvas = document.getElementById("sig-canvas");
    if (!canvas) return;
    // Check if canvas is blank
    var ctx = canvas.getContext("2d");
    var pixels = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
    var hasInk = false;
    for (var i = 0; i < pixels.length; i += 4) {
      if (pixels[i] < 250 || pixels[i+1] < 250 || pixels[i+2] < 250) { hasInk = true; break; }
    }
    if (!hasInk) { flash("Sign first", "err"); return; }
    var dataUrl = canvas.toDataURL("image/jpeg", 0.85);

    // Consent signatures go to temp state, not photos
    if (sigModalType === "consent_patient") {
      setConsentSigs(function(s) { return Object.assign({}, s, { patient: dataUrl }); });
      setSigModalType(null);
      flash("Patient signature captured");
      return;
    }
    if (sigModalType === "consent_witness") {
      setConsentSigs(function(s) { return Object.assign({}, s, { witness: dataUrl }); });
      setSigModalType(null);
      flash("Witness signature captured");
      return;
    }

    // Regular signature photos
    var pid = photoPatientId || form.patientId;
    if (!pid) { flash("No Patient ID", "err"); return; }
    var newPhoto = { id: Date.now(), patientId: pid, type: sigModalType, timestamp: new Date().toISOString(), data: dataUrl };
    var updated = photos.concat([newPhoto]);
    setPhotos(updated);
    try { storage.set(PHOTOS_KEY, JSON.stringify(updated)); } catch(e) { flash("Storage full", "warn"); }
    var matched = PHOTO_TYPES.find(function(t){return t.key===sigModalType});
    flash((matched ? matched.label : "Signature") + " saved");
    setSigModalType(null);
  }

  // Composite consent = title + acknowledgment + two signatures + timestamp, rendered as one image
  function saveConsent() {
    var pid = form.patientId;
    if (!pid) { flash("No Patient ID", "err"); return; }
    if (!currentConsent) return;
    var consent = CONSENTS.find(function(c){return c.key===currentConsent});
    if (!consent) return;
    if (!consentSigs.patient) { flash("Patient signature required", "err"); return; }
    if (!consentSigs.witness) { flash("Witness signature required", "err"); return; }
    if (!consentSigs.witnessName.trim()) { flash("Witness name required", "err"); return; }

    // ---- Render full consent text onto a tall canvas with signatures at the bottom ----
    // Approach: measure and wrap body text line-by-line at 820px wide (900px canvas - 80px padding),
    // compute total height, draw everything, then the signature section, then save as one tall JPEG.
    var canvasWidth = 900;
    var padX = 40;
    var contentWidth = canvasWidth - (padX * 2);
    var lineHeight = 20;
    var bodyFont = "14px Arial";
    var titleFont = "bold 22px Arial";
    var headerFont = "14px Arial";

    // Offscreen context just for measuring
    var measureCanvas = document.createElement("canvas");
    var mctx = measureCanvas.getContext("2d");
    mctx.font = bodyFont;

    function wrapLine(text, maxWidth) {
      var words = text.split(" ");
      var lines = [];
      var current = "";
      for (var i = 0; i < words.length; i++) {
        var test = current ? current + " " + words[i] : words[i];
        if (mctx.measureText(test).width > maxWidth && current) {
          lines.push(current);
          current = words[i];
        } else {
          current = test;
        }
      }
      if (current) lines.push(current);
      return lines;
    }

    // Build all wrapped lines for the body
    var bodyLines = [];
    var paragraphs = consent.body.split("\n");
    for (var p = 0; p < paragraphs.length; p++) {
      if (paragraphs[p] === "") {
        bodyLines.push(""); // blank line
      } else {
        var wrapped = wrapLine(paragraphs[p], contentWidth);
        for (var w = 0; w < wrapped.length; w++) bodyLines.push(wrapped[w]);
      }
    }

    // Compute total canvas height: header (130px) + body + signature block (280px) + footer (60px)
    var headerHeight = 130;
    var bodyHeight = bodyLines.length * lineHeight + 20;
    var sigBlockHeight = 280;
    var footerHeight = 60;
    var totalHeight = headerHeight + bodyHeight + sigBlockHeight + footerHeight;

    var canvas = document.createElement("canvas");
    canvas.width = canvasWidth;
    canvas.height = totalHeight;
    var ctx = canvas.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Header
    ctx.fillStyle = "#000000";
    ctx.font = titleFont;
    ctx.fillText(consent.title, padX, 40);
    ctx.font = headerFont;
    ctx.fillText("Diabetic Nerve Clinic", padX, 65);
    ctx.fillText("Study ID: " + pid, padX, 85);
    ctx.fillText("Date: " + new Date().toLocaleString(), padX, 105);
    // Horizontal rule
    ctx.strokeStyle = "#cccccc";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(padX, 120);
    ctx.lineTo(canvasWidth - padX, 120);
    ctx.stroke();

    // Body text
    ctx.font = bodyFont;
    ctx.fillStyle = "#000000";
    var y = headerHeight + 10;
    for (var bl = 0; bl < bodyLines.length; bl++) {
      ctx.fillText(bodyLines[bl], padX, y);
      y += lineHeight;
    }

    // Signature section
    var sigY = headerHeight + bodyHeight + 20;
    ctx.strokeStyle = "#cccccc";
    ctx.beginPath();
    ctx.moveTo(padX, sigY);
    ctx.lineTo(canvasWidth - padX, sigY);
    ctx.stroke();

    ctx.fillStyle = "#000000";
    ctx.font = "bold 14px Arial";
    ctx.fillText("SIGNATURES", padX, sigY + 25);

    // Patient sig box
    ctx.fillStyle = "#666666";
    ctx.font = "12px Arial";
    ctx.fillText("PATIENT SIGNATURE", padX, sigY + 50);
    ctx.strokeStyle = "#999999";
    ctx.strokeRect(padX, sigY + 60, 380, 160);

    // Witness sig box
    ctx.fillText("WITNESS SIGNATURE", 470, sigY + 50);
    ctx.strokeRect(470, sigY + 60, 380, 160);
    ctx.fillStyle = "#000000";
    ctx.font = "13px Arial";
    ctx.fillText("Witness: " + consentSigs.witnessName, 470, sigY + 245);

    var patientImg = new Image();
    patientImg.onerror = function() { flash("Patient signature image failed to load, try re-signing", "err"); };
    patientImg.onload = function() {
      ctx.drawImage(patientImg, padX, sigY + 60, 380, 160);

      var witnessImg = new Image();
      witnessImg.onerror = function() { flash("Witness signature image failed to load, try re-signing", "err"); };
      witnessImg.onload = function() {
        ctx.drawImage(witnessImg, 470, sigY + 60, 380, 160);

        // Footer
        var footY = sigY + sigBlockHeight;
        ctx.fillStyle = "#000000";
        ctx.font = "11px Arial";
        ctx.fillText("Diabetic Nerve Clinic — Signed electronically at the time of visit", padX, footY + 20);
        ctx.fillText("This document constitutes informed consent for the topics described above.", padX, footY + 38);

        // Save as photo (higher quality than before since this is a legal doc)
        var dataUrl = canvas.toDataURL("image/jpeg", 0.9);
        var newPhoto = { id: Date.now(), patientId: pid, type: consent.photoType, timestamp: new Date().toISOString(), data: dataUrl };
        // Remove any existing consent of this type to prevent duplicates on re-sign
        var filtered = photos.filter(function(ph){ return !(ph.patientId === pid && ph.type === consent.photoType); });
        var updated = filtered.concat([newPhoto]);
        setPhotos(updated);
        try { storage.set(PHOTOS_KEY, JSON.stringify(updated)); } catch(e) { flash("Storage full", "warn"); }
        flash(consent.title + " signed and saved");
        setCurrentConsent(null);
        setConsentSigs({ patient: null, witness: null, witnessName: "" });
        setScrolledToBottom(false);
      };
      witnessImg.src = consentSigs.witness;
    };
    patientImg.src = consentSigs.patient;
  }
