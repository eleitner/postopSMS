        var matched = PHOTO_TYPES.find(function(t){return t.key===p.type}) || {};
        html += "<div style=\"font-family:Arial,sans-serif;font-size:10px;color:#666;margin-top:8px;\">" + (matched.label || p.type) + " - " + new Date(p.timestamp).toLocaleString() + "</div>";
        html += "<img src=\"" + p.data + "\" style=\"max-width:400px;margin:4px 0 12px 0;\" />";
      });
    }
    return html;
  }

  async function copyNoteWithPhotos() {
    var pid = form.patientId;
    var patientPhotos = pid ? getPhotosForPatient(pid) : [];
    // Only include photos for D0
    if (form.visitType === "D0" && patientPhotos.length > 0) {
      try {
        var html = generateNoteHtml();
        var blob = new Blob([html], { type: "text/html" });
        var textBlob = new Blob([generateNote()], { type: "text/plain" });
        await navigator.clipboard.write([
          new ClipboardItem({
            "text/html": blob,
            "text/plain": textBlob
          })
        ]);
        flash("Copied note + " + patientPhotos.length + " photos");
        return;
      } catch(e) {}
    }
    try { await navigator.clipboard.writeText(generateNote()); flash("Copied note"); } catch(e) { flash("Copy failed", "err"); }
  }

  function saveSheetUrl() { storage.set(SHEET_URL_KEY, sheetUrl); flash("Sheet URL saved"); setShowConfig(false); }

  function exportCSV() {
    if (!records.length) return;
    var headers = Object.keys(records[0]).filter(function(k){return k!=="id"});
    var csv = [headers.join(",")].concat(records.map(function(r){return headers.map(function(h){return '"'+String(r[h]||"").replace(/"/g,'""')+'"'}).join(",")})).join("\n");
    var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
    a.download = "dpn_data_" + todayLocal() + ".csv"; a.click();
  }

  function clearAll() { if(confirm("Delete all saved records?")){ storage.delete(STORAGE_KEY); setRecords([]); } }
  function resetForm() { setForm(Object.assign({}, defaultState, { date: todayLocal() })); setFormSection("intake"); setPatientName(""); }

  var ic = "w-full border border-gray-300 rounded px-2 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-blue-400";
  var lc = "block text-xs font-medium text-gray-600 mb-0.5";

  // Chip toggle helper
  function Chip(props) {
    var active = props.selected;
    return <button onClick={props.onClick}
      className={"text-xs py-1 px-2 rounded-full border mr-1 mb-1 " + (active ? "bg-blue-500 text-white border-blue-500" : "bg-white text-gray-600 border-gray-300")}>
      {props.label}
    </button>;
  }

  var draftList = getDraftList();

  return (
    <div className="max-w-lg mx-auto bg-white min-h-screen">
      <div className="flex border-b border-gray-200 sticky top-0 bg-white z-10">
        {(function() {
          var tabs = [["referrals","Referrals"],["consent","Consent"],["form","Assess"],["photos","Photos"],["note","Note"],["records","Data"]];
          if (userProfile && String(userProfile.role).toLowerCase() === "physician") {
            tabs.push(["cosign","Cosign" + (cosignQueue.length ? " (" + cosignQueue.length + ")" : "")]);
          }
          return tabs.map(function(item) {
            var v = item[0], l = item[1];
            return <button key={v} onClick={function(){setView(v)}} className={"flex-1 min-w-0 px-1 py-2.5 text-xs font-medium truncate " + (view===v ? "text-blue-600 border-b-2 border-blue-600" : "text-gray-500")}>{l}</button>;
          });
        })()}
        <button onClick={function(){setShowSettings(true)}} className="px-1.5 py-2.5 text-gray-400 text-sm" title="Profile settings">⚙</button>
        <button onClick={function(){setShowConfig(!showConfig)}} className="px-1.5 py-2.5 text-gray-400 text-sm">{showConfig ? "X" : "+"}</button>
      </div>

      {showConfig && (
        <div className="p-3 bg-yellow-50 border-b border-yellow-200 space-y-3">
          <div>
            <label className={lc}>Google Apps Script URL</label>
            <input className={ic} value={sheetUrl} onChange={function(e){setSheetUrl(e.target.value)}} placeholder="https://script.google.com/macros/s/.../exec" />
            <button onClick={saveSheetUrl} className="mt-2 px-3 py-1 bg-yellow-500 text-white text-xs rounded">Save URL</button>
          </div>
          <div className="border-t border-yellow-300 pt-3">
            <div className="text-xs font-semibold text-gray-600 mb-2">PATIENT DIRECTORY (local only, never exported)</div>
            <div className="flex gap-1 mb-2">
              <input className={ic} value={dirName} onChange={function(e){setDirName(e.target.value)}} placeholder="Patient name" />
              <input className={ic + " w-28"} value={dirId} onChange={function(e){setDirId(e.target.value)}} placeholder="DNC-XXXX" />
              <button onClick={addToDirectory} className="px-2 py-1 bg-blue-500 text-white text-xs rounded whitespace-nowrap">Add</button>
            </div>
            {directory.length > 0 && (
              <div>
                <input className={ic + " mb-2"} value={dirSearch} onChange={function(e){setDirSearch(e.target.value)}} placeholder="Search name or ID..." />
                <div className="max-h-40 overflow-y-auto space-y-1">
                  {getFilteredDirectory().map(function(d, i) { return (
                    <div key={i} className="flex justify-between items-center bg-white rounded px-2 py-1.5 border border-gray-200">
                      <button onClick={function(){selectFromDirectory(d.id, d.name)}} className="text-xs text-left flex-1">
                        <span className="font-medium text-gray-700">{d.name}</span>
                        <span className="text-blue-500 ml-2">{d.id}</span>
                      </button>
                      <button onClick={function(){removeFromDirectory(i)}} className="text-red-400 text-xs ml-2">X</button>
                    </div>
                  );})}
                </div>
              </div>
            )}
          </div>
        </div>
      )}

      {msg.text && (
        <div className={"px-4 py-2 text-sm font-medium " + (msg.type==="err" ? "bg-red-50 text-red-600" : msg.type==="warn" ? "bg-yellow-50 text-yellow-700" : "bg-green-50 text-green-600")}>{msg.text}</div>
      )}

      {/* ========== REFERRALS TAB ========== */}
      {view === "referrals" && (
        <div className="p-4 space-y-3">
          {/* Role toggle */}
          <div className="flex rounded overflow-hidden border border-gray-200">
            <button onClick={function(){switchRole("ma")}} className={"flex-1 py-2 text-sm font-medium " + (role==="ma" ? "bg-blue-600 text-white" : "bg-gray-50 text-gray-500")}>MA View</button>
            <button onClick={function(){switchRole("clinician")}} className={"flex-1 py-2 text-sm font-medium " + (role==="clinician" ? "bg-blue-600 text-white" : "bg-gray-50 text-gray-500")}>Clinician View</button>
          </div>

          {/* MA: Add Referral */}
          {role === "ma" && (
            <div className="bg-green-50 rounded p-3 border border-green-200 space-y-2">
              <div className="text-xs font-semibold text-green-700">NEW REFERRAL</div>
              <label className="block w-full py-2 bg-blue-600 text-white rounded text-sm font-medium text-center cursor-pointer">
                Snap Referral Sheet(s) — pick one or many
                <input type="file" accept="image/*" multiple onChange={handleReferralPhotoCapture} className="hidden" />
              </label>

              {/* Parse queue (batch mode) */}
              {parseQueue.length > 0 && (
                <div className="bg-white rounded p-2 border border-blue-200 space-y-2">
                  <div className="flex justify-between items-center">
                    <div className="text-xs font-semibold text-blue-700">PARSE QUEUE ({parseQueue.length})</div>
                    <button onClick={function(){setParseQueue([])}} className="text-xs text-gray-400">Clear all</button>
                  </div>
                  {parseQueue.map(function(item) {
                    var p = item.parsed || {};
                    var hasContra = Array.isArray(p.contraindications) && p.contraindications.length > 0;
                    var payerTier = item.payerTier || { tier: "neutral", reason: "" };
                    var formatWarnings = item.formatWarnings || [];
                    // Color precedence: error > contra (red) > payer red > payer yellow > payer green > neutral
                    var cardBorder = item.status === "error" ? "border-red-300 bg-red-50"
                      : item.status === "parsing" ? "border-gray-200 bg-gray-50"
                      : hasContra ? "border-red-400 bg-red-50"
                      : payerTier.tier === "red" ? "border-red-400 bg-red-50"
                      : payerTier.tier === "yellow" ? "border-amber-400 bg-amber-50"
                      : payerTier.tier === "green" ? "border-green-300 bg-green-50"
                      : "border-gray-200 bg-white";
                    return (
                      <div key={item.id} className={"rounded p-2 border " + cardBorder}>
                        {item.status === "parsing" && (
                          <div className="flex justify-between items-center">
                            <div className="text-xs text-gray-500">Parsing {item.fileName}...</div>
                            <button onClick={function(){skipFromQueue(item.id)}} className="text-xs text-gray-400">×</button>
                          </div>
                        )}
                        {item.status === "error" && (
                          <div className="flex justify-between items-center">
                            <div className="text-xs text-red-600">Parse failed: {item.error}</div>
                            <button onClick={function(){skipFromQueue(item.id)}} className="text-xs text-gray-400">×</button>
                          </div>
                        )}
                        {item.status === "parsed" && (
                          <div>
                            {hasContra && (
                              <div className="text-xs font-bold text-red-700 mb-1">‼ NEEDS SPECIALIST CLEARANCE: {p.contraindications.join(", ")}</div>
                            )}
                            {payerTier.tier === "red" && !hasContra && (
                              <div className="text-xs font-bold text-red-700 mb-1">‼ NOT YET APPROVED: {payerTier.reason}</div>
                            )}
                            {payerTier.tier === "yellow" && (
                              <div className="text-xs font-semibold text-amber-700 mb-1">⏱ LONG PREAUTH: {payerTier.reason}</div>
                            )}
                            <div className="font-medium text-sm text-gray-900">{p.name || "(no name)"}</div>
                            <div className="text-xs text-gray-500">{p.phone || "(no phone)"}{p.provider ? " | Ref: " + p.provider : ""}</div>
                            {(p.insurancePrimary || p.memberIdPrimary) && (
                              <div className="text-xs text-gray-500">Ins: {p.insurancePrimary || ""}{p.memberIdPrimary ? " #" + p.memberIdPrimary : ""}</div>
                            )}
                            {(p.insuranceSecondary || p.memberIdSecondary) && (
                              <div className="text-xs text-gray-500">Sec: {p.insuranceSecondary || ""}{p.memberIdSecondary ? " #" + p.memberIdSecondary : ""}</div>
                            )}
                            {(p.referringClinicName || p.referringClinicCity) && (
                              <div className="text-xs text-gray-400">Clinic: {p.referringClinicName || ""}{p.referringClinicCity ? ", " + p.referringClinicCity : ""}{p.referringClinicState ? " " + p.referringClinicState : ""}</div>
                            )}
                            {item.confidence && (function() {
                              var suspects = [];
                              for (var cf in item.confidence) {
                                if (item.confidence[cf] === "suspect_disagreement" || item.confidence[cf] === "suspect_single_pass" || item.confidence[cf] === "format_error") {
                                  var detail = "";
                                  if (item.disagreements) {
                                    var d = item.disagreements.find(function(x){return x.field === cf;});
                                    if (d) detail = " (" + d.pass1 + " vs " + d.pass2 + ")";
                                  }
                                  suspects.push(cf + detail);
                                }
                              }
                              if (!suspects.length) return null;
                              return (
                                <div className="mt-1 bg-yellow-100 border border-yellow-300 rounded p-1.5">
                                  <div className="text-xs font-semibold text-yellow-800 mb-0.5">⚠ Verify — passes disagreed:</div>
                                  {suspects.map(function(s, si) { return <div key={"s"+si} className="text-xs text-yellow-800">{s}</div>; })}
                                </div>
                              );
                            })()}
                            {formatWarnings.length > 0 && (
                              <div className="mt-1 bg-yellow-100 border border-yellow-300 rounded p-1.5">
                                <div className="text-xs font-semibold text-yellow-800 mb-0.5">⚠ Verify before adding:</div>
                                {formatWarnings.map(function(w, i) { return <div key={"f"+i} className="text-xs text-yellow-800">{w}</div>; })}
                              </div>
                            )}
                            <div className="flex gap-2 mt-2">
                              <button onClick={function(){addReferral(false, {queueId: item.id})}} className="flex-1 py-1 bg-green-600 text-white rounded text-xs font-medium">Add</button>
                              <button onClick={function(){skipFromQueue(item.id)}} className="flex-1 py-1 bg-gray-200 text-gray-600 rounded text-xs font-medium">Skip</button>
                            </div>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}

              <div className="text-xs text-gray-500 text-center">Or enter manually below</div>
              <input className={ic} value={newRef.name} onChange={function(e){setNewRef(Object.assign({}, newRef, {name:e.target.value}))}} placeholder="Patient name *" />
              <div className="grid grid-cols-2 gap-2">
                <input className={ic} value={newRef.dob} onChange={function(e){setNewRef(Object.assign({}, newRef, {dob:e.target.value}))}} placeholder="DOB" />
                <input className={ic} value={newRef.phone} onChange={function(e){setNewRef(Object.assign({}, newRef, {phone:e.target.value}))}} placeholder="Phone *" type="tel" />
              </div>
              <input className={ic} value={newRef.provider} onChange={function(e){setNewRef(Object.assign({}, newRef, {provider:e.target.value}))}} placeholder="Referring provider" />
              <input className={ic} value={newRef.notes} onChange={function(e){setNewRef(Object.assign({}, newRef, {notes:e.target.value}))}} placeholder="Notes (optional)" />
              <button onClick={function(){addReferral()}} className="w-full py-2 bg-green-600 text-white rounded text-sm font-medium">Add Referral</button>
            </div>
          )}

          {/* Call List */}
          <div className="flex items-center justify-between">
            <div className="text-sm font-semibold text-gray-700">{role === "clinician" ? "Call List" : "Referrals"} ({referrals.length})</div>
            <button onClick={loadReferrals} className="text-xs text-blue-600 font-medium py-1 px-3 border border-blue-200 rounded">{referralsLoading ? "Loading..." : "Refresh"}</button>
          </div>

          {referrals.length === 0 && !referralsLoading && (
            <div className="text-center text-gray-400 text-sm py-6">No referrals. Tap Refresh to load from database.</div>
          )}

          {(function(){
            // Tighter contra keyword scan (manual entry fallback — Haiku handles photo path)
            // The ICD acronym overlaps with ICD-10/ICD-9 diagnostic coding, so we suppress
            // standalone "icd" matches when coding-system text appears anywhere in notes.
            function detectContraKeywords(notesStr) {
              var lower = notesStr.toLowerCase();
              var hits = [];
              if (lower.indexOf("pacemaker") >= 0) hits.push("pacemaker");
              if (lower.indexOf("defibrillator") >= 0) hits.push("defibrillator");
              if (/\baicd\b/i.test(notesStr)) hits.push("AICD");
              // ICD device only if not in a diagnostic-coding context AND has device context nearby
              var hasCodingMention = /icd[-\s]*(10|9|cm|pcs|code|coding)/i.test(notesStr);
              if (!hasCodingMention && /\bicd\b/i.test(notesStr) && /(implant|device|placement|s\/p|h\/o|history of)/i.test(notesStr)) {
                hits.push("ICD device");
              }
              if (lower.indexOf("loop recorder") >= 0) hits.push("loop recorder");
              if (lower.indexOf("spinal cord stim") >= 0) hits.push("spinal cord stimulator");
              if (lower.indexOf("deep brain stim") >= 0) hits.push("deep brain stimulator");
              if (lower.indexOf("bladder stim") >= 0) hits.push("bladder stimulator");
              if (lower.indexOf("pregnan") >= 0) hits.push("pregnancy");
              if (lower.indexOf("hemophilia") >= 0) hits.push("hemophilia");
              if (lower.indexOf("dementia") >= 0) hits.push("dementia");
              return hits;
            }

            // Classify each referral
            var classified = referrals.map(function(ref) {
              var notesStr = String(ref.notes || "");
              // Contraindication: trust the CONTRA: marker from Haiku, fall back to keyword scan
              var contraMatch = /CONTRA:\s*([^|]+)/i.exec(notesStr);
              var contraText = "";
              if (contraMatch) {
                contraText = contraMatch[1].trim();
              } else {
                var hits = detectContraKeywords(notesStr);
                if (hits.length) contraText = hits.join(", ");
              }
              // Payer classification from Ins:/Sec: prefixes in notes
              var insMatch = /\bIns:\s*([^|#]+)/i.exec(notesStr);
              var secMatch = /\bSec:\s*([^|#]+)/i.exec(notesStr);
              var primaryIns = insMatch ? insMatch[1].trim() : "";
              var secondaryIns = secMatch ? secMatch[1].trim() : "";
              var payerTier = classifyPayer(primaryIns, secondaryIns);
              return { ref: ref, contraText: contraText, hasContra: !!contraText, payerTier: payerTier };
            });
            // Partition: red (contra or red-payer) at bottom; everything else keeps server order
            var nonRed = classified.filter(function(c){ return !c.hasContra && c.payerTier.tier !== "red"; });
            var red = classified.filter(function(c){ return c.hasContra || c.payerTier.tier === "red"; });
            var ordered = nonRed.concat(red);

            return ordered.map(function(c, idx) {
              var ref = c.ref;
              var days = ref.referralDate ? Math.floor((Date.now() - new Date(ref.referralDate).getTime()) / 86400000) : 0;
              var isStale = days >= 2 && !ref.called && !c.hasContra && c.payerTier.tier !== "red";
              var statusColor = ref.status === "Complete" ? "text-green-600" :
                ref.status === "Intake Complete" ? "text-blue-600" :
                (c.hasContra || c.payerTier.tier === "red") ? "text-red-700" :
                isStale ? "text-orange-600" : "text-gray-500";
              // Color precedence: contra (red) > red payer > yellow payer > green payer > neutral
              var cardClass = c.hasContra ? "border-red-400 bg-red-50"
                : c.payerTier.tier === "red" ? "border-red-400 bg-red-50"
                : c.payerTier.tier === "yellow" ? "border-amber-400 bg-amber-50"
                : c.payerTier.tier === "green" ? "border-green-300 bg-green-50"
                : "border-gray-200 bg-white";
              return (
                <div key={idx} className={"rounded border p-3 space-y-1 " + cardClass}>
                  {c.hasContra && (
                    <div className="bg-red-200 text-red-900 rounded px-2 py-1 text-xs font-bold mb-1">
                      ‼ NEEDS SPECIALIST CLEARANCE: {c.contraText}
                    </div>
                  )}
                  {!c.hasContra && c.payerTier.tier === "red" && (
                    <div className="bg-red-200 text-red-900 rounded px-2 py-1 text-xs font-bold mb-1">
                      ‼ NOT YET APPROVED: {c.payerTier.reason}
                    </div>
                  )}
                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-2 flex-1 min-w-0">
                      <div className="font-medium text-sm text-gray-900 truncate">{ref.name || "Unknown"}</div>
                      {!c.hasContra && c.payerTier.tier === "yellow" && (
                        <span className="text-xs bg-amber-200 text-amber-900 px-1.5 py-0.5 rounded font-semibold whitespace-nowrap">⏱ Long preauth</span>
                      )}
                      {!c.hasContra && c.payerTier.tier === "green" && (
                        <span className="text-xs bg-green-200 text-green-900 px-1.5 py-0.5 rounded font-semibold whitespace-nowrap">✓ Medicare</span>
                      )}
                    </div>
                    <div className={"text-xs font-medium ml-2 " + statusColor}>{ref.status || "New"}</div>
                  </div>
                  <div className="flex items-center justify-between">
                    <div className="text-xs text-gray-500">{ref.provider ? "Ref: " + ref.provider : ""}{ref.phone ? " | " + ref.phone : ""}</div>
                    <div className={"text-xs " + (isStale ? "text-orange-600 font-bold" : "text-gray-400")}>{days > 0 ? days + "d ago" : "Today"}</div>
                  </div>
                  {(function(){
                    // Extract Ins: and Sec: lines from notes string for display
                    var notesStr = String(ref.notes || "");
                    var insMatch = /\bIns:\s*([^|]+)/i.exec(notesStr);
                    var secMatch = /\bSec:\s*([^|]+)/i.exec(notesStr);
                    var primary = insMatch ? insMatch[1].trim() : "";
                    var secondary = secMatch ? secMatch[1].trim() : "";
                    if (!primary && !secondary) return null;
                    return (
                      <div className="text-xs text-gray-500 mt-0.5">
                        {primary && <div className="truncate">{primary}</div>}
                        {secondary && <div className="truncate">2°: {secondary}</div>}
                      </div>
                    );
                  })()}
                  {ref.dncId && <div className="text-xs text-blue-500">ID: {ref.dncId}</div>}
                <div className="flex gap-2 pt-1">
                  {!ref.dncId && (
                    <button onClick={function(){startIntakeFromReferral(ref)}}
                      className="flex-1 py-1.5 bg-blue-600 text-white rounded text-xs font-medium">Start Intake</button>
                  )}
                  {ref.dncId && !ref.called && (
                    <button onClick={function(){updateReferralStatus(ref.rowIndex, "called", new Date().toISOString()); flash("Marked as called");}}
                      className="flex-1 py-1.5 bg-yellow-500 text-white rounded text-xs font-medium">Mark Called</button>
                  )}
                  {ref.dncId && (
                    <button onClick={function(){setForm(function(f){return Object.assign({}, f, {patientId: ref.dncId})}); setView("form"); loadDraft(ref.dncId);}}
                      className="flex-1 py-1.5 bg-gray-200 text-gray-700 rounded text-xs font-medium">Open Draft</button>
                  )}
                  <button onClick={function(){
                    var reason = prompt("Remove " + (ref.name || "this referral") + " from list?\n\nEnter reason (e.g. Withdrawn, Wrong patient, Duplicate, Patient seen elsewhere):");
                    if (reason && reason.trim()) {
                      updateReferralStatus(ref.rowIndex, "status", "Removed: " + reason.trim());
                      flash("Removed from list");
                    }
                  }} className="px-2 py-1.5 bg-red-50 text-red-500 rounded text-xs font-medium">×</button>
                </div>
                {ref.dncId && (
                  <div className="flex gap-1 pt-1 border-t border-gray-100 mt-1">
                    <span className="text-xs text-gray-400 py-1 mr-1">Billing:</span>
                    {!ref.medicareSubmitted ? (
                      <button onClick={function(){updateReferralStatus(ref.rowIndex, "medicareSubmitted", new Date().toISOString()); flash("Marked submitted to Medicare");}}
                        className="py-1 px-2 bg-purple-50 text-purple-700 rounded text-xs font-medium">Mark Submitted</button>
                    ) : !ref.reimbursement ? (
                      <React.Fragment>
                        <span className="text-xs text-purple-600 py-1">Submitted ✓</span>
                        <button onClick={function(){
                          var amt = prompt("Reimbursement amount (e.g. $4500):");
                          if (amt && amt.trim()) {
                            updateReferralStatus(ref.rowIndex, "reimbursement", amt.trim());
                            updateReferralStatus(ref.rowIndex, "status", "Complete");
                            flash("Marked reimbursed: " + amt.trim());
                          }
                        }} className="py-1 px-2 bg-green-50 text-green-700 rounded text-xs font-medium">Reimbursed</button>
                        <button onClick={function(){
                          var reason = prompt("Denial reason:");
                          if (reason && reason.trim()) {
                            updateReferralStatus(ref.rowIndex, "status", "Denied: " + reason.trim());
                            flash("Marked denied");
                          }
                        }} className="py-1 px-2 bg-red-50 text-red-600 rounded text-xs font-medium">Denied</button>
                      </React.Fragment>
                    ) : (
                      <span className="text-xs text-green-600 py-1">Reimbursed: {ref.reimbursement} ✓</span>
                    )}
                  </div>
                )}
              </div>
            );
          });
          })()}
        </div>
      )}

      {/* ========== CONSENT TAB ========== */}
      {view === "consent" && (
        <div className="p-4 space-y-3">
          <div>
            <label className={lc}>Patient (load from Assess tab or enter ID)</label>
            <input className={ic} value={form.patientId} onChange={function(e){set("patientId",e.target.value)}} placeholder="DNC-XXXX" />
            {patientName && <div className="text-xs text-gray-500 mt-1">{patientName}</div>}
          </div>

          {!form.patientId && (
            <div className="text-center text-gray-400 text-sm py-6">Enter Study ID to begin consent</div>
          )}

          {/* Consent list view */}
          {form.patientId && !currentConsent && (
            <div className="space-y-3">
              <div className="text-xs text-gray-500">Tap a consent to review and sign. Patient reads the full text, then patient and witness both sign at the bottom.</div>
              {CONSENTS.map(function(c) {
                var existing = photos.find(function(p){return p.patientId === form.patientId && p.type === c.photoType});
                var signed = !!existing;
                return (
                  <button key={c.key} onClick={function(){setCurrentConsent(c.key); setScrolledToBottom(false); setConsentSigs({patient:null,witness:null,witnessName:""});}}
                    className={"w-full text-left p-4 rounded-lg border-2 " + (signed ? "bg-green-50 border-green-300" : "bg-white border-gray-200")}>
                    <div className="flex items-center justify-between">
                      <div className="font-medium text-gray-800">{c.title}</div>
                      <div className={"text-xs font-semibold " + (signed ? "text-green-600" : "text-gray-400")}>{signed ? "SIGNED ✓" : "Tap to sign"}</div>
                    </div>
                    {signed && <div className="text-xs text-gray-500 mt-1">{new Date(existing.timestamp).toLocaleString()}</div>}
                  </button>
                );
              })}
            </div>
          )}

          {/* Consent detail view */}
          {form.patientId && currentConsent && (function() {
            var consent = CONSENTS.find(function(c){return c.key===currentConsent});
            if (!consent) return null;
            var canSave = scrolledToBottom && consentSigs.patient && consentSigs.witness && consentSigs.witnessName.trim();
            return (
              <div className="space-y-3">
                <button onClick={function(){setCurrentConsent(null)}} className="text-xs text-blue-600">← Back to consents</button>
                <div className="font-bold text-gray-800 text-base">{consent.title}</div>
                <div className="text-xs text-gray-500">Patient: {patientName || form.patientId}</div>

                {/* Scrollable consent body */}
                <div
                  id="consent-body"
                  className="border-2 border-gray-200 rounded bg-gray-50 p-3 text-sm text-gray-700 leading-relaxed whitespace-pre-wrap"
                  style={{maxHeight: "300px", overflowY: "auto"}}
                  onScroll={function(e){
                    var el = e.target;
                    if (el.scrollTop + el.clientHeight >= el.scrollHeight - 20) {
                      setScrolledToBottom(true);
                    }
                  }}>
                  {consent.body}
                </div>
                {!scrolledToBottom && (
                  <div className="text-xs text-orange-600 font-medium">Scroll to bottom to enable signing</div>
                )}
                {scrolledToBottom && (
                  <div className="text-xs text-green-600 font-medium">✓ Consent text reviewed</div>
                )}

                {/* Patient signature */}
                <div className={"rounded border-2 p-3 " + (consentSigs.patient ? "border-green-300 bg-green-50" : "border-gray-200 bg-white")}>
                  <div className="flex items-center justify-between mb-2">
                    <div className="text-sm font-semibold text-gray-700">Patient Signature</div>
                    {consentSigs.patient && <div className="text-xs text-green-600 font-medium">SIGNED ✓</div>}
                  </div>
                  {consentSigs.patient && (
                    <img src={consentSigs.patient} className="w-full h-24 object-contain bg-white border border-gray-200 rounded mb-2" alt="Patient signature" />
                  )}
                  <button
                    onClick={function(){
                      if (!scrolledToBottom) { flash("Scroll through consent text first", "err"); return; }
                      setSigModalType("consent_patient");
                      setTimeout(function() {
                        var canvas = document.getElementById("sig-canvas");
                        if (canvas) {
                          var ctx = canvas.getContext("2d");
                          ctx.fillStyle = "#ffffff";
                          ctx.fillRect(0, 0, canvas.width, canvas.height);
                          ctx.strokeStyle = "#000000";
                          ctx.lineWidth = 2.5;
                          ctx.lineCap = "round";
                          ctx.lineJoin = "round";
                        }
                      }, 50);
                    }}
                    disabled={!scrolledToBottom}
                    className={"w-full py-2 rounded text-sm font-medium " + (scrolledToBottom ? "bg-blue-600 text-white" : "bg-gray-200 text-gray-400")}>
                    {consentSigs.patient ? "Re-sign" : "Tap to sign"}
                  </button>
                </div>

                {/* Witness */}
                <div className={"rounded border-2 p-3 " + (consentSigs.witness ? "border-green-300 bg-green-50" : "border-gray-200 bg-white")}>
                  <div className="flex items-center justify-between mb-2">
                    <div className="text-sm font-semibold text-gray-700">Witness</div>
                    {consentSigs.witness && <div className="text-xs text-green-600 font-medium">SIGNED ✓</div>}
                  </div>
                  <input
                    className={ic + " mb-2"}
                    value={consentSigs.witnessName}
                    onChange={function(e){setConsentSigs(function(s){return Object.assign({}, s, {witnessName: e.target.value})})}}
                    placeholder="Witness name (clinic staff)"
                  />
                  {consentSigs.witness && (
                    <img src={consentSigs.witness} className="w-full h-24 object-contain bg-white border border-gray-200 rounded mb-2" alt="Witness signature" />
                  )}
                  <button
                    onClick={function(){
                      if (!consentSigs.witnessName.trim()) { flash("Enter witness name first", "err"); return; }
                      setSigModalType("consent_witness");
                      setTimeout(function() {
                        var canvas = document.getElementById("sig-canvas");
                        if (canvas) {
                          var ctx = canvas.getContext("2d");
                          ctx.fillStyle = "#ffffff";
                          ctx.fillRect(0, 0, canvas.width, canvas.height);
                          ctx.strokeStyle = "#000000";
                          ctx.lineWidth = 2.5;
                          ctx.lineCap = "round";
                          ctx.lineJoin = "round";
                        }
                      }, 50);
                    }}
                    className="w-full py-2 rounded text-sm font-medium bg-blue-600 text-white">
                    {consentSigs.witness ? "Re-sign" : "Tap to sign"}
                  </button>
                </div>

                <button
                  onClick={saveConsent}
                  disabled={!canSave}
                  className={"w-full py-3 rounded-lg text-base font-semibold " + (canSave ? "bg-green-600 text-white" : "bg-gray-200 text-gray-400")}>
                  {canSave ? "Save Consent" : "Complete all fields to save"}
                </button>
              </div>
            );
          })()}
        </div>
      )}

      {/* ========== ASSESS TAB ========== */}
      {view === "form" && (
        <div className="p-4 space-y-3">
          {/* Patient Name + ID */}
          <div className="space-y-2">
            <div>
              <label className={lc}>Patient Name (local only, never exported)</label>
              <input className={ic} value={patientName} onChange={function(e){setPatientName(e.target.value)}} placeholder="Last, First" />
            </div>
            <div className="grid grid-cols-4 gap-2">
              <div className="col-span-2">
                <label className={lc}>Study ID</label>
                <div className="flex gap-1">
                  <input className={ic} value={form.patientId} onChange={function(e){set("patientId",e.target.value)}} placeholder="DNC-XXXX" />
                  <button onClick={function(){set("patientId", generatePatientId())}} className="px-2 py-1 bg-gray-200 text-gray-600 text-xs rounded whitespace-nowrap">New</button>
                  <button onClick={function(){loadDraft()}} className="px-2 py-1 bg-blue-100 text-blue-600 text-xs rounded whitespace-nowrap">Load</button>
                </div>
              </div>
              <div><label className={lc}>Visit</label><select className={ic} value={form.visitType} onChange={function(e){set("visitType",e.target.value)}}><option>Phone Intake</option><option>D0</option><option>D20</option><option>D90</option></select></div>
              <div><label className={lc}>Date</label><input type="date" className={ic} value={form.date} onChange={function(e){set("date",e.target.value)}} /></div>
            </div>
          </div>

          {/* Saved drafts indicator */}
          {draftList.length > 0 && (
            <div className="text-xs text-gray-400">Drafts: {draftList.map(function(d){
              return <button key={d} onClick={function(){set("patientId",d);}} className="text-blue-500 underline mr-2">{d}</button>;
            })}</div>
          )}

          {/* Demographics */}
          <div className="grid grid-cols-4 gap-2">
            <div><label className={lc}>Age</label><input className={ic} type="number" value={form.age} onChange={function(e){set("age",e.target.value)}} /></div>
            <div><label className={lc}>Sex</label><select className={ic} value={form.sex} onChange={function(e){set("sex",e.target.value)}}><option value="">--</option><option>M</option><option>F</option></select></div>
            <div><label className={lc}>DM Type</label><select className={ic} value={form.diabetesType} onChange={function(e){set("diabetesType",e.target.value)}}><option>Type 1</option><option>Type 2</option></select></div>
            <div><label className={lc}>DM Yrs</label><input className={ic} type="number" value={form.diabetesDuration} onChange={function(e){set("diabetesDuration",e.target.value)}} /></div>
          </div>

          {/* Section toggle */}
          <div className="flex rounded-lg overflow-hidden border border-gray-300">
            <button onClick={function(){setFormSection("intake")}} className={"flex-1 py-2 text-sm font-medium " + (formSection==="intake" ? "bg-blue-600 text-white" : "bg-gray-50 text-gray-500")}>{form.visitType === "D0" ? "Intake / H&P" : form.visitType === "Phone Intake" ? "Phone Intake" : "Progress Note"}</button>
            <button onClick={function(){setFormSection("sensory")}} className={"flex-1 py-2 text-sm font-medium " + (formSection==="sensory" ? "bg-blue-600 text-white" : "bg-gray-50 text-gray-500")}>Sensory Assessment</button>
          </div>

          {/* ---- INTAKE SECTION ---- */}
          {formSection === "intake" && (
            <div className="space-y-3">

              {/* Paste transcript */}
              <div className="bg-blue-50 rounded p-3 border border-blue-200">
                <div className="text-xs font-semibold text-blue-600 mb-1">PASTE TRANSCRIPT (OpenEvidence or other)</div>
                <textarea className={ic + " h-20 bg-white"} value={transcript} onChange={function(e){setTranscript(e.target.value)}} placeholder="Paste call transcript or OpenEvidence note here..."></textarea>
                <button onClick={parseTranscript} disabled={parsing}
                  className={"mt-1 w-full py-2 rounded text-sm font-medium " + (parsing ? "bg-gray-300 text-gray-500" : "bg-blue-600 text-white")}>
                  {parsing ? "Parsing..." : "Parse Transcript to Form"}
                </button>
              </div>

              {/* Phone Intake + D0: Full intake history */}
              {(form.visitType === "D0" || form.visitType === "Phone Intake") && (
                <div className="space-y-3">
                  {form.visitType === "D0" && (
                  <div className="bg-purple-50 border border-purple-200 rounded p-3">
                    <div className="text-xs font-semibold text-purple-700 mb-1">DAY-OF-PROCEDURE NOTE (clinician adds at D0)</div>
                    <div className="text-xs text-purple-600 mb-2">Brief subjective added by clinician on day of procedure. Will prepend to op note.</div>
                    <textarea className={ic} rows="2" value={form.procedureDaySubjective} onChange={function(e){set("procedureDaySubjective",e.target.value)}} placeholder="e.g. Patient presents today for scheduled NS100 implantation. Pain remains 7/10. No interval changes. Ready to proceed." />
                  </div>
                  )}

                  {form.visitType === "D0" && (
                    <div className="text-xs text-gray-400 italic border-t border-gray-200 pt-2">— Phone intake data below (completed during intake call, editable if correction needed) —</div>
                  )}
                  <div className={form.visitType === "D0" ? "space-y-3 opacity-60" : "space-y-3"}>

                  <div><label className={lc}>Referring Provider</label><input className={ic} value={form.referringProvider} onChange={function(e){set("referringProvider",e.target.value)}} placeholder="Dr. Smith" /></div>

                  <div className="bg-gray-50 rounded p-3">
                    <div className="text-xs font-semibold text-gray-500 mb-2">PATIENT CONTACT (for requisition form)</div>
                    <div className="grid grid-cols-2 gap-2 mb-2">
                      <div><label className={lc}>DOB</label><input className={ic} value={form.dob} onChange={function(e){set("dob",e.target.value)}} placeholder="MM/DD/YYYY" /></div>
                      <div><label className={lc}>Phone</label><input className={ic} type="tel" value={form.phone} onChange={function(e){set("phone",e.target.value)}} placeholder="555-555-5555" /></div>
                    </div>
                    <input className={ic + " mb-2"} value={form.address} onChange={function(e){set("address",e.target.value)}} placeholder="Street address" />
                    <div className="grid grid-cols-3 gap-2 mb-2">
                      <input className={ic} value={form.city} onChange={function(e){set("city",e.target.value)}} placeholder="City" />
                      <input className={ic} value={form.state} onChange={function(e){set("state",e.target.value)}} placeholder="State" />
                      <input className={ic} value={form.zip} onChange={function(e){set("zip",e.target.value)}} placeholder="Zip" />
                    </div>
                    <input className={ic} type="email" value={form.email} onChange={function(e){set("email",e.target.value)}} placeholder="Email (optional)" />
                  </div>

                  <div className="bg-gray-50 rounded p-3">
                    <div className="flex items-center justify-between mb-2">
                      <div className="text-xs font-semibold text-gray-500">INSURANCE</div>
                      {(function(){
                        var pid = form.patientId;
                        function has(t) { return pid && photos.some(function(p){return p.patientId===pid && p.type===t}); }
                        function slot(label, key) {
                          var present = has(key);
                          return (
                            <div key={key} className="flex items-center gap-1">
                              <span className="text-xs text-gray-600 w-16">{label}</span>
                              <button onClick={function(){capturePhoto(key)}} className={"px-1.5 py-0.5 text-xs rounded " + (present ? "bg-green-100 text-green-700" : "bg-blue-100 text-blue-600")} title="Capture/Upload">📷</button>
                              <button onClick={function(){pasteClipboardPhoto(key)}} className="px-1.5 py-0.5 text-xs rounded bg-gray-100 text-gray-600" title="Paste from clipboard">📋</button>
                              {present && <span className="text-xs text-green-600">✓</span>}
                            </div>
                          );
                        }
                        return (
                          <div className="flex flex-col gap-1">
                            {slot("1° Front", "insurance_primary_front")}
                            {slot("1° Back", "insurance_primary_back")}
                            {slot("2° Front", "insurance_secondary_front")}
                            {slot("2° Back", "insurance_secondary_back")}
                            <button onClick={requestInsuranceCards} className="mt-1 px-2 py-1 text-xs rounded bg-purple-100 text-purple-700 font-medium" title="Send SMS to patient requesting insurance card photos">📱 Text patient for cards</button>
                          </div>
                        );
                      })()}
                    </div>
                    <div className="text-xs text-gray-400 mb-2">Primary (e.g. Medicare)</div>
                    <input className={ic + " mb-2"} value={form.insuranceName} onChange={function(e){set("insuranceName",e.target.value)}} placeholder="Insurance name (e.g. Medicare Part B)" />
                    <div className="grid grid-cols-2 gap-2 mb-2">
                      <input className={ic} value={form.memberId} onChange={function(e){set("memberId",e.target.value)}} placeholder="Member ID" />
                      <input className={ic} value={form.groupNum} onChange={function(e){set("groupNum",e.target.value)}} placeholder="Group #" />
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <input className={ic} value={form.effectiveDate} onChange={function(e){set("effectiveDate",e.target.value)}} placeholder="Effective date" />
                      <input className={ic} value={form.insuredName} onChange={function(e){set("insuredName",e.target.value)}} placeholder="Insured (if not patient)" />
                    </div>

                    {(form.insuranceName2 || form.memberId2) && (
                      <div className="text-xs text-gray-400 mt-3 mb-2">Secondary (e.g. BCBS Supplement)</div>
                    )}
                    {!form.insuranceName2 && !form.memberId2 && (
                      <div className="text-xs text-gray-400 mt-3 mb-1">Secondary insurance (optional, tap Secondary button above to snap)</div>
                    )}
                    <input className={ic + " mb-2"} value={form.insuranceName2} onChange={function(e){set("insuranceName2",e.target.value)}} placeholder="Secondary insurance name" />
                    <div className="grid grid-cols-2 gap-2 mb-2">
                      <input className={ic} value={form.memberId2} onChange={function(e){set("memberId2",e.target.value)}} placeholder="Secondary Member ID" />
                      <input className={ic} value={form.groupNum2} onChange={function(e){set("groupNum2",e.target.value)}} placeholder="Secondary Group #" />
                    </div>
                    <input className={ic} value={form.effectiveDate2} onChange={function(e){set("effectiveDate2",e.target.value)}} placeholder="Secondary effective date" />
                  </div>

                  <div className="bg-gray-50 rounded p-3">
                    <div className="text-xs font-semibold text-gray-500 mb-2">PAIN</div>
                    <div className="grid grid-cols-3 gap-2 mb-2">
                      <div><label className={lc}>Rest /10</label><input className={ic} type="number" min="0" max="10" value={form.painRest} onChange={function(e){set("painRest",e.target.value)}} /></div>
                      <div><label className={lc}>Best /10</label><input className={ic} type="number" min="0" max="10" value={form.painBest} onChange={function(e){set("painBest",e.target.value)}} /></div>
                      <div><label className={lc}>Worst /10</label><input className={ic} type="number" min="0" max="10" value={form.painWorst} onChange={function(e){set("painWorst",e.target.value)}} /></div>
                    </div>
                    <label className={lc}>Descriptors</label>
                    <div className="flex flex-wrap">{PAIN_DESC.map(function(d){return <Chip key={d} label={d} selected={form.painDescriptors.includes(d)} onClick={function(){toggleMulti("painDescriptors",d)}} />;})}</div>
                    <input className={ic + " mt-1"} value={form.painNotes} onChange={function(e){set("painNotes",e.target.value)}} placeholder="Additional pain notes..." />
                  </div>

                  <div className="bg-gray-50 rounded p-3">
                    <label className={lc}>Functional Limitations</label>
                    <div className="flex flex-wrap">{FUNCTIONAL.map(function(d){return <Chip key={d} label={d} selected={form.functionalLimitations.includes(d)} onClick={function(){toggleMulti("functionalLimitations",d)}} />;})}</div>
                    <input className={ic + " mt-1"} value={form.functionalNotes} onChange={function(e){set("functionalNotes",e.target.value)}} placeholder="Additional functional notes..." />
                  </div>

                  <div className="bg-gray-50 rounded p-3">
                    <label className={lc}>PMHx</label>
                    <div className="flex flex-wrap">{PMHX_OPTIONS.map(function(d){return <Chip key={d} label={d} selected={form.pmhx.includes(d)} onClick={function(){toggleMulti("pmhx",d)}} />;})}</div>
                    <label className={lc + " mt-2"}>PSHx</label>
                    <input className={ic} value={form.pshx} onChange={function(e){set("pshx",e.target.value)}} placeholder="Surgical history" />
                    <input className={ic + " mt-1"} value={form.pmhxNotes} onChange={function(e){set("pmhxNotes",e.target.value)}} placeholder="Additional PMHx notes..." />
                  </div>

                  <div className="bg-gray-50 rounded p-3">
                    <label className={lc}>Allergies</label>
                    <div className="flex flex-wrap">{ALLERGY_COMMON.map(function(d){return <Chip key={d} label={d} selected={form.allergies.includes(d)} onClick={function(){toggleMulti("allergies",d)}} />;})}</div>
                    <input className={ic + " mt-1"} value={form.allergiesOther} onChange={function(e){set("allergiesOther",e.target.value)}} placeholder="Other allergies" />
                  </div>

                  <div className="bg-gray-50 rounded p-3">
                    <label className={lc}>Medications (current)</label>
                    <textarea className={ic + " h-14"} value={form.medications} onChange={function(e){set("medications",e.target.value)}} placeholder="List current medications"></textarea>
                  </div>

                  <div className="bg-gray-50 rounded p-3">
                    <label className={lc}>Prior Therapies Tried</label>
                    <div className="flex flex-wrap">{PRIOR_TX.map(function(d){return <Chip key={d} label={d} selected={form.priorTx.includes(d)} onClick={function(){toggleMulti("priorTx",d)}} />;})}</div>
                    <input className={ic + " mt-1"} value={form.txNotes} onChange={function(e){set("txNotes",e.target.value)}} placeholder="Additional therapy notes, results..." />
                  </div>

                  <div className="bg-gray-50 rounded p-3">
                    <div className="text-xs font-semibold text-gray-500 mb-2">SOCIAL HX</div>
                    <div className="grid grid-cols-3 gap-2">
                      <div><label className={lc}>Tobacco</label><select className={ic} value={form.socialTob} onChange={function(e){set("socialTob",e.target.value)}}><option>No</option><option>Current</option><option>Former</option></select></div>
                      <div><label className={lc}>EtOH</label><select className={ic} value={form.socialEtOH} onChange={function(e){set("socialEtOH",e.target.value)}}><option>No</option><option>Social</option><option>Daily</option><option>Former</option></select></div>
                      <div><label className={lc}>Substances</label><select className={ic} value={form.socialSubstance} onChange={function(e){set("socialSubstance",e.target.value)}}><option>No</option><option>Current</option><option>Former</option></select></div>
                    </div>
                    <input className={ic + " mt-1"} value={form.socialNotes} onChange={function(e){set("socialNotes",e.target.value)}} placeholder="Additional social hx notes..." />
                  </div>

                  <div className="bg-gray-50 rounded p-3">
                    <div className="text-xs font-semibold text-gray-500 mb-2">LABS</div>
                    <div className="grid grid-cols-3 gap-2">
                      <div><label className={lc}>A1C</label><input className={ic} value={form.a1c} onChange={function(e){set("a1c",e.target.value)}} placeholder="%" /></div>
                      <div><label className={lc}>Fasting BG</label><input className={ic} value={form.bgFasting} onChange={function(e){set("bgFasting",e.target.value)}} placeholder="mg/dL" /></div>
                      <div><label className={lc}>BG Control</label><select className={ic} value={form.glucoseControl} onChange={function(e){set("glucoseControl",e.target.value)}}><option value="">--</option><option>Well controlled</option><option>Poorly controlled</option></select></div>
                    </div>
                    <input className={ic + " mt-1"} value={form.labNotes} onChange={function(e){set("labNotes",e.target.value)}} placeholder="Additional lab notes..." />
                  </div>

                  <div className="bg-gray-50 rounded p-3">
                    <div className="text-xs font-semibold text-gray-500 mb-2">SELF-REPORT EXAM (phone intake, no-touch)</div>

                    <div className="space-y-2">
                      <div>
                        <label className={lc}>Any ulcers or wounds on feet or hands?</label>
                        <div className="flex gap-2">
                          <select className={ic + " w-20"} value={form.srWounds} onChange={function(e){set("srWounds",e.target.value)}}><option>No</option><option>Yes</option></select>
                          {form.srWounds === "Yes" && <input className={ic + " flex-1"} value={form.srWoundsLocation} onChange={function(e){set("srWoundsLocation",e.target.value)}} placeholder="Where?" />}
                        </div>
                      </div>

                      <div>
                        <label className={lc}>Any balance issues or falls?</label>
                        <div className="flex gap-2">
                          <select className={ic + " w-20"} value={form.srBalance} onChange={function(e){set("srBalance",e.target.value)}}><option>No</option><option>Yes</option></select>
                          {form.srBalance === "Yes" && <input className={ic + " flex-1"} value={form.srBalanceDetail} onChange={function(e){set("srBalanceDetail",e.target.value)}} placeholder="Details" />}
                        </div>
                      </div>

                      <div>
                        <label className={lc}>Any swelling in arms or legs?</label>
                        <div className="flex gap-2">
                          <select className={ic + " w-20"} value={form.srSwelling} onChange={function(e){set("srSwelling",e.target.value)}}><option>No</option><option>Yes</option></select>
                          {form.srSwelling === "Yes" && <input className={ic + " flex-1"} value={form.srSwellingLocation} onChange={function(e){set("srSwellingLocation",e.target.value)}} placeholder="Where?" />}
                        </div>
                      </div>

                      <div>
                        <label className={lc}>Any increased work of breathing?</label>
                        <div className="flex gap-2">
                          <select className={ic + " w-20"} value={form.srBreathing} onChange={function(e){set("srBreathing",e.target.value)}}><option>No</option><option>Yes</option></select>
                          {form.srBreathing === "Yes" && <input className={ic + " flex-1"} value={form.srBreathingDetail} onChange={function(e){set("srBreathingDetail",e.target.value)}} placeholder="Details" />}
                        </div>
                      </div>

                      <div>
                        <label className={lc}>Any awareness of your heart (racing, pounding)?</label>
                        <div className="flex gap-2">
                          <select className={ic + " w-20"} value={form.srHeartAwareness} onChange={function(e){set("srHeartAwareness",e.target.value)}}><option>No</option><option>Yes</option></select>
                          {form.srHeartAwareness === "Yes" && <input className={ic + " flex-1"} value={form.srHeartAwarenessDetail} onChange={function(e){set("srHeartAwarenessDetail",e.target.value)}} placeholder="Details" />}
                        </div>
                      </div>

                      <div>
                        <label className={lc}>Any known rhythm problems (AFib, arrhythmia)?</label>
                        <div className="flex gap-2">
                          <select className={ic + " w-20"} value={form.srRhythm} onChange={function(e){set("srRhythm",e.target.value)}}><option>No</option><option>Yes</option></select>

                      </div>
                    </div>
                  </div>

                  <div className="bg-gray-50 rounded p-3">
                    <div className="text-xs font-semibold text-gray-500 mb-2">DIAGNOSIS and MEDICAL NECESSITY</div>

                      <div><label className={lc}>Pain duration</label><input className={ic} type="number" value={form.painDuration} onChange={function(e){set("painDuration",e.target.value)}} /></div>
