  async function generatePreauth() {
    if (!form.patientId) { flash("Study ID required", "err"); return; }
    if (!patientName) { flash("Patient name required (enter in Assess tab)", "err"); return; }
    if (!form.age || !form.sex) { flash("Age and sex required", "err"); return; }
    if (!form.dxCodes.length) { flash("At least one DX code required", "err"); return; }
    if (!sheetUrl) { flash("No script URL configured", "err"); return; }

    // Billing audit - block if claim killers present
    var billingErrors = getBillingErrors();
    if (billingErrors.length > 0) {
      setValidationErrors(billingErrors);
      setShowOverride(true);
      return;
    }

    setPreauthGenerating(true);
    try {
      // Save draft first so the patient is findable later
      var draftData = Object.assign({}, form, { savedAt: new Date().toISOString() });
      var updated = Object.assign({}, drafts);
      updated[form.patientId] = draftData;
      setDrafts(updated);
      storage.set(DRAFTS_KEY, JSON.stringify(updated));
      var saveDraftPayload = Object.assign({}, draftData, { _action: "saveDraft", patientName: patientName });
      await fetch(sheetUrl, { method: "POST", mode: "no-cors", body: JSON.stringify(saveDraftPayload) });

      // Then generate the preauth packet
      // CRITICAL: userEmail must be included so backend can look up author
      // profile → determine if cosign is needed (any non-physician author
      // requires cosign). Omitting this was a silent bug: preauthAuthorProfile
      // would be null, the cosign-guard short-circuited, and packets generated
      // by Bradley/CRNAs went straight to biller without ever creating a
      // Cosign row. Patients slipped through unsigned until we caught it.
      var preauthUserEmail = (typeof firebase !== "undefined" && firebase.auth && firebase.auth().currentUser)
        ? firebase.auth().currentUser.email : "";
      var payload = {
        _action: "generatePreauth",
        patientId: form.patientId,
        patientName: patientName,
        date: form.date,
        hnpText: generateHnP(),
        lomnText: generateLOMN(),
        userEmail: preauthUserEmail,
        // For the gate. Backend's shouldAutoAuthorize reads these.
        insuranceName: form.insuranceName,
        memberId: form.memberId,
        memberIdConfidence: form.memberIdConfidence
      };
      await fetch(sheetUrl, { method: "POST", mode: "no-cors", body: JSON.stringify(payload) });
      flash("Draft saved + preauth packet sent to biller", "ok");
    } catch(e) {
      flash("Error: " + e.toString(), "err");
    }
    setPreauthGenerating(false);
  }

  // Billing audit - claim-killer fields that cause Medicare rejection
  // Use for both D0 submit and Phone Intake → Generate Preauth paths
  function getBillingErrors() {
    var errors = [];

    // Identifying info
    if (!patientName) errors.push("REJECTION RISK: Patient name missing");
    if (!form.dob) errors.push("REJECTION RISK: DOB missing (Medicare requires)");
    if (!form.address || !form.city || !form.state || !form.zip) {
      errors.push("REJECTION RISK: Complete address missing (street/city/state/zip)");
    }
    if (!form.phone) errors.push("REJECTION RISK: Patient phone missing");

    // Insurance
    if (!form.insuranceName) errors.push("REJECTION RISK: Primary insurance name missing");
    if (!form.memberId) errors.push("REJECTION RISK: Insurance member ID missing");

    // Billing codes
    if (!form.dxCodes || !form.dxCodes.length) {
      errors.push("REJECTION RISK: No ICD-10 diagnosis codes selected");
    }

    // Referring provider (Medicare requires for DME orders)
    if (!form.referringProvider) errors.push("REJECTION RISK: Referring provider name missing");

    // LOMN content requirements
    if (!form.painDuration) errors.push("REJECTION RISK: Pain duration missing (LOMN requires)");
    if (!form.medications) errors.push("REJECTION RISK: Current medications missing (LOMN requires)");
    if (!form.priorTx || !form.priorTx.length) {
      errors.push("REJECTION RISK: No prior conservative treatments documented (LOMN requires evidence of failed therapy)");
    }
    if (!form.painRest && !form.painWorst) {
      errors.push("REJECTION RISK: Pain rating missing (LOMN requires)");
    }

    // Contraindications must be actively screened (empty array means not screened)
    // Allow "none identified" by requiring an explicit acknowledgment via the contraindications field existing
    // The chip group exists; if user never touched it, that's not the same as "screened and none"
    // We accept either: at least one contraindication selected, OR an explicit "none" pseudo-flag
    // For now: warn if completely empty since user should at least look at the section
    // (Not strictly a rejection trigger, downgraded to warning would be ideal but keeping as error for safety)

    return errors;
  }

  // Validation - check for missing required items
  function getValidationErrors() {
    var errors = [];
    var pid = form.patientId;
    if (!pid) return ["Study ID required"];
    if (!patientName) return ["Patient name required (local only, for directory mapping)"];
    // Phone Intake uses Generate Preauth, not Submit. Block Submit path explicitly.
    if (form.visitType === "Phone Intake") return ["Phone Intake saves via the Generate Preauth button, not Submit. Switch Visit Type to D0 when ready for the implant."];

    var patientPhotos = pid ? getPhotosForPatient(pid) : [];
    var photoTypes = patientPhotos.map(function(p) { return p.type; });

    // D0 (placement visit): consents, device stickers, impedance
    if (form.visitType === "D0") {
      // Billing audit first - claim killers block submit
      var billingErrors = getBillingErrors();
      for (var bi = 0; bi < billingErrors.length; bi++) errors.push(billingErrors[bi]);

      if (photoTypes.indexOf("consent_procedure") === -1) errors.push("Missing: Procedure Consent (sign on Consent tab)");
      if (photoTypes.indexOf("consent_data") === -1) errors.push("Missing: Data Use Consent (sign on Consent tab)");
      if (photoTypes.indexOf("consent_social") === -1) errors.push("Missing: Social Media Consent (sign on Consent tab)");
      if (photoTypes.indexOf("serial") === -1) errors.push("Missing: Device Sticker (top)");
      if (photoTypes.indexOf("needles") === -1) errors.push("Missing: Needles Sticker (bottom)");
      if (!form.deviceSerial) errors.push("Missing: Device serial number (type or snap sticker)");
    }

    // D20 = explant day — no consent re-check (already signed at D0 and in Drive doc)
    // D90 = follow-up assessment — no device/consent requirements
    // (Future: add ear photo validation here if/when the capture UI is built)

    return errors;
  }

  const [showOverride, setShowOverride] = useState(false);
  const [validationErrors, setValidationErrors] = useState([]);

  function tryCopy() {
    var errors = getValidationErrors();
    if (errors.length > 0) {
      setValidationErrors(errors);
      setShowOverride(true);
      return;
    }
    setShowOverride(false);
    setValidationErrors([]);
    copyNoteWithPhotos();
  }

  function trySubmit() {
    var errors = getValidationErrors();
    if (errors.length > 0) {
      setValidationErrors(errors);
      setShowOverride(true);
      return;
    }
    setShowOverride(false);
    setValidationErrors([]);
    handleSubmit();
  }

  async function handleSubmit() {
    if (!form.patientId) { flash("Enter a Study ID", "err"); return; }
    if (!patientName) { flash("Enter patient name", "err"); return; }
    // Hard-block Phone Intake from the Submit path. This catches override attempts
    // that bypass validateForm. Phone Intake must use Generate Preauth.
    if (form.visitType === "Phone Intake") {
      flash("Phone Intake must use Generate Preauth. Switch Visit Type to D0 for implant day.", "err");
      return;
    }
    setSubmitting(true);
    var row = buildRow();

    // Auto-add to directory if not already there
    var alreadyInDir = directory.some(function(d) { return d.id === form.patientId; });
    if (patientName && !alreadyInDir) {
      var entry = { name: patientName, id: form.patientId, addedAt: new Date().toISOString() };
      var updatedDir = directory.concat([entry]);
      setDirectory(updatedDir);
      storage.set(DIRECTORY_KEY, JSON.stringify(updatedDir));
    }

    try { await copyNoteWithPhotos(); } catch(e) {}
    var updated = records.concat([Object.assign({}, row, { id: Date.now() })]);
    try { storage.set(STORAGE_KEY, JSON.stringify(updated)); setRecords(updated); } catch(e) {}
    // Update draft with latest intake/device data for future visits
    var d = Object.assign({}, drafts);
    d[form.patientId] = Object.assign({}, form, { savedAt: new Date().toISOString() });
    setDrafts(d);
    try { storage.set(DRAFTS_KEY, JSON.stringify(d)); } catch(e) {}
    // Also sync the draft to cloud so other devices can load it
    if (sheetUrl) {
      try {
        var draftSync = Object.assign({}, form, { savedAt: new Date().toISOString(), _action: "saveDraft", patientName: patientName });
        fetch(sheetUrl, { method: "POST", mode: "no-cors", body: JSON.stringify(draftSync) });
      } catch(e) {}
    }
    var sheetOk = false;
    var sheetErr = "";
    if (sheetUrl) {
      try {
        // Include note text and photos for Google Doc creation
        var submitData = Object.assign({}, row);
        submitData._patientName = patientName;
        if (form.visitType === "D0") {
          // D0 creates only op note and requisition - H&P and LOMN come from Preauth button
          submitData._opNoteText = generateOpNoteStandalone();
          submitData._requisitionText = generateRequisition();
          // Photos attach to op note
          var pid = form.patientId;
          var patientPhotos = pid ? getPhotosForPatient(pid) : [];
          submitData._photos = patientPhotos.map(function(p) {
            var matched = PHOTO_TYPES.find(function(t){return t.key===p.type});
            return { type: p.type, label: (matched ? matched.label : p.type), data: p.data };
          });
          // Signed procedure consent goes on the requisition doc
          var procedureConsent = patientPhotos.find(function(p){return p.type === "consent_procedure"});
          if (procedureConsent) {
            submitData._consentImage = procedureConsent.data;
          }
        } else {
          // D20, D90: single progress note
          submitData._noteText = generateNote();
        }
        // Use real cors so we can verify the response and only clear photos on confirmed success
        var resp = await fetch(sheetUrl, {method:"POST", body:JSON.stringify(submitData)});
        var result = await resp.json();
        if (result.status === "ok") {
          sheetOk = true;
          // AUTO-CLEAR photos for this patient: they are now embedded in the Drive docs,
          // localStorage copy is redundant and wastes ~1-2MB per patient. Draft stays so the
          // Sheet1 fallback has a backup loader.
          if (form.patientId) {
            var submittedPid = form.patientId;
            var remainingPhotos = photos.filter(function(ph) { return ph.patientId !== submittedPid; });
            setPhotos(remainingPhotos);
            try { storage.set(PHOTOS_KEY, JSON.stringify(remainingPhotos)); } catch(e) {}
          }
          if (result.docWarnings && result.docWarnings.length) {
            sheetErr = " (doc warnings: " + result.docWarnings.join("; ") + ")";
          }
        } else {
          sheetErr = result.message || result.status || "unknown";
        }
      } catch(e) { sheetErr = e.toString(); }
    }
    setSubmitting(false);
    if (sheetOk) {
      flash("Saved + Sheet + Docs created · photos auto-cleared" + sheetErr, "ok");
    } else if (sheetUrl) {
      flash("Submit failed: " + sheetErr + " · photos kept locally, retry", "err");
    } else {
      flash("Saved locally (no script URL).", "warn");
    }
    setPatientName(""); // clear name after submit, it's in the directory now
  }

  // Directory functions (local only, never exported)
  function addToDirectory() {
    if (!dirName || !dirId) { flash("Enter both name and ID", "err"); return; }
    var entry = { name: dirName, id: dirId, addedAt: new Date().toISOString() };
    var updated = directory.concat([entry]);
    setDirectory(updated);
    storage.set(DIRECTORY_KEY, JSON.stringify(updated));
    setDirName(""); setDirId("");
    flash("Added " + dirName + " as " + dirId);
  }

  function removeFromDirectory(idx) {
    var updated = directory.filter(function(_, i) { return i !== idx; });
    setDirectory(updated);
    storage.set(DIRECTORY_KEY, JSON.stringify(updated));
  }

  function selectFromDirectory(id, name) {
    set("patientId", id);
    setPhotoPatientId(id);
    setPatientName(name || "");
    setShowConfig(false);
    flash("Selected " + id);
  }

  function getFilteredDirectory() {
    if (!dirSearch) return directory;
    var s = dirSearch.toLowerCase();
    return directory.filter(function(d) {
      return d.name.toLowerCase().includes(s) || d.id.toLowerCase().includes(s);
    });
  }

  function generateNoteHtml() {
    var text = generateNote();
    var pid = form.patientId;
    var patientPhotos = pid ? getPhotosForPatient(pid) : [];
    var html = "<div style=\"font-family:Courier New,monospace;font-size:11px;white-space:pre-wrap;\">" + text.replace(/\n/g, "<br>") + "</div>";
    if (patientPhotos.length) {
      html += "<br><div style=\"font-family:Arial,sans-serif;font-size:11px;font-weight:bold;\">PHOTOS:</div>";
      patientPhotos.forEach(function(p) {
        var matched = PHOTO_TYPES.find(function(t){return t.key===p.type}) || {};
        html += "<div style=\"font-family:Arial,sans-serif;font-size:10px;color:#666;margin-top:8px;\">" + (matched.label || p.type) + " - " + new Date(p.timestamp).toLocaleString() + "</div>";
        html += "<img src=\"" + p.data + "\" style=\"max-width:400px;margin:4px 0 12px 0;\" />";
      });
    }
    return html;
  }

  async function copyNoteWithPhotos() {
    var pid = form.patientId;
    var patientPhotos = pid ? getPhotosForPatient(pid) : [];
    // Only include photos for D0
    if (form.visitType === "D0" && patientPhotos.length > 0) {
      try {
        var html = generateNoteHtml();
        var blob = new Blob([html], { type: "text/html" });
        var textBlob = new Blob([generateNote()], { type: "text/plain" });
        await navigator.clipboard.write([
          new ClipboardItem({
            "text/html": blob,
            "text/plain": textBlob
          })
        ]);
        flash("Copied note + " + patientPhotos.length + " photos");
        return;
      } catch(e) {}
    }
    try { await navigator.clipboard.writeText(generateNote()); flash("Copied note"); } catch(e) { flash("Copy failed", "err"); }
  }

  function saveSheetUrl() { storage.set(SHEET_URL_KEY, sheetUrl); flash("Sheet URL saved"); setShowConfig(false); }

  function exportCSV() {
    if (!records.length) return;
    var headers = Object.keys(records[0]).filter(function(k){return k!=="id"});
    var csv = [headers.join(",")].concat(records.map(function(r){return headers.map(function(h){return '"'+String(r[h]||"").replace(/"/g,'""')+'"'}).join(",")})).join("\n");
    var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
    a.download = "dpn_data_" + todayLocal() + ".csv"; a.click();
  }

  function clearAll() { if(confirm("Delete all saved records?")){ storage.delete(STORAGE_KEY); setRecords([]); } }
  function resetForm() { setForm(Object.assign({}, defaultState, { date: todayLocal() })); setFormSection("intake"); setPatientName(""); }

  var ic = "w-full border border-gray-300 rounded px-2 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-blue-400";
  var lc = "block text-xs font-medium text-gray-600 mb-0.5";

  // Chip toggle helper
  function Chip(props) {
    var active = props.selected;
    return <button onClick={props.onClick}
      className={"text-xs py-1 px-2 rounded-full border mr-1 mb-1 " + (active ? "bg-blue-500 text-white border-blue-500" : "bg-white text-gray-600 border-gray-300")}>
      {props.label}
    </button>;
  }

  var draftList = getDraftList();

  return (
    <div className="max-w-lg md:max-w-3xl lg:max-w-4xl mx-auto bg-white min-h-screen">
      {/* Tab bar redesigned for iPhone Chrome (~390px viewport):
          - 7 tabs + settings used to overflow at flex-1; "Referrals" alone needs ~60px
            but only got ~50px per slot, so text spilled or wrapped.
          - Shorter labels ("Refs" vs "Referrals") buy us horizontal headroom.
          - whitespace-nowrap prevents any remaining wrap if a user has a smaller
            phone or the system font is wider (Chrome on some Androids is +15%).
          - text-xs on the base, sm:text-sm for larger screens, keeps everything
            legible without starving narrow viewports.
          - The settings "+" becomes a compact gear icon that doesn't fight for
            horizontal space with the primary navigation.
          - min-w-0 on the tab wrapper lets flex-1 actually shrink below content
            width — without it, flex-1 silently refuses to compress long labels. */}
      <div className="flex border-b border-gray-200 sticky top-0 bg-white z-10">
        <div className="flex-1 flex min-w-0">
          {[["referrals","Refs"],["cosign","Cosign"],["consent","Consent"],["form","Assess"],["photos","Photos"],["note","Note"],["records","Data"]].map(function(item) {
            var v = item[0], l = item[1];
            return <button key={v} onClick={function(){setView(v)}}
              className={"flex-1 min-w-0 py-2.5 text-xs sm:text-sm font-medium whitespace-nowrap px-1 " +
                (view===v ? "text-blue-600 border-b-2 border-blue-600" : "text-gray-500")}>{l}</button>;
          })}
        </div>
        <button onClick={function(){setShowConfig(!showConfig)}}
          className="shrink-0 px-2.5 py-2.5 text-gray-400 text-base"
          aria-label="Settings">{showConfig ? "✕" : "⚙"}</button>
      </div>

      {showConfig && (
        <div className="p-3 bg-yellow-50 border-b border-yellow-200 space-y-3">
          <div>
            <label className={lc}>Google Apps Script URL</label>
            <input className={ic} value={sheetUrl} onChange={function(e){setSheetUrl(e.target.value)}} placeholder="https://script.google.com/macros/s/.../exec" />
            <button onClick={saveSheetUrl} className="mt-2 px-3 py-1 bg-yellow-500 text-white text-xs rounded">Save URL</button>
          </div>

          {/* User profile editor — name, credentials, role, sites, and the
              all-important signature pad. Cosign appends this signature image
              to docs; without it, only caption text appears. Re-saving here
              after a Workspace migration also fixes signatures that became
              inaccessible to the new Apps Script identity.
              Always renders when settings is open — even if the profile load
              is in flight or failed. The user can fill from scratch as a
              fallback. The previous `{userProfile && ...}` gate hid the whole
              section when load failed, leaving no way to re-save signatures
              and creating a chicken-and-egg cosign breakage. */}
          <div className="border-t border-yellow-300 pt-3">
            <div className="text-xs font-semibold text-gray-600 mb-2">YOUR PROFILE</div>
            {profileLoading && <div className="text-xs text-gray-400 mb-2">Loading…</div>}
            {!userProfile && !profileLoading && (
              <div className="text-xs text-amber-700 mb-2">
                Couldn't load your saved profile. You can still fill in below to save a fresh one.
                <button onClick={loadUserProfile}
                  className="ml-2 px-2 py-0.5 bg-amber-200 text-amber-900 rounded text-[10px]">Retry</button>
              </div>
            )}
            {userProfile && (
              <div className="space-y-2">
                <div>
                  <label className={lc}>Email</label>
                  <input className={ic + " bg-gray-100"} value={userProfile.email} readOnly />
                </div>
                <div>
                  <label className={lc}>Display name</label>
                  <input className={ic} value={userProfile.displayName}
                    onChange={function(e){setUserProfile(Object.assign({}, userProfile, {displayName: e.target.value}))}} />
                </div>
                <div className="flex gap-2">
                  <div className="flex-1">
                    <label className={lc}>Credentials</label>
                    <input className={ic} value={userProfile.credentials}
                      placeholder="MD, DO, NP, PA, RN, etc."
                      onChange={function(e){setUserProfile(Object.assign({}, userProfile, {credentials: e.target.value}))}} />
                  </div>
                  <div className="flex-1">
                    <label className={lc}>Role</label>
                    <select className={ic} value={userProfile.role}
                      onChange={function(e){setUserProfile(Object.assign({}, userProfile, {role: e.target.value}))}}>
                      <option value="">— select —</option>
                      <option value="physician">physician</option>
                      <option value="crna">crna</option>
                      <option value="ma">ma</option>
                      <option value="biller">biller</option>
                      <option value="admin">admin</option>
                    </select>
                  </div>
                </div>
                <div>
                  <label className={lc}>Sites (comma-separated, e.g. LEWES,SALISBURY)</label>
                  <input className={ic} value={userProfile.locations}
                    onChange={function(e){setUserProfile(Object.assign({}, userProfile, {locations: e.target.value}))}} />
                </div>
                <div>
                  <label className={lc}>Licensed states (comma-separated, e.g. DE,MD,VA)</label>
                  <input className={ic} value={userProfile.licensedStates}
                    onChange={function(e){setUserProfile(Object.assign({}, userProfile, {licensedStates: e.target.value}))}} />
                </div>

                {/* Signature pad. Existing signature shown above the canvas if
                    one is on file. Drawing in the canvas marks profileSigDirty
                    so save sends the new image; not drawing leaves the
                    existing signatureUrl alone. */}
                <div className="border-t border-gray-200 pt-2">
                  <label className={lc}>Signature</label>
                  {userProfile.signatureUrl && !profileSigDirty && (
                    <div className="text-[10px] text-gray-500 mb-1">
                      ✓ Signature on file. Draw below to replace it.
                    </div>
                  )}
                  {!userProfile.signatureUrl && (
                    <div className="text-[10px] text-amber-700 mb-1">
                      ⚠ No signature on file. Cosigns will go through without an image.
                    </div>
                  )}
                  <canvas
                    id="profile-sig-canvas"
                    width="600"
                    height="200"
                    className="w-full border-2 border-gray-300 rounded bg-white"
                    style={{touchAction: "none"}}
                    onMouseDown={profileSigStart}
                    onMouseMove={profileSigMove}
                    onMouseUp={profileSigEnd}
                    onMouseLeave={profileSigEnd}
                    onTouchStart={profileSigStart}
                    onTouchMove={profileSigMove}
                    onTouchEnd={profileSigEnd}
                  />
                  <div className="flex gap-2 mt-1">
                    <button onClick={profileSigClear}
                      className="flex-1 py-1 bg-gray-200 text-gray-700 text-xs rounded">Clear pad</button>
                  </div>
                </div>

                <button onClick={saveUserProfile}
                  className="w-full mt-2 py-2 bg-blue-600 text-white text-sm rounded font-medium">
                  Save Profile{profileSigDirty ? " + Signature" : ""}
                </button>
              </div>
            )}
          </div>

          <div className="border-t border-yellow-300 pt-3">
            <div className="text-xs font-semibold text-gray-600 mb-2">PATIENT DIRECTORY (local only, never exported)</div>
            <div className="flex gap-1 mb-2">
              <input className={ic} value={dirName} onChange={function(e){setDirName(e.target.value)}} placeholder="Patient name" />
              <input className={ic + " w-28"} value={dirId} onChange={function(e){setDirId(e.target.value)}} placeholder="DNC-XXXX" />
              <button onClick={addToDirectory} className="px-2 py-1 bg-blue-500 text-white text-xs rounded whitespace-nowrap">Add</button>
            </div>
            {directory.length > 0 && (
              <div>
                <input className={ic + " mb-2"} value={dirSearch} onChange={function(e){setDirSearch(e.target.value)}} placeholder="Search name or ID..." />
                <div className="max-h-40 overflow-y-auto space-y-1">
                  {getFilteredDirectory().map(function(d, i) { return (
                    <div key={i} className="flex justify-between items-center bg-white rounded px-2 py-1.5 border border-gray-200">
                      <button onClick={function(){selectFromDirectory(d.id, d.name)}} className="text-xs text-left flex-1">
                        <span className="font-medium text-gray-700">{d.name}</span>
                        <span className="text-blue-500 ml-2">{d.id}</span>
                      </button>
                      <button onClick={function(){removeFromDirectory(i)}} className="text-red-400 text-xs ml-2">X</button>
                    </div>
                  );})}
                </div>
              </div>
            )}
          </div>

          {/* Pending Payer Updates — Floyd's eligibility detection queue.
              Hidden when empty (no signal, no UI). When updates exist,
              shows a compact reviewer with Approve / Reject buttons.
              Approving promotes payer to the main reference table; rejecting
              keeps an audit trail but doesn't affect categorization. */}
          {(pendingPayerUpdates.length > 0 || pendingPayerLoading) && (
            <div className="border-t border-yellow-300 pt-3">
              <div className="text-xs font-semibold text-gray-600 mb-2">
                PENDING PAYER UPDATES ({pendingPayerUpdates.length})
              </div>
              <div className="text-[10px] text-gray-500 mb-2">
                Floyd's eligibility emails detected new payer info. Review each before adding to the reference table.
              </div>
              {pendingPayerLoading && (
                <div className="text-xs text-gray-400">Loading...</div>
              )}
              <div className="space-y-2">
                {pendingPayerUpdates.map(function(u) {
                  // Three queue entry types:
                  //   "promote-precedent"   — favorable surprise (authorized for previously preauth-required payer).
                  //                           Primary CTA: promote to auto-approved. Default green/positive treatment.
                  //   "needs-reverification" — unfavorable surprise (rejected for previously auto-approved payer).
                  //                           Primary CTA: KEEP CURRENT (most rejections are patient-specific, not policy).
                  //                           Downgrade is secondary.
                  //   "auto-approved" / "preauth-required" / "not-covered" — Floyd-detected new payer entry, normal review.
                  var isPromotePrecedent = u.suggestedCategory === "promote-precedent";
                  var isReverification = u.suggestedCategory === "needs-reverification";
                  var isConflict = isPromotePrecedent || isReverification;

                  var catLabel, catCls, borderCls;
                  if (isPromotePrecedent) {
                    catLabel = "✨ Precedent set";
                    catCls = "bg-green-100 text-green-800 border border-green-300";
                    borderCls = "border-2 border-green-400";
                  } else if (isReverification) {
                    catLabel = "⚠ Unexpected rejection";
                    catCls = "bg-purple-100 text-purple-800 border border-purple-300";
                    borderCls = "border-2 border-purple-400";
                  } else if (u.suggestedCategory === "auto-approved") {
                    catLabel = "⚡ Auto-approve";
                    catCls = "bg-green-100 text-green-800";
                    borderCls = "border border-gray-200";
                  } else if (u.suggestedCategory === "preauth-required") {
                    catLabel = "🔍 Preauth needed";
                    catCls = "bg-amber-100 text-amber-800";
                    borderCls = "border border-gray-200";
                  } else if (u.suggestedCategory === "not-covered") {
                    catLabel = "❌ Not covered";
                    catCls = "bg-red-100 text-red-800";
                    borderCls = "border border-gray-200";
                  } else {
                    catLabel = u.suggestedCategory;
                    catCls = "bg-gray-100 text-gray-800";
                    borderCls = "border border-gray-200";
                  }

                  return (
                    <div key={u.updateId} className={"bg-white rounded p-2 " + borderCls}>
                      <div className="font-medium text-xs text-gray-800">{u.payerName}</div>
                      <div className="flex items-center gap-2 mt-1 mb-2 flex-wrap">
                        <span className={"text-[10px] px-1.5 py-0.5 rounded font-semibold " + catCls}>{catLabel}</span>
                        <span className="text-[10px] text-gray-500 truncate">{u.detectedFrom}</span>
                      </div>
                      {isPromotePrecedent && (
                        <div className="text-[10px] text-green-700 mb-2 italic">
                          First authorization recorded for this payer. Promoting saves preauth delay for future patients.
                          See Floyd's email for context.
                        </div>
                      )}
                      {isReverification && (
                        <div className="text-[10px] text-purple-700 mb-2 italic">
                          Rejection happened despite favorable history. Most likely patient-specific — read Floyd's email
                          before deciding. Default action is keep current classification.
                        </div>
                      )}
                      <div className="flex gap-1">

                    </div>

      {msg.text && (

      {view === "referrals" && (

          {role === "ma" && (

                            <div className="font-medium text-sm text-gray-900">{p.name || "(no name)"}</div>

                            {(p.insurancePrimary || p.memberIdPrimary) && (
                              <div className="text-xs text-gray-500">Ins: {p.insurancePrimary || ""}{p.memberIdPrimary ? " #" + p.memberIdPrimary : ""}</div>

                            {(p.insuranceSecondary || p.memberIdSecondary) && (

              <div className="text-xs text-gray-500 text-center">Or enter manually below</div>

          {(function(){
            // Tighter contra keyword scan (manual entry fallback — Haiku handles photo path)
