function sumChecked(arr) { return arr.filter(Boolean).length; }

// Phone format validation: should normalize to exactly 10 digits.
// Returns true if the string contains a valid US phone number.
function isValidPhone(s) {
  if (!s) return false;
  var digits = String(s).replace(/\D/g, "");
  return digits.length === 10 || digits.length === 11; // 11 = with country code
}

// Normalize phone for comparison: digits only, last 10
function normalizePhone(s) {
  if (!s) return "";
  var d = String(s).replace(/\D/g, "");
  return d.slice(-10);
}

// Compare two values from main parse vs verification pass.
// Returns null if they match (or one is missing), otherwise returns {field, primary, verified}.
function compareNumeric(field, primary, verified) {
  if (!primary || !verified) return null; // can't compare
  if (field === "phone") {
    return normalizePhone(primary) === normalizePhone(verified) ? null : { field: field, primary: primary, verified: verified };
  }
  // Member IDs: case-insensitive, strip whitespace and dashes for comparison
  var p = String(primary).replace(/[\s-]/g, "").toUpperCase();
  var v = String(verified).replace(/[\s-]/g, "").toUpperCase();
  return p === v ? null : { field: field, primary: primary, verified: verified };
}

// Classify a referral's payer mix into a tier:
//   "green"   = Medicare Part B (traditional, fast preauth, approved)
//   "yellow"  = Medicare + secondary OR BCBS Medicare Advantage (slower preauth but approved)
//   "red"     = anything else (commercial, other MA plans, Medicaid, unknown payer with insurance listed)
//   "neutral" = no insurance info parsed at all (unknown — don't penalize)
// Input: { primary: "Medicare Part B", secondary: "BCBS Medigap" } or empty object
function classifyPayer(primary, secondary) {
  var p = String(primary || "").toLowerCase();
  var s = String(secondary || "").toLowerCase();
  if (!p && !s) return { tier: "neutral", reason: "" };

  var hasMedicare = /\bmedicare\b/.test(p) && !/advantage|ma\s*plan|hmo|ppo/.test(p);
  var isMA = /medicare\s*advantage|ma\s*plan/.test(p) || /medicare\s*advantage|ma\s*plan/.test(s);
  var isBCBS = /bcbs|blue\s*cross|blue\s*shield/.test(p) || /bcbs|blue\s*cross|blue\s*shield/.test(s);
  var hasSecondary = !!s;

  // Green: plain Medicare with NO secondary
  if (hasMedicare && !hasSecondary && !isMA) return { tier: "green", reason: "Medicare" };
  // Yellow: BCBS Medicare Advantage (only MA plan currently approved)
  if (isMA && isBCBS) return { tier: "yellow", reason: "BCBS Medicare Advantage" };
  // Yellow: Medicare with any secondary (long preauth but approved path)
  if (hasMedicare && hasSecondary) return { tier: "yellow", reason: "Medicare + secondary" };
  // Red: everything else (other MA, commercial, Medicaid, unknown payer)
  return { tier: "red", reason: primary || secondary || "Non-Medicare payer" };
}

// Local date YYYY-MM-DD. Using toISOString() gives UTC, which shifts the date
// forward for late-evening Eastern submissions (9pm ET = 1am UTC next day).
function todayLocal() {
  var d = new Date();
  var y = d.getFullYear();
  var m = String(d.getMonth() + 1).padStart(2, "0");
  var day = String(d.getDate()).padStart(2, "0");
  return y + "-" + m + "-" + day;
}

  // Storage usage monitoring - localStorage has ~5MB ceiling, photos are the main consumer
  function getStorageUsageBytes() {
    var total = 0;
    try {
      for (var key in localStorage) {
        if (localStorage.hasOwnProperty(key)) {
          // Each char is 2 bytes in UTF-16 localStorage
          total += (localStorage[key].length + key.length) * 2;
        }
      }
    } catch(e) {}
    return total;
  }
  function getStorageUsagePct() {
    // Assume 5MB ceiling (Safari iOS is actually 5MB, Chrome is 10MB)
    return Math.round((getStorageUsageBytes() / (5 * 1024 * 1024)) * 100);

    if (!hasSubmittedVisit) {
      flash("Cannot clear " + patientId + " — no submitted visit yet. Submit D0 first.", "err");
      return;
    }
    if (!confirm("Clear all local data for " + patientId + "?\n\nThis removes photos and the local draft from this device. Cloud data (Sheet1, Drafts tab, Drive folder) is NOT affected. Use this after the patient's visit is complete and synced.")) return;

    var remainingPhotos = photos.filter(function(p) { return p.patientId !== patientId; });
    setPhotos(remainingPhotos);
    try { storage.set(PHOTOS_KEY, JSON.stringify(remainingPhotos)); } catch(e) {}

    setDrafts(newDrafts);

  async function addReferral(forceAdd, source) {
    // source: undefined = form path (uses newRef), or {queueId} = queue path
    var data;
    if (source && source.queueId != null) {
      var item = parseQueue.find(function(q){ return q.id === source.queueId; });
      if (!item || item.status !== "parsed" || !item.parsed) { flash("Queue item not ready", "err"); return; }
      var p = item.parsed;
      // Rebuild notes in same format parseReferralPhoto uses (CONTRA/Ins/Sec markers)
      var parts = [];
      if (Array.isArray(p.contraindications) && p.contraindications.length) {
        parts.push("CONTRA: " + p.contraindications.join(", "));
      }
      if (p.insurancePrimary || p.memberIdPrimary) {
        parts.push("Ins: " + (p.insurancePrimary || "Primary") + (p.memberIdPrimary ? " #" + p.memberIdPrimary : ""));
      }
      if (p.insuranceSecondary || p.memberIdSecondary) {
        parts.push("Sec: " + (p.insuranceSecondary || "Secondary") + (p.memberIdSecondary ? " #" + p.memberIdSecondary : ""));
      }
      if (p.notes) parts.push(p.notes);
      data = {
        name: p.name || "", dob: p.dob || "", phone: p.phone || "",
        provider: p.provider || "", notes: parts.join(" | "), orderDate: p.orderDate || "",
        state: p.state || "", referringClinicState: p.referringClinicState || "",
        referringClinicName: p.referringClinicName || "", referringClinicCity: p.referringClinicCity || ""
      };
    } else {
      data = {
        name: newRef.name, dob: newRef.dob, phone: newRef.phone,
        provider: newRef.provider, notes: newRef.notes, orderDate: "",
        state: newRef.state || "", referringClinicState: newRef.referringClinicState || ""
      };
    }
    if (!data.name.trim() || !data.phone.trim()) { flash("Name and phone required", "err"); return; }
    if (!sheetUrl) { flash("Set database URL first", "err"); return; }
    try {
      var payload = {
        _action: "addReferral",
        patientName: data.name, dob: data.dob, phone: data.phone,
        referringProvider: data.provider, notes: data.notes,
        orderDate: data.orderDate,
        state: data.state || "", referringClinicState: data.referringClinicState || ""
      };
      if (forceAdd) payload.forceAdd = true;
      var resp = await fetch(sheetUrl, {
        method: "POST",
        body: JSON.stringify(payload)
      });
      var result = await resp.json();
      if (result.status === "ok") {
        flash("Referral added");
        if (source && source.queueId != null) {
          setParseQueue(function(q){ return q.filter(function(x){ return x.id !== source.queueId; }); });
        } else {
          setNewRef({ name: "", dob: "", phone: "", provider: "", notes: "" });
        }
        setDupModal(null);
        loadReferrals();
      } else if (result.status === "duplicate") {
        setDupModal({ existing: result.existing, source: source });
      } else { flash("Error: " + (result.message || ""), "err"); }
    } catch(e) { flash("Error: " + e.toString(), "err"); }
  }

  function startIntakeFromReferral(ref) {
    set("referringProvider", ref.provider || "");
    setPatientName(ref.name || "");
    // Hydrate contact fields directly from the throughput columns
    if (ref.phone) set("phone", ref.phone);
    if (ref.dob) set("dob", ref.dob);
    // Parse insurance back out of the notes string we built during parseReferralPhoto.
    // Format: "CONTRA: ... | Ins: Medicare Part B #1EG4... | Sec: BCBS #ABC... | reason"
    // This is a temporary ugliness until Supabase gives us real insurance columns.
    function extractInsurance(prefix, notes) {
      var re = new RegExp("\\b" + prefix + ":\\s*([^|]+)", "i");
      var m = re.exec(notes);
      if (!m) return null;
      var chunk = m[1].trim();
      var hashIdx = chunk.indexOf("#");
      if (hashIdx >= 0) {
        return { name: chunk.substring(0, hashIdx).trim(), memberId: chunk.substring(hashIdx + 1).trim() };
      }
      return { name: chunk, memberId: "" };
    }
    var notesStr = ref.notes || "";
    var primary = extractInsurance("Ins", notesStr);
    var secondary = extractInsurance("Sec", notesStr);
    if (primary) {
      if (primary.name) set("insuranceName", primary.name);
      if (primary.memberId) set("memberId", primary.memberId);
    }
    if (secondary) {
      if (secondary.name) set("insuranceName2", secondary.name);
      if (secondary.memberId) set("memberId2", secondary.memberId);
    }
    var id = generatePatientId();
    setForm(function(f) { return Object.assign({}, f, { patientId: id, visitType: "Phone Intake", _referralRowIndex: ref.rowIndex || null }); });
    // Save to directory
    if (ref.name) {
      var d = directory.slice();
      d.push({ name: ref.name, id: id });
      setDirectory(d);
      try { localStorage.setItem("dncDir", JSON.stringify(d)); } catch(e) {}
    }
    // Update throughput with DNC ID
    if (ref.rowIndex) {
      updateReferralStatus(ref.rowIndex, "dncId", id);
    }
    setView("form");
    setFormSection("intake");
    var hydrated = [];
    if (primary) hydrated.push("primary ins");
    if (secondary) hydrated.push("secondary ins");
    if (ref.phone) hydrated.push("phone");
    if (ref.dob) hydrated.push("DOB");
    var hydratedMsg = hydrated.length ? " (hydrated: " + hydrated.join(", ") + ")" : "";
    flash("Loaded referral for " + ref.name + " as " + id + hydratedMsg);
  }

  // Downscale a camera photo / image file to fit within Anthropic's 5 MB per-image limit
  // while preserving enough detail for OCR on referral text. Returns a Promise<string>
  // resolving to a base64 data URL. Uses canvas to resize+recompress client-side.
  // Target: max 2000px on the long edge, JPEG quality 0.85, which lands under 1 MB for
  // typical document photos. Retries with lower quality if the first attempt is still big.
  function downscaleImageFile(file) {
    return new Promise(function(resolve, reject) {
      // Short-circuit for small files (already under threshold) and non-images (PDFs etc.)
      if (!file.type || file.type.indexOf("image/") !== 0) {
        var reader0 = new FileReader();
        reader0.onload = function(ev) { resolve(ev.target.result); };
        reader0.onerror = function() { reject(new Error("Read failed")); };
        reader0.readAsDataURL(file);
        return;
      }
      // If the file is already small enough, skip the canvas round trip (saves CPU + memory)
      if (file.size < 4 * 1024 * 1024) {
        var reader1 = new FileReader();
        reader1.onload = function(ev) { resolve(ev.target.result); };
        reader1.onerror = function() { reject(new Error("Read failed")); };
        reader1.readAsDataURL(file);
        return;
      }

      var img = new Image();
      var objectUrl = URL.createObjectURL(file);
      img.onload = function() {
        try {
          var maxDim = 2000;
          var w = img.naturalWidth, h = img.naturalHeight;
          if (w > maxDim || h > maxDim) {
            if (w >= h) { h = Math.round(h * (maxDim / w)); w = maxDim; }
            else { w = Math.round(w * (maxDim / h)); h = maxDim; }
          }
          var canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          var ctx = canvas.getContext("2d");
          // White background in case the source has alpha
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          // Start at q=0.85. If the resulting base64 decodes to over ~4.5MB, retry at q=0.7, then 0.55.
          function tryQuality(q) {
            var dataUrl = canvas.toDataURL("image/jpeg", q);
            // Estimate decoded byte size: base64 length * 0.75, minus the "data:image/jpeg;base64," prefix
            var b64 = dataUrl.split(",")[1] || "";
            var estBytes = Math.floor(b64.length * 0.75);
            if (estBytes > 4500000 && q > 0.5) {
              return tryQuality(q - 0.15);
            }
            return dataUrl;
          }
          var result = tryQuality(0.85);
          URL.revokeObjectURL(objectUrl);
          resolve(result);
        } catch(err) {
          URL.revokeObjectURL(objectUrl);
          reject(err);
        }
      };
      img.onerror = function() {
        URL.revokeObjectURL(objectUrl);
        reject(new Error("Image decode failed"));
      };
      img.src = objectUrl;
    });
  }

  function handleReferralPhotoCapture(e) {
    var files = Array.from(e.target.files || []);
    if (!files.length) return;

    // Single-file path: use existing flow that pre-fills the NEW REFERRAL form
    if (files.length === 1) {
      downscaleImageFile(files[0])
        .then(function(dataUrl) { parseReferralPhoto(dataUrl); })
        .catch(function(err) { flash("Failed to read photo: " + err.toString(), "err"); });
      e.target.value = ""; // allow re-selection of same file
      return;
    }

    // Multi-file path: parse all into a queue, user reviews and adds each
    var now = Date.now();
    var newItems = files.map(function(file, i) {
      return { id: now + i, status: "parsing", parsed: null, error: "", fileName: file.name || ("Photo " + (i+1)) };
    });
    setParseQueue(function(q){ return q.concat(newItems); });
    flash("Parsing " + files.length + " referrals...");

    files.forEach(function(file, i) {
      var qid = newItems[i].id;
      downscaleImageFile(file)
        .then(function(dataUrl) { parseReferralToQueue(qid, dataUrl); })
        .catch(function(err) {
          setParseQueue(function(q){
            return q.map(function(item){
              return item.id === qid ? Object.assign({}, item, { status: "error", error: "Read failed: " + err.toString() }) : item;
            });
          });
        });
    });

    e.target.value = ""; // allow re-selection
  }

  async function parseReferralToQueue(queueId, base64Data) {
    if (!sheetUrl) {
      setParseQueue(function(q){
        return q.map(function(item){
          return item.id === queueId ? Object.assign({}, item, { status: "error", error: "No script URL" }) : item;
        });
      });
      return;
    }
    try {
      var resp = await fetch(sheetUrl, {
        method: "POST",
        body: JSON.stringify({ _action: "parseReferralPhoto", imageData: base64Data })
      });
      var result = await resp.json();
      if (result.status === "ok" && result.parsed) {
        var p = result.parsed;
        // Format validation: phone must be 10-11 digits
        var formatWarnings = [];
        if (p.phone && !isValidPhone(p.phone)) formatWarnings.push("Phone number doesn't look right: " + p.phone);
        // Member ID sanity: flag if it contains '?' (model couldn't read a character)
        if (p.memberIdPrimary && p.memberIdPrimary.indexOf("?") >= 0) formatWarnings.push("Primary member ID has unreadable characters: " + p.memberIdPrimary);
        if (p.memberIdSecondary && p.memberIdSecondary.indexOf("?") >= 0) formatWarnings.push("Secondary member ID has unreadable characters: " + p.memberIdSecondary);
        // Payer classification
        var payerTier = classifyPayer(p.insurancePrimary, p.insuranceSecondary);
        // Capture confidence signals from two-pass pipeline (if present)
        var confidence = result.confidence || null;
        var disagreements = result.disagreements || [];
        var pipelineWarnings = result.warnings || [];
        // Merge pipeline warnings into formatWarnings
        if (pipelineWarnings.length) formatWarnings = formatWarnings.concat(pipelineWarnings);
        setParseQueue(function(q){
          return q.map(function(item){
            return item.id === queueId
              ? Object.assign({}, item, { status: "parsed", parsed: p, formatWarnings: formatWarnings, payerTier: payerTier, confidence: confidence, disagreements: disagreements })
              : item;
          });
        });
      } else {
        setParseQueue(function(q){
          return q.map(function(item){
            return item.id === queueId ? Object.assign({}, item, { status: "error", error: result.message || "parse failed" }) : item;
          });
        });
      }
    } catch(e) {
      setParseQueue(function(q){
        return q.map(function(item){
          return item.id === queueId ? Object.assign({}, item, { status: "error", error: e.toString() }) : item;
        });
      });
    }
  }

  function skipFromQueue(queueId) {

  }

        if (p.diabetesType) set("diabetesType", p.diabetesType);
        if (p.diabetesDuration) set("diabetesDuration", p.diabetesDuration);

        if (p.srRhythm) set("srRhythm", p.srRhythm);

        // Arrays: pain descriptors, pmhx, prior tx, allergies, contraindications, functional limitations
        // Strict Array.isArray check: Haiku occasionally returns comma-separated strings instead
        // of arrays for these fields. Accept only actual arrays; silently ignore string fallbacks.
        if (Array.isArray(p.painDescriptors) && p.painDescriptors.length) setForm(function(f) { return Object.assign({}, f, { painDescriptors: p.painDescriptors }); });

        if (Array.isArray(p.allergies) && p.allergies.length) setForm(function(f) { return Object.assign({}, f, { allergies: p.allergies }); });
        if (Array.isArray(p.contraindications) && p.contraindications.length) setForm(function(f) { return Object.assign({}, f, { contraindications: p.contraindications }); });
        if (Array.isArray(p.functionalLimitations) && p.functionalLimitations.length) setForm(function(f) { return Object.assign({}, f, { functionalLimitations: p.functionalLimitations }); });
        // Free text fields
        if (p.painNotes) set("painNotes", p.painNotes);
        if (p.txNotes) set("txNotes", p.txNotes);
        if (p.pmhxNotes) set("pmhxNotes", p.pmhxNotes);
        if (p.socialNotes) set("socialNotes", p.socialNotes);
        flash("Parsed! Review and correct the fields below.");
      } else {
        flash("Parse failed: " + (result.message || "unknown error"), "err");
      }
    } catch(e) {
      flash("Parse failed: " + e.toString(), "err");
    }
    setParsing(false);
  }

  function saveDraft() {
    if (!form.patientId) { flash("Enter Patient ID", "err"); return; }
    var draftData = Object.assign({}, form, { savedAt: new Date().toISOString() });
    // Save locally
    var updated = Object.assign({}, drafts);
    updated[form.patientId] = draftData;
    setDrafts(updated);
    storage.set(DRAFTS_KEY, JSON.stringify(updated));
    // Reverse-sync corrections back to the source referral row
    syncReferralCorrections();
    // Save to cloud
    if (sheetUrl) {
      var cloudData = withUserContext(Object.assign({}, draftData, { _action: "saveDraft", patientName: patientName }));
      fetch(sheetUrl, { method: "POST", mode: "no-cors", body: JSON.stringify(cloudData) })
        .then(function() { flash("Draft saved locally + cloud"); })
        .catch(function() { flash("Draft saved locally (cloud failed)", "warn"); });
    } else {
      flash("Draft saved locally");
    }
  }

  // Reverse-sync corrected demographics + insurance back to the source referral row,
  // so the Referrals tab card stays in sync with the MA's corrections during intake.
  // Fire-and-forget; never blocks the UI. No-ops if the form wasn't loaded from a referral.
  function syncReferralCorrections() {
    if (!form._referralRowIndex || !sheetUrl) return;
    var payload = withUserContext({
      _action: "updateReferralCorrections",
      rowIndex: form._referralRowIndex,
      patientName: patientName || "",

      phone: form.phone || "",
      referringProvider: form.referringProvider || "",

    });

    } catch(e) {}

  // Silent auto-save: fires on form changes, debounced, no flash messages
  function autoSaveDraft() {
    if (!form.patientId) return;
    // Guard: don't overwrite cloud draft with empty form. If the form has no name,
    // no age, no demographics, no clinical content, refuse to save. This prevents
    // data loss when the form is reset (e.g. after submit, after switching patients,
    // after page refresh while a stale patientId lingers).
    var hasContent = patientName || form.age || form.sex || form.dob || form.phone ||
      form.painRest || form.painBest || form.painWorst ||
      form.medications || form.referringProvider ||
      (form.pmhx && form.pmhx.length > 0) ||
      (form.painDescriptors && form.painDescriptors.length > 0) ||
      (form.priorTx && form.priorTx.length > 0);
    if (!hasContent) return;
    var draftData = Object.assign({}, form, { savedAt: new Date().toISOString() });
    var updated = Object.assign({}, drafts);
    updated[form.patientId] = draftData;
    setDrafts(updated);
    try { storage.set(DRAFTS_KEY, JSON.stringify(updated)); } catch(e) {}
    // Reverse-sync corrections back to the source referral row
    syncReferralCorrections();
    if (sheetUrl) {
      var cloudData = withUserContext(Object.assign({}, draftData, { _action: "saveDraft", patientName: patientName }));
      try {
        fetch(sheetUrl, { method: "POST", mode: "no-cors", body: JSON.stringify(cloudData) });
        setLastAutoSave(new Date());
      } catch(e) {}
    }
  }

  // Debounced auto-save effect. Intentionally depends only on form, not patientName:
  // patientName is included inside the save payload but shouldn't trigger saves by itself.
  // This prevents post-submit setPatientName("") from firing a stale autosave.
  useEffect(function() {
    if (!form.patientId) return;
    var t = setTimeout(autoSaveDraft, 1500);
    return function() { clearTimeout(t); };
  }, [form]);

  async function loadDraft(optionalId) {
    var pid = (typeof optionalId === "string" && optionalId) ? optionalId : form.patientId;
    if (!pid) { flash("Enter Study ID to load", "err"); return; }
    var draftData = null;

    // Try cloud first
    if (sheetUrl) {
      try {
        flash("Loading from cloud...");
        var url = sheetUrl + "?action=loadDraft&id=" + encodeURIComponent(pid);
        var resp = await fetch(url, { redirect: "follow" });
        var result = await resp.json();
        if (result.status === "ok" && result.draft) {
          draftData = result.draft;
          if (result.source === "sheet1_fallback") {
            flash("Loaded from Sheet1 (no draft found, using last submitted visit)", "warn");
          }
        } else if (result.status === "not_found") {
          flash("No cloud draft for " + pid, "warn");
        } else {
          flash("Cloud err: " + (result.message || result.status), "err");
        }
      } catch(e) { flash("Fetch failed: " + e.toString(), "err"); }
    }

    // Fall back to local
    if (!draftData) {
      draftData = drafts[pid];
    }

    if (!draftData) { flash("No draft found for " + pid, "warn"); return; }

    // Load intake + device data, clear sensory fields for fresh assessment
    // Defensive array defaults protect against Sheet1-fallback loads (which don't reconstruct
    // these fields) and any old drafts saved before these fields existed.
    var loaded = Object.assign({}, draftData, {
      date: todayLocal(),
      // Defensive: arrays that may be missing from Sheet1 fallback or old drafts
      allergies: (draftData && draftData.allergies) || [],
      functionalLimitations: (draftData && draftData.functionalLimitations) || [],
      pmhx: (draftData && draftData.pmhx) || [],
      priorTx: (draftData && draftData.priorTx) || [],
      painDescriptors: (draftData && draftData.painDescriptors) || [],
      dxCodes: (draftData && draftData.dxCodes) || [],
      contraindications: (draftData && draftData.contraindications) || [],
      // Sensory arrays: defensive defaults if missing from old drafts, but preserve any saved values
      leftFootPre: (draftData && draftData.leftFootPre) || Array(12).fill(false),
      leftFootPost: (draftData && draftData.leftFootPost) || Array(12).fill(false),
      rightFootPre: (draftData && draftData.rightFootPre) || Array(12).fill(false),
      rightFootPost: (draftData && draftData.rightFootPost) || Array(12).fill(false),
    });
    setForm(loaded);
    // Restore patient name. Priority: explicit field on the draft (saved via saveDraft),
    // then directory lookup as fallback. CRITICAL: explicitly clear stale name first —
    // if the loaded draft has no name and no directory entry, we must NOT keep the
    // previous patient's name in the field.
    var nameFromDraft = draftData.patientName || draftData._patientName || "";
    if (nameFromDraft) {
      setPatientName(nameFromDraft);
    } else {
      var dirEntry = directory.find(function(e) { return e.id === pid; });
      setPatientName(dirEntry ? dirEntry.name : "");
    }
    // Also save to local drafts. Use `pid` (the actual loaded ID) not `form.patientId`
    // which is still the stale pre-setForm value due to React's async state updates.
    var updated = Object.assign({}, drafts);
    updated[pid] = draftData;
    setDrafts(updated);
    storage.set(DRAFTS_KEY, JSON.stringify(updated));
    flash("Loaded " + pid);
  }

  // Photo functions
  function capturePhoto(photoType) {
    var pid = photoPatientId || form.patientId;
    if (!pid) { flash("Enter a Patient ID first", "err"); return; }
    // Signature types open the signature modal instead of camera
    if (photoType === "signature_patient" || photoType === "signature_witness") {
      setSigModalType(photoType);
      setTimeout(function() {
        var canvas = document.getElementById("sig-canvas");
        if (canvas) {
          var ctx = canvas.getContext("2d");
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.strokeStyle = "#000000";
          ctx.lineWidth = 2.5;
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
        }
      }, 50);
      return;
    }
    var input = document.createElement("input");
    input.type = "file"; input.accept = "image/*";
    input.onchange = function(e) {
      var file = e.target.files[0]; if (!file) return;
      var reader = new FileReader();
      reader.onload = function(ev) {
        var img = new Image();
        img.onload = function() {
          var canvas = document.createElement("canvas");
          var maxDim = 1200; var w = img.width; var h = img.height;
          if (w > maxDim || h > maxDim) { if (w > h) { h = h*maxDim/w; w = maxDim; } else { w = w*maxDim/h; h = maxDim; } }
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          var compressed = canvas.toDataURL("image/jpeg", 0.7);
          var newPhoto = { id: Date.now(), patientId: pid, type: photoType, timestamp: new Date().toISOString(), data: compressed };
          // Remove any existing photo of this type for this patient (re-capture overwrites)
          var filtered = photos.filter(function(p){ return !(p.patientId === pid && p.type === photoType); });
          var updated = filtered.concat([newPhoto]);
          setPhotos(updated);
          try { storage.set(PHOTOS_KEY, JSON.stringify(updated)); } catch(e) { flash("Storage full", "warn"); }
          var matched = PHOTO_TYPES.find(function(t){return t.key===photoType});
          flash((matched ? matched.label : photoType) + " captured");
          // Auto-parse insurance card front (where the member ID lives) and device sticker
          if (photoType === "insurance_primary_front") {
            parseMedicareCard(compressed, false);
          } else if (photoType === "insurance_secondary_front") {
            parseMedicareCard(compressed, true);
          } else if (photoType === "serial") {
            parseDeviceSticker(compressed, "device");
          } else if (photoType === "needles") {
            parseDeviceSticker(compressed, "needles");
          }
        };
        img.onerror = function() { flash("Photo decode failed, try capturing again", "err"); };
        img.src = ev.target.result;
      };
      reader.onerror = function() { flash("Failed to read photo file, try again", "err"); };
      reader.readAsDataURL(file);
    };
    input.click();
  }

  // Clipboard-paste variant of capturePhoto — reads the clipboard via navigator.clipboard.read()
  // and stores the image under the given photoType. Used for pasting insurance card images
  // from Spruce/screenshots on desktop.
  async function pasteClipboardPhoto(photoType) {
    var pid = photoPatientId || form.patientId;
    if (!pid) { flash("Enter a Patient ID first", "err"); return; }
    if (!navigator.clipboard || !navigator.clipboard.read) {
      flash("Clipboard paste not supported in this browser — use Capture instead", "err");
      return;
    }
    try {
      var items = await navigator.clipboard.read();
      var blob = null;
      for (var i = 0; i < items.length; i++) {
        var item = items[i];
        for (var t = 0; t < item.types.length; t++) {
          if (item.types[t].indexOf("image/") === 0) {
            blob = await item.getType(item.types[t]);
            break;
          }
        }
        if (blob) break;
      }
      if (!blob) { flash("No image on clipboard", "err"); return; }
      var reader = new FileReader();
      reader.onload = function(ev) {
        var img = new Image();
        img.onload = function() {
          var canvas = document.createElement("canvas");
          var maxDim = 1200; var w = img.width; var h = img.height;
          if (w > maxDim || h > maxDim) { if (w > h) { h = h*maxDim/w; w = maxDim; } else { w = w*maxDim/h; h = maxDim; } }
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          var compressed = canvas.toDataURL("image/jpeg", 0.7);
          var newPhoto = { id: Date.now(), patientId: pid, type: photoType, timestamp: new Date().toISOString(), data: compressed };
          var filtered = photos.filter(function(p){ return !(p.patientId === pid && p.type === photoType); });
          var updated = filtered.concat([newPhoto]);
          setPhotos(updated);
          try { storage.set(PHOTOS_KEY, JSON.stringify(updated)); } catch(e) { flash("Storage full", "warn"); }
          var matched = PHOTO_TYPES.find(function(t){return t.key===photoType});
          flash((matched ? matched.label : photoType) + " pasted");
          if (photoType === "insurance_primary_front") parseMedicareCard(compressed, false);
          else if (photoType === "insurance_secondary_front") parseMedicareCard(compressed, true);
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(blob);
    } catch(e) {
      flash("Clipboard read failed: " + e.toString(), "err");
    }
  }

  function getSigCoords(e, canvas) {
    var rect = canvas.getBoundingClientRect();
    var scaleX = canvas.width / rect.width;
    var scaleY = canvas.height / rect.height;
    var clientX, clientY;
    if (e.touches && e.touches.length > 0) {
      clientX = e.touches[0].clientX;
      clientY = e.touches[0].clientY;
    } else {
      clientX = e.clientX;
      clientY = e.clientY;
    }
    return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
  }

  function sigStart(e) {
    e.preventDefault();
    setSigDrawing(true);
    var canvas = document.getElementById("sig-canvas");
    if (!canvas) return;
    var ctx = canvas.getContext("2d");
    var pos = getSigCoords(e, canvas);
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
  }

  function sigMove(e) {
    if (!sigDrawing) return;
    e.preventDefault();
    var canvas = document.getElementById("sig-canvas");
    if (!canvas) return;
    var ctx = canvas.getContext("2d");
    var pos = getSigCoords(e, canvas);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
  }

  function sigEnd(e) {
    if (e) e.preventDefault();
    setSigDrawing(false);
  }

  function sigClear() {
    var canvas = document.getElementById("sig-canvas");
    if (!canvas) return;
    var ctx = canvas.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  function sigSave() {
    var canvas = document.getElementById("sig-canvas");
    if (!canvas) return;
    // Check if canvas is blank
    var ctx = canvas.getContext("2d");
    var pixels = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
    var hasInk = false;
    for (var i = 0; i < pixels.length; i += 4) {
      if (pixels[i] < 250 || pixels[i+1] < 250 || pixels[i+2] < 250) { hasInk = true; break; }
    }
    if (!hasInk) { flash("Sign first", "err"); return; }
    var dataUrl = canvas.toDataURL("image/jpeg", 0.85);

    // Consent signatures go to temp state, not photos
    if (sigModalType === "consent_patient") {
      setConsentSigs(function(s) { return Object.assign({}, s, { patient: dataUrl }); });
      setSigModalType(null);
      flash("Patient signature captured");
      return;
    }
    if (sigModalType === "consent_witness") {
      setConsentSigs(function(s) { return Object.assign({}, s, { witness: dataUrl }); });
      setSigModalType(null);
      flash("Witness signature captured");
      return;
    }

    // Regular signature photos
    var pid = photoPatientId || form.patientId;
    if (!pid) { flash("No Patient ID", "err"); return; }
    var newPhoto = { id: Date.now(), patientId: pid, type: sigModalType, timestamp: new Date().toISOString(), data: dataUrl };
    var updated = photos.concat([newPhoto]);
    setPhotos(updated);
    try { storage.set(PHOTOS_KEY, JSON.stringify(updated)); } catch(e) { flash("Storage full", "warn"); }
    var matched = PHOTO_TYPES.find(function(t){return t.key===sigModalType});
    flash((matched ? matched.label : "Signature") + " saved");
    setSigModalType(null);
  }

  // Composite consent = title + acknowledgment + two signatures + timestamp, rendered as one image
  function saveConsent() {
    var pid = form.patientId;
    if (!pid) { flash("No Patient ID", "err"); return; }
    if (!currentConsent) return;
    var consent = CONSENTS.find(function(c){return c.key===currentConsent});
    if (!consent) return;
    if (!consentSigs.patient) { flash("Patient signature required", "err"); return; }
    if (!consentSigs.witness) { flash("Witness signature required", "err"); return; }
    if (!consentSigs.witnessName.trim()) { flash("Witness name required", "err"); return; }

    // ---- Render full consent text onto a tall canvas with signatures at the bottom ----
    // Approach: measure and wrap body text line-by-line at 820px wide (900px canvas - 80px padding),
    // compute total height, draw everything, then the signature section, then save as one tall JPEG.
    var canvasWidth = 900;
    var padX = 40;
    var contentWidth = canvasWidth - (padX * 2);
    var lineHeight = 20;
    var bodyFont = "14px Arial";
    var titleFont = "bold 22px Arial";
    var headerFont = "14px Arial";

    // Offscreen context just for measuring
    var measureCanvas = document.createElement("canvas");
    var mctx = measureCanvas.getContext("2d");
    mctx.font = bodyFont;

    function wrapLine(text, maxWidth) {
      var words = text.split(" ");
      var lines = [];
      var current = "";
      for (var i = 0; i < words.length; i++) {
        var test = current ? current + " " + words[i] : words[i];
        if (mctx.measureText(test).width > maxWidth && current) {
          lines.push(current);
          current = words[i];
        } else {
          current = test;
        }
      }
      if (current) lines.push(current);
      return lines;
    }

    // Build all wrapped lines for the body
    var bodyLines = [];
    var paragraphs = consent.body.split("\n");
    for (var p = 0; p < paragraphs.length; p++) {
      if (paragraphs[p] === "") {
        bodyLines.push(""); // blank line
      } else {
        var wrapped = wrapLine(paragraphs[p], contentWidth);
        for (var w = 0; w < wrapped.length; w++) bodyLines.push(wrapped[w]);
      }
    }

    // Compute total canvas height: header (130px) + body + signature block (280px) + footer (60px)
    var headerHeight = 130;
    var bodyHeight = bodyLines.length * lineHeight + 20;
    var sigBlockHeight = 280;
    var footerHeight = 60;
    var totalHeight = headerHeight + bodyHeight + sigBlockHeight + footerHeight;

    var canvas = document.createElement("canvas");
    canvas.width = canvasWidth;
    canvas.height = totalHeight;
    var ctx = canvas.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Header
    ctx.fillStyle = "#000000";
    ctx.font = titleFont;
    ctx.fillText(consent.title, padX, 40);
    ctx.font = headerFont;
    ctx.fillText("Diabetic Nerve Clinic", padX, 65);
    ctx.fillText("Study ID: " + pid, padX, 85);
    ctx.fillText("Date: " + new Date().toLocaleString(), padX, 105);
    // Horizontal rule
    ctx.strokeStyle = "#cccccc";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(padX, 120);
    ctx.lineTo(canvasWidth - padX, 120);
    ctx.stroke();

    // Body text
    ctx.font = bodyFont;
    ctx.fillStyle = "#000000";
    var y = headerHeight + 10;
    for (var bl = 0; bl < bodyLines.length; bl++) {
      ctx.fillText(bodyLines[bl], padX, y);
      y += lineHeight;
    }

    // Signature section
    var sigY = headerHeight + bodyHeight + 20;
    ctx.strokeStyle = "#cccccc";
    ctx.beginPath();
    ctx.moveTo(padX, sigY);
    ctx.lineTo(canvasWidth - padX, sigY);
    ctx.stroke();

    ctx.fillStyle = "#000000";
    ctx.font = "bold 14px Arial";
    ctx.fillText("SIGNATURES", padX, sigY + 25);

    // Patient sig box
    ctx.fillStyle = "#666666";
    ctx.font = "12px Arial";
    ctx.fillText("PATIENT SIGNATURE", padX, sigY + 50);
    ctx.strokeStyle = "#999999";
    ctx.strokeRect(padX, sigY + 60, 380, 160);

    // Witness sig box
    ctx.fillText("WITNESS SIGNATURE", 470, sigY + 50);
    ctx.strokeRect(470, sigY + 60, 380, 160);
    ctx.fillStyle = "#000000";
    ctx.font = "13px Arial";
    ctx.fillText("Witness: " + consentSigs.witnessName, 470, sigY + 245);

    var patientImg = new Image();
    patientImg.onerror = function() { flash("Patient signature image failed to load, try re-signing", "err"); };
    patientImg.onload = function() {
      ctx.drawImage(patientImg, padX, sigY + 60, 380, 160);

      var witnessImg = new Image();
      witnessImg.onerror = function() { flash("Witness signature image failed to load, try re-signing", "err"); };
      witnessImg.onload = function() {
        ctx.drawImage(witnessImg, 470, sigY + 60, 380, 160);

        // Footer
        var footY = sigY + sigBlockHeight;
        ctx.fillStyle = "#000000";
        ctx.font = "11px Arial";
        ctx.fillText("Diabetic Nerve Clinic — Signed electronically at the time of visit", padX, footY + 20);
        ctx.fillText("This document constitutes informed consent for the topics described above.", padX, footY + 38);

        // Save as photo (higher quality than before since this is a legal doc)
        var dataUrl = canvas.toDataURL("image/jpeg", 0.9);
        var newPhoto = { id: Date.now(), patientId: pid, type: consent.photoType, timestamp: new Date().toISOString(), data: dataUrl };
        // Remove any existing consent of this type to prevent duplicates on re-sign
        var filtered = photos.filter(function(ph){ return !(ph.patientId === pid && ph.type === consent.photoType); });
        var updated = filtered.concat([newPhoto]);
        setPhotos(updated);
        try { storage.set(PHOTOS_KEY, JSON.stringify(updated)); } catch(e) { flash("Storage full", "warn"); }
        flash(consent.title + " signed and saved");
        setCurrentConsent(null);
        setConsentSigs({ patient: null, witness: null, witnessName: "" });
        setScrolledToBottom(false);
      };
      witnessImg.src = consentSigs.witness;
    };
    patientImg.src = consentSigs.patient;
  }

  function deletePhoto(id) {
    if (!confirm("Delete this photo?")) return;
    var updated = photos.filter(function(p){return p.id !== id});
    setPhotos(updated); storage.set(PHOTOS_KEY, JSON.stringify(updated));

  function getPhotosForPatient(pid) { return photos.filter(function(p){return p.patientId === pid}); }

  // Build data row
  function buildRow() {
    var lPre=sumChecked(form.leftFootPre||[]), rPre=sumChecked(form.rightFootPre||[]);
    var lPost=sumChecked(form.leftFootPost||[]), rPost=sumChecked(form.rightFootPost||[]);
    // Defensive: guard against undefined array fields (e.g., from Sheet1 fallback loads)
    var safe = function(a) { return Array.isArray(a) ? a : []; };
    return {
      patientId:form.patientId, date:form.date, visitType:form.visitType,
      age:form.age, sex:form.sex, diabetesType:form.diabetesType, diabetesDuration:form.diabetesDuration,
      referringProvider:form.referringProvider, a1c:form.a1c,
      pmhx:safe(form.pmhx).join("; "), medications:form.medications, priorTx:safe(form.priorTx).join("; "),
      painDescriptors:safe(form.painDescriptors).join("; "),
      painNotes:form.painNotes, functionalNotes:form.functionalNotes,
      pmhxNotes:form.pmhxNotes, txNotes:form.txNotes,
      socialNotes:form.socialNotes, labNotes:form.labNotes,
      painRest:form.painRest, painBest:form.painBest, painWorst:form.painWorst,

  async function generatePreauth() {
    if (!form.patientId) { flash("Study ID required", "err"); return; }
    if (!patientName) { flash("Patient name required (enter in Assess tab)", "err"); return; }
    if (!form.age || !form.sex) { flash("Age and sex required", "err"); return; }
    if (!form.dxCodes.length) { flash("At least one DX code required", "err"); return; }
    if (!sheetUrl) { flash("No script URL configured", "err"); return; }

    // Billing audit - block if claim killers present
    var billingErrors = getBillingErrors();
    if (billingErrors.length > 0) {
      setValidationErrors(billingErrors);
      setShowOverride(true);
      return;
    }

    setPreauthGenerating(true);
    try {
      // Save draft first so the patient is findable later
      var draftData = Object.assign({}, form, { savedAt: new Date().toISOString() });
      var updated = Object.assign({}, drafts);
      updated[form.patientId] = draftData;
      setDrafts(updated);
      storage.set(DRAFTS_KEY, JSON.stringify(updated));
      var saveDraftPayload = withUserContext(Object.assign({}, draftData, { _action: "saveDraft", patientName: patientName }));
      await fetch(sheetUrl, { method: "POST", mode: "no-cors", body: JSON.stringify(saveDraftPayload) });

      // Then generate the preauth packet
      // Include any captured insurance card photos so the biller gets a standalone Insurance Cards doc
      var pid = form.patientId;
      var insurancePhotos = photos.filter(function(p) {
        return p.patientId === pid && p.type && p.type.indexOf("insurance_") === 0;
      }).map(function(p) {
        return { type: p.type, data: p.data };
      });
      var payload = withUserContext({
        _action: "generatePreauth",
        patientId: form.patientId,
        patientName: patientName,
        date: form.date,
        hnpText: generateHnP(),
        lomnText: generateLOMN(),
        insuranceCardPhotos: insurancePhotos
      });
      await fetch(sheetUrl, { method: "POST", mode: "no-cors", body: JSON.stringify(payload) });
      flash("Draft saved + preauth packet sent to biller", "ok");
    } catch(e) {
      flash("Error: " + e.toString(), "err");
    }
    setPreauthGenerating(false);
  }

  // Billing audit - claim-killer fields that cause Medicare rejection
  // Use for both D0 submit and Phone Intake → Generate Preauth paths
  function getBillingErrors() {
    var errors = [];

    // Identifying info
    if (!patientName) errors.push("REJECTION RISK: Patient name missing");
    if (!form.dob) errors.push("REJECTION RISK: DOB missing (Medicare requires)");
    if (!form.address || !form.city || !form.state || !form.zip) {
      errors.push("REJECTION RISK: Complete address missing (street/city/state/zip)");
    }
    if (!form.phone) errors.push("REJECTION RISK: Patient phone missing");

    // Insurance
    if (!form.insuranceName) errors.push("REJECTION RISK: Primary insurance name missing");
    if (!form.memberId) errors.push("REJECTION RISK: Insurance member ID missing");

    // Insurance card photos — biller requires these in the preauth packet
    var pid = form.patientId;
    var hasInsurancePhotos = pid && photos.some(function(p) {
      return p.patientId === pid && p.type && p.type.indexOf("insurance_") === 0;
    });
    if (!hasInsurancePhotos) errors.push("REJECTION RISK: Insurance card photos not captured (biller requires front/back of card in preauth packet)");

    // Billing codes
    if (!form.dxCodes || !form.dxCodes.length) {
      errors.push("REJECTION RISK: No ICD-10 diagnosis codes selected");
    }

    // Referring provider (Medicare requires for DME orders)
    if (!form.referringProvider) errors.push("REJECTION RISK: Referring provider name missing");

    // LOMN content requirements
    if (!form.painDuration) errors.push("REJECTION RISK: Pain duration missing (LOMN requires)");
    if (!form.medications) errors.push("REJECTION RISK: Current medications missing (LOMN requires)");
    if (!form.priorTx || !form.priorTx.length) {
      errors.push("REJECTION RISK: No prior conservative treatments documented (LOMN requires evidence of failed therapy)");
    }
    if (!form.painRest && !form.painWorst) {
      errors.push("REJECTION RISK: Pain rating missing (LOMN requires)");
    }

    // Contraindications must be actively screened (empty array means not screened)
    // Allow "none identified" by requiring an explicit acknowledgment via the contraindications field existing
    // The chip group exists; if user never touched it, that's not the same as "screened and none"
    // We accept either: at least one contraindication selected, OR an explicit "none" pseudo-flag
    // For now: warn if completely empty since user should at least look at the section
    // (Not strictly a rejection trigger, downgraded to warning would be ideal but keeping as error for safety)

    return errors;
  }

  // Validation - check for missing required items
  function getValidationErrors() {
    var errors = [];
    var pid = form.patientId;
    if (!pid) return ["Study ID required"];
    if (!patientName) return ["Patient name required (local only, for directory mapping)"];
    // Phone Intake uses Generate Preauth, not Submit. Block Submit path explicitly.
    if (form.visitType === "Phone Intake") return ["Phone Intake saves via the Generate Preauth button, not Submit. Switch Visit Type to D0 when ready for the implant."];

    var patientPhotos = pid ? getPhotosForPatient(pid) : [];
    var photoTypes = patientPhotos.map(function(p) { return p.type; });

    // D0 (placement visit): consents, device stickers, impedance
    if (form.visitType === "D0") {
      // Billing audit first - claim killers block submit
      var billingErrors = getBillingErrors();
      for (var bi = 0; bi < billingErrors.length; bi++) errors.push(billingErrors[bi]);

      if (photoTypes.indexOf("consent_procedure") === -1) errors.push("Missing: Procedure Consent (sign on Consent tab)");
      if (photoTypes.indexOf("consent_data") === -1) errors.push("Missing: Data Use Consent (sign on Consent tab)");
      if (photoTypes.indexOf("consent_social") === -1) errors.push("Missing: Social Media Consent (sign on Consent tab)");
      if (photoTypes.indexOf("serial") === -1) errors.push("Missing: Device Sticker (top)");
      if (photoTypes.indexOf("needles") === -1) errors.push("Missing: Needles Sticker (bottom)");
      if (!form.deviceSerial) errors.push("Missing: Device serial number (type or snap sticker)");
    }

    // D20 = explant day — no consent re-check (already signed at D0 and in Drive doc)
    // D90 = follow-up assessment — no device/consent requirements
    // (Future: add ear photo validation here if/when the capture UI is built)

    return errors;
  }

  const [showOverride, setShowOverride] = useState(false);
  const [validationErrors, setValidationErrors] = useState([]);

  function tryCopy() {
    var errors = getValidationErrors();
    if (errors.length > 0) {
      setValidationErrors(errors);
      setShowOverride(true);
      return;
    }
    setShowOverride(false);
    setValidationErrors([]);
    copyNoteWithPhotos();
  }

  function trySubmit() {
    var errors = getValidationErrors();
    if (errors.length > 0) {
      setValidationErrors(errors);
      setShowOverride(true);
      return;
    }
    setShowOverride(false);
    setValidationErrors([]);
    handleSubmit();
  }

  async function handleSubmit() {
    if (!form.patientId) { flash("Enter a Study ID", "err"); return; }
    if (!patientName) { flash("Enter patient name", "err"); return; }
    // Hard-block Phone Intake from the Submit path. This catches override attempts
    // that bypass validateForm. Phone Intake must use Generate Preauth.
    if (form.visitType === "Phone Intake") {
      flash("Phone Intake must use Generate Preauth. Switch Visit Type to D0 for implant day.", "err");
      return;
    }
    setSubmitting(true);
    var row = buildRow();

    // Auto-add to directory if not already there
    var alreadyInDir = directory.some(function(d) { return d.id === form.patientId; });
    if (patientName && !alreadyInDir) {
      var entry = { name: patientName, id: form.patientId, addedAt: new Date().toISOString() };
      var updatedDir = directory.concat([entry]);
      setDirectory(updatedDir);
      storage.set(DIRECTORY_KEY, JSON.stringify(updatedDir));
    }

    try { await copyNoteWithPhotos(); } catch(e) {}
    var updated = records.concat([Object.assign({}, row, { id: Date.now() })]);
    try { storage.set(STORAGE_KEY, JSON.stringify(updated)); setRecords(updated); } catch(e) {}
    // Update draft with latest intake/device data for future visits
    var d = Object.assign({}, drafts);
    d[form.patientId] = Object.assign({}, form, { savedAt: new Date().toISOString() });
    setDrafts(d);
    try { storage.set(DRAFTS_KEY, JSON.stringify(d)); } catch(e) {}
    // Also sync the draft to cloud so other devices can load it
    if (sheetUrl) {
      try {
        var draftSync = withUserContext(Object.assign({}, form, { savedAt: new Date().toISOString(), _action: "saveDraft", patientName: patientName }));
        fetch(sheetUrl, { method: "POST", mode: "no-cors", body: JSON.stringify(draftSync) });
      } catch(e) {}
    }
    var sheetOk = false;
    var sheetErr = "";
    if (sheetUrl) {
      try {
        // Include note text and photos for Google Doc creation
        var submitData = Object.assign({}, row);
        submitData._patientName = patientName;
        if (form.visitType === "D0") {
          // D0 creates only op note and requisition - H&P and LOMN come from Preauth button
          submitData._opNoteText = generateOpNoteStandalone();
          submitData._requisitionText = generateRequisition();
          // Photos attach to op note
          var pid = form.patientId;
          var patientPhotos = pid ? getPhotosForPatient(pid) : [];
          submitData._photos = patientPhotos.map(function(p) {
            var matched = PHOTO_TYPES.find(function(t){return t.key===p.type});
            return { type: p.type, label: (matched ? matched.label : p.type), data: p.data };
          });
          // Signed procedure consent goes on the requisition doc
          var procedureConsent = patientPhotos.find(function(p){return p.type === "consent_procedure"});
          if (procedureConsent) {
            submitData._consentImage = procedureConsent.data;
          }
        } else {
          // D20, D90: single progress note
          submitData._noteText = generateNote();
        }
        // Use real cors so we can verify the response and only clear photos on confirmed success
        submitData = withUserContext(submitData);
        var resp = await fetch(sheetUrl, {method:"POST", body:JSON.stringify(submitData)});
        var result = await resp.json();
        if (result.status === "ok") {
          sheetOk = true;
          // AUTO-CLEAR photos for this patient: they are now embedded in the Drive docs,
          // localStorage copy is redundant and wastes ~1-2MB per patient. Draft stays so the
          // Sheet1 fallback has a backup loader.
          if (form.patientId) {
            var submittedPid = form.patientId;
            var remainingPhotos = photos.filter(function(ph) { return ph.patientId !== submittedPid; });
            setPhotos(remainingPhotos);
            try { storage.set(PHOTOS_KEY, JSON.stringify(remainingPhotos)); } catch(e) {}
          }
          if (result.docWarnings && result.docWarnings.length) {
            sheetErr = " (doc warnings: " + result.docWarnings.join("; ") + ")";
          }
        } else {
          sheetErr = result.message || result.status || "unknown";
        }
      } catch(e) { sheetErr = e.toString(); }
    }
    setSubmitting(false);
    if (sheetOk) {
      flash("Saved + Sheet + Docs created · photos auto-cleared" + sheetErr, "ok");
    } else if (sheetUrl) {
      flash("Submit failed: " + sheetErr + " · photos kept locally, retry", "err");
    } else {
      flash("Saved locally (no script URL).", "warn");
    }
    setPatientName(""); // clear name after submit, it's in the directory now
  }

    var html = "<div style=\"font-family:Courier New,monospace;font-size:11px;white-space:pre-wrap;\">" + text.replace(/\n/g, "<br>") + "</div>";
    if (patientPhotos.length) {
      html += "<br><div style=\"font-family:Arial,sans-serif;font-size:11px;font-weight:bold;\">PHOTOS:</div>";
