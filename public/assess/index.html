    // D0: Full intake + pre/post exam
    if (form.visitType === "D0") {
      var dxLine = form.dxCodes.length ? form.dxCodes.join(", ") : "E11.42, G89.29";

      var opNote = "OPERATIVE NOTE - IMPLANTATION OF TRIAL NEUROSTIMULATOR (NS100)\n\n" +
"Preoperative Diagnosis:\n" +
"  " + dxLine + " - " + form.neuropathyType + ", " + form.neuropathyDistribution + "\n\n" +
"Postoperative Diagnosis: Same\n\n" +
"Procedure:\n" +
"  Implantation of trial peripheral neurostimulator of the distal auricular branches\n" +
"  of cranial nerves V, VII, IX, X and cervical spinal nerve roots C1-C3\n" +
"  Intraoperative electrical analysis and generator reprogramming\n\n" +
"Anesthesia: Topical anesthetic\n" +
"Complications: None\n\n" +
"Operative Note:\n" +
"Patient has maximized medical management and failed to achieve long-lasting symptom control with conservative therapies for greater than " + (form.painDuration || "___") + " " + form.painDurationUnit.toLowerCase() + " as outlined in the medical record. Patient is seeking alternative treatment and there is no contraindication known at this time to a trial of peripheral nerve stimulation.\n\n" +
"After standard of care informed consent was obtained, topical anesthetic was placed at the anticipated implantation sites. Preparation and draping of the surgical site was carried out in the usual sterile fashion.\n\n" +
"The programmable patient technical unit was utilized to precisely identify and implant electrodes at the following locations:\n" +
(form.trigeminalOhms ? "  1. Trigeminal nerve (CN V): Scapha medial to helix, " + form.trigeminalOhms + " ohms, " + form.trigeminalHz + " Hz\n" : "") +
(form.c2Ohms ? "  2. Lesser occipital nerve (C2): Posterior mid helix-concha, " + form.c2Ohms + " ohms, " + form.c2Hz + " Hz\n" : "") +
(form.vagusOhms ? "  3. Vagus nerve (CN X): Inferomedial antitragus, " + form.vagusOhms + " ohms, " + form.vagusHz + " Hz\n" : "") +
"\nAll electrodes secured, dressing applied, external battery connected and secured. Patient monitored post-procedure, met discharge criteria, discharged without complication with complete postoperative instructions.\n" +
(form.deviceNotes ? "\nDevice: " + form.deviceNotes + "\n" : "");

      return header +
"DIAGNOSIS: " + dxLine + "\n\n" +
"CC: " + form.cc + "\n" +
"Diabetes: " + form.diabetesType + ", " + form.diabetesDuration + " yrs | A1C: " + (form.a1c||"pending") + " | Glucose control: " + (form.glucoseControl||"N/A") + "\n" +
"Chronic pain duration: " + (form.painDuration||"___") + " " + form.painDurationUnit.toLowerCase() + "\n\n" +
"HPI: Pt is a " + form.age + " year old " + (form.sex==="M"?"male":"female") + " with " + form.diabetesType + " DM x " + form.diabetesDuration + " years presenting with chronic diabetic neuropathic pain.\n" +
"Pain NRS: Rest " + form.painRest + "/10, Best " + form.painBest + "/10, Worst " + form.painWorst + "/10\n" +
"Descriptors: " + (form.painDescriptors.length ? form.painDescriptors.join(", ") : "none selected") + (form.painNotes ? " | " + form.painNotes : "") + "\n" +
"Functional: " + (form.functionalLimitations.length ? form.functionalLimitations.join(", ") : "none") + (form.functionalNotes ? " | " + form.functionalNotes : "") + "\n\n" +
"PMHx: " + (form.pmhx.length ? form.pmhx.join(", ") : "none") + (form.pmhxNotes ? " | " + form.pmhxNotes : "") + "\n" +
"PSHx: " + (form.pshx || "none") + "\n" +
"Allergies: " + (form.allergies.length ? form.allergies.join(", ") : "NKDA") + (form.allergiesOther ? ", " + form.allergiesOther : "") + "\n" +
"Medications: " + (form.medications || "none listed") + "\n" +
"Prior Tx: " + (form.priorTx.length ? form.priorTx.join(", ") : "none") + (form.txNotes ? " | " + form.txNotes : "") + "\n" +
"Social: Tobacco " + form.socialTob + " | EtOH " + form.socialEtOH + " | Substances " + form.socialSubstance + (form.socialNotes ? " | " + form.socialNotes : "") + "\n" +
(form.labNotes ? "Lab notes: " + form.labNotes + "\n" : "") +
"Contraindications: " + (form.contraindications.length ? form.contraindications.join(", ") : "None identified") + "\n\n" +
examBlock("PRE-ACTIVATION", true) + "\n" +
opNote + "\n" +
examBlock("POST-ACTIVATION (10 min)", false) + "\n" +
"CHANGE: Mono " + ((lPost+rPost)-(lPre+rPre)>0?"+":"") + ((lPost+rPost)-(lPre+rPre)) + " pts | Coins " + coinPre + "/3 to " + coinPost + "/3 | RMSSD " + delta(form.rmssdPre,form.rmssdPost) + " ms | Pain " + delta(form.nrsPainPre,form.nrsPainPost) + " pts\n\n" +
"ASSESSMENT:\n" +
form.age + " year old " + (form.sex==="M"?"male":"female") + " with chronic (>" + (form.painDuration||"3") + " " + form.painDurationUnit.toLowerCase() + ") diabetic " + form.neuropathyType.toLowerCase() + " pain at levels >" + (form.painRest||"5") + "/10. Conservative measures attempted without significant long-term improvement. Patient underwent implantation of trial NS100 neurostimulator device with immediate improvement in sensory examination.\n\n" +
"PLAN:\n" +
"Device trial for up to 20 days. Follow-up for explant and reassessment at D20." +
(form.notes ? "\n\nNotes: " + form.notes : "");
    }

    // D20: SOAP progress note with pre/post exam and explant
    if (form.visitType === "D20") {
      var explantNote = "Hands washed. Area cleaned and prepped. Device and electrodes explanted. " +
        (form.explantComplication === "Yes" ?
          "COMPLICATION: " + (form.explantComplicationDetail || "[Details not recorded]") :
          "Site inspection: non-indurated, non-erythematous. Site clean. Procedure tolerated well without complication.") +
        (form.explantNotes ? " " + form.explantNotes : "");

      return header +
"SUBJECTIVE (PRE-EXPLANT):\n" +
(form.subjectivePre || "[Not entered]") + "\n" +
"Current Pain: Rest " + (form.nrsPainPre||"---") + "/10, Best " + (form.painBest||"---") + "/10, Worst " + (form.painWorst||"---") + "/10\n\n" +
"RELEVANT HISTORY:\n" +
"  " + form.diabetesType + " DM x " + form.diabetesDuration + " yrs | A1C: " + (form.a1c||"---") + "\n" +
"  PMHx: " + (form.pmhx.length ? form.pmhx.join(", ") : "none") + "\n" +
"  Meds: " + (form.medications || "none") + "\n" +
(form.trigeminalOhms ? "  Device (D0): Tri " + form.trigeminalOhms + "/" + form.trigeminalHz + "Hz | C2 " + form.c2Ohms + "/" + form.c2Hz + "Hz | Vagus " + form.vagusOhms + "/" + form.vagusHz + "Hz\n" : "") + "\n" +
"OBJECTIVE:\n" +
examBlock("PRE-EXPLANT", true) + "\n" +
"EXPLANT PROCEDURE:\n" + explantNote + "\n\n" +
examBlock("POST-EXPLANT", false) + "\n" +
"SUBJECTIVE (POST-EXPLANT):\n" +
(form.subjectivePost || "[Not entered]") + "\n\n" +
"CHANGE: Mono " + ((lPost+rPost)-(lPre+rPre)>0?"+":"") + ((lPost+rPost)-(lPre+rPre)) + " pts | Coins " + coinPre + "/3 to " + coinPost + "/3 | RMSSD " + delta(form.rmssdPre,form.rmssdPost) + " ms | Pain " + delta(form.nrsPainPre,form.nrsPainPost) + " pts\n\n" +
"PLAN:\n" + (form.plan || "[No plan entered]") +
(form.notes ? "\n\nNotes: " + form.notes : "");
    }

    // D90: SOAP progress note with single exam
    return header +
"SUBJECTIVE:\n" +
(form.subjective || "[No subjective entered]") + "\n" +
"Current Pain: Rest " + (form.nrsPainPre||"---") + "/10, Best " + (form.painBest||"---") + "/10, Worst " + (form.painWorst||"---") + "/10\n\n" +
"RELEVANT HISTORY:\n" +
"  " + form.diabetesType + " DM x " + form.diabetesDuration + " yrs | A1C: " + (form.a1c||"---") + "\n" +
"  PMHx: " + (form.pmhx.length ? form.pmhx.join(", ") : "none") + "\n" +
"  Meds: " + (form.medications || "none") + "\n\n" +
"OBJECTIVE:\n" +
examBlock("EXAM", true) + "\n" +
"PLAN:\n" + (form.plan || "[No plan entered]") +
(form.notes ? "\n\nNotes: " + form.notes : "");
  }

  function generateLOMN() {
    var dxLine = form.dxCodes.length ? form.dxCodes.join(", ") : "E11.42, G89.29";
    return "LETTER OF MEDICAL NECESSITY\n" +
"Implantation of Neurostimulator - NS100 (L8679)\n\n" +
"Patient: " + (patientName || "[Name]") + " (Study ID: " + (form.patientId || "[ID]") + ")\n" +
"Date: " + form.date + " | Age: " + form.age + " | Sex: " + form.sex + "\n" +
"Referring: " + (form.referringProvider || "N/A") + "\n\n" +
"Does the patient have chronic intractable pain due to Diabetic Neuropathy? YES\n\n" +
"Neurostimulator L8679 is used for the treatment of chronic intractable pain due to Diabetic Neuropathy. The patient is likely to derive significant therapeutic benefit from neurostimulator treatments.\n\n" +
"Is there documentation of conservative and/or medication therapies that have been tried and failed? YES\n\n" +
"Diagnosis:\n" +
form.dxCodes.map(function(c, i) { return "  " + (i+1) + ". " + c; }).join("\n") + "\n\n" +
"Neuropathy: " + form.neuropathyType + ", " + form.neuropathyDistribution + "\n\n" +
"Patient has been treated for chronic pain for the past " + (form.painDuration || "___") + " " + form.painDurationUnit + ".\n" +
"Pain Rating Scale: " + (form.painRest || "___") + "/10\n\n" +
"Medication therapy used to treat diabetic neuropathy:\n" +
"  " + (form.medications || "none listed") + "\n\n" +
"Past conservative treatments and results:\n" +
"  " + (form.priorTx.length ? form.priorTx.join(", ") : "none") + (form.txNotes ? "\n  " + form.txNotes : "") + "\n\n" +
"Diagnostic testing performed: Physical exam" + (form.a1c ? ", A1C: " + form.a1c : "") + "\n\n" +
"Expected benefits from implantation of neurostimulator:\n" +
"  - Eliminate/decrease localized and referred pain\n" +
"  - Decreased swelling\n" +
"  - Improve clinical picture\n" +
"  - Significantly increased mobility without pain\n" +
"  - Decrease insomnia related to neuropathy symptoms\n\n" +
"Duration of treatment: Up to 20 days\n" +
"Prognosis: " + form.prognosis + "\n\n" +
"Contraindications: " + (form.contraindications.length ? "YES - " + form.contraindications.join(", ") : "NO") + "\n\n" +
"Provider: " + (patientName ? "" : "") + "Lindsey A. Nelson, MD\n" +
"Date: " + form.date;
  }

  // Validation - check for missing required items
  function getValidationErrors() {
    var errors = [];
    var pid = form.patientId;
    if (!pid) return ["Study ID required"];
    if (!patientName) return ["Patient name required (local only, for directory mapping)"];

    var patientPhotos = pid ? getPhotosForPatient(pid) : [];
    var photoTypes = patientPhotos.map(function(p) { return p.type; });

    // Always required
    if (photoTypes.indexOf("consent_procedure") === -1) errors.push("Missing: Procedure Consent photo");
    if (photoTypes.indexOf("consent_data") === -1) errors.push("Missing: Data Use Consent photo");

    // Required on D0 (placement visit)
    if (form.visitType === "D0") {
      if (photoTypes.indexOf("consent_social") === -1) errors.push("Missing: Social Media Consent photo");
      if (photoTypes.indexOf("serial") === -1) errors.push("Missing: Device Serial / Lot photo");
      if (photoTypes.indexOf("earmap") === -1) errors.push("Missing: Ear Map photo");
      if (photoTypes.indexOf("earphoto") === -1) errors.push("Missing: Ear Photo");
      if (!form.trigeminalOhms || !form.trigeminalHz) errors.push("Missing: Trigeminal impedance values");
      if (!form.c2Ohms || !form.c2Hz) errors.push("Missing: C2 impedance values");
      if (!form.vagusOhms || !form.vagusHz) errors.push("Missing: Vagus impedance values");
    }

    // D20 = explant day, want ear photo
    if (form.visitType === "D20") {
      if (photoTypes.indexOf("earphoto") === -1) errors.push("Missing: Ear Photo (explant)");
    }

    return errors;
  }

  const [showOverride, setShowOverride] = useState(false);
  const [validationErrors, setValidationErrors] = useState([]);

  function tryCopy() {
    var errors = getValidationErrors();
    if (errors.length > 0) {
      setValidationErrors(errors);
      setShowOverride(true);
      return;
    }
    setShowOverride(false);
    setValidationErrors([]);
    copyNoteWithPhotos();
  }

  function trySubmit() {
    var errors = getValidationErrors();
    if (errors.length > 0) {
      setValidationErrors(errors);
      setShowOverride(true);
      return;
    }
    setShowOverride(false);
    setValidationErrors([]);
    handleSubmit();
  }

  async function handleSubmit() {
    if (!form.patientId) { flash("Enter a Study ID", "err"); return; }
    if (!patientName) { flash("Enter patient name", "err"); return; }
    setSubmitting(true);
    var row = buildRow();

    // Auto-add to directory if not already there
    var alreadyInDir = directory.some(function(d) { return d.id === form.patientId; });
    if (patientName && !alreadyInDir) {
      var entry = { name: patientName, id: form.patientId, addedAt: new Date().toISOString() };
      var updatedDir = directory.concat([entry]);
      setDirectory(updatedDir);
      storage.set(DIRECTORY_KEY, JSON.stringify(updatedDir));
    }

    try { await copyNoteWithPhotos(); } catch(e) {}
    var updated = records.concat([Object.assign({}, row, { id: Date.now() })]);
    try { storage.set(STORAGE_KEY, JSON.stringify(updated)); setRecords(updated); } catch(e) {}
    // Update draft with latest intake/device data for future visits
    var d = Object.assign({}, drafts);
    d[form.patientId] = Object.assign({}, form, { savedAt: new Date().toISOString() });
    setDrafts(d);
    try { storage.set(DRAFTS_KEY, JSON.stringify(d)); } catch(e) {}
    var sheetOk = false;
    if (sheetUrl) {
      try {
        // Include note text and photos for Google Doc creation
        var submitData = Object.assign({}, row);
        submitData._noteText = generateNote();
        submitData._patientName = patientName;
        // Include LOMN for D0
        if (form.visitType === "D0") {
          submitData._lomnText = generateLOMN();
        }
        // Include photos for D0
        if (form.visitType === "D0") {
          var pid = form.patientId;
          var patientPhotos = pid ? getPhotosForPatient(pid) : [];
          submitData._photos = patientPhotos.map(function(p) {
            var matched = PHOTO_TYPES.find(function(t){return t.key===p.type});
            return { type: p.type, label: (matched ? matched.label : p.type), data: p.data };
          });
        }
        await fetch(sheetUrl, {method:"POST", mode:"no-cors", body:JSON.stringify(submitData)});
        sheetOk = true;
      } catch(e) {}
    }
    setSubmitting(false);
    flash("Saved" + (sheetOk ? " + Sheet + Doc created" : sheetUrl ? " (Sheet may have updated)" : "") + ".", "ok");
    setPatientName(""); // clear name after submit, it's in the directory now
  }

  // Directory functions (local only, never exported)
  function addToDirectory() {
    if (!dirName || !dirId) { flash("Enter both name and ID", "err"); return; }
    var entry = { name: dirName, id: dirId, addedAt: new Date().toISOString() };
    var updated = directory.concat([entry]);
    setDirectory(updated);
    storage.set(DIRECTORY_KEY, JSON.stringify(updated));
    setDirName(""); setDirId("");
    flash("Added " + dirName + " as " + dirId);
  }

  function removeFromDirectory(idx) {
    var updated = directory.filter(function(_, i) { return i !== idx; });
    setDirectory(updated);
    storage.set(DIRECTORY_KEY, JSON.stringify(updated));
  }

  function selectFromDirectory(id, name) {
    set("patientId", id);
    setPhotoPatientId(id);
    setPatientName(name || "");
    setShowConfig(false);
    flash("Selected " + id);
  }

  function getFilteredDirectory() {
    if (!dirSearch) return directory;
    var s = dirSearch.toLowerCase();
    return directory.filter(function(d) {
      return d.name.toLowerCase().includes(s) || d.id.toLowerCase().includes(s);
    });
  }

  function generateNoteHtml() {
    var text = generateNote();
    var pid = form.patientId;
    var patientPhotos = pid ? getPhotosForPatient(pid) : [];
    var html = "<div style=\"font-family:Courier New,monospace;font-size:11px;white-space:pre-wrap;\">" + text.replace(/\n/g, "<br>") + "</div>";
    if (patientPhotos.length) {
      html += "<br><div style=\"font-family:Arial,sans-serif;font-size:11px;font-weight:bold;\">PHOTOS:</div>";
      patientPhotos.forEach(function(p) {
        var matched = PHOTO_TYPES.find(function(t){return t.key===p.type}) || {};
        html += "<div style=\"font-family:Arial,sans-serif;font-size:10px;color:#666;margin-top:8px;\">" + (matched.label || p.type) + " - " + new Date(p.timestamp).toLocaleString() + "</div>";
        html += "<img src=\"" + p.data + "\" style=\"max-width:400px;margin:4px 0 12px 0;\" />";
      });
    }
    return html;
  }

  async function copyNoteWithPhotos() {
    var pid = form.patientId;
    var patientPhotos = pid ? getPhotosForPatient(pid) : [];
    // Only include photos for D0
    if (form.visitType === "D0" && patientPhotos.length > 0) {
      try {
        var html = generateNoteHtml();
        var blob = new Blob([html], { type: "text/html" });
        var textBlob = new Blob([generateNote()], { type: "text/plain" });
        await navigator.clipboard.write([
          new ClipboardItem({
            "text/html": blob,
            "text/plain": textBlob
          })
        ]);
        flash("Copied note + " + patientPhotos.length + " photos");
        return;
      } catch(e) {}
    }
    try { await navigator.clipboard.writeText(generateNote()); flash("Copied note"); } catch(e) { flash("Copy failed", "err"); }
  }

  function saveSheetUrl() { storage.set(SHEET_URL_KEY, sheetUrl); flash("Sheet URL saved"); setShowConfig(false); }

  function exportCSV() {
    if (!records.length) return;
    var headers = Object.keys(records[0]).filter(function(k){return k!=="id"});
    var csv = [headers.join(",")].concat(records.map(function(r){return headers.map(function(h){return '"'+String(r[h]||"").replace(/"/g,'""')+'"'}).join(",")})).join("\n");
    var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
    a.download = "dpn_data_" + new Date().toISOString().split("T")[0] + ".csv"; a.click();
  }

  function clearAll() { if(confirm("Delete all saved records?")){ storage.delete(STORAGE_KEY); setRecords([]); } }
  function resetForm() { setForm(Object.assign({}, defaultState, { date: new Date().toISOString().split("T")[0] })); setFormSection("intake"); setPatientName(""); }

  var ic = "w-full border border-gray-300 rounded px-2 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-blue-400";
  var lc = "block text-xs font-medium text-gray-600 mb-0.5";

  // Chip toggle helper
  function Chip(props) {
    var active = props.selected;
    return <button onClick={props.onClick}
      className={"text-xs py-1 px-2 rounded-full border mr-1 mb-1 " + (active ? "bg-blue-500 text-white border-blue-500" : "bg-white text-gray-600 border-gray-300")}>
      {props.label}
    </button>;
  }

  var draftList = getDraftList();

  return (
    <div className="max-w-lg mx-auto bg-white min-h-screen">
      <div className="flex border-b border-gray-200 sticky top-0 bg-white z-10">
        {[["referrals","Referrals"],["form","Assess"],["photos","Photos"],["note","Note"],["records","Data"]].map(function(item) {
          var v = item[0], l = item[1];
          return <button key={v} onClick={function(){setView(v)}} className={"flex-1 py-2.5 text-sm font-medium " + (view===v ? "text-blue-600 border-b-2 border-blue-600" : "text-gray-500")}>{l}</button>;
        })}
        <button onClick={function(){setShowConfig(!showConfig)}} className="px-3 py-2.5 text-gray-400 text-sm">{showConfig ? "X" : "+"}</button>
      </div>

      {showConfig && (
        <div className="p-3 bg-yellow-50 border-b border-yellow-200 space-y-3">
          <div>
            <label className={lc}>Google Apps Script URL</label>
            <input className={ic} value={sheetUrl} onChange={function(e){setSheetUrl(e.target.value)}} placeholder="https://script.google.com/macros/s/.../exec" />
            <button onClick={saveSheetUrl} className="mt-2 px-3 py-1 bg-yellow-500 text-white text-xs rounded">Save URL</button>
          </div>
          <div className="border-t border-yellow-300 pt-3">
            <div className="text-xs font-semibold text-gray-600 mb-2">PATIENT DIRECTORY (local only, never exported)</div>
            <div className="flex gap-1 mb-2">
              <input className={ic} value={dirName} onChange={function(e){setDirName(e.target.value)}} placeholder="Patient name" />
              <input className={ic + " w-28"} value={dirId} onChange={function(e){setDirId(e.target.value)}} placeholder="DNC-XXXX" />
              <button onClick={addToDirectory} className="px-2 py-1 bg-blue-500 text-white text-xs rounded whitespace-nowrap">Add</button>
            </div>
            {directory.length > 0 && (
              <div>
                <input className={ic + " mb-2"} value={dirSearch} onChange={function(e){setDirSearch(e.target.value)}} placeholder="Search name or ID..." />
                <div className="max-h-40 overflow-y-auto space-y-1">
                  {getFilteredDirectory().map(function(d, i) { return (
                    <div key={i} className="flex justify-between items-center bg-white rounded px-2 py-1.5 border border-gray-200">
                      <button onClick={function(){selectFromDirectory(d.id, d.name)}} className="text-xs text-left flex-1">
                        <span className="font-medium text-gray-700">{d.name}</span>
                        <span className="text-blue-500 ml-2">{d.id}</span>
                      </button>
                      <button onClick={function(){removeFromDirectory(i)}} className="text-red-400 text-xs ml-2">X</button>
                    </div>
                  );})}
                </div>
              </div>
            )}
          </div>
        </div>
      )}

      {msg.text && (
        <div className={"px-4 py-2 text-sm font-medium " + (msg.type==="err" ? "bg-red-50 text-red-600" : msg.type==="warn" ? "bg-yellow-50 text-yellow-700" : "bg-green-50 text-green-600")}>{msg.text}</div>
      )}

      {/* ========== REFERRALS TAB ========== */}
      {view === "referrals" && (
        <div className="p-4 space-y-3">
          {/* Role toggle */}
          <div className="flex rounded overflow-hidden border border-gray-200">
            <button onClick={function(){switchRole("ma")}} className={"flex-1 py-2 text-sm font-medium " + (role==="ma" ? "bg-blue-600 text-white" : "bg-gray-50 text-gray-500")}>MA View</button>
            <button onClick={function(){switchRole("clinician")}} className={"flex-1 py-2 text-sm font-medium " + (role==="clinician" ? "bg-blue-600 text-white" : "bg-gray-50 text-gray-500")}>Clinician View</button>
          </div>

          {/* MA: Add Referral */}
          {role === "ma" && (
            <div className="bg-green-50 rounded p-3 border border-green-200 space-y-2">
              <div className="text-xs font-semibold text-green-700">NEW REFERRAL</div>
              <input className={ic} value={newRef.name} onChange={function(e){setNewRef(Object.assign({}, newRef, {name:e.target.value}))}} placeholder="Patient name *" />
              <div className="grid grid-cols-2 gap-2">
                <input className={ic} value={newRef.dob} onChange={function(e){setNewRef(Object.assign({}, newRef, {dob:e.target.value}))}} placeholder="DOB" />
                <input className={ic} value={newRef.phone} onChange={function(e){setNewRef(Object.assign({}, newRef, {phone:e.target.value}))}} placeholder="Phone *" type="tel" />
              </div>
              <input className={ic} value={newRef.provider} onChange={function(e){setNewRef(Object.assign({}, newRef, {provider:e.target.value}))}} placeholder="Referring provider" />
              <input className={ic} value={newRef.notes} onChange={function(e){setNewRef(Object.assign({}, newRef, {notes:e.target.value}))}} placeholder="Notes (optional)" />
              <button onClick={addReferral} className="w-full py-2 bg-green-600 text-white rounded text-sm font-medium">Add Referral</button>
            </div>
          )}

          {/* Call List */}
          <div className="flex items-center justify-between">
            <div className="text-sm font-semibold text-gray-700">{role === "clinician" ? "Call List" : "Referrals"} ({referrals.length})</div>
            <button onClick={loadReferrals} className="text-xs text-blue-600 font-medium py-1 px-3 border border-blue-200 rounded">{referralsLoading ? "Loading..." : "Refresh"}</button>
          </div>

          {referrals.length === 0 && !referralsLoading && (
            <div className="text-center text-gray-400 text-sm py-6">No referrals. Tap Refresh to load from database.</div>
          )}

          {referrals.map(function(ref, idx) {
            var days = ref.referralDate ? Math.floor((Date.now() - new Date(ref.referralDate).getTime()) / 86400000) : 0;
            var isStale = days >= 2 && !ref.called;
            var statusColor = ref.status === "Complete" ? "text-green-600" :
              ref.status === "Intake Complete" ? "text-blue-600" :
              isStale ? "text-red-600" : "text-gray-500";
            return (
              <div key={idx} className={"rounded border p-3 space-y-1 " + (isStale ? "border-red-300 bg-red-50" : "border-gray-200 bg-white")}>
                <div className="flex items-center justify-between">
                  <div className="font-medium text-sm text-gray-900">{ref.name || "Unknown"}</div>
                  <div className={"text-xs font-medium " + statusColor}>{ref.status || "New"}</div>
                </div>
                <div className="flex items-center justify-between">
                  <div className="text-xs text-gray-500">{ref.provider ? "Ref: " + ref.provider : ""}{ref.phone ? " | " + ref.phone : ""}</div>
                  <div className="text-xs text-gray-400">{days > 0 ? days + "d ago" : "Today"}</div>
                </div>
                {ref.dncId && <div className="text-xs text-blue-500">ID: {ref.dncId}</div>}
                <div className="flex gap-2 pt-1">
                  {!ref.dncId && (
                    <button onClick={function(){startIntakeFromReferral({name: ref.name, provider: ref.provider, rowIndex: ref.rowIndex})}}
                      className="flex-1 py-1.5 bg-blue-600 text-white rounded text-xs font-medium">Start Intake</button>
                  )}
                  {ref.dncId && !ref.called && (
                    <button onClick={function(){updateReferralStatus(ref.rowIndex, "called", new Date().toISOString()); flash("Marked as called");}}
                      className="flex-1 py-1.5 bg-yellow-500 text-white rounded text-xs font-medium">Mark Called</button>
                  )}
                  {ref.dncId && (
                    <button onClick={function(){setForm(function(f){return Object.assign({}, f, {patientId: ref.dncId})}); setView("form"); loadDraft(ref.dncId);}}
                      className="flex-1 py-1.5 bg-gray-200 text-gray-700 rounded text-xs font-medium">Open Draft</button>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* ========== ASSESS TAB ========== */}
      {view === "form" && (
        <div className="p-4 space-y-3">
          {/* Patient Name + ID */}
          <div className="space-y-2">
            <div>
              <label className={lc}>Patient Name (local only, never exported)</label>
              <input className={ic} value={patientName} onChange={function(e){setPatientName(e.target.value)}} placeholder="Last, First" />
            </div>
            <div className="grid grid-cols-4 gap-2">
              <div className="col-span-2">
                <label className={lc}>Study ID</label>
                <div className="flex gap-1">
                  <input className={ic} value={form.patientId} onChange={function(e){set("patientId",e.target.value)}} placeholder="DNC-XXXX" />
                  <button onClick={function(){set("patientId", generatePatientId())}} className="px-2 py-1 bg-gray-200 text-gray-600 text-xs rounded whitespace-nowrap">New</button>
                  <button onClick={loadDraft} className="px-2 py-1 bg-blue-100 text-blue-600 text-xs rounded whitespace-nowrap">Load</button>
                </div>
              </div>
              <div><label className={lc}>Visit</label><select className={ic} value={form.visitType} onChange={function(e){set("visitType",e.target.value)}}><option>D0</option><option>D20</option><option>D90</option></select></div>
              <div><label className={lc}>Date</label><input type="date" className={ic} value={form.date} onChange={function(e){set("date",e.target.value)}} /></div>
            </div>
          </div>

          {/* Saved drafts indicator */}
          {draftList.length > 0 && (
            <div className="text-xs text-gray-400">Drafts: {draftList.map(function(d){
              return <button key={d} onClick={function(){set("patientId",d);}} className="text-blue-500 underline mr-2">{d}</button>;
            })}</div>
          )}

          {/* Demographics */}
          <div className="grid grid-cols-4 gap-2">
            <div><label className={lc}>Age</label><input className={ic} type="number" value={form.age} onChange={function(e){set("age",e.target.value)}} /></div>
            <div><label className={lc}>Sex</label><select className={ic} value={form.sex} onChange={function(e){set("sex",e.target.value)}}><option value="">--</option><option>M</option><option>F</option></select></div>
            <div><label className={lc}>DM Type</label><select className={ic} value={form.diabetesType} onChange={function(e){set("diabetesType",e.target.value)}}><option>Type 1</option><option>Type 2</option></select></div>
            <div><label className={lc}>DM Yrs</label><input className={ic} type="number" value={form.diabetesDuration} onChange={function(e){set("diabetesDuration",e.target.value)}} /></div>
          </div>

          {/* Section toggle */}
          <div className="flex rounded-lg overflow-hidden border border-gray-300">
            <button onClick={function(){setFormSection("intake")}} className={"flex-1 py-2 text-sm font-medium " + (formSection==="intake" ? "bg-blue-600 text-white" : "bg-gray-50 text-gray-500")}>{form.visitType === "D0" ? "Intake / H&P" : "Progress Note"}</button>
            <button onClick={function(){setFormSection("sensory")}} className={"flex-1 py-2 text-sm font-medium " + (formSection==="sensory" ? "bg-blue-600 text-white" : "bg-gray-50 text-gray-500")}>Sensory Assessment</button>
          </div>

          {/* ---- INTAKE SECTION ---- */}
          {formSection === "intake" && (
            <div className="space-y-3">

              {/* Paste transcript */}
              <div className="bg-blue-50 rounded p-3 border border-blue-200">
                <div className="text-xs font-semibold text-blue-600 mb-1">PASTE TRANSCRIPT (OpenEvidence or other)</div>
                <textarea className={ic + " h-20 bg-white"} value={transcript} onChange={function(e){setTranscript(e.target.value)}} placeholder="Paste call transcript or OpenEvidence note here..."></textarea>
                <button onClick={parseTranscript} disabled={parsing}
                  className={"mt-1 w-full py-2 rounded text-sm font-medium " + (parsing ? "bg-gray-300 text-gray-500" : "bg-blue-600 text-white")}>
                  {parsing ? "Parsing..." : "Parse Transcript to Form"}
                </button>
              </div>

              {/* D0: Full intake */}
              {form.visitType === "D0" && (
                <div className="space-y-3">
                  <div><label className={lc}>Referring Provider</label><input className={ic} value={form.referringProvider} onChange={function(e){set("referringProvider",e.target.value)}} placeholder="Dr. Smith" /></div>

                  <div className="bg-gray-50 rounded p-3">
                    <div className="text-xs font-semibold text-gray-500 mb-2">PAIN</div>
                    <div className="grid grid-cols-3 gap-2 mb-2">
                      <div><label className={lc}>Rest /10</label><input className={ic} type="number" min="0" max="10" value={form.painRest} onChange={function(e){set("painRest",e.target.value)}} /></div>
                      <div><label className={lc}>Best /10</label><input className={ic} type="number" min="0" max="10" value={form.painBest} onChange={function(e){set("painBest",e.target.value)}} /></div>
                      <div><label className={lc}>Worst /10</label><input className={ic} type="number" min="0" max="10" value={form.painWorst} onChange={function(e){set("painWorst",e.target.value)}} /></div>
                    </div>
                    <label className={lc}>Descriptors</label>
                    <div className="flex flex-wrap">{PAIN_DESC.map(function(d){return <Chip key={d} label={d} selected={form.painDescriptors.includes(d)} onClick={function(){toggleMulti("painDescriptors",d)}} />;})}</div>
                    <input className={ic + " mt-1"} value={form.painNotes} onChange={function(e){set("painNotes",e.target.value)}} placeholder="Additional pain notes..." />
                  </div>

                  <div className="bg-gray-50 rounded p-3">
                    <label className={lc}>Functional Limitations</label>
                    <div className="flex flex-wrap">{FUNCTIONAL.map(function(d){return <Chip key={d} label={d} selected={form.functionalLimitations.includes(d)} onClick={function(){toggleMulti("functionalLimitations",d)}} />;})}</div>
                    <input className={ic + " mt-1"} value={form.functionalNotes} onChange={function(e){set("functionalNotes",e.target.value)}} placeholder="Additional functional notes..." />
                  </div>

                  <div className="bg-gray-50 rounded p-3">
                    <label className={lc}>PMHx</label>
                    <div className="flex flex-wrap">{PMHX_OPTIONS.map(function(d){return <Chip key={d} label={d} selected={form.pmhx.includes(d)} onClick={function(){toggleMulti("pmhx",d)}} />;})}</div>
                    <label className={lc + " mt-2"}>PSHx</label>
                    <input className={ic} value={form.pshx} onChange={function(e){set("pshx",e.target.value)}} placeholder="Surgical history" />
                    <input className={ic + " mt-1"} value={form.pmhxNotes} onChange={function(e){set("pmhxNotes",e.target.value)}} placeholder="Additional PMHx notes..." />
                  </div>

                  <div className="bg-gray-50 rounded p-3">
                    <label className={lc}>Allergies</label>
                    <div className="flex flex-wrap">{ALLERGY_COMMON.map(function(d){return <Chip key={d} label={d} selected={form.allergies.includes(d)} onClick={function(){toggleMulti("allergies",d)}} />;})}</div>
                    <input className={ic + " mt-1"} value={form.allergiesOther} onChange={function(e){set("allergiesOther",e.target.value)}} placeholder="Other allergies" />
                  </div>

                  <div className="bg-gray-50 rounded p-3">
                    <label className={lc}>Medications (current)</label>
                    <textarea className={ic + " h-14"} value={form.medications} onChange={function(e){set("medications",e.target.value)}} placeholder="List current medications"></textarea>
                  </div>

                  <div className="bg-gray-50 rounded p-3">
                    <label className={lc}>Prior Therapies Tried</label>
                    <div className="flex flex-wrap">{PRIOR_TX.map(function(d){return <Chip key={d} label={d} selected={form.priorTx.includes(d)} onClick={function(){toggleMulti("priorTx",d)}} />;})}</div>
                    <input className={ic + " mt-1"} value={form.txNotes} onChange={function(e){set("txNotes",e.target.value)}} placeholder="Additional therapy notes, results..." />
                  </div>

                  <div className="bg-gray-50 rounded p-3">
                    <div className="text-xs font-semibold text-gray-500 mb-2">SOCIAL HX</div>
                    <div className="grid grid-cols-3 gap-2">
                      <div><label className={lc}>Tobacco</label><select className={ic} value={form.socialTob} onChange={function(e){set("socialTob",e.target.value)}}><option>No</option><option>Current</option><option>Former</option></select></div>
                      <div><label className={lc}>EtOH</label><select className={ic} value={form.socialEtOH} onChange={function(e){set("socialEtOH",e.target.value)}}><option>No</option><option>Social</option><option>Daily</option><option>Former</option></select></div>
                      <div><label className={lc}>Substances</label><select className={ic} value={form.socialSubstance} onChange={function(e){set("socialSubstance",e.target.value)}}><option>No</option><option>Current</option><option>Former</option></select></div>
                    </div>
                    <input className={ic + " mt-1"} value={form.socialNotes} onChange={function(e){set("socialNotes",e.target.value)}} placeholder="Additional social hx notes..." />
                  </div>

                  <div className="bg-gray-50 rounded p-3">
                    <div className="text-xs font-semibold text-gray-500 mb-2">LABS</div>
                    <div className="grid grid-cols-3 gap-2">
                      <div><label className={lc}>A1C</label><input className={ic} value={form.a1c} onChange={function(e){set("a1c",e.target.value)}} placeholder="%" /></div>
                      <div><label className={lc}>Fasting BG</label><input className={ic} value={form.bgFasting} onChange={function(e){set("bgFasting",e.target.value)}} placeholder="mg/dL" /></div>
                      <div><label className={lc}>BG Control</label><select className={ic} value={form.glucoseControl} onChange={function(e){set("glucoseControl",e.target.value)}}><option value="">--</option><option>Well controlled</option><option>Poorly controlled</option></select></div>
                    </div>
                    <input className={ic + " mt-1"} value={form.labNotes} onChange={function(e){set("labNotes",e.target.value)}} placeholder="Additional lab notes..." />
                  </div>

                  <div className="bg-gray-50 rounded p-3">
                    <div className="text-xs font-semibold text-gray-500 mb-2">DIAGNOSIS and MEDICAL NECESSITY</div>
                    <div className="grid grid-cols-2 gap-2 mb-2">
                      <div><label className={lc}>Pain duration</label><input className={ic} type="number" value={form.painDuration} onChange={function(e){set("painDuration",e.target.value)}} /></div>
                      <div><label className={lc}>Unit</label><select className={ic} value={form.painDurationUnit} onChange={function(e){set("painDurationUnit",e.target.value)}}><option>Months</option><option>Years</option></select></div>
                    </div>
                    <div className="grid grid-cols-2 gap-2 mb-2">
                      <div><label className={lc}>Neuropathy type</label><select className={ic} value={form.neuropathyType} onChange={function(e){set("neuropathyType",e.target.value)}}><option>Polyneuropathy</option><option>Mononeuropathy</option></select></div>
                      <div><label className={lc}>Distribution</label><select className={ic} value={form.neuropathyDistribution} onChange={function(e){set("neuropathyDistribution",e.target.value)}}><option>Bilateral LE</option><option>Right LE</option><option>Left LE</option><option>Bilateral UE</option><option>Bilateral UE/LE</option></select></div>
                    </div>
                    <label className={lc}>Diagnosis codes</label>
                    <div className="flex flex-wrap mb-2">{DX_OPTIONS.map(function(d){return <Chip key={d.code} label={d.code + " " + d.label} selected={form.dxCodes.includes(d.code)} onClick={function(){toggleMulti("dxCodes",d.code)}} />;})}</div>
                    <div><label className={lc}>Prognosis</label><select className={ic} value={form.prognosis} onChange={function(e){set("prognosis",e.target.value)}}><option>Fair</option><option>Good</option><option>Excellent</option></select></div>
                  </div>

                  <div className="bg-gray-50 rounded p-3">
                    <div className="text-xs font-semibold text-gray-500 mb-2">CONTRAINDICATIONS</div>
                    <div className="flex flex-wrap">{CONTRAINDICATIONS.map(function(d){return <Chip key={d} label={d} selected={form.contraindications.includes(d)} onClick={function(){toggleMulti("contraindications",d)}} />;})}</div>
                    {form.contraindications.length > 0 && (
                      <div className="text-xs text-red-500 mt-1 font-medium">Contraindication(s) selected - verify eligibility</div>
                    )}
                  </div>

                  <div className="bg-gray-50 rounded p-3">
                    <div className="text-xs font-semibold text-gray-500 mb-2">DEVICE IMPEDANCE (at placement)</div>
                    <div className="grid grid-cols-3 gap-2">
                      <div className="text-xs font-medium text-gray-500 text-center">Trigeminal</div>
                      <div className="text-xs font-medium text-gray-500 text-center">C2</div>
                      <div className="text-xs font-medium text-gray-500 text-center">Vagus</div>
                    </div>
                    <div className="grid grid-cols-3 gap-2 mt-1">
                      <div><label className={lc}>Ohms</label><input className={ic} value={form.trigeminalOhms} onChange={function(e){set("trigeminalOhms",e.target.value)}} placeholder="325-350" /></div>
                      <div><label className={lc}>Ohms</label><input className={ic} value={form.c2Ohms} onChange={function(e){set("c2Ohms",e.target.value)}} placeholder="350-360" /></div>
                      <div><label className={lc}>Ohms</label><input className={ic} value={form.vagusOhms} onChange={function(e){set("vagusOhms",e.target.value)}} placeholder="~400" /></div>
                    </div>
                    <div className="grid grid-cols-3 gap-2 mt-1">
                      <div><label className={lc}>Hz</label><input className={ic} value={form.trigeminalHz} onChange={function(e){set("trigeminalHz",e.target.value)}} placeholder="9.12" /></div>
                      <div><label className={lc}>Hz</label><input className={ic} value={form.c2Hz} onChange={function(e){set("c2Hz",e.target.value)}} placeholder="36.48" /></div>
                      <div><label className={lc}>Hz</label><input className={ic} value={form.vagusHz} onChange={function(e){set("vagusHz",e.target.value)}} placeholder="72.96" /></div>
                    </div>
                    <input className={ic + " mt-1"} value={form.deviceNotes} onChange={function(e){set("deviceNotes",e.target.value)}} placeholder="Device serial, lot, placement notes..." />
                  </div>
                </div>
              )}

              {/* D20/D90: Progress note with greyed-out original HPI */}
              {form.visitType !== "D0" && (
                <div className="space-y-3">
                  <div className="bg-gray-100 rounded p-3 opacity-60">
                    <div className="text-xs font-semibold text-gray-500 mb-1">ORIGINAL HPI (from D0)</div>
                    <div className="text-xs text-gray-600 space-y-1">
                      <div>{form.age}yo {form.sex === "M" ? "male" : form.sex === "F" ? "female" : ""} | {form.diabetesType} DM x {form.diabetesDuration} yrs | A1C: {form.a1c || "---"}</div>
                      <div>Pain at D0: Rest {form.painRest}/10, Best {form.painBest}/10, Worst {form.painWorst}/10</div>
                      <div>Descriptors: {form.painDescriptors.length ? form.painDescriptors.join(", ") : "none"}</div>
                      <div>PMHx: {form.pmhx.length ? form.pmhx.join(", ") : "none"}</div>
                      <div>Meds: {form.medications || "none"}</div>
                      <div>Prior Tx: {form.priorTx.length ? form.priorTx.join(", ") : "none"}</div>
                      {form.trigeminalOhms && <div>Device: Tri {form.trigeminalOhms}/{form.trigeminalHz}Hz | C2 {form.c2Ohms}/{form.c2Hz}Hz | Vagus {form.vagusOhms}/{form.vagusHz}Hz</div>}
                    </div>
                  </div>

                  {/* D90: single subjective */}
                  {form.visitType === "D90" && (
                    <div className="bg-gray-50 rounded p-3">
                      <div className="text-xs font-semibold text-gray-500 mb-2">SUBJECTIVE</div>
                      <textarea className={ic + " h-24"} value={form.subjective} onChange={function(e){set("subjective",e.target.value)}} placeholder="Patient reports... symptoms since device removal, changes in pain, function, sleep..."></textarea>
                    </div>
                  )}

                  {/* D20: pre-explant subjective */}
                  {form.visitType === "D20" && (
                    <div className="bg-gray-50 rounded p-3">
                      <div className="text-xs font-semibold text-gray-500 mb-2">SUBJECTIVE (PRE-EXPLANT)</div>
                      <textarea className={ic + " h-20"} value={form.subjectivePre} onChange={function(e){set("subjectivePre",e.target.value)}} placeholder="Patient reports over 20-day treatment period... pain changes, sensation improvements, function, sleep..."></textarea>
                    </div>
                  )}

                  <div className="bg-gray-50 rounded p-3">
                    <div className="text-xs font-semibold text-gray-500 mb-2">CURRENT PAIN</div>
                    <div className="grid grid-cols-3 gap-2">
                      <div><label className={lc}>Rest /10</label><input className={ic} type="number" min="0" max="10" value={form.nrsPainPre} onChange={function(e){set("nrsPainPre",e.target.value)}} /></div>
                      <div><label className={lc}>Best /10</label><input className={ic} type="number" min="0" max="10" value={form.painBest} onChange={function(e){set("painBest",e.target.value)}} /></div>
                      <div><label className={lc}>Worst /10</label><input className={ic} type="number" min="0" max="10" value={form.painWorst} onChange={function(e){set("painWorst",e.target.value)}} /></div>
                    </div>
                  </div>

                  {/* D20: explant procedure note */}
                  {form.visitType === "D20" && (
                    <div className="bg-gray-50 rounded p-3">
                      <div className="text-xs font-semibold text-gray-500 mb-2">EXPLANT PROCEDURE</div>
                      <div className="space-y-2">
                        <div>
                          <label className={lc}>Complication</label>
                          <select className={ic} value={form.explantComplication || "No"} onChange={function(e){set("explantComplication",e.target.value)}}><option>No</option><option>Yes</option></select>
                        </div>
                        {form.explantComplication === "Yes" && (
                          <textarea className={ic + " h-20 border-red-300"} value={form.explantComplicationDetail || ""} onChange={function(e){set("explantComplicationDetail",e.target.value)}} placeholder="Describe: site findings (induration, erythema, infection, bleeding), patient symptoms, actions taken..."></textarea>
                        )}
                        <input className={ic} value={form.explantNotes} onChange={function(e){set("explantNotes",e.target.value)}} placeholder="Additional procedure notes..." />
                      </div>
                    </div>
                  )}

                  {/* D20: post-explant subjective */}
                  {form.visitType === "D20" && (
                    <div className="bg-gray-50 rounded p-3">
                      <div className="text-xs font-semibold text-gray-500 mb-2">SUBJECTIVE (POST-EXPLANT)</div>
                      <textarea className={ic + " h-16"} value={form.subjectivePost} onChange={function(e){set("subjectivePost",e.target.value)}} placeholder="How patient feels after device removal..."></textarea>
                    </div>
                  )}

                  {form.visitType === "D20" && (
                    <div className="bg-gray-50 rounded p-3">
                      <div className="text-xs font-semibold text-gray-500 mb-2">UPDATED LABS</div>
                      <div className="grid grid-cols-2 gap-2">
                        <div><label className={lc}>A1C (if available)</label><input className={ic} value={form.a1c} onChange={function(e){set("a1c",e.target.value)}} placeholder="%" /></div>
                        <div><label className={lc}>BG Control</label><select className={ic} value={form.glucoseControl} onChange={function(e){set("glucoseControl",e.target.value)}}><option value="">--</option><option>Well controlled</option><option>Poorly controlled</option></select></div>
                      </div>
                    </div>
                  )}

                  <div className="bg-gray-50 rounded p-3">
                    <div className="text-xs font-semibold text-gray-500 mb-2">PLAN</div>
                    <textarea className={ic + " h-16"} value={form.plan} onChange={function(e){set("plan",e.target.value)}} placeholder="Plan, follow-up instructions, medication changes..."></textarea>
                  </div>
                </div>
              )}

              <div className="flex gap-2">
                <button onClick={saveDraft} className="flex-1 py-2.5 bg-yellow-500 text-white rounded-lg text-sm font-medium">{form.visitType === "D0" ? "Save Draft (phone intake)" : "Save Progress"}</button>
                <button onClick={function(){setFormSection("sensory")}} className="flex-1 py-2.5 bg-blue-600 text-white rounded-lg text-sm font-medium">Continue to Sensory</button>
              </div>
            </div>
          )}

          {/* ---- SENSORY ASSESSMENT SECTION ---- */}
          {formSection === "sensory" && (function() {
            var phases = form.visitType === "D90" ? ["Pre"] : ["Pre","Post"];
            var phaseLabel = function(ph) { return form.visitType === "D90" ? "EXAM" : ph.toUpperCase(); };
            return (
            <div className="space-y-3">
              {form.visitType === "D90" && <div className="text-xs text-center text-gray-400 bg-gray-50 py-2 rounded">Single exam (no device in place)</div>}

              <div className="bg-gray-50 rounded p-3">
                <div className="text-xs font-semibold text-gray-500 mb-2">HRV and PAIN</div>
                <div className={"grid gap-4 " + (phases.length === 1 ? "grid-cols-1" : "grid-cols-2")}>
                  {phases.map(function(ph) { return (
                    <div key={ph}>
                      <div className="text-xs text-gray-400 mb-1">{phaseLabel(ph)}</div>
                      <div className="grid grid-cols-2 gap-2">
                        <div><label className={lc}>RMSSD</label><input className={ic} type="number" step="0.1" value={form["rmssd"+ph]} onChange={function(e){set("rmssd"+ph,e.target.value)}} placeholder="ms" /></div>
                        <div><label className={lc}>NRS Pain</label><input className={ic} type="number" min="0" max="10" value={form["nrsPain"+ph]} onChange={function(e){set("nrsPain"+ph,e.target.value)}} placeholder="/10" /></div>
                      </div>
                    </div>
                  );})}
                </div>
              </div>

              {phases.map(function(phase) { return (
                <div key={phase} className="bg-gray-50 rounded p-3">
                  <div className="flex justify-between items-center mb-2">
                    <span className="text-xs font-semibold text-gray-500">MONOFILAMENT {phaseLabel(phase)}</span>
                    <span className="text-sm font-bold text-blue-600">L: {sumChecked(form["leftFoot"+phase])}/12 | R: {sumChecked(form["rightFoot"+phase])}/12</span>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    {["left","right"].map(function(side) { return (
                      <div key={side}>
                        <div className="text-xs text-gray-400 mb-1 capitalize">{side}</div>
                        <div className="grid grid-cols-3 gap-1">
                          {siteLabels.map(function(label, i) {
                            var key = side+"Foot"+phase;
                            return <button key={i} onClick={function(){toggleSite(key,i)}}
                              className={"text-xs py-1 px-0.5 rounded border " + (form[key][i] ? "bg-blue-500 text-white border-blue-500" : "bg-white text-gray-500 border-gray-300")}>{label}</button>;
                          })}
                        </div>
                      </div>
                    );})}
                  </div>
                </div>
              );})}

              <div className="bg-gray-50 rounded p-3">
                <div className="text-xs font-semibold text-gray-500 mb-2">STEREOGNOSIS (0-3 per hand)</div>
                <div className={"grid gap-4 " + (phases.length === 1 ? "grid-cols-1" : "grid-cols-2")}>
                  {phases.map(function(ph) { return (
                    <div key={ph}>
                      <div className="text-xs text-gray-400 mb-1">{phaseLabel(ph)}</div>
                      <div className="grid grid-cols-3 gap-2">
                        <div><label className={lc}>Quarter</label><select className={ic} value={form["coinQuarter"+ph]} onChange={function(e){set("coinQuarter"+ph,e.target.value)}}><option value="">--</option><option>Yes</option><option>No</option></select></div>
                        <div><label className={lc}>Dime</label><select className={ic} value={form["coinDime"+ph]} onChange={function(e){set("coinDime"+ph,e.target.value)}}><option value="">--</option><option>Yes</option><option>No</option></select></div>
                        <div><label className={lc}>Penny</label><select className={ic} value={form["coinPenny"+ph]} onChange={function(e){set("coinPenny"+ph,e.target.value)}}><option value="">--</option><option>Yes</option><option>No</option></select></div>
                      </div>
                    </div>
                  );})}
                </div>
              </div>

              <div className="bg-gray-50 rounded p-3">
                <div className="text-xs font-semibold text-gray-500 mb-2">SINGLE LEG STANCE (eyes closed, max 30s) and 10M WALK</div>
                <div className={"grid gap-4 " + (phases.length === 1 ? "grid-cols-1" : "grid-cols-2")}>
                  {phases.map(function(ph) { return (
                    <div key={ph}>
                      <div className="text-xs text-gray-400 mb-1">{phaseLabel(ph)}</div>
                      <div className="space-y-2">
                        <div className="grid grid-cols-2 gap-2">
                          <div><label className={lc}>R leg (s)</label><input className={ic} type="number" step="0.1" value={form["slsRightSec"+ph]} onChange={function(e){set("slsRightSec"+ph,e.target.value)}} /></div>
                          <div><label className={lc}>R fall?</label><select className={ic} value={form["slsRightFall"+ph]} onChange={function(e){set("slsRightFall"+ph,e.target.value)}}><option>No</option><option>Yes</option></select></div>
                        </div>
                        <div className="grid grid-cols-2 gap-2">
                          <div><label className={lc}>L leg (s)</label><input className={ic} type="number" step="0.1" value={form["slsLeftSec"+ph]} onChange={function(e){set("slsLeftSec"+ph,e.target.value)}} /></div>
                          <div><label className={lc}>L fall?</label><select className={ic} value={form["slsLeftFall"+ph]} onChange={function(e){set("slsLeftFall"+ph,e.target.value)}}><option>No</option><option>Yes</option></select></div>
                        </div>
                        <div><label className={lc}>10m walk (s)</label><input className={ic} type="number" step="0.1" value={form["walkTime"+ph]} onChange={function(e){set("walkTime"+ph,e.target.value)}} /></div>
                      </div>
                    </div>
                  );})}
                </div>
              </div>

              <div><label className={lc}>Notes</label><textarea className={ic + " h-14"} value={form.notes} onChange={function(e){set("notes",e.target.value)}} placeholder="Meds, observations..."></textarea></div>

              <button onClick={trySubmit} disabled={submitting}
                className={"w-full py-3 rounded-lg text-white font-semibold text-base " + (submitting ? "bg-gray-400" : "bg-blue-600 active:bg-blue-700")}>
                {submitting ? "Submitting..." : "Submit: Copy Note + Save Data"}
              </button>

              {showOverride && validationErrors.length > 0 && (
                <div className="bg-red-50 border border-red-200 rounded-lg p-3 mt-2">
                  <div className="text-xs font-semibold text-red-600 mb-1">Cannot submit - missing items:</div>
                  {validationErrors.map(function(err, i) { return <div key={i} className="text-xs text-red-500 py-0.5">{err}</div>; })}
                  <button onClick={function(){ setShowOverride(false); setValidationErrors([]); handleSubmit(); }}
                    className="mt-2 w-full py-1.5 bg-red-100 text-red-600 text-xs rounded font-medium">Override and Submit Anyway</button>
                </div>
              )}
              <div className="flex gap-2">
                <button onClick={function(){setFormSection("intake")}} className="flex-1 py-2 text-sm text-gray-400">{form.visitType === "D0" ? "Back to Intake" : "Back to Progress"}</button>
                <button onClick={resetForm} className="flex-1 py-2 text-sm text-gray-400">Clear All</button>
              </div>
            </div>
            );
          })()}
        </div>
      )}

      {/* ========== PHOTOS TAB ========== */}
      {view === "photos" && (
        <div className="p-4 space-y-3">
          <div>
            <label className={lc}>Patient ID for Photos</label>
            <input className={ic} value={photoPatientId || form.patientId} onChange={function(e){setPhotoPatientId(e.target.value)}} placeholder="DNC-XXXX" />
          </div>
          <div className="grid grid-cols-3 gap-2">
            {PHOTO_TYPES.map(function(t) { return (
              <button key={t.key} onClick={function(){capturePhoto(t.key)}}
                className="flex flex-col items-center justify-center py-3 bg-gray-50 rounded-lg border border-gray-200 active:bg-blue-50">
                <span className="text-lg font-bold text-blue-500 mb-1">{t.icon}</span>
                <span className="text-xs font-medium text-gray-600 text-center leading-tight">{t.label}</span>
              </button>
            );})}
          </div>
          {(function() {
            var pid = photoPatientId || form.patientId;
            var patientPhotos = pid ? getPhotosForPatient(pid) : [];
            if (!pid) return <div className="text-center text-gray-400 text-sm py-4">Enter Patient ID above</div>;
            if (!patientPhotos.length) return <div className="text-center text-gray-400 text-sm py-4">No photos for {pid}</div>;
            return (
              <div className="space-y-2">
                <div className="text-xs font-medium text-gray-500">{patientPhotos.length} photos for {pid}</div>
                {patientPhotos.map(function(p) { return (
                  <div key={p.id} className="bg-gray-50 rounded-lg overflow-hidden border">
                    <div className="flex justify-between items-center px-3 py-1.5">
                      <span className="text-xs font-medium text-gray-600">
                        {(PHOTO_TYPES.find(function(t){return t.key===p.type})||{}).icon} {(PHOTO_TYPES.find(function(t){return t.key===p.type})||{}).label}
                      </span>
                      <div className="flex items-center gap-2">
                        <span className="text-xs text-gray-400">{new Date(p.timestamp).toLocaleString()}</span>
                        <button onClick={function(){deletePhoto(p.id)}} className="text-red-400 text-xs">X</button>
                      </div>
                    </div>
                    <img src={p.data} className="w-full" alt={p.type} />
                  </div>
                );})}
              </div>
            );
          })()}
        </div>
      )}

      {/* ========== NOTE TAB ========== */}
      {view === "note" && (
        <div className="p-4">
          <pre className="text-xs font-mono bg-gray-50 p-4 rounded whitespace-pre-wrap border">{generateNote()}</pre>
          {form.visitType === "D0" && (function() {
            var pid = form.patientId;
            var patientPhotos = pid ? getPhotosForPatient(pid) : [];
            if (!patientPhotos.length) return null;
            return (
              <div className="mt-2 space-y-2">
                <div className="text-xs font-semibold text-gray-500">PHOTOS ({patientPhotos.length})</div>
                {patientPhotos.map(function(p) { return (
                  <div key={p.id} className="bg-gray-50 rounded overflow-hidden border">
                    <div className="px-2 py-1 text-xs text-gray-500">{(PHOTO_TYPES.find(function(t){return t.key===p.type})||{}).label}</div>
                    <img src={p.data} className="w-full" alt={p.type} />
                  </div>
                );})}
              </div>
            );
          })()}
          <button onClick={tryCopy}
            className="mt-3 w-full py-2 bg-blue-600 text-white rounded text-sm font-medium">{form.visitType === "D0" ? "Copy Note + Photos" : "Copy Note"}</button>

          {showOverride && validationErrors.length > 0 && (
            <div className="bg-red-50 border border-red-200 rounded-lg p-3 mt-2">
              <div className="text-xs font-semibold text-red-600 mb-1">Missing items:</div>
              {validationErrors.map(function(err, i) { return <div key={i} className="text-xs text-red-500 py-0.5">{err}</div>; })}
              <button onClick={function(){ setShowOverride(false); setValidationErrors([]); copyNoteWithPhotos(); }}
                className="mt-2 w-full py-1.5 bg-red-100 text-red-600 text-xs rounded font-medium">Copy Anyway</button>
            </div>
          )}
        </div>
      )}

      {/* ========== RECORDS TAB ========== */}
      {view === "records" && (
        <div className="p-4">
          <div className="flex justify-between items-center mb-3">
            <span className="text-sm text-gray-600">{records.length} records</span>
            <div className="flex gap-2">
              <button onClick={exportCSV} disabled={!records.length} className="px-3 py-1 bg-green-600 text-white text-xs rounded">CSV</button>
              <button onClick={clearAll} disabled={!records.length} className="px-3 py-1 bg-red-100 text-red-600 text-xs rounded">Clear</button>
            </div>
          </div>
          {!records.length ? <div className="text-center text-gray-400 py-8 text-sm">No records yet</div> : (
            <div className="space-y-2 max-h-96 overflow-y-auto">
              {records.map(function(r, i) { return (
                <div key={r.id || i} className="bg-gray-50 rounded p-3 text-xs">
                  <div className="flex justify-between"><span className="font-medium">{r.patientId}</span><span className="text-gray-400">{r.date} | {r.visitType}</span></div>
                  <div className="text-gray-600 mt-1">
                    Mono: {r.combinedPre}/24 &rarr; {r.combinedPost}/24 ({r.monofilamentChange > 0 ? "+" : ""}{r.monofilamentChange}) |
                    Coins: {r.coinScorePre != null ? r.coinScorePre : "?"}/3 &rarr; {r.coinScorePost != null ? r.coinScorePost : "?"}/3 |
                    RMSSD: {r.rmssdPre} &rarr; {r.rmssdPost} | Pain: {r.nrsPainPre} &rarr; {r.nrsPainPost}
                  </div>
                </div>
              );})}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body>
</html>
