              {(form.visitType === "D0" || form.visitType === "Phone Intake") && (
                <button onClick={generatePreauth} disabled={preauthGenerating} className={"w-full py-2.5 rounded-lg text-sm font-medium mt-2 " + (preauthGenerating ? "bg-gray-300 text-gray-500" : "bg-purple-600 text-white")}>
                  {preauthGenerating ? "Generating..." : "Generate Preauth Packet (H&P + LOMN → Biller)"}
                </button>
              )}
            </div>
          )}

          {/* ---- SENSORY ASSESSMENT SECTION ---- */}
          {/* Layout mirrors the real clinical workflow so MAs/CRNAs can use the form
              as a step-by-step guide rather than hunting for fields. Flow:
                PRE  → 1. Walk (shoes on) 2. SLS (shoes on) 3. Monofilament (shoes off)
                       4. Stereognosis 5. HRV + Pain (baseline before activation)
                DEVICE PLACEMENT (in Intake section for D0, Explant for D20)
                POST → 6. HRV + Pain (immediately after activation)
                       7. Stereognosis 8. Monofilament 9. SLS (shoes on) 10. Walk
              D90 = single exam, Pre flow only (no device in place). */}
          {formSection === "sensory" && (function() {
            var isD90 = form.visitType === "D90";
            // Per-step header. Numbered badge + title, optional sub-label (shoe state, hand).
            function StepHeader(props) {
              return (
                <div className="flex items-baseline gap-2 mb-2">
                  <div className="bg-gray-700 text-white text-xs font-bold rounded-full w-6 h-6 flex items-center justify-center flex-shrink-0">{props.num}</div>
                  <div className="text-sm font-semibold text-gray-800">{props.title}</div>
                  {props.sub && <div className="text-xs text-gray-500">{props.sub}</div>}
                </div>
              );
            }
            // Per-phase banner (PRE / POST / EXAM)
            function PhaseBanner(props) {
              var colors = props.phase === "post" ? "bg-purple-100 text-purple-900 border-purple-300"
                : props.phase === "pre" ? "bg-blue-100 text-blue-900 border-blue-300"
                : "bg-gray-200 text-gray-800 border-gray-300";
              return <div className={"rounded px-3 py-2 font-bold text-sm tracking-wide border " + colors}>{props.children}</div>;
            }
            // One monofilament foot grid (re-used for L and R, pre and post)
            function FootGrid(props) {
              var key = props.side + "Foot" + props.phase;
              return (
                <div>
                  <div className="text-xs text-gray-500 mb-1">{props.label}: <span className="font-bold text-blue-600">{sumChecked(form[key])}/12</span></div>
                  <div className="grid grid-cols-3 gap-1">
                    {siteLabels.map(function(label, i) {
                      return <button key={i} onClick={function(){toggleSite(key,i)}}
                        className={"text-xs py-1 px-0.5 rounded border " + (form[key][i] ? "bg-blue-500 text-white border-blue-500" : "bg-white text-gray-500 border-gray-300")}>{label}</button>;
                    })}
                  </div>
                </div>
              );
            }
            // SLS: side-by-side R/L, each with its own stopwatch, time input, fall Y/N
            function SlsBlock(props) {
              return (
                <div className="grid grid-cols-2 gap-3">
                  {["Right","Left"].map(function(side) {
                    var secKey = "sls" + side + "Sec" + props.phase;
                    var fallKey = "sls" + side + "Fall" + props.phase;
                    return (
                      <div key={side} className="bg-white rounded p-2 border border-gray-200">
                        <div className="text-xs font-semibold text-gray-600 mb-1">{side} leg</div>
                        <Stopwatch />
                        <div className="grid grid-cols-2 gap-1 mt-1">
                          <input className={ic} type="number" step="0.1" value={form[secKey]} onChange={function(e){set(secKey,e.target.value)}} placeholder="sec" />
                          <select className={ic} value={form[fallKey]} onChange={function(e){set(fallKey,e.target.value)}}>
                            <option value="No">No fall</option>
                            <option value="Yes">Fell</option>
                          </select>
                        </div>
                      </div>
                    );
                  })}
                </div>
              );
            }
            // 10m walk block: one stopwatch, one time input
            function WalkBlock(props) {
              var key = "walkTime" + props.phase;
              return (
                <div className="grid grid-cols-2 gap-2 items-start">
                  <Stopwatch />
                  <input className={ic} type="number" step="0.1" value={form[key]} onChange={function(e){set(key,e.target.value)}} placeholder="time (sec)" />
                </div>
              );
            }
            // Stereognosis block: Q / D / P selects
            function StereoBlock(props) {
              return (
                <div className="grid grid-cols-3 gap-2">
                  <div><label className={lc}>Quarter</label><select className={ic} value={form["coinQuarter"+props.phase]} onChange={function(e){set("coinQuarter"+props.phase,e.target.value)}}><option value="">--</option><option>Yes</option><option>No</option></select></div>
                  <div><label className={lc}>Dime</label><select className={ic} value={form["coinDime"+props.phase]} onChange={function(e){set("coinDime"+props.phase,e.target.value)}}><option value="">--</option><option>Yes</option><option>No</option></select></div>
                  <div><label className={lc}>Penny</label><select className={ic} value={form["coinPenny"+props.phase]} onChange={function(e){set("coinPenny"+props.phase,e.target.value)}}><option value="">--</option><option>Yes</option><option>No</option></select></div>
                </div>
              );
            }
            // HRV + Pain block: RMSSD and NRS inputs
            function HrvBlock(props) {
              return (
                <div className="grid grid-cols-2 gap-2">
                  <div><label className={lc}>RMSSD (ms)</label><input className={ic} type="number" step="0.1" value={form["rmssd"+props.phase]} onChange={function(e){set("rmssd"+props.phase,e.target.value)}} placeholder="ms" /></div>
                  <div><label className={lc}>NRS Pain</label><input className={ic} type="number" min="0" max="10" value={form["nrsPain"+props.phase]} onChange={function(e){set("nrsPain"+props.phase,e.target.value)}} placeholder="/10" /></div>
                </div>
              );
            }
            // Single step card wrapper
            function StepCard(props) {
              return (
                <div className="bg-gray-50 rounded p-3">
                  <StepHeader num={props.num} title={props.title} sub={props.sub} />
                  {props.children}
                </div>
              );
            }

            return (
            <div className="space-y-3">
              {isD90 && (
                <div className="text-xs text-center text-gray-500 bg-gray-50 py-2 rounded">Single exam (no device in place)</div>
              )}

              {/* ━━━ PRE (or EXAM for D90) ━━━ */}
              <PhaseBanner phase={isD90 ? "exam" : "pre"}>
                {isD90 ? "EXAM" : "PRE-ACTIVATION"}
              </PhaseBanner>

              <StepCard num="1" title="10m Walk" sub="shoes on">
                <WalkBlock phase="Pre" />
              </StepCard>

              <StepCard num="2" title="Single Leg Stance" sub="shoes on · eyes closed · max 45s">
                <SlsBlock phase="Pre" />
              </StepCard>

              <StepCard num="3" title="Monofilament" sub="shoes off · L then R">
                <div className="grid grid-cols-2 gap-3">
                  <FootGrid side="left" label="L foot" phase="Pre" />
                  <FootGrid side="right" label="R foot" phase="Pre" />
                </div>
                <div className="text-xs text-gray-500 mt-2">Combined: <span className="font-bold text-blue-600">{sumChecked(form.leftFootPre) + sumChecked(form.rightFootPre)}/24</span></div>
              </StepCard>

              <StepCard num="4" title="Stereognosis" sub="0–3 correct">
                <StereoBlock phase="Pre" />
              </StepCard>

              <StepCard num="5" title="HRV & Pain" sub={isD90 ? "" : "baseline before activation"}>
                <HrvBlock phase="Pre" />
              </StepCard>

              {/* ━━━ POST (D0 and D20 only) ━━━ */}
              {!isD90 && (
                <React.Fragment>
                  <div className="text-xs text-center text-gray-400 italic py-2">— device placement / explant happens between Pre and Post —</div>

                  <PhaseBanner phase="post">POST-ACTIVATION</PhaseBanner>

                  <StepCard num="6" title="HRV & Pain" sub="immediately after activation — captures acute vagal response">
                    <HrvBlock phase="Post" />
                  </StepCard>

                  <StepCard num="7" title="Stereognosis" sub="0–3 correct">
                    <StereoBlock phase="Post" />
                  </StepCard>

                  <StepCard num="8" title="Monofilament" sub="shoes still off">
                    <div className="grid grid-cols-2 gap-3">
                      <FootGrid side="left" label="L foot" phase="Post" />
                      <FootGrid side="right" label="R foot" phase="Post" />
                    </div>
                    <div className="text-xs text-gray-500 mt-2">Combined: <span className="font-bold text-blue-600">{sumChecked(form.leftFootPost) + sumChecked(form.rightFootPost)}/24</span></div>
                  </StepCard>

                  <StepCard num="9" title="Single Leg Stance" sub="shoes back on · eyes closed · max 45s">
                    <SlsBlock phase="Post" />
                  </StepCard>

                  <StepCard num="10" title="10m Walk" sub="shoes on">
                    <WalkBlock phase="Post" />
                  </StepCard>
                </React.Fragment>
              )}

              {/* Notes + Submit */}
              <div><label className={lc}>Notes</label><textarea className={ic + " h-14"} value={form.notes} onChange={function(e){set("notes",e.target.value)}} placeholder="Meds, observations..."></textarea></div>

              <button onClick={trySubmit} disabled={submitting}
                className={"w-full py-3 rounded-lg text-white font-semibold text-base " + (submitting ? "bg-gray-400" : "bg-blue-600 active:bg-blue-700")}>
                {submitting ? "Submitting..." : "Submit: Copy Note + Save Data"}
              </button>

              {showOverride && validationErrors.length > 0 && (
                <div className="bg-red-50 border border-red-200 rounded-lg p-3 mt-2">
                  <div className="text-xs font-semibold text-red-600 mb-1">Cannot submit - missing items:</div>
                  {validationErrors.map(function(err, i) { return <div key={i} className="text-xs text-red-500 py-0.5">{err}</div>; })}
                  <button onClick={function(){ setShowOverride(false); setValidationErrors([]); handleSubmit(); }}
                    className="mt-2 w-full py-1.5 bg-red-100 text-red-600 text-xs rounded font-medium">Override and Submit Anyway</button>
                </div>
              )}
              <div className="flex gap-2">
                <button onClick={function(){setFormSection("intake")}} className="flex-1 py-2 text-sm text-gray-400">{form.visitType === "D0" ? "Back to Intake" : "Back to Progress"}</button>
                <button onClick={resetForm} className="flex-1 py-2 text-sm text-gray-400">Clear All</button>
              </div>
            </div>
            );
          })()}
        </div>
      )}

      {/* ========== PHOTOS TAB ========== */}
      {view === "photos" && (
        <div className="p-4 space-y-3">
          <div>
            <label className={lc}>Patient ID for Photos</label>
            <input className={ic} value={photoPatientId || form.patientId} onChange={function(e){setPhotoPatientId(e.target.value)}} placeholder="DNC-XXXX" />
          </div>
          <div className="grid grid-cols-3 gap-2">
            {PHOTO_TYPES.filter(function(t){return t.key.indexOf("consent_") !== 0}).map(function(t) { return (
              <button key={t.key} onClick={function(){capturePhoto(t.key)}}
                className="flex flex-col items-center justify-center py-3 bg-gray-50 rounded-lg border border-gray-200 active:bg-blue-50">
                <span className="text-lg font-bold text-blue-500 mb-1">{t.icon}</span>
                <span className="text-xs font-medium text-gray-600 text-center leading-tight">{t.label}</span>
              </button>
            );})}
          </div>
          {(function() {
            var pid = photoPatientId || form.patientId;
            var patientPhotos = pid ? getPhotosForPatient(pid) : [];
            if (!pid) return <div className="text-center text-gray-400 text-sm py-4">Enter Patient ID above</div>;
            if (!patientPhotos.length) return <div className="text-center text-gray-400 text-sm py-4">No photos for {pid}</div>;
            return (
              <div className="space-y-2">
                <div className="text-xs font-medium text-gray-500">{patientPhotos.length} photos for {pid}</div>
                {patientPhotos.map(function(p) { return (
                  <div key={p.id} className="bg-gray-50 rounded-lg overflow-hidden border">
                    <div className="flex justify-between items-center px-3 py-1.5">
                      <span className="text-xs font-medium text-gray-600">
                        {(PHOTO_TYPES.find(function(t){return t.key===p.type})||{}).icon} {(PHOTO_TYPES.find(function(t){return t.key===p.type})||{}).label}
                      </span>
                      <div className="flex items-center gap-2">
                        <span className="text-xs text-gray-400">{new Date(p.timestamp).toLocaleString()}</span>
                        <button onClick={function(){deletePhoto(p.id)}} className="text-red-400 text-xs">X</button>
                      </div>
                    </div>
                    <img src={p.data} className="w-full" alt={p.type} />
                  </div>
                );})}
              </div>
            );
          })()}
        </div>
      )}

      {/* ========== NOTE TAB ========== */}
      {view === "note" && (
        <div className="p-4">
          <pre className="text-xs font-mono bg-gray-50 p-4 rounded whitespace-pre-wrap border">{generateNote()}</pre>
          {form.visitType === "D0" && (function() {
            var pid = form.patientId;
            var patientPhotos = pid ? getPhotosForPatient(pid) : [];
            if (!patientPhotos.length) return null;
            return (
              <div className="mt-2 space-y-2">
                <div className="text-xs font-semibold text-gray-500">PHOTOS ({patientPhotos.length})</div>
                {patientPhotos.map(function(p) { return (
                  <div key={p.id} className="bg-gray-50 rounded overflow-hidden border">
                    <div className="px-2 py-1 text-xs text-gray-500">{(PHOTO_TYPES.find(function(t){return t.key===p.type})||{}).label}</div>
                    <img src={p.data} className="w-full" alt={p.type} />
                  </div>
                );})}
              </div>
            );
          })()}
          <button onClick={tryCopy}
            className="mt-3 w-full py-2 bg-blue-600 text-white rounded text-sm font-medium">{form.visitType === "D0" ? "Copy Note + Photos" : "Copy Note"}</button>

          {showOverride && validationErrors.length > 0 && (
            <div className="bg-red-50 border border-red-200 rounded-lg p-3 mt-2">
              <div className="text-xs font-semibold text-red-600 mb-1">Missing items:</div>
              {validationErrors.map(function(err, i) { return <div key={i} className="text-xs text-red-500 py-0.5">{err}</div>; })}
              <button onClick={function(){ setShowOverride(false); setValidationErrors([]); copyNoteWithPhotos(); }}
                className="mt-2 w-full py-1.5 bg-red-100 text-red-600 text-xs rounded font-medium">Copy Anyway</button>
            </div>
          )}
        </div>
      )}

      {/* ========== RECORDS TAB ========== */}
      {view === "records" && (
        <div className="p-4">
          {/* Storage usage indicator */}
          {(function() {
            var pct = getStorageUsagePct();
            var color = pct > 85 ? "bg-red-500" : pct > 70 ? "bg-yellow-500" : "bg-green-500";
            var warn = pct > 85 ? "STORAGE ALMOST FULL - clear finished patients below" :
                       pct > 70 ? "Storage getting full - consider clearing finished patients" :
                       "Local storage";
            return (
              <div className="mb-4 bg-gray-50 rounded p-3">
                <div className="flex justify-between items-center mb-1">
                  <span className="text-xs font-medium text-gray-600">{warn}</span>
                  <span className="text-xs text-gray-500">{pct}% of ~5MB</span>
                </div>
                <div className="h-2 bg-gray-200 rounded overflow-hidden">
                  <div className={"h-full " + color} style={{width: Math.min(100,pct) + "%"}}></div>
                </div>
              </div>
            );
          })()}

          {/* Local patient data (photos + drafts) with per-patient clear */}
          {(function() {
            // Gather unique patient IDs from photos and drafts
            var pids = {};
            photos.forEach(function(p) { if (p.patientId) pids[p.patientId] = (pids[p.patientId] || 0) + 1; });
            Object.keys(drafts).forEach(function(id) { pids[id] = pids[id] || 0; });
            var ids = Object.keys(pids);
            if (!ids.length) return null;
            return (
              <div className="mb-4">
                <div className="text-xs font-semibold text-gray-500 mb-2">LOCAL PATIENT DATA (clear after cloud sync verified)</div>
                <div className="space-y-1 max-h-48 overflow-y-auto">
                  {ids.map(function(id) {
                    var photoCount = pids[id];
                    var dirEntry = directory.find(function(d){return d.id===id});
                    var name = dirEntry ? dirEntry.name : "";
                    var hasDraft = !!drafts[id];
                    var hasSubmitted = records.some(function(r){return r.patientId === id});
                    return (
                      <div key={id} className="flex justify-between items-center bg-gray-50 rounded p-2">
                        <div className="text-xs">
                          <div className="font-medium">{id}{name ? " — " + name : ""}</div>
                          <div className="text-gray-500">{photoCount} photos{hasDraft ? ", draft" : ""}{!hasSubmitted ? " · not yet submitted" : ""}</div>
                        </div>
                        <button onClick={function(){clearPatientLocal(id)}} disabled={!hasSubmitted} className={"px-2 py-1 text-xs rounded font-medium " + (hasSubmitted ? "bg-red-100 text-red-600" : "bg-gray-200 text-gray-400")}>Clear</button>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })()}

          <div className="flex justify-between items-center mb-3">
            <span className="text-sm text-gray-600">{records.length} records</span>
            <div className="flex gap-2">
              <button onClick={exportCSV} disabled={!records.length} className="px-3 py-1 bg-green-600 text-white text-xs rounded">CSV</button>
              <button onClick={clearAll} disabled={!records.length} className="px-3 py-1 bg-red-100 text-red-600 text-xs rounded">Clear</button>
            </div>
          </div>
          {!records.length ? <div className="text-center text-gray-400 py-8 text-sm">No records yet</div> : (
            <div className="space-y-2 max-h-96 overflow-y-auto">
              {records.map(function(r, i) { return (
                <div key={r.id || i} className="bg-gray-50 rounded p-3 text-xs">
                  <div className="flex justify-between"><span className="font-medium">{r.patientId}</span><span className="text-gray-400">{r.date} | {r.visitType}</span></div>
                  <div className="text-gray-600 mt-1">
                    Mono: {r.combinedPre}/24 &rarr; {r.combinedPost}/24 ({r.monofilamentChange > 0 ? "+" : ""}{r.monofilamentChange}) |
                    Coins: {r.coinScorePre != null ? r.coinScorePre : "?"}/3 &rarr; {r.coinScorePost != null ? r.coinScorePost : "?"}/3 |
                    RMSSD: {r.rmssdPre} &rarr; {r.rmssdPost} | Pain: {r.nrsPainPre} &rarr; {r.nrsPainPost}
                  </div>
                </div>
              );})}
            </div>
          )}
        </div>
      )}
      {/* ========== FLOATING SUBMIT BUTTON ========== */}
      {form.patientId && form.visitType !== "Phone Intake" && ["consent","form","photos"].indexOf(view) >= 0 && (
        <div className="fixed bottom-4 right-4 z-40 flex flex-col items-end gap-2">
          {msg.text && (
            <div className={"px-3 py-2 rounded-lg shadow-lg text-xs font-medium max-w-xs " +
              (msg.type === "err" ? "bg-red-600 text-white" :
               msg.type === "warn" ? "bg-yellow-500 text-white" :
               "bg-green-600 text-white")}>
              {msg.text}
            </div>
          )}
          <button onClick={trySubmit} disabled={submitting}
            className={"px-5 py-3 rounded-full shadow-lg font-semibold text-sm text-white " + (submitting ? "bg-gray-400" : "bg-green-600 active:bg-green-700")}>
            {submitting ? "Submitting..." : "Submit " + form.visitType}
          </button>
        </div>
      )}

      {/* ========== DUPLICATE REFERRAL MODAL ========== */}
      {dupModal && dupModal.existing && (
        <div className="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4" onClick={function(){setDupModal(null)}}>
          <div className="bg-white rounded-lg p-4 max-w-md w-full" onClick={function(e){e.stopPropagation()}}>
            <div className="text-sm font-semibold text-orange-600 mb-2">Possible duplicate referral</div>
            <div className="text-xs text-gray-700 mb-3">
              A referral with the same name and phone number already exists:
            </div>
            <div className="bg-gray-50 rounded p-3 mb-3 text-xs">
              <div className="font-semibold text-gray-800">{dupModal.existing.name}</div>
              <div className="text-gray-600">{dupModal.existing.phone}</div>
              <div className="text-gray-500 mt-1">Status: {dupModal.existing.status}</div>
              {dupModal.existing.dncId && <div className="text-blue-500">ID: {dupModal.existing.dncId}</div>}
              {dupModal.existing.referralDate && <div className="text-gray-400">Added: {new Date(dupModal.existing.referralDate).toLocaleDateString()}</div>}
            </div>
            <div className="flex gap-2">
              <button onClick={function(){setDupModal(null)}}
                className="flex-1 py-2 bg-gray-100 text-gray-700 text-sm rounded font-medium">Cancel</button>
              <button onClick={function(){addReferral(true, dupModal.source)}}
                className="flex-1 py-2 bg-orange-100 text-orange-700 text-sm rounded font-medium">Add Anyway</button>
            </div>
          </div>
        </div>
      )}

      {/* ========== CALL OUTCOME MODAL ==========
          Opened when user taps "Call Patient" on a referral card. Decouples "tried
          to call" from "reached and doing intake now" so the card's visual state
          doesn't falsely advance when nobody picks up. Two paths:
          - Reached → closes modal, jumps to startIntakeFromReferral (existing flow)
          - Any other outcome → logs attempt, card stays "Referral Received" */}
      {callModalRef && (
        <div className="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4" onClick={function(e){if(e.target===e.currentTarget){setCallModalRef(null); setCallOutcome(""); setCallOutcomeReason(""); setCallFollowupNote("");}}}>
          <div className="bg-white rounded-lg p-4 max-w-md w-full" onClick={function(e){e.stopPropagation()}}>
            <div className="text-sm font-semibold text-gray-800 mb-1">Call {callModalRef.name || "patient"}</div>
            {callModalRef.phone && <div className="text-xs text-gray-500 mb-3">{callModalRef.phone}</div>}
            {(parseInt(callModalRef.callAttempts, 10) || 0) > 0 && (
              <div className="text-xs text-gray-500 bg-gray-50 rounded p-2 mb-3">
                📞 {callModalRef.callAttempts} prior {(parseInt(callModalRef.callAttempts,10)||0) === 1 ? "attempt" : "attempts"}
                {callModalRef.callLog && (
                  <pre className="text-xs text-gray-400 mt-1 whitespace-pre-wrap font-sans">{callModalRef.callLog}</pre>
                )}
              </div>
            )}

            <div className="text-xs font-semibold text-gray-700 mb-2">Did patient answer?</div>

            <div className="space-y-2 mb-3">
              <button onClick={function(){
                var ref = callModalRef;
                setCallModalRef(null); setCallOutcome(""); setCallOutcomeReason(""); setCallFollowupNote("");
                startIntakeFromReferral(ref);
              }} className="w-full py-2 bg-green-600 text-white rounded text-sm font-medium">
                Yes — start intake now
              </button>
            </div>

            <div className="text-xs text-gray-500 mb-1">If no, what happened?</div>
            <select className={ic + " mb-2"} value={callOutcome} onChange={function(e){setCallOutcome(e.target.value)}}>
              <option value="">-- select outcome --</option>
              <option value="no_answer">No answer</option>
              <option value="voicemail_full">Voicemail full</option>
              <option value="left_vm">Left voicemail</option>
              <option value="wrong_number">Wrong number</option>
              <option value="patient_hung_up">Patient hung up</option>
              <option value="other">Other</option>
            </select>

            {callOutcome === "other" && (
              <input className={ic + " mb-2"} placeholder="describe what happened..."
                value={callOutcomeReason} onChange={function(e){setCallOutcomeReason(e.target.value)}} />
            )}

            {/* Forward-looking follow-up note. Optional, applies to any outcome.
                Use case: MA talks to family, they say "call back 7-8pm", MA
                jots that here so next MA who picks up this card sees it right
                at the top of the call log. Not a separate reminder — just
                context inline with the attempt. */}
            <input className={ic + " mb-2"}
              placeholder="Follow-up note (optional) — e.g. call back Thu 7pm"
              value={callFollowupNote} onChange={function(e){setCallFollowupNote(e.target.value)}} />

            <div className="flex gap-2 mt-2">
              <button onClick={function(){setCallModalRef(null); setCallOutcome(""); setCallOutcomeReason(""); setCallFollowupNote("")}}
                className="flex-1 py-2 bg-gray-100 text-gray-700 text-sm rounded font-medium">Cancel</button>
              <button onClick={submitCallAttempt}
                disabled={!callOutcome || callSubmitting || (callOutcome === "other" && !callOutcomeReason.trim())}
                className={"flex-1 py-2 text-white text-sm rounded font-medium " + ((!callOutcome || callSubmitting || (callOutcome === "other" && !callOutcomeReason.trim())) ? "bg-gray-400" : "bg-blue-600")}>
                {callSubmitting ? "Logging..." : "Log attempt"}
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ========== GLOBAL VALIDATION ERROR MODAL (visible from any tab) ========== */}
      {showOverride && validationErrors.length > 0 && (
        <div className="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4" onClick={function(){setShowOverride(false)}}>
          <div className="bg-white rounded-lg p-4 max-w-md w-full" onClick={function(e){e.stopPropagation()}}>
            <div className="text-sm font-semibold text-red-600 mb-2">Cannot submit — missing items:</div>
            <div className="max-h-64 overflow-y-auto mb-3">
              {validationErrors.map(function(err, i) { return <div key={i} className="text-xs text-red-500 py-0.5">• {err}</div>; })}
            </div>
            <div className="flex gap-2">
              <button onClick={function(){setShowOverride(false); setValidationErrors([])}}
                className="flex-1 py-2 bg-gray-100 text-gray-700 text-sm rounded font-medium">Fix Items</button>
              <button onClick={function(){setShowOverride(false); setValidationErrors([]); handleSubmit()}}
                className="flex-1 py-2 bg-red-100 text-red-600 text-sm rounded font-medium">Override &amp; Submit</button>
            </div>
          </div>
        </div>
      )}

      {/* ========== SIGNATURE MODAL ========== */}
      {sigModalType && (
        <div className="fixed inset-0 bg-black bg-opacity-60 z-50 flex items-center justify-center p-4" onClick={function(e){if(e.target===e.currentTarget)setSigModalType(null)}}>
          <div className="bg-white rounded-lg max-w-lg w-full p-4 space-y-3">
            <div className="flex items-center justify-between">
              <div className="font-semibold text-gray-800">{(PHOTO_TYPES.find(function(t){return t.key===sigModalType})||{}).label}</div>
              <button onClick={function(){setSigModalType(null)}} className="text-gray-400 text-xl px-2">×</button>
            </div>
            <div className="text-xs text-gray-500">Sign in the box below. Use finger on phone/tablet or mouse on desktop.</div>
            <canvas
              id="sig-canvas"
              width="600"
              height="250"
              className="w-full border-2 border-gray-300 rounded bg-white"
              style={{touchAction: "none"}}
              onMouseDown={sigStart}
              onMouseMove={sigMove}
              onMouseUp={sigEnd}
              onMouseLeave={sigEnd}
              onTouchStart={sigStart}
              onTouchMove={sigMove}
              onTouchEnd={sigEnd}
            />
            <div className="text-xs text-gray-400 text-center">{form.patientId} · {new Date().toLocaleString()}</div>
            <div className="flex gap-2">
              <button onClick={sigClear} className="flex-1 py-2 bg-gray-200 text-gray-700 rounded text-sm font-medium">Clear</button>
              <button onClick={sigSave} className="flex-1 py-2 bg-blue-600 text-white rounded text-sm font-medium">Save Signature</button>
            </div>
          </div>
        </div>
      )}

      {/* Bug report / feature suggestion footer.
          Lives at the bottom of every screen so it's discoverable but not
          intrusive. Pre-fills a structured email so reports come in with the
          context I need (what they were doing, what happened, screenshot).
          Goes to evan@leitneranesthesia.com (Workspace, BAA-covered) because
          screenshots may include PHI — must NOT be sent to a non-BAA mailbox.

          The "How to screenshot" link expands to platform-specific instructions
          covering iPhone, Android, Mac, Windows. Auto-detects platform from
          user agent and bolds the most-likely option, but shows all so the
          user can pick if detection is wrong (e.g., iPad Safari is detected
          as desktop Mac on some iPad versions). */}
      <BugReportFooter />
    </div>
  );
}

// Compact footer rendered at the bottom of the app shell. Self-contained so
// the surrounding App() function isn't cluttered with another expand/collapse
// state hook + platform detection logic.
function BugReportFooter() {
  const [showHelp, setShowHelp] = useState(false);

  // Detect platform from navigator.userAgent. This is best-effort — modern
  // user agents are imprecise (iPad Safari can claim to be Mac, etc.) so we
  // show all platforms regardless and just bold the detected one.
  var ua = (typeof navigator !== "undefined" && navigator.userAgent) ? navigator.userAgent : "";
  var detected = "unknown";
  if (/iPhone|iPod/.test(ua)) detected = "iphone";
  else if (/iPad/.test(ua) || (ua.indexOf("Macintosh") !== -1 && typeof navigator !== "undefined" && navigator.maxTouchPoints > 1)) detected = "ipad";
  else if (/Android/.test(ua)) detected = "android";
  else if (/Mac/.test(ua)) detected = "mac";
  else if (/Windows/.test(ua)) detected = "windows";

  // Pre-filled email body. Asks for the four things that turn a "broken!"
  // report into something actually fixable: what they did, what happened,
  // what they expected, and a screenshot. The %0A characters are URL-encoded
  // newlines for mailto: links.
  var subject = "DNC App: ";
  var body =
    "What I was doing:%0A%0A%0A" +
    "What happened:%0A%0A%0A" +
    "What I expected to happen:%0A%0A%0A" +
    "(Please attach a screenshot.)%0A%0A" +
    "---%0A" +
    "App version: " + (window.__APP_VERSION || "unknown") + "%0A" +
    "Device: " + (typeof navigator !== "undefined" ? navigator.userAgent.substring(0, 100) : "unknown");

  var mailto = "mailto:evan@leitneranesthesia.com?subject=" + encodeURIComponent(subject) + "&body=" + body;

  return (
    <div className="border-t border-gray-100 bg-gray-50 px-4 py-3 text-center text-xs text-gray-500 mt-8">
      <div>
        Found a bug or have an idea?{" "}
        <a href={mailto} className="text-blue-600 underline">Email Evan</a>
        {" · "}
        <button onClick={function(){setShowHelp(!showHelp)}} className="text-blue-600 underline">
          {showHelp ? "Hide" : "How to screenshot"}
        </button>
      </div>
      <div className="mt-1 text-[10px] text-gray-400 font-mono">
        v {(typeof window !== "undefined" && window.__APP_VERSION) || "unknown"}
      </div>
      {showHelp && (
        <div className="mt-2 text-left max-w-md mx-auto bg-white border border-gray-200 rounded p-3 space-y-1">
          <div className={detected === "iphone" ? "font-semibold text-gray-800" : "text-gray-600"}>
            <span className="font-medium">iPhone:</span> Side button + Volume Up (press together briefly)
          </div>
          <div className={detected === "ipad" ? "font-semibold text-gray-800" : "text-gray-600"}>
            <span className="font-medium">iPad:</span> Top button + Volume Up (or Home button + Top on older iPads)
          </div>
          <div className={detected === "android" ? "font-semibold text-gray-800" : "text-gray-600"}>
            <span className="font-medium">Android:</span> Power + Volume Down (press together)
          </div>
          <div className={detected === "mac" ? "font-semibold text-gray-800" : "text-gray-600"}>
            <span className="font-medium">Mac:</span> Cmd + Shift + 4 (drag to select area)
          </div>
          <div className={detected === "windows" ? "font-semibold text-gray-800" : "text-gray-600"}>
            <span className="font-medium">Windows:</span> Windows + Shift + S (drag to select area)
          </div>
          <div className="text-gray-400 text-[10px] mt-2 pt-2 border-t border-gray-100">
            Screenshots save to your Photos / Pictures. Attach to the email when you write to Evan.
          </div>
        </div>
      )}
    </div>
  );
}

function AuthGate() {
  const [user, setUser] = useState(null);
  const [loading, setLoading] = useState(true);
  const [authError, setAuthError] = useState("");
  const [emailInput, setEmailInput] = useState("");
  const [passwordInput, setPasswordInput] = useState("");
  const [signingIn, setSigningIn] = useState(false);
  const [requestMode, setRequestMode] = useState(false);
  const [requestName, setRequestName] = useState("");
  const [requestRole, setRequestRole] = useState("");
  const [requestReason, setRequestReason] = useState("");
  const [requestSubmitting, setRequestSubmitting] = useState(false);
  const [requestSent, setRequestSent] = useState(false);

  useEffect(function() {
    if (!__firebaseEnabled) {
      setLoading(false);
      return;
    }
    var unsub = firebase.auth().onAuthStateChanged(function(u) {
      if (u) {
        var email = (u.email || "").toLowerCase();
        var allowed = ALLOWED_EMAILS.map(function(e){return e.toLowerCase()});
        if (allowed.indexOf(email) === -1) {
          setAuthError("Access denied for " + email + ". Contact admin.");
          firebase.auth().signOut();
          setUser(null);
        } else {
          setUser(u);
          setAuthError("");
          window.__currentUser = u;
        }
      } else {
        setUser(null);
        window.__currentUser = null;
      }
      setLoading(false);
    });
    return function(){ unsub && unsub(); };
  }, []);

  function signIn() {
    if (!emailInput || !passwordInput) {
      setAuthError("Enter email and password");
      return;
    }
    setAuthError("");
    setSigningIn(true);
    firebase.auth().signInWithEmailAndPassword(emailInput, passwordInput)
      .catch(function(e) {
        var msg = e.message || "Sign-in failed";
        if (e.code === "auth/wrong-password" || e.code === "auth/invalid-credential") msg = "Wrong password";
        else if (e.code === "auth/user-not-found") msg = "No account for this email. Contact admin.";
        else if (e.code === "auth/invalid-email") msg = "Invalid email format";
        setAuthError(msg);
      })
      .finally(function() { setSigningIn(false); });
  }

  function signOut() {
    firebase.auth().signOut();
  }
  window.__signOut = signOut;

  function sendPasswordReset() {
    if (!emailInput) {
      setAuthError("Enter your email above first");
      return;
    }
    setAuthError("");
    firebase.auth().sendPasswordResetEmail(emailInput)
      .then(function() {
        setAuthError("Reset email sent to " + emailInput + ". Check inbox.");
      })
      .catch(function(e) {
        var msg = e.message || "Reset failed";
        if (e.code === "auth/user-not-found") msg = "No account for this email";
        else if (e.code === "auth/invalid-email") msg = "Invalid email format";
        setAuthError(msg);
      });
  }

  async function submitAccessRequest() {
    if (!emailInput || !requestName || !requestRole) {
      setAuthError("Email, name, and role required");
      return;
    }
    setAuthError("");
    setRequestSubmitting(true);
    try {
      var storedUrl = localStorage.getItem(SHEET_URL_KEY);
      var url = storedUrl || DEFAULT_SHEET_URL;
      await fetch(url, {
        method: "POST",
        mode: "no-cors",
        body: JSON.stringify({
          _action: "requestAccess",
          email: emailInput,
          name: requestName,
          role: requestRole,
          reason: requestReason
        })
      });
      setRequestSent(true);
    } catch(e) {
      setAuthError("Request failed: " + e.toString());
    }
    setRequestSubmitting(false);
  }

  if (!__firebaseEnabled) {
    return (
      <div>
        <div className="bg-yellow-100 text-yellow-900 text-xs px-3 py-1 text-center border-b border-yellow-300">
          ⚠ Auth disabled (no Firebase config) — dev mode
        </div>
        <App />
      </div>
    );
  }

  if (loading) {
    return <div className="min-h-screen flex items-center justify-center text-gray-500">Loading...</div>;
  }

  if (!user) {
    return (
      <div className="min-h-screen flex items-center justify-center bg-gray-50 px-4">
        <div className="bg-white rounded-lg shadow-md p-6 max-w-sm w-full">
          <div className="text-center mb-4">
            <div className="text-lg font-semibold text-gray-800">Diabetic Nerve Clinic</div>
            <div className="text-xs text-gray-500 mt-1">{requestMode ? "Request access" : "Sign in to access the platform"}</div>
          </div>
          {!requestMode && (
            <div className="space-y-2">
              <input
                type="email"
                className="w-full border border-gray-300 rounded px-3 py-2 text-sm"
                placeholder="Email"
                value={emailInput}
                onChange={function(e){setEmailInput(e.target.value)}}
                onKeyDown={function(e){if(e.key==="Enter")signIn()}}
                autoFocus
              />
              <input
                type="password"
                className="w-full border border-gray-300 rounded px-3 py-2 text-sm"
                placeholder="Password"
                value={passwordInput}
                onChange={function(e){setPasswordInput(e.target.value)}}
                onKeyDown={function(e){if(e.key==="Enter")signIn()}}
              />
              <button
                onClick={signIn}
                disabled={signingIn}
                className={"w-full py-2.5 rounded-lg text-sm font-medium " + (signingIn ? "bg-gray-300 text-gray-500" : "bg-blue-600 text-white")}
              >
                {signingIn ? "Signing in..." : "Sign in"}
              </button>
              <div className="flex justify-between items-center mt-2">
                <button
                  onClick={sendPasswordReset}
                  className="text-xs text-blue-600 underline"
                >
                  Forgot password
                </button>
                <button
                  onClick={function(){setRequestMode(true); setAuthError(""); setRequestSent(false)}}
                  className="text-xs text-blue-600 underline"
                >
                  Request access
                </button>
              </div>
            </div>
          )}
          {requestMode && !requestSent && (
            <div className="space-y-2">
              <input
                type="email"
                className="w-full border border-gray-300 rounded px-3 py-2 text-sm"
                placeholder="Your work email"
                value={emailInput}
                onChange={function(e){setEmailInput(e.target.value)}}
              />
              <input
                type="text"
                className="w-full border border-gray-300 rounded px-3 py-2 text-sm"
                placeholder="Full name"
                value={requestName}
                onChange={function(e){setRequestName(e.target.value)}}
              />
              <select
                className="w-full border border-gray-300 rounded px-3 py-2 text-sm"
                value={requestRole}
                onChange={function(e){setRequestRole(e.target.value)}}
              >
                <option value="">Role...</option>
                <option>Clinician</option>
                <option>MA / Front desk</option>
                <option>Biller</option>
                <option>Admin</option>
                <option>Other</option>
              </select>
              <textarea
                className="w-full border border-gray-300 rounded px-3 py-2 text-sm h-16"
                placeholder="Reason for access (optional)"
                value={requestReason}
                onChange={function(e){setRequestReason(e.target.value)}}
              />
              <button
                onClick={submitAccessRequest}
                disabled={requestSubmitting}
                className={"w-full py-2.5 rounded-lg text-sm font-medium " + (requestSubmitting ? "bg-gray-300 text-gray-500" : "bg-blue-600 text-white")}
              >
                {requestSubmitting ? "Sending..." : "Send request"}
              </button>
              <button
                onClick={function(){setRequestMode(false); setAuthError("")}}
                className="w-full text-xs text-gray-500 underline mt-1"
              >
                Back to sign in
              </button>
            </div>
          )}
          {requestMode && requestSent && (
            <div className="space-y-3 text-center">
              <div className="text-sm text-green-700 font-medium">Request sent</div>
              <div className="text-xs text-gray-600">An admin will review and contact you at {emailInput}.</div>
              <button
                onClick={function(){setRequestMode(false); setRequestSent(false); setEmailInput(""); setRequestName(""); setRequestRole(""); setRequestReason("")}}
                className="w-full text-xs text-blue-600 underline"
              >
                Back to sign in
              </button>
            </div>
          )}
          {authError && <div className="mt-3 text-xs text-red-600 text-center">{authError}</div>}
        </div>
      </div>
    );
  }

  return (
    <div>
      <div className="bg-gray-100 text-gray-600 text-xs px-3 py-1 flex justify-between items-center border-b border-gray-200">
        <span>{user.email}</span>
        <button onClick={signOut} className="text-blue-600 underline">Sign out</button>
      </div>
      <App />
    </div>
  );
}

ReactDOM.render(<AuthGate />, document.getElementById("root"));
</script>
